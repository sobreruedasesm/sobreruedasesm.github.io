<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración | Sobre Ruedas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#222}
header{background:#111827;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:20px}
main{max-width:1100px;margin:auto;padding:20px}
section{background:#fff;border-radius:12px;padding:18px;margin-bottom:18px;box-shadow:0 2px 8px #0000000d}
h2{margin:0 0 15px;font-size:18px}
h3{margin:18px 0 10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select,textarea,button{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font:inherit}
textarea{min-height:80px;resize:vertical}
button{border:0;background:#111827;color:#fff;cursor:pointer;font-weight:600}
button:hover{opacity:.9}
.btn2{background:#2563eb}
.btn3{background:#dc2626}
.btn4{background:#059669}
.btn5{background:#6b7280}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{width:auto}
.card{border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-bottom:12px}
.card img{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.producto{display:grid;grid-template-columns:1fr 110px 90px;gap:8px;margin-bottom:8px}
.producto button{width:auto}
.check{display:flex;align-items:center;gap:8px}
.check input{width:auto}
.estado{font-size:12px;padding:4px 8px;border-radius:20px;background:#dcfce7;color:#166534}
.estado.off{background:#fee2e2;color:#991b1b}
.msg{padding:10px;border-radius:8px;margin-bottom:12px;display:none}
.ok{background:#dcfce7;color:#166534}
.err{background:#fee2e2;color:#991b1b}
.preview{max-width:180px;max-height:100px;object-fit:cover;border-radius:8px;margin-top:8px}
.dia{display:grid;grid-template-columns:100px 1fr 1fr 80px;gap:8px;align-items:center;margin-bottom:7px}
.dia input[type=checkbox]{width:auto}
@media(max-width:600px){
 .row,.producto,.dia{grid-template-columns:1fr}
 header{gap:10px;align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>

<header>
<h1>Sobre Ruedas · Administración</h1>
<button onclick="nuevoLocal()" style="width:auto">+ Nuevo local</button>
</header>

<main>
<div id="mensaje" class="msg"></div>

<section>
<h2>Configuración del negocio</h2>
<div class="grid">
<div><label>Nombre</label><input id="cfgNombre"></div>
<div><label>Ciudad</label><input id="cfgCiudad"></div>
<div><label>Tarifa delivery</label><input id="cfgDelivery" type="number" step="0.01" min="0"></div>
<div><label>WhatsApp</label><input id="cfgWhatsapp"></div>
<div><label>Moneda</label><input id="cfgMoneda"></div>
</div>
<br>
<button class="btn4" onclick="guardarConfiguracion()">Guardar configuración</button>
</section>

<section>
<h2>Categorías</h2>
<div class="grid">
<div><input id="catNombre" placeholder="Nueva categoría"></div>
<div><button class="btn2" onclick="crearCategoria()">Agregar categoría</button></div>
</div>
<div id="categoriasLista"></div>
</section>

<section>
<h2>Locales</h2>
<div id="localesLista">Cargando...</div>
</section>

<section id="editor" style="display:none">
<h2 id="editorTitulo">Nuevo local</h2>

<input type="hidden" id="localId">

<div class="grid">
<div>
<label>Nombre</label>
<input id="localNombre">
</div>
<div>
<label>Categoría</label>
<select id="localCategoria"></select>
</div>
</div>

<br>

<label>Descripción</label>
<textarea id="localDescripcion"></textarea>

<br>

<label>Banner</label>
<input id="bannerArchivo" type="file" accept="image/*" onchange="previsualizarBanner()">
<img id="bannerPreview" class="preview" style="display:none">
<div class="check">
<input id="eliminarBanner" type="checkbox">
<label for="eliminarBanner">Eliminar banner actual</label>
</div>

<br>

<div class="check">
<input id="localActivo" type="checkbox" checked>
<label for="localActivo">Local activo</label>
</div>

<h3>Horarios</h3>
<div id="horarios"></div>

<h3>Productos</h3>
<div id="productosEditor"></div>

<div class="actions">
<button class="btn4" onclick="guardarLocal()">Guardar local</button>
<button class="btn5" onclick="cancelarEdicion()">Cancelar</button>
</div>
</section>
</main>

<script>
const BUCKET="restaurantes";
let categorias=[];
let locales=[];
let productos=[];
let horarios=[];
let bannerActual=null;

const dias=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

function mostrarMensaje(texto,tipo="ok"){
 const e=document.getElementById("mensaje");
 e.textContent=texto;
 e.className="msg "+tipo;
 e.style.display="block";
 setTimeout(()=>e.style.display="none",4500);
}

function escapeHtml(v=""){
 return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function cargarConfiguracion(){
 const {data,error}=await supabaseClient
 .from("configuracion_negocio")
 .select("*")
 .order("id",{ascending:true})
 .limit(1)
 .maybeSingle();

 if(error) throw error;

 if(data){
  cfgNombre.value=data.nombre_negocio||"";
  cfgCiudad.value=data.ciudad||"";
  cfgDelivery.value=data.tarifa_delivery??1.5;
  cfgWhatsapp.value=data.whatsapp_negocio||"";
  cfgMoneda.value=data.moneda||"USD";
 }
}

async function guardarConfiguracion(){
 try{
  const payload={
   nombre_negocio:cfgNombre.value.trim(),
   ciudad:cfgCiudad.value.trim(),
   tarifa_delivery:Number(cfgDelivery.value)||0,
   whatsapp_negocio:cfgWhatsapp.value.trim(),
   moneda:cfgMoneda.value.trim()||"USD",
   actualizado_en:new Date().toISOString()
  };

  const {data:existente,error:e1}=await supabaseClient
   .from("configuracion_negocio")
   .select("id")
   .order("id",{ascending:true})
   .limit(1)
   .maybeSingle();

  if(e1)throw e1;

  let r;

  if(existente){
   r=await supabaseClient
    .from("configuracion_negocio")
    .update(payload)
    .eq("id",existente.id);
  }else{
   r=await supabaseClient
    .from("configuracion_negocio")
    .insert(payload);
  }

  if(r.error)throw r.error;
  mostrarMensaje("Configuración guardada");
 }catch(e){
  mostrarMensaje("No se pudo guardar la configuración: "+e.message,"err");
 }
}

async function cargarCategorias(){
 const {data,error}=await supabaseClient
  .from("categorias")
  .select("*")
  .order("nombre");

 if(error)throw error;
 categorias=data||[];
 renderCategorias();
 actualizarSelectCategorias();
}

function renderCategorias(){
 categoriasLista.innerHTML=categorias.map(c=>`
  <div class="card">
   <div class="grid">
    <input id="cat_${c.id}" value="${escapeHtml(c.nombre)}">
    <div class="actions">
     <button class="btn2" onclick="editarCategoria(${c.id})">Guardar</button>
     <button class="btn3" onclick="eliminarCategoria(${c.id})">Eliminar</button>
    </div>
   </div>
  </div>
 `).join("");
}

function actualizarSelectCategorias(){
 localCategoria.innerHTML=
  `<option value="">Seleccionar categoría</option>`+
  categorias.filter(c=>c.activo!==false)
   .map(c=>`<option value="${escapeHtml(c.nombre)}">${escapeHtml(c.nombre)}</option>`)
   .join("");
}

async function crearCategoria(){
 const nombre=catNombre.value.trim();
 if(!nombre)return mostrarMensaje("Ingrese una categoría","err");

 try{
  const {error}=await supabaseClient
   .from("categorias")
   .insert({nombre,activo:true});

  if(error)throw error;

  catNombre.value="";
  await cargarCategorias();
  mostrarMensaje("Categoría creada");
 }catch(e){
  mostrarMensaje("No se pudo crear la categoría: "+e.message,"err");
 }
}

async function editarCategoria(id){
 const nombre=document.getElementById("cat_"+id).value.trim();
 if(!nombre)return;

 try{
  const {error}=await supabaseClient
   .from("categorias")
   .update({nombre})
   .eq("id",id);

  if(error)throw error;

  await cargarCategorias();
  mostrarMensaje("Categoría actualizada");
 }catch(e){
  mostrarMensaje("No se pudo actualizar: "+e.message,"err");
 }
}

async function eliminarCategoria(id){
 if(!confirm("¿Eliminar esta categoría?"))return;

 try{
  const {error}=await supabaseClient
   .from("categorias")
   .delete()
   .eq("id",id);

  if(error)throw error;

  await cargarCategorias();
  mostrarMensaje("Categoría eliminada");
 }catch(e){
  mostrarMensaje("No se pudo eliminar: "+e.message,"err");
 }
}

async function cargarLocales(){
 locales=[];
 productos=[];
 horarios=[];

 const r=await supabaseClient
  .from("restaurantes")
  .select("*")
  .order("nombre");

 if(r.error)throw r.error;
 locales=r.data||[];

 const p=await supabaseClient
  .from("productos")
  .select("*")
  .order("nombre");

 if(p.error)throw p.error;
 productos=p.data||[];

 const h=await supabaseClient
  .from("horarios_restaurantes")
  .select("*")
  .order("restaurante_id")
  .order("dia_semana");

 if(h.error)throw h.error;
 horarios=h.data||[];

 renderLocales();
}

function renderLocales(){
 if(!locales.length){
  localesLista.innerHTML="<p>No existen locales.</p>";
  return;
 }

 localesLista.innerHTML=locales.map(l=>{
  const ps=productos.filter(p=>p.restaurante_id===l.id);
  const hs=horarios.filter(h=>h.restaurante_id===l.id);

  return `
  <div class="card">
   ${l.banner_url?`<img src="${escapeHtml(l.banner_url)}" onerror="this.style.display='none'">`:""}
   <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
    <strong>${escapeHtml(l.nombre)}</strong>
    <span class="estado ${l.activo===false?"off":""}">
     ${l.activo===false?"Inactivo":"Activo"}
    </span>
   </div>
   <p>${escapeHtml(l.categoria||"")} · ${escapeHtml(l.descripcion||"")}</p>
   <small>${ps.length} producto(s) · ${hs.length} horario(s)</small>
   <br><br>
   <div class="actions">
    <button class="btn2" onclick="editarLocal(${l.id})">Editar</button>
    <button class="btn5" onclick="cambiarEstadoLocal(${l.id},${l.activo!==false})">
     ${l.activo===false?"Activar":"Desactivar"}
    </button>
    <button class="btn3" onclick="eliminarLocal(${l.id})">Eliminar</button>
   </div>
  </div>`;
 }).join("");
}

function nuevoLocal(){
 editor.style.display="block";
 editorTitulo.textContent="Nuevo local";
 localId.value="";
 localNombre.value="";
 localDescripcion.value="";
 localCategoria.value="";
 localActivo.checked=true;
 bannerArchivo.value="";
 eliminarBanner.checked=false;
 bannerActual=null;
 bannerPreview.style.display="none";
 renderHorarios([]);
 renderProductosEditor([]);
 editor.scrollIntoView({behavior:"smooth"});
}

function cancelarEdicion(){
 editor.style.display="none";
 bannerActual=null;
}

function previsualizarBanner(){
 const archivo=bannerArchivo.files[0];
 if(!archivo){
  bannerPreview.style.display="none";
  return;
 }

 bannerPreview.src=URL.createObjectURL(archivo);
 bannerPreview.style.display="block";
}

function renderHorarios(lista){
 horarios.innerHTML=dias.map((dia,i)=>{
  const h=lista.find(x=>Number(x.dia_semana)===i)||{};
  return `
   <div class="dia">
    <strong>${dia}</strong>
    <input type="time" id="ap_${i}" value="${h.hora_apertura||""}">
    <input type="time" id="ci_${i}" value="${h.hora_cierre||""}">
    <label class="check">
     <input type="checkbox" id="ce_${i}" ${h.cerrado?"checked":""}>
     Cerrado
    </label>
   </div>`;
 }).join("");
}

function obtenerHorarios(){
 return dias.map((_,i)=>({
  dia_semana:i,
  hora_apertura:document.getElementById("ap_"+i).value||null,
  hora_cierre:document.getElementById("ci_"+i).value||null,
  cerrado:document.getElementById("ce_"+i).checked
 }));
}

function renderProductosEditor(lista){
 productosEditor.innerHTML=lista.map((p,i)=>`
  <div class="producto" data-id="${p.id||""}">
   <input class="pn" value="${escapeHtml(p.nombre||"")}" placeholder="Producto">
   <input class="pp" type="number" step="0.01" min="0" value="${p.precio??0}" placeholder="Precio">
   <button class="btn3" onclick="this.parentElement.remove()">Eliminar</button>
  </div>
 `).join("")+
 `<button type="button" class="btn2" onclick="agregarProductoEditor()">+ Agregar producto</button>`;
}

function agregarProductoEditor(){
 const div=document.createElement("div");
 div.className="producto";
 div.innerHTML=`
  <input class="pn" placeholder="Producto">
  <input class="pp" type="number" step="0.01" min="0" value="0">
  <button type="button" class="btn3" onclick="this.parentElement.remove()">Eliminar</button>`;
 const boton=productosEditor.querySelector("button:last-child");
 productosEditor.insertBefore(div,boton);
}

function obtenerProductosEditor(){
 return [...productosEditor.querySelectorAll(".producto")].map(e=>({
  id:e.dataset.id?Number(e.dataset.id):null,
  nombre:e.querySelector(".pn").value.trim(),
  precio:Number(e.querySelector(".pp").value)||0
 })).filter(p=>p.nombre);
}

async function editarLocal(id){
 const local=locales.find(x=>x.id===id);
 if(!local)return;

 editor.style.display="block";
 editorTitulo.textContent="Editar local";
 localId.value=id;
 localNombre.value=local.nombre||"";
 localDescripcion.value=local.descripcion||"";
 localActivo.checked=local.activo!==false;
 localCategoria.value=local.categoria||"";
 bannerActual=local.banner_url||null;
 bannerArchivo.value="";
 eliminarBanner.checked=false;

 if(bannerActual){
  bannerPreview.src=bannerActual;
  bannerPreview.style.display="block";
 }else{
  bannerPreview.style.display="none";
 }

 renderHorarios(horarios.filter(h=>h.restaurante_id===id));
 renderProductosEditor(productos.filter(p=>p.restaurante_id===id));
 editor.scrollIntoView({behavior:"smooth"});
}

async function subirImagen(archivo,idLocal){
 if(!archivo)return null;

 const extension=(archivo.name.split(".").pop()||"jpg").toLowerCase();
 const ruta=`locales/${idLocal}_${Date.now()}.${extension}`;

 const {error}=await supabaseClient.storage
  .from(BUCKET)
  .upload(ruta,archivo,{
   cacheControl:"3600",
   upsert:false,
   contentType:archivo.type||"image/jpeg"
  });

 if(error)throw new Error("No se pudo subir la imagen: "+error.message);

 const {data}=supabaseClient.storage
  .from(BUCKET)
  .getPublicUrl(ruta);

 if(!data?.publicUrl)throw new Error("No se pudo obtener la URL pública de la imagen");

 return data.publicUrl;
}

async function guardarLocal(){
 const id=localId.value?Number(localId.value):null;
 const nombre=localNombre.value.trim();

 if(!nombre)return mostrarMensaje("Ingrese el nombre del local","err");
 if(!localCategoria.value)return mostrarMensaje("Seleccione una categoría","err");

 try{
  const archivo=bannerArchivo.files[0]||null;
  let banner_url=bannerActual;

  if(eliminarBanner.checked)banner_url=null;

  if(archivo){
   banner_url=await subirImagen(archivo,id||Date.now());
  }

  const payload={
   nombre,
   categoria:localCategoria.value,
   descripcion:localDescripcion.value.trim()||null,
   banner_url,
   activo:localActivo.checked
  };

  let localIdGuardado=id;

  if(id){
   const {error}=await supabaseClient
    .from("restaurantes")
    .update(payload)
    .eq("id",id);

   if(error)throw error;
  }else{
   const {data,error}=await supabaseClient
    .from("restaurantes")
    .insert(payload)
    .select("id")
    .single();

   if(error)throw error;
   localIdGuardado=data.id;
  }

  const nuevosHorarios=obtenerHorarios().map(h=>({
   ...h,
   restaurante_id:localIdGuardado
  }));

  const {error:eh}=await supabaseClient
   .from("horarios_restaurantes")
   .upsert(nuevosHorarios,{
    onConflict:"restaurante_id,dia_semana"
   });

  if(eh)throw eh;

  const nuevosProductos=obtenerProductosEditor();
  const existentes=productos.filter(p=>p.restaurante_id===localIdGuardado);

  for(const p of nuevosProductos){
   if(p.id){
    const {error}=await supabaseClient
     .from("productos")
     .update({
      nombre:p.nombre,
      precio:p.precio,
      activo:true
     })
     .eq("id",p.id)
     .eq("restaurante_id",localIdGuardado);

    if(error)throw error;
   }else{
    const {error}=await supabaseClient
     .from("productos")
     .insert({
      restaurante_id:localIdGuardado,
      nombre:p.nombre,
      descripcion:null,
      precio:p.precio,
      activo:true
     });

    if(error)throw error;
   }
  }

  const idsActuales=new Set(nuevosProductos.filter(p=>p.id).map(p=>p.id));

  for(const p of existentes){
   if(!idsActuales.has(p.id)){
    const {error}=await supabaseClient
     .from("productos")
     .update({activo:false})
     .eq("id",p.id)
     .eq("restaurante_id",localIdGuardado);

    if(error)throw error;
   }
  }

  await cargarLocales();
  cancelarEdicion();
  mostrarMensaje("Local guardado correctamente");
 }catch(e){
  mostrarMensaje("No se pudo guardar el local: "+e.message,"err");
 }
}

async function cambiarEstadoLocal(id,actual){
 try{
  const {error}=await supabaseClient
   .from("restaurantes")
   .update({activo:!actual})
   .eq("id",id);

  if(error)throw error;

  await cargarLocales();
  mostrarMensaje("Estado actualizado");
 }catch(e){
  mostrarMensaje("No se pudo cambiar el estado: "+e.message,"err");
 }
}

async function eliminarLocal(id){
 if(!confirm("¿Eliminar este local y sus productos?"))return;

 try{
  const {error:ep}=await supabaseClient
   .from("productos")
   .delete()
   .eq("restaurante_id",id);

  if(ep)throw ep;

  const {error:eh}=await supabaseClient
   .from("horarios_restaurantes")
   .delete()
   .eq("restaurante_id",id);

  if(eh)throw eh;

  const {error:er}=await supabaseClient
   .from("restaurantes")
   .delete()
   .eq("id",id);

  if(er)throw er;

  await cargarLocales();
  mostrarMensaje("Local eliminado");
 }catch(e){
  mostrarMensaje("No se pudo eliminar el local: "+e.message,"err");
 }
}

async function iniciar(){
 try{
  await cargarConfiguracion();
  await cargarCategorias();
  await cargarLocales();
 }catch(e){
  mostrarMensaje("Error al cargar administración: "+e.message,"err");
  localesLista.innerHTML="<p>No fue posible cargar los datos.</p>";
 }
}

iniciar();
</script>
</body>
</html>
