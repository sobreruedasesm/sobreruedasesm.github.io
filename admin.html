<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración | Sobre Ruedas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f5ee;color:#26352d}
header{background:#2f5d45;color:#fff;padding:18px 20px}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;color:#e7f0e8}
main{max-width:1100px;margin:auto;padding:20px}
.seccion{background:#fffdf9;border:1px solid #eee5d8;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 3px 10px #5b46331c}
.seccion h2{margin:0 0 15px;color:#2f5d45;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.campo{margin-bottom:12px}
.campo label{display:block;margin-bottom:5px;font-weight:bold;color:#53665a}
input,textarea,select{width:100%;padding:10px;border:1px solid #d8d0c3;border-radius:8px;background:#fff;color:#26352d;font-size:14px}
textarea{min-height:75px;resize:vertical}
button{border:0;border-radius:8px;background:#d97941;color:#fff;padding:10px 14px;cursor:pointer;font-weight:bold}
button:hover{background:#c86832}
button.sec{background:#2f5d45}
button.sec:hover{background:#244936}
button.gray{background:#e7dfd2;color:#2f5d45}
button.danger{background:#a9553b}
button.danger:hover{background:#8f4430}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lista{display:grid;gap:12px}
.card{background:#fff;border:1px solid #eee5d8;border-radius:12px;padding:14px}
.card h3{margin:0 0 5px;color:#2f5d45}
.card p{margin:4px 0;color:#68736b;font-size:14px}
.estado{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:bold;margin-top:5px}
.activo{background:#dcebdc;color:#35633f}
.inactivo{background:#eee0d9;color:#8c4937}
.banner{width:100%;max-width:500px;height:180px;object-fit:cover;border-radius:10px;background:#e9e1d3;margin:8px 0}
.preview{width:100%;height:150px;object-fit:cover;border-radius:9px;background:#e9e1d3;display:none;margin-top:8px}
.producto-row{display:grid;grid-template-columns:1fr 120px auto;gap:8px;align-items:center;margin-bottom:8px}
.horarios{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.dia{border:1px solid #eee5d8;border-radius:8px;padding:8px;background:#fff}
.dia strong{display:block;color:#2f5d45;margin-bottom:6px}
.check{display:flex;align-items:center;gap:6px;font-size:13px}
.check input{width:auto}
.mensaje{padding:10px;border-radius:8px;background:#f5eadf;color:#76543d;margin-bottom:12px}
.exito{background:#e2efe3;color:#35633f}
.oculto{display:none}
hr{border:0;border-top:1px solid #eee5d8;margin:18px 0}
@media(max-width:600px){
 .producto-row{grid-template-columns:1fr 100px}
 .producto-row button{grid-column:1/3}
}
</style>
</head>

<body>

<header>
<h1>Sobre Ruedas</h1>
<p>Panel de administración</p>
</header>

<main>

<div id="mensaje"></div>

<section class="seccion">
<h2>Configuración del negocio</h2>

<div class="grid">
<div class="campo">
<label>Nombre del negocio</label>
<input id="nombreNegocio">
</div>

<div class="campo">
<label>Ciudad</label>
<input id="ciudad">
</div>

<div class="campo">
<label>Tarifa de delivery</label>
<input id="tarifaDelivery" type="number" step="0.01" min="0">
</div>

<div class="campo">
<label>WhatsApp del negocio</label>
<input id="whatsappNegocio">
</div>
</div>

<button onclick="guardarConfiguracion()">Guardar configuración</button>
</section>

<section class="seccion">
<h2>Categorías</h2>

<div class="grid">
<div class="campo">
<label>Nueva categoría</label>
<input id="nuevaCategoria" placeholder="Ej.: Hamburguesas">
</div>
</div>

<button onclick="crearCategoria()">Agregar categoría</button>

<hr>

<div id="listaCategorias" class="lista"></div>
</section>

<section class="seccion">
<h2>Nuevo local</h2>

<div class="grid">
<div class="campo">
<label>Nombre</label>
<input id="nuevoNombre">
</div>

<div class="campo">
<label>Categoría</label>
<select id="nuevoCategoria"></select>
</div>

<div class="campo">
<label>Descripción</label>
<textarea id="nuevoDescripcion"></textarea>
</div>

<div class="campo">
<label>Banner</label>
<input id="nuevoBanner" type="file" accept="image/*" onchange="previsualizarArchivo(this,'previewNuevo')">
<img id="previewNuevo" class="preview">
</div>
</div>

<h3 style="color:#2f5d45">Horarios</h3>
<div id="horariosNuevo" class="horarios"></div>

<h3 style="color:#2f5d45;margin-top:18px">Productos</h3>
<div id="productosNuevos"></div>

<div class="acciones">
<button class="gray" onclick="agregarProductoNuevo()">+ Producto</button>
<button onclick="crearLocal()">Crear local</button>
</div>
</section>

<section class="seccion">
<h2>Locales</h2>
<div id="listaLocales" class="lista">Cargando...</div>
</section>

<section id="edicion" class="seccion oculto">
<h2>Editar local</h2>

<input id="editId" type="hidden">

<div class="grid">
<div class="campo">
<label>Nombre</label>
<input id="editNombre">
</div>

<div class="campo">
<label>Categoría</label>
<select id="editCategoria"></select>
</div>

<div class="campo">
<label>Descripción</label>
<textarea id="editDescripcion"></textarea>
</div>

<div class="campo">
<label>Estado</label>
<select id="editActivo">
<option value="true">Activo</option>
<option value="false">Inactivo</option>
</select>
</div>

<div class="campo">
<label>Nuevo banner</label>
<input id="editBanner" type="file" accept="image/*" onchange="previsualizarArchivo(this,'previewEdit')">
<img id="previewEdit" class="preview">
</div>
</div>

<div id="bannerActual"></div>

<h3 style="color:#2f5d45">Horarios</h3>
<div id="horariosEdit" class="horarios"></div>

<h3 style="color:#2f5d45;margin-top:18px">Productos</h3>
<div id="productosEdit"></div>

<div class="acciones">
<button class="gray" onclick="agregarProductoEdit()">+ Producto</button>
<button onclick="guardarEdicion()">Guardar cambios</button>
<button class="gray" onclick="cerrarEdicion()">Cancelar</button>
</div>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>

<script>
const BUCKET="restaurantes";

let categorias=[];
let locales=[];
let productosEdit=[];
let productosNuevos=[];
let horarios=[];
let bannerEdicionActual="";

const dias=[
 "Domingo",
 "Lunes",
 "Martes",
 "Miércoles",
 "Jueves",
 "Viernes",
 "Sábado"
];

function escapeHtml(v=""){
 return String(v).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]);
}

function mostrarMensaje(texto,exito=false){
 mensaje.innerHTML=
  `<div class="mensaje ${exito?"exito":""}">
   ${escapeHtml(texto)}
  </div>`;

 setTimeout(()=>{
  mensaje.innerHTML="";
 },4000);
}

function cacheUrl(url){
 if(!url)return "";
 return url+(url.includes("?")?"&":"?")+"v="+Date.now();
}

function extensionArchivo(nombre=""){
 const partes=nombre.toLowerCase().split(".");
 return partes.length>1?partes.pop():"jpg";
}

async function subirImagen(archivo,idLocal){
 if(!archivo)return null;

 const extension=extensionArchivo(archivo.name);
 const ruta=
  `banners/${idLocal}/${Date.now()}-${crypto.randomUUID()}.${extension}`;

 const {error}=await supabaseClient.storage
  .from(BUCKET)
  .upload(ruta,archivo,{
   cacheControl:"3600",
   upsert:false,
   contentType:archivo.type||"image/jpeg"
  });

 if(error)throw error;

 const {data}=supabaseClient.storage
  .from(BUCKET)
  .getPublicUrl(ruta);

 if(!data?.publicUrl){
  throw new Error("No se pudo obtener la URL pública de la imagen.");
 }

 return data.publicUrl;
}

function previsualizarArchivo(input,id){
 const archivo=input.files?.[0];
 const img=document.getElementById(id);

 if(!archivo){
  img.style.display="none";
  img.removeAttribute("src");
  return;
 }

 img.src=URL.createObjectURL(archivo);
 img.style.display="block";
}

async function cargarConfiguracion(){
 const {data,error}=await supabaseClient
  .from("configuracion_negocio")
  .select("*")
  .order("id")
  .limit(1)
  .maybeSingle();

 if(error)throw error;

 if(data){
  nombreNegocio.value=data.nombre_negocio||"";
  ciudad.value=data.ciudad||"";
  tarifaDelivery.value=data.tarifa_delivery??1.5;
  whatsappNegocio.value=data.whatsapp_negocio||"";
 }
}

async function guardarConfiguracion(){
 try{
  const registro={
   nombre_negocio:nombreNegocio.value.trim()||"Sobre Ruedas",
   ciudad:ciudad.value.trim()||"Esmeraldas",
   tarifa_delivery:Number(tarifaDelivery.value)||0,
   whatsapp_negocio:whatsappNegocio.value.trim(),
   moneda:"USD",
   actualizado_en:new Date().toISOString()
  };

  const {data:existente}=await supabaseClient
   .from("configuracion_negocio")
   .select("id")
   .order("id")
   .limit(1)
   .maybeSingle();

  let error;

  if(existente?.id){
   ({error}=await supabaseClient
    .from("configuracion_negocio")
    .update(registro)
    .eq("id",existente.id));
  }else{
   ({error}=await supabaseClient
    .from("configuracion_negocio")
    .insert(registro));
  }

  if(error)throw error;

  mostrarMensaje("Configuración guardada.",true);
 }catch(e){
  console.error(e);
  mostrarMensaje("No se pudo guardar la configuración: "+e.message);
 }
}

async function cargarCategorias(){
 const {data,error}=await supabaseClient
  .from("categorias")
  .select("*")
  .order("nombre");

 if(error)throw error;

 categorias=data||[];
 renderCategorias();
 cargarSelectCategorias();
}

function renderCategorias(){
 listaCategorias.innerHTML=categorias.map(c=>`
  <div class="card">
   <strong>${escapeHtml(c.nombre)}</strong>
   <span class="estado ${c.activo?"activo":"inactivo"}">
    ${c.activo?"Activa":"Inactiva"}
   </span>
   <div class="acciones">
    <button class="gray" onclick="editarCategoria(${c.id})">
     Editar
    </button>
    <button class="${c.activo?"danger":"sec"}"
     onclick="cambiarEstadoCategoria(${c.id},${!c.activo})">
     ${c.activo?"Desactivar":"Activar"}
    </button>
   </div>
  </div>
 `).join("");
}

function cargarSelectCategorias(){
 const opciones=
  '<option value="">Seleccionar categoría</option>'+
  categorias
   .filter(c=>c.activo)
   .map(c=>`
    <option value="${escapeHtml(c.nombre)}">
     ${escapeHtml(c.nombre)}
    </option>
   `).join("");

 nuevoCategoria.innerHTML=opciones;
 editCategoria.innerHTML=opciones;
}

async function crearCategoria(){
 const nombre=nuevaCategoria.value.trim();

 if(!nombre){
  mostrarMensaje("Ingresa el nombre de la categoría.");
  return;
 }

 try{
  const {error}=await supabaseClient
   .from("categorias")
   .insert({nombre,activo:true});

  if(error)throw error;

  nuevaCategoria.value="";
  await cargarCategorias();
  mostrarMensaje("Categoría creada.",true);
 }catch(e){
  console.error(e);
  mostrarMensaje("No se pudo crear la categoría: "+e.message);
 }
}

async function editarCategoria(id){
 const categoria=categorias.find(c=>Number(c.id)===Number(id));
 if(!categoria)return;

 const nuevo=prompt("Nombre de la categoría:",categoria.nombre);

 if(nuevo===null)return;

 const nombre=nuevo.trim();

 if(!nombre)return;

 try{
  const {error}=await supabaseClient
   .from("categorias")
   .update({nombre})
   .eq("id",id);

  if(error)throw error;

  await cargarCategorias();
  await cargarLocales();
  mostrarMensaje("Categoría actualizada.",true);
 }catch(e){
  console.error(e);
  mostrarMensaje("No se pudo actualizar la categoría: "+e.message);
 }
}

async function cambiarEstadoCategoria(id,activo){
 try{
  const {error}=await supabaseClient
   .from("categorias")
   .update({activo})
   .eq("id",id);

  if(error)throw error;

  await cargarCategorias();
  mostrarMensaje("Estado actualizado.",true);
 }catch(e){
  console.error(e);
  mostrarMensaje("No se pudo actualizar: "+e.message);
 }
}

function renderHorarios(contenedorId,datos=[]){
 const cont=document.getElementById(contenedorId);

 const mapa={};

 datos.forEach(h=>{
  mapa[h.dia_semana]=h;
 });

 cont.innerHTML=dias.map((dia,i)=>{
  const h=mapa[i]||{cerrado:false,hora_apertura:"10:00",hora_cierre:"22:00"};

  return `
   <div class="dia">
    <strong>${dia}</strong>

    <label class="check">
     <input
      type="checkbox"
      id="${contenedorId}_cerrado_${i}"
      ${h.cerrado?"checked":""}>
     Cerrado
    </label>

    <input
     type="time"
     id="${contenedorId}_apertura_${i}"
     value="${h.hora_apertura||"10:00"}"
     style="margin-top:6px">

    <input
     type="time"
     id="${contenedorId}_cierre_${i}"
     value="${h.hora_cierre||"22:00"}"
     style="margin-top:6px">
   </div>
  `;
 }).join("");
}

function leerHorarios(contenedorId){
 return dias.map((_,i)=>({
  dia_semana:i,
  hora_apertura:
   document.getElementById(`${contenedorId}_apertura_${i}`).value||null,
  hora_cierre:
   document.getElementById(`${contenedorId}_cierre_${i}`).value||null,
  cerrado:
   document.getElementById(`${contenedorId}_cerrado_${i}`).checked
 }));
}

function renderProductosNuevos(){
 productosNuevosEl.innerHTML=productosNuevos.map((p,i)=>`
  <div class="producto-row">
   <input
    placeholder="Nombre del producto"
    value="${escapeHtml(p.nombre||"")}"
    oninput="productosNuevos[${i}].nombre=this.value">

   <input
    type="number"
    step="0.01"
    min="0"
    placeholder="Precio"
    value="${p.precio??""}"
    oninput="productosNuevos[${i}].precio=this.value">

   <button class="danger" onclick="eliminarProductoNuevo(${i})">
    Eliminar
   </button>
  </div>
 `).join("");
}

function agregarProductoNuevo(){
 productosNuevos.push({
  nombre:"",
  precio:""
 });

 renderProductosNuevos();
}

function eliminarProductoNuevo(i){
 productosNuevos.splice(i,1);
 renderProductosNuevos();
}

function renderProductosEdit(){
 productosEditEl.innerHTML=productosEdit.map((p,i)=>`
  <div class="card" style="margin-bottom:8px">
   <div class="producto-row">
    <input
     placeholder="Nombre"
     value="${escapeHtml(p.nombre||"")}"
     oninput="productosEdit[${i}].nombre=this.value">

    <input
     type="number"
     step="0.01"
     min="0"
     placeholder="Precio"
     value="${p.precio??""}"
     oninput="productosEdit[${i}].precio=this.value">

    <button class="${p._nuevo?"danger":"gray"}"
     onclick="eliminarProductoEdit(${i})">
     ${p._nuevo?"Eliminar":"Desactivar"}
    </button>
   </div>

   <label class="check">
    <input
     type="checkbox"
     ${p.activo!==false?"checked":""}
     onchange="productosEdit[${i}].activo=this.checked">
    Producto activo
   </label>
  </div>
 `).join("");
}

function agregarProductoEdit(){
 productosEdit.push({
  nombre:"",
  precio:"",
  activo:true,
  _nuevo:true
 });

 renderProductosEdit();
}

function eliminarProductoEdit(i){
 if(productosEdit[i]._nuevo){
  productosEdit.splice(i,1);
 }else{
  productosEdit[i].activo=false;
 }

 renderProductosEdit();
}

async function crearLocal(){
 try{
  const nombre=nuevoNombre.value.trim();

  if(!nombre){
   mostrarMensaje("Ingresa el nombre del local.");
   return;
  }

  if(!nuevoCategoria.value){
   mostrarMensaje("Selecciona una categoría.");
   return;
  }

  const {data,error}=await supabaseClient
   .from("restaurantes")
   .insert({
    nombre,
    categoria:nuevoCategoria.value,
    descripcion:nuevoDescripcion.value.trim(),
    activo:true
   })
   .select()
   .single();

  if(error)throw error;

  let bannerUrl=null;

  try{
   const archivo=nuevoBanner.files?.[0];

   if(archivo){
    bannerUrl=await subirImagen(archivo,data.id);

    const {error:errorBanner}=await supabaseClient
     .from("restaurantes")
     .update({banner_url:bannerUrl})
     .eq("id",data.id);

    if(errorBanner)throw errorBanner;
   }
  }catch(e){
   await supabaseClient
    .from("restaurantes")
    .delete()
    .eq("id",data.id);

   throw new Error("No se pudo subir el banner: "+e.message);
  }

  const horariosData=leerHorarios("horariosNuevo");

  const {error:errorHorarios}=await supabaseClient
   .from("horarios_restaurantes")
   .upsert(
    horariosData.map(h=>({
     restaurante_id:data.id,
     ...h
    })),
    {onConflict:"restaurante_id,dia_semana"}
   );

  if(errorHorarios)throw errorHorarios;

  const productosValidos=productosNuevos
   .filter(p=>p.nombre.trim()&&Number(p.precio)>=0)
   .map(p=>({
    restaurante_id:data.id,
    nombre:p.nombre.trim(),
    precio:Number(p.precio)||0,
    activo:true
   }));

  if(productosValidos.length){
   const {error:errorProductos}=await supabaseClient
    .from("productos")
    .insert(productosValidos);

   if(errorProductos)throw errorProductos;
  }

  nuevoNombre.value="";
  nuevoCategoria.value="";
  nuevoDescripcion.value="";
  nuevoBanner.value="";
  previewNuevo.style.display="none";
  productosNuevos=[];
  renderProductosNuevos();
  renderHorarios("horariosNuevo");

  await cargarLocales();

  mostrarMensaje("Local creado correctamente.",true);

 }catch(e){
  console.error(e);
  mostrarMensaje("No se pudo crear el local: "+e.message);
 }
}

async function cargarLocales(){
 try{
  const {data,error}=await supabaseClient
   .from("restaurantes")
   .select("*")
   .order("nombre");

  if(error)throw error;

  locales=data||[];

  listaLocales.innerHTML=locales.length
   ? locales.map(l=>`
    <div class="card">
     ${
      l.banner_url
      ? `<img
          class="banner"
          src="${escapeHtml(cacheUrl(l.banner_url))}"
          alt="${escapeHtml(l.nombre)}"
          onerror="this.style.display='none'">`
      : ""
     }

     <h3>${escapeHtml(l.nombre)}</h3>

     <p>
      <strong>Categoría:</strong>
      ${escapeHtml(l.categoria||"")}
     </p>

     <p>${escapeHtml(l.descripcion||"")}</p>

     <span class="estado ${l.activo?"activo":"inactivo"}">
      ${l.activo?"Activo":"Inactivo"}
     </span>

     <div class="acciones">
      <button onclick="abrirEdicion(${l.id})">
       Editar
      </button>

      <button class="${l.activo?"danger":"sec"}"
       onclick="cambiarEstadoLocal(${l.id},${!l.activo})">
       ${l.activo?"Desactivar":"Activar"}
      </button>

      <button class="danger"
       onclick="eliminarLocal(${l.id})">
       Eliminar
      </button>
     </div>
    </div>
   `).join("")
   : `<div class="card">No hay locales registrados.</div>`;

 }catch(e){
  console.error(e);
  listaLocales.innerHTML=
   `<div class="mensaje">No se pudieron cargar los locales.</div>`;
 }
}

async function abrirEdicion(id){
 try{
  const local=locales.find(l=>Number(l.id)===Number(id));
  if(!local)return;

  editId.value=local.id;
  editNombre.value=local.nombre||"";
  editCategoria.value=local.categoria||"";
  editDescripcion.value=local.descripcion||"";
  editActivo.value=String(local.activo!==false);

  bannerEdicionActual=local.banner_url||"";
  editBanner.value="";
  previewEdit.style.display="none";
  previewEdit.removeAttribute("src");

  bannerActual.innerHTML=local.banner_url
   ? `
    <p style="color:#53665a;font-weight:bold">Banner actual</p>
    <img
     class="banner"
     src="${escapeHtml(cacheUrl(local.banner_url))}"
     onerror="this.style.display='none'">
   `
   : `<p style="color:#68736b">Este local no tiene banner.</p>`;

  const {data:horariosData,error:errorHorarios}=await supabaseClient
   .from("horarios_restaurantes")
   .select("*")
   .eq("restaurante_id",id)
   .order("dia_semana");

  if(errorHorarios)throw errorHorarios;

  renderHorarios("horariosEdit",horariosData||[]);

  const {data:productos,error:errorProductos}=await supabaseClient
   .from("productos")
   .select("*")
   .eq("restaurante_id",id)
   .order("nombre");

  if(errorProductos)throw errorProductos;

  productosEdit=(productos||[]).map(p=>({
   ...p,
   _nuevo:false
  }));

  renderProductosEdit();

  edicion.classList.remove("oculto");
  edicion.scrollIntoView({behavior:"smooth",block:"start"});

 }catch(e){
  console.error(e);
  mostrarMensaje("No se pudo cargar el local: "+e.message);
 }
}

async function guardarEdicion(){
 try{
  const id=Number(editId.value);

  if(!id)return;

  if(!editNombre.value.trim()){
   mostrarMensaje("Ingresa el nombre del local.");
   return;
  }

  let bannerUrl=bannerEdicionActual;

  const archivo=editBanner.files?.[0];

  if(archivo){
   bannerUrl=await subirImagen(archivo,id);
  }

  const {error}=await supabaseClient
   .from("restaurantes")
   .update({
    nombre:editNombre.value.trim(),
    categoria:editCategoria.value||null,
    descripcion:editDescripcion.value.trim(),
    activo:editActivo.value==="true",
    banner_url:bannerUrl||null
   })
   .eq("id",id);

  if(error)throw error;

  const horariosData=leerHorarios("horariosEdit");

  const {error:errorHorarios}=await supabaseClient
   .from("horarios_restaurantes")
   .upsert(
    horariosData.map(h=>({
     restaurante_id:id,
     ...h
    })),
    {onConflict:"restaurante_id,dia_semana"}
   );

  if(errorHorarios)throw errorHorarios;

  const existentes=productosEdit.filter(p=>!p._nuevo);

  for(const p of existentes){
   const {error:errorProducto}=await supabaseClient
    .from("productos")
    .update({
     nombre:p.nombre.trim(),
     precio:Number(p.precio)||0,
     activo:p.activo!==false
    })
    .eq("id",p.id);

   if(errorProducto)throw errorProducto;
  }

  const nuevos=productosEdit
   .filter(p=>p._nuevo&&p.nombre.trim())
   .map(p=>({
    restaurante_id:id,
    nombre:p.nombre.trim(),
    precio:Number(p.precio)||0,
    activo:p.activo!==false
   }));

  if(nuevos.length){
   const {error:errorNuevos}=await supabaseClient
    .from("productos")
    .insert(nuevos);

   if(errorNuevos)throw errorNuevos;
  }

  await cargarLocales();
  cerrarEdicion();

  mostrarMensaje("Local actualizado correctamente.",true);

 }catch(e){
  console.error(e);
  mostrarMensaje("No se pudo actualizar el local: "+e.message);
 }
}

function cerrarEdicion(){
 edicion.classList.add("oculto");
 bannerEdicionActual="";
 productosEdit=[];
 editBanner.value="";
 previewEdit.style.display="none";
 bannerActual.innerHTML="";
}

async function eliminarLocal(id){
 const local=locales.find(l=>Number(l.id)===Number(id));

 if(!local)return;

 if(!confirm(
  `¿Eliminar definitivamente el local "${local.nombre}"?\n\n`+
  "También se eliminarán sus productos y horarios."
 ))return;

 try{
  const {error:errorProductos}=await supabaseClient
   .from("productos")
   .delete()
   .eq("restaurante_id",id);

  if(errorProductos)throw errorProductos;

  const {error:errorHorarios}=await supabaseClient
   .from("horarios_restaurantes")
   .delete()
   .eq("restaurante_id",id);

  if(errorHorarios)throw errorHorarios;

  const {error}=await supabaseClient
   .from("restaurantes")
   .delete()
   .eq("id",id);

  if(error)throw error;

  await cargarLocales();

  mostrarMensaje("Local eliminado.",true);

 }catch(e){
  console.error(e);
  mostrarMensaje("No se pudo eliminar el local: "+e.message);
 }
}
