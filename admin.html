<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Sobre Ruedas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:18px;text-align:center}
main{max-width:1100px;margin:auto;padding:20px}
section{background:#fff;padding:20px;margin-bottom:20px;border-radius:10px;box-shadow:0 2px 8px #0001}
h2{margin:0 0 15px}
h3{margin:15px 0 8px}
input,select,textarea{width:100%;padding:10px;margin:5px 0 10px;border:1px solid #ccc;border-radius:6px}
textarea{min-height:80px;resize:vertical}
button{border:0;border-radius:6px;padding:9px 13px;cursor:pointer;margin:3px}
.btn{background:#222;color:#fff}
.btn2{background:#ddd;color:#222}
.ok{background:#198754;color:#fff}
.danger{background:#c0392b;color:#fff}
.warn{background:#f39c12;color:#fff}
.mensaje{padding:10px;border-radius:6px;margin-top:10px;display:none}
.exito{display:block;background:#dff5e5;color:#176b35}
.error{display:block;background:#fde2e2;color:#8b1e1e}
.item{border:1px solid #ddd;border-radius:8px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.estado{font-weight:bold;font-size:13px}
.activo{color:#198754}
.inactivo{color:#c0392b}
.img{width:90px;height:70px;object-fit:cover;border-radius:6px;border:1px solid #ddd}
.preview{max-width:180px;max-height:120px;object-fit:cover;border-radius:6px;margin:5px 0}
.producto{border:1px solid #ddd;padding:12px;border-radius:8px;margin:8px 0}
.oculto{display:none!important}
.dia{border:1px solid #ddd;padding:10px;border-radius:7px}
.dia label{display:block}
small{color:#666}
</style>
</head>

<body>
<header><h1>Administración | Sobre Ruedas</h1></header>

<main>

<section>
<h2>Configuración del negocio</h2>
<div class="grid">
<div><label>Tarifa delivery</label><input id="tarifaDelivery" type="number" min="0" step="0.01"></div>
<div><label>WhatsApp</label><input id="whatsappNegocio" type="text"></div>
</div>
<button class="btn ok" onclick="guardarConfiguracion()">Guardar configuración</button>
<div id="mensajeConfiguracion" class="mensaje"></div>
</section>

<section>
<h2>Categorías</h2>
<div class="flex">
<input id="nuevaCategoria" placeholder="Nueva categoría" style="flex:1">
<button class="btn ok" onclick="agregarCategoria()">Agregar</button>
</div>
<div id="listaCategorias"></div>
<div id="mensajeCategoria" class="mensaje"></div>
</section>

<section>
<h2>Nuevo restaurante</h2>

<div class="grid">
<div><label>Nombre</label><input id="nombreRestaurante"></div>
<div><label>Categoría</label><select id="categoriaRestaurante"></select></div>
</div>

<label>Descripción</label>
<textarea id="descripcionRestaurante"></textarea>

<label>Banner <small>(opcional)</small></label>
<input id="bannerRestaurante" type="file" accept="image/*" onchange="mostrarBanner()">
<div id="previewBanner" class="oculto">
<img id="imagenBanner" class="preview">
</div>

<h3>Productos</h3>
<div id="listaProductos"></div>
<button class="btn2" onclick="agregarProducto()">+ Producto</button>

<br><br>
<button class="btn ok" onclick="publicarRestaurante()">Publicar restaurante</button>
<div id="mensajePublicacion" class="mensaje"></div>
</section>

<section id="editorRestaurante" class="oculto">
<h2>Editar restaurante</h2>
<input type="hidden" id="editarId">

<div class="grid">
<div><label>Nombre</label><input id="editarNombreRestaurante"></div>
<div><label>Categoría</label><select id="editarCategoriaRestaurante"></select></div>
</div>

<label>Descripción</label>
<textarea id="editarDescripcionRestaurante"></textarea>

<label>Banner nuevo <small>(opcional)</small></label>
<input id="editarBannerRestaurante" type="file" accept="image/*" onchange="mostrarBannerEdicion()">

<div id="previewBannerEdicion" class="oculto">
<img id="editarImagenBanner" class="preview">
</div>

<label>
<input type="checkbox" id="quitarBannerRestaurante" onchange="actualizarPreviewBannerEdicion()">
 Quitar banner actual
</label>

<label>
<input type="checkbox" id="editarActivoRestaurante">
 Restaurante activo
</label>

<div>
<button class="btn ok" onclick="guardarEdicionRestaurante()">Guardar cambios</button>
<button class="btn2" onclick="cerrarEditorRestaurante()">Cancelar</button>
</div>

<div id="mensajeEdicionRestaurante" class="mensaje"></div>
</section>

<section id="editorProductos" class="oculto">
<h2>Productos</h2>
<div id="nombreRestauranteProductos"></div>
<div id="listaProductosEdicion"></div>

<h3>Agregar producto</h3>
<div class="grid">
<div><label>Nombre</label><input id="nuevoProductoNombre"></div>
<div><label>Precio</label><input id="nuevoProductoPrecio" type="number" min="0" step="0.01"></div>
</div>

<label>Imagen <small>(opcional)</small></label>
<input id="nuevoProductoImagen" type="file" accept="image/*">

<button class="btn ok" onclick="agregarProductoExistente()">Agregar producto</button>
<button class="btn2" onclick="cerrarEditorProductos()">Cerrar</button>

<div id="mensajeProductos" class="mensaje"></div>
</section>

<section>
<h2>Restaurantes</h2>
<div id="restaurantesLista">Cargando...</div>
</section>

<section>
<h2>Horarios</h2>
<select id="restauranteHorario" onchange="cargarHorariosRestaurante()"></select>
<div id="editorHorarios"></div>
<button class="btn ok" onclick="guardarHorarios()">Guardar horarios</button>
<div id="mensajeHorarios" class="mensaje"></div>
</section>

</main>

<script>
let productos=[],bannerArchivo=null,configuracionNegocioId=null;
let categoriasDisponibles=[],restaurantesCache=[];
let restauranteEditandoId=null,bannerEdicionArchivo=null,quitarBannerEdicion=false;
let productosEdicion=[],diasNombres=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

document.addEventListener("DOMContentLoaded",async()=>{
 await cargarConfiguracion();
 await cargarCategorias();
 agregarProducto();
 await cargarRestaurantes();
 await cargarRestaurantesParaHorarios();
});

function mensaje(id,text,tipo="exito"){
 const e=document.getElementById(id);
 e.textContent=text;e.className="mensaje "+tipo;
}

function escaparHTML(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function cargarConfiguracion(){
 try{
  const {data,error}=await supabaseClient.from("configuracion_negocio")
   .select("id,nombre_negocio,ciudad,tarifa_delivery,whatsapp_negocio,moneda")
   .order("id",{ascending:true}).limit(1).maybeSingle();
  if(error)throw error;
  if(data){
   configuracionNegocioId=data.id;
   tarifaDelivery.value=Number(data.tarifa_delivery).toFixed(2);
   whatsappNegocio.value=data.whatsapp_negocio||"";
  }else{
   tarifaDelivery.value=Number(CONFIG.tarifaDelivery||0).toFixed(2);
   whatsappNegocio.value=CONFIG.whatsappNegocio||"";
  }
 }catch(e){
  tarifaDelivery.value=Number(CONFIG.tarifaDelivery||0).toFixed(2);
  whatsappNegocio.value=CONFIG.whatsappNegocio||"";
  mensaje("mensajeConfiguracion","No se pudo cargar configuración: "+e.message,"error");
 }
}

async function guardarConfiguracion(){
 const tarifa=Number(tarifaDelivery.value),whatsapp=whatsappNegocio.value.trim();
 if(Number.isNaN(tarifa)||tarifa<0)return mensaje("mensajeConfiguracion","Tarifa inválida.","error");
 if(!whatsapp)return mensaje("mensajeConfiguracion","Ingresa el WhatsApp.","error");

 try{
  const datos={
   nombre_negocio:CONFIG.nombreNegocio||"Sobre Ruedas",
   ciudad:CONFIG.ciudad||"Esmeraldas",
   tarifa_delivery:tarifa,whatsapp_negocio:whatsapp,
   moneda:CONFIG.moneda||"USD",actualizado_en:new Date().toISOString()
  };
  let r;
  if(configuracionNegocioId)
   r=await supabaseClient.from("configuracion_negocio").update(datos).eq("id",configuracionNegocioId);
  else{
   r=await supabaseClient.from("configuracion_negocio").insert(datos).select("id").single();
   if(r.data)configuracionNegocioId=r.data.id;
  }
  if(r.error)throw r.error;
  mensaje("mensajeConfiguracion","Configuración guardada.");
 }catch(e){mensaje("mensajeConfiguracion","No se pudo guardar: "+e.message,"error")}
}

async function cargarCategorias(){
 try{
  const {data,error}=await supabaseClient.from("categorias").select("id,nombre,activo").order("nombre");
  if(error)throw error;
  categoriasDisponibles=data||[];
  const opciones=categoriasDisponibles.map(c=>`<option value="${escaparHTML(c.nombre)}">${escaparHTML(c.nombre)}${c.activo?"":" (INACTIVA)"}</option>`).join("");
  categoriaRestaurante.innerHTML=opciones;
  renderCategorias();
 }catch(e){mensaje("mensajeCategoria","Error cargando categorías: "+e.message,"error")}
}

function renderCategorias(){
 listaCategorias.innerHTML=categoriasDisponibles.length?categoriasDisponibles.map(c=>`
 <div class="item flex">
 <span style="flex:1"><b>${escaparHTML(c.nombre)}</b> <span class="${c.activo?"activo":"inactivo"}">${c.activo?"ACTIVA":"INACTIVA"}</span></span>
 <button class="btn2" onclick="editarCategoria(${c.id},'${escaparHTML(c.nombre)}')">Editar</button>
 <button class="${c.activo?"danger":"ok"}" onclick="cambiarEstadoCategoria(${c.id},${!c.activo})">${c.activo?"Desactivar":"Activar"}</button>
 </div>`).join(""):"<p>No existen categorías.</p>";
}

async function agregarCategoria(){
 const nombre=nuevaCategoria.value.trim();
 if(!nombre)return mensaje("mensajeCategoria","Ingresa una categoría.","error");
 try{
  const {error}=await supabaseClient.from("categorias").insert({nombre});
  if(error)throw error;
  nuevaCategoria.value="";
  await cargarCategorias();
  mensaje("mensajeCategoria","Categoría agregada.");
 }catch(e){mensaje("mensajeCategoria","No se pudo agregar: "+e.message,"error")}
}

async function editarCategoria(id,nombre){
 const nuevo=prompt("Nombre de la categoría:",nombre);
 if(!nuevo||nuevo.trim()===nombre)return;
 try{
  const {error}=await supabaseClient.from("categorias").update({nombre:nuevo.trim()}).eq("id",id);
  if(error)throw error;
  await cargarCategorias();
 }catch(e){mensaje("mensajeCategoria","No se pudo editar: "+e.message,"error")}
}

async function cambiarEstadoCategoria(id,activo){
 try{
  const {error}=await supabaseClient.from("categorias").update({activo}).eq("id",id);
  if(error)throw error;
  await cargarCategorias();
 }catch(e){mensaje("mensajeCategoria","No se pudo actualizar: "+e.message,"error")}
}

async function subirImagen(archivo,carpeta){
 if(!archivo)return null;
 if(!supabaseClient?.storage)throw new Error("Supabase Storage no está disponible.");
 const ext=(archivo.name.split(".").pop()||"jpg").toLowerCase();
 const nombre=`${carpeta}/${Date.now()}-${Math.random().toString(36).slice(2,10)}.${ext}`;
 try{
  const {error}=await supabaseClient.storage.from("restaurantes").upload(nombre,archivo,{
   cacheControl:"3600",upsert:false,contentType:archivo.type||"application/octet-stream"
  });
  if(error)throw new Error(error.message||"Error de Storage");
  const {data}=supabaseClient.storage.from("restaurantes").getPublicUrl(nombre);
  if(!data?.publicUrl)throw new Error("No se pudo obtener la URL.");
  return data.publicUrl;
 }catch(e){
  console.error("Storage:",e);
  if(String(e.message).includes("NetworkError")||e.name==="TypeError")
   throw new Error("No se pudo conectar con Supabase Storage. Verifica el bucket 'restaurantes' y la conexión de Supabase.");
  throw e;
 }
}

function mostrarBanner(){
 const archivo=bannerRestaurante.files[0];
 bannerArchivo=archivo||null;
 if(!archivo){previewBanner.classList.add("oculto");return}
 imagenBanner.src=URL.createObjectURL(archivo);
 previewBanner.classList.remove("oculto");
}

function agregarProducto(nombre="",precio=0){
 productos.push({nombre,precio:Number(precio)||0,archivoImagen:null,imagenUrl:null});
 mostrarProductos();
}

function mostrarProductos(){
 listaProductos.innerHTML=productos.map((p,i)=>`
 <div class="producto">
 <div class="grid">
 <div><input placeholder="Nombre" value="${escaparHTML(p.nombre)}" oninput="productos[${i}].nombre=this.value"></div>
 <div><input type="number" min="0" step=".01" placeholder="Precio" value="${p.precio}" oninput="productos[${i}].precio=Number(this.value)||0"></div>
 </div>
 <input type="file" accept="image/*" onchange="seleccionarImagenProducto(${i},this)">
 <small>Imagen opcional</small>
 <button class="danger" onclick="eliminarProducto(${i})">Eliminar</button>
 </div>`).join("");
}

function seleccionarImagenProducto(i,input){
 productos[i].archivoImagen=input.files[0]||null;
}

function eliminarProducto(i){
 productos.splice(i,1);
 mostrarProductos();
}

async function publicarRestaurante(){
 const nombre=nombreRestaurante.value.trim(),categoria=categoriaRestaurante.value,descripcion=descripcionRestaurante.value.trim();
 if(!nombre)return mensaje("mensajePublicacion","Ingresa el nombre.","error");
 if(!categoria)return mensaje("mensajePublicacion","Selecciona una categoría.","error");
 if(!productos.length)return mensaje("mensajePublicacion","Agrega al menos un producto.","error");
 for(const p of productos)if(!p.nombre.trim()||p.precio<0)return mensaje("mensajePublicacion","Revisa los productos.","error");

 try{
  mensaje("mensajePublicacion","Publicando...");
  const bannerUrl=await subirImagen(bannerArchivo,"banners");
  const {data:r,error}=await supabaseClient.from("restaurantes").insert({
   nombre,categoria,descripcion,banner_url:bannerUrl,activo:true
  }).select().single();
  if(error)throw error;

  for(const p of productos){
   const imagenUrl=await subirImagen(p.archivoImagen,`productos/${r.id}`);
   const {error:e}=await supabaseClient.from("productos").insert({
    restaurante_id:r.id,nombre:p.nombre.trim(),precio:Number(p.precio),imagen_url:imagenUrl
   });
   if(e)throw e;
  }

  mensaje("mensajePublicacion","Restaurante publicado correctamente.");
  limpiarFormulario();
  await cargarRestaurantes();
  await cargarRestaurantesParaHorarios();
 }catch(e){mensaje("mensajePublicacion","No se pudo publicar: "+e.message,"error")}
}

function limpiarFormulario(){
 nombreRestaurante.value="";
 descripcionRestaurante.value="";
 bannerRestaurante.value="";
 bannerArchivo=null;
 previewBanner.classList.add("oculto");
 productos=[];
 agregarProducto();
}

async function cargarRestaurantes(){
 try{
  const {data,error}=await supabaseClient.from("restaurantes")
   .select("id,nombre,categoria,descripcion,banner_url,activo,creado_en")
   .order("creado_en",{ascending:false});
  if(error)throw error;
  restaurantesCache=data||[];
  if(!restaurantesCache.length){
   restaurantesLista.innerHTML="<p>No existen restaurantes.</p>";return;
  }

  restaurantesLista.innerHTML=restaurantesCache.map(r=>`
  <div class="item">
   <div class="flex">
    ${r.banner_url?`<img src="${escaparHTML(r.banner_url)}" class="img">`:""}
    <div style="flex:1">
     <b>${escaparHTML(r.nombre)}</b><br>
     ${escaparHTML(r.categoria||"Sin categoría")}<br>
     <small>${escaparHTML(r.descripcion||"")}</small><br>
     <span class="estado ${r.activo?"activo":"inactivo"}">${r.activo?"ACTIVO":"INACTIVO"}</span>
    </div>
   </div>
   <hr>
   <button class="btn" onclick="abrirEditorRestaurante(${r.id})">Editar restaurante</button>
   <button class="btn" onclick="abrirEditorProductos(${r.id})">Gestionar productos</button>
   <button class="${r.activo?"danger":"ok"}" onclick="cambiarEstadoRestaurante(${r.id},${!r.activo})">${r.activo?"Desactivar":"Activar"}</button>
  </div>`).join("");
 }catch(e){
  restaurantesLista.innerHTML=`<p class="inactivo">Error: ${escaparHTML(e.message)}</p>`;
 }
}

function cargarSelectCategorias(select,actual){
 select.innerHTML=categoriasDisponibles.map(c=>`
 <option value="${escaparHTML(c.nombre)}">${escaparHTML(c.nombre)}${c.activo?"":" (INACTIVA)"}</option>`).join("");
 if(actual&&!categoriasDisponibles.some(c=>c.nombre===actual))
  select.insertAdjacentHTML("beforeend",`<option value="${escaparHTML(actual)}">${escaparHTML(actual)}</option>`);
 select.value=actual||"";
}

function abrirEditorRestaurante(id){
 const r=restaurantesCache.find(x=>x.id===id);
 if(!r)return;
 restauranteEditandoId=id;
 bannerEdicionArchivo=null;
 quitarBannerEdicion=false;
 editarId.value=id;
 editarNombreRestaurante.value=r.nombre||"";
 editarDescripcionRestaurante.value=r.descripcion||"";
 editarActivoRestaurante.checked=!!r.activo;
 editarBannerRestaurante.value="";
 quitarBannerRestaurante.checked=false;
 cargarSelectCategorias(editarCategoriaRestaurante,r.categoria);
 editarImagenBanner.src=r.banner_url||"";
 previewBannerEdicion.classList.toggle("oculto",!r.banner_url);
 editorRestaurante.classList.remove("oculto");
 editorProductos.classList.add("oculto");
 window.scrollTo({top:editorRestaurante.offsetTop-10,behavior:"smooth"});
}

function mostrarBannerEdicion(){
 const archivo=editarBannerRestaurante.files[0];
 bannerEdicionArchivo=archivo||null;
 if(!archivo)return;
 quitarBannerRestaurante.checked=false;
 editarImagenBanner.src=URL.createObjectURL(archivo);
 previewBannerEdicion.classList.remove("oculto");
}

function actualizarPreviewBannerEdicion(){
 if(quitarBannerRestaurante.checked&&!bannerEdicionArchivo){
  previewBannerEdicion.classList.add("oculto");
 }
}

async function guardarEdicionRestaurante(){
 if(!restauranteEditandoId)return;
 const r=restaurantesCache.find(x=>x.id===restauranteEditandoId);
 const nombre=editarNombreRestaurante.value.trim();
 if(!nombre)return mensaje("mensajeEdicionRestaurante","Ingresa el nombre.","error");

 try{
  mensaje("mensajeEdicionRestaurante","Guardando...");
  let bannerUrl=r.banner_url||null;

  /* SOLO sube si realmente se seleccionó una imagen nueva */
  if(bannerEdicionArchivo)
   bannerUrl=await subirImagen(bannerEdicionArchivo,`banners/${restauranteEditandoId}`);
  else if(quitarBannerRestaurante.checked)
   bannerUrl=null;

  const {error}=await supabaseClient.from("restaurantes").update({
   nombre,
   categoria:editarCategoriaRestaurante.value,
   descripcion:editarDescripcionRestaurante.value.trim(),
   banner_url:bannerUrl,
   activo:editarActivoRestaurante.checked
  }).eq("id",restauranteEditandoId);

  if(error)throw error;

  mensaje("mensajeEdicionRestaurante","Restaurante actualizado.");
  await cargarRestaurantes();
  await cargarRestaurantesParaHorarios();
 }catch(e){
  console.error(e);
  mensaje("mensajeEdicionRestaurante","No se pudo actualizar: "+e.message,"error");
 }
}

function cerrarEditorRestaurante(){
 editorRestaurante.classList.add("oculto");
 restauranteEditandoId=null;
 bannerEdicionArchivo=null;
}

async function cambiarEstadoRestaurante(id,activo){
 try{
  const {error}=await supabaseClient.from("restaurantes").update({activo}).eq("id",id);
  if(error)throw error;
  await cargarRestaurantes();
  await cargarRestaurantesParaHorarios();
 }catch(e){alert("No se pudo actualizar: "+e.message)}
}

async function abrirEditorProductos(id){
 const r=restaurantesCache.find(x=>x.id===id);
 if(!r)return;
 restauranteEditandoId=id;
 nombreRestauranteProductos.innerHTML=`<b>${escaparHTML(r.nombre)}</b>`;
 editorProductos.classList.remove("oculto");
 editorRestaurante.classList.add("oculto");
 await cargarProductosEdicion(id);
 window.scrollTo({top:editorProductos.offsetTop-10,behavior:"smooth"});
}

async function cargarProductosEdicion(id){
 listaProductosEdicion.innerHTML="Cargando...";
 try{
  const {data,error}=await supabaseClient.from("productos")
   .select("id,restaurante_id,nombre,precio,imagen_url")
   .eq("restaurante_id",id).order("id");
  if(error)throw error;
  productosEdicion=data||[];
  renderProductosEdicion();
 }catch(e){listaProductosEdicion.innerHTML=`<p class="inactivo">${escaparHTML(e.message)}</p>`}
}

function renderProductosEdicion(){
 if(!productosEdicion.length){
  listaProductosEdicion.innerHTML="<p>No existen productos.</p>";return;
 }
 listaProductosEdicion.innerHTML=productosEdicion.map((p,i)=>`
 <div class="producto">
  <div class="grid">
   <div>
    <label>Nombre</label>
    <input value="${escaparHTML(p.nombre)}" onchange="productosEdicion[${i}].nombre=this.value">
   </div>
   <div>
    <label>Precio</label>
    <input type="number" min="0" step=".01" value="${p.precio}" onchange="productosEdicion[${i}].precio=Number(this.value)">
   </div>
  </div>
  ${p.imagen_url?`<img src="${escaparHTML(p.imagen_url)}" class="img">`:""}
  <label>Nueva imagen <small>(opcional)</small></label>
  <input type="file" accept="image/*" onchange="productosEdicion[${i}].archivoImagen=this.files[0]||null">
  <label><input type="checkbox" onchange="productosEdicion[${i}].quitarImagen=this.checked"> Quitar imagen</label>
  <br>
  <button class="btn ok" onclick="guardarProductoEditado(${i})">Guardar producto</button>
  <button class="danger" onclick="eliminarProductoExistente(${p.id})">Eliminar</button>
  <div id="msgProd${p.id}" class="mensaje"></div>
 </div>`).join("");
}

async function guardarProductoEditado(i){
 const p=productosEdicion[i];
 if(!p.nombre?.trim())return alert("Ingresa el nombre del producto.");
 if(Number(p.precio)<0)return alert("El precio no puede ser negativo.");

 try{
  let imagenUrl=p.imagen_url||null;

  /* Solo sube si el usuario eligió una imagen nueva */
  if(p.archivoImagen)
   imagenUrl=await subirImagen(p.archivoImagen,`productos/${p.restaurante_id}`);
  else if(p.quitarImagen)
   imagenUrl=null;

  const {error}=await supabaseClient.from("productos").update({
   nombre:p.nombre.trim(),
   precio:Number(p.precio),
   imagen_url:imagenUrl
  }).eq("id",p.id);

  if(error)throw error;
  await cargarProductosEdicion(p.restaurante_id);
 }catch(e){alert("No se pudo actualizar el producto: "+e.message)}
}

async function eliminarProductoExistente(id){
 if(!confirm("¿Eliminar este producto?"))return;
 try{
  const {error}=await supabaseClient.from("productos").delete().eq("id",id);
  if(error)throw error;
  await cargarProductosEdicion(restauranteEditandoId);
 }catch(e){alert("No se pudo eliminar: "+e.message)}
}

async function agregarProductoExistente(){
 const nombre=nuevoProductoNombre.value.trim();
 const precio=Number(nuevoProductoPrecio.value);
 const archivo=nuevoProductoImagen.files[0]||null;

 if(!nombre)return mensaje("mensajeProductos","Ingresa el nombre.","error");
 if(Number.isNaN(precio)||precio<0)return mensaje("mensajeProductos","Precio inválido.","error");

 try{
  const imagenUrl=await subirImagen(archivo,`productos/${restauranteEditandoId}`);
  const {error}=await supabaseClient.from("productos").insert({
   restaurante_id:restauranteEditandoId,
   nombre,precio,imagen_url:imagenUrl
  });
  if(error)throw error;

  nuevoProductoNombre.value="";
  nuevoProductoPrecio.value="";
  nuevoProductoImagen.value="";
  await cargarProductosEdicion(restauranteEditandoId);
  mensaje("mensajeProductos","Producto agregado.");
 }catch(e){mensaje("mensajeProductos","No se pudo agregar: "+e.message,"error")}
}

function cerrarEditorProductos(){
 editorProductos.classList.add("oculto");
 productosEdicion=[];
}

async function cargarRestaurantesParaHorarios(){
 try{
  const {data,error}=await supabaseClient.from("restaurantes")
   .select("id,nombre").order("nombre");
  if(error)throw error;
  restauranteHorario.innerHTML=(data||[]).map(r=>`<option value="${r.id}">${escaparHTML(r.nombre)}</option>`).join("");
  if(data?.length)cargarHorariosRestaurante();
 }catch(e){editorHorarios.innerHTML=`<p class="inactivo">${escaparHTML(e.message)}</p>`}
}

async function cargarHorariosRestaurante(){
 const id=Number(restauranteHorario.value);
 if(!id)return;
 try{
  const {data,error}=await supabaseClient.from("horarios_restaurantes")
   .select("dia_semana,hora_apertura,hora_cierre,cerrado")
   .eq("restaurante_id",id).order("dia_semana");
  if(error)throw error;
  const mapa={};
  (data||[]).forEach(x=>mapa[x.dia_semana]=x);

  editorHorarios.innerHTML=diasNombres.map((d,i)=>{
   const h=mapa[i]||{cerrado:false,hora_apertura:"10:00",hora_cierre:"22:00"};
   return `<div class="dia">
    <b>${d}</b>
    <label><input type="checkbox" id="cerrado${i}" ${h.cerrado?"checked":""} onchange="cambiarEstadoDia(${i})"> Cerrado</label>
    <div class="grid">
     <input type="time" id="apertura${i}" value="${h.hora_apertura||"10:00"}" ${h.cerrado?"disabled":""}>
     <input type="time" id="cierre${i}" value="${h.hora_cierre||"22:00"}" ${h.cerrado?"disabled":""}>
    </div>
   </div>`;
  }).join("");
 }catch(e){mensaje("mensajeHorarios","No se pudieron cargar horarios: "+e.message,"error")}
}

function cambiarEstadoDia(i){
 const cerrado=document.getElementById("cerrado"+i).checked;
 document.getElementById("apertura"+i).disabled=cerrado;
 document.getElementById("cierre"+i).disabled=cerrado;
}

async function guardarHorarios(){
 const id=Number(restauranteHorario.value);
 if(!id)return mensaje("mensajeHorarios","Selecciona un restaurante.","error");

 try{
  const {error:delError}=await supabaseClient.from("horarios_restaurantes").delete().eq("restaurante_id",id);
  if(delError)throw delError;

  const filas=diasNombres.map((_,i)=>{
   const cerrado=document.getElementById("cerrado"+i).checked;
   return{
    restaurante_id:id,
    dia_semana:i,
    hora_apertura:cerrado?null:document.getElementById("apertura"+i).value,
    hora_cierre:cerrado?null:document.getElementById("cierre"+i).value,
    cerrado
   };
  });

  const {error}=await supabaseClient.from("horarios_restaurantes").insert(filas);
  if(error)throw error;
  mensaje("mensajeHorarios","Horarios guardados correctamente.");
 }catch(e){mensaje("mensajeHorarios","No se pudieron guardar: "+e.message,"error")}
}
</script>
