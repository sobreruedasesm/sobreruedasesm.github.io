<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Sobre Ruedas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:16px;text-align:center}
main{max-width:1100px;margin:auto;padding:20px}
section{background:#fff;padding:18px;margin-bottom:18px;border-radius:10px;box-shadow:0 2px 8px #0001}
h2{margin:0 0 15px}
h3{margin:15px 0 8px}
input,select,textarea{width:100%;padding:9px;margin:4px 0 9px;border:1px solid #ccc;border-radius:6px}
textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:6px;padding:9px 12px;cursor:pointer;margin:3px}
.btn{background:#222;color:#fff}
.btn2{background:#ddd;color:#222}
.ok{background:#198754;color:#fff}
.danger{background:#c0392b;color:#fff}
.mensaje{padding:9px;border-radius:6px;margin-top:10px;display:none}
.exito{display:block;background:#dff5e5;color:#176b35}
.error{display:block;background:#fde2e2;color:#8b1e1e}
.item,.producto,.dia{border:1px solid #ddd;border-radius:8px;padding:11px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.estado{font-weight:bold;font-size:13px}
.activo{color:#198754}
.inactivo{color:#c0392b}
.img{width:100px;height:75px;object-fit:cover;border-radius:6px;border:1px solid #ddd}
.preview{max-width:200px;max-height:130px;object-fit:cover;border-radius:6px;margin:5px 0}
.oculto{display:none!important}
small{color:#666}
.horarios{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.dia label{display:block;font-weight:bold;margin-bottom:5px}
.producto img{width:80px;height:60px;object-fit:cover;border-radius:6px}
.url-imagen{font-size:10px;color:#666;word-break:break-all;margin-top:4px}
.cargando{color:#666}
.imagen-error{font-size:12px;color:#c0392b;background:#fde2e2;padding:5px;border-radius:5px;margin-top:4px}
</style>
</head>

<body>

<header>
<h1>Administración | Sobre Ruedas</h1>
</header>

<main>

<!-- CONFIGURACIÓN -->
<section>
<h2>Configuración del negocio</h2>

<div class="grid">
<div>
<label>Tarifa delivery</label>
<input id="tarifaDelivery" type="number" min="0" step=".01">
</div>

<div>
<label>WhatsApp</label>
<input id="whatsappNegocio">
</div>
</div>

<button class="btn ok" onclick="guardarConfiguracion()">Guardar configuración</button>
<div id="mensajeConfiguracion" class="mensaje"></div>
</section>


<!-- CATEGORÍAS -->
<section>
<h2>Categorías</h2>

<div class="flex">
<input id="nuevaCategoria" placeholder="Nueva categoría">
<button class="btn ok" onclick="agregarCategoria()">Agregar</button>
</div>

<div id="listaCategorias"></div>
<div id="mensajeCategoria" class="mensaje"></div>
</section>


<!-- CREAR LOCAL -->
<section>

<h2>Crear local</h2>

<div class="grid">
<div>
<label>Nombre del local</label>
<input id="nombreLocal">
</div>

<div>
<label>Categoría</label>
<select id="categoriaLocal"></select>
</div>
</div>

<label>Descripción</label>
<textarea id="descripcionLocal" placeholder="Descripción del local"></textarea>

<label>Banner <small>(opcional)</small></label>
<input id="bannerLocal" type="file" accept="image/*" onchange="mostrarBanner()">

<div id="previewBanner" class="oculto">
<img id="imagenBanner" class="preview">
</div>

<h3>Horario del local</h3>
<div id="horarioNuevo" class="horarios"></div>

<h3>Productos del local</h3>
<div id="listaProductos"></div>

<button class="btn2" onclick="agregarProducto()">+ Producto</button>

<br><br>

<button class="btn ok" onclick="publicarLocal()">Publicar local</button>
<div id="mensajePublicacion" class="mensaje"></div>

</section>


<!-- LOCALES -->
<section>

<h2>Locales registrados</h2>
<div id="localesLista">Cargando...</div>

</section>


<!-- EDITAR LOCAL -->
<section id="editor" class="oculto">

<h2>Editar local</h2>

<input type="hidden" id="editarId">

<div class="grid">

<div>
<label>Nombre del local</label>
<input id="editarNombre">
</div>

<div>
<label>Categoría</label>
<select id="editarCategoria"></select>
</div>

</div>

<label>Descripción</label>
<textarea id="editarDescripcion"></textarea>

<label>Nuevo banner <small>(opcional)</small></label>
<input id="editarBanner" type="file" accept="image/*" onchange="mostrarBannerEdicion()">

<div id="previewEditarBanner" class="oculto">
<img id="editarImagen" class="preview">
<div id="errorImagenEditar" class="imagen-error oculto"></div>
</div>

<label>
<input type="checkbox" id="quitarBanner">
Quitar banner actual
</label>

<label>
<input type="checkbox" id="editarActivo">
Local activo
</label>

<h3>Horario del local</h3>
<div id="horarioEditar" class="horarios"></div>

<h3>Productos del local</h3>
<div id="productosEditar"></div>

<h3>Agregar producto</h3>

<div class="grid">

<div>
<label>Nombre</label>
<input id="nuevoProductoNombre">
</div>

<div>
<label>Precio</label>
<input id="nuevoProductoPrecio" type="number" min="0" step=".01">
</div>

</div>

<label>Imagen <small>(opcional)</small></label>
<input id="nuevoProductoImagen" type="file" accept="image/*">

<button class="btn ok" onclick="agregarProductoExistente()">Agregar producto</button>

<br><br>

<button class="btn ok" onclick="guardarLocalCompleto()">Guardar todos los cambios</button>
<button class="btn2" onclick="cerrarEditor()">Cancelar</button>

<div id="mensajeEdicion" class="mensaje"></div>

</section>

</main>


<script>

let productos=[];
let bannerArchivo=null;
let configuracionNegocioId=null;
let categoriasDisponibles=[];
let localesCache=[];
let localEditandoId=null;
let bannerEdicionArchivo=null;
let productosEdicion=[];

const dias=[
"Domingo","Lunes","Martes","Miércoles",
"Jueves","Viernes","Sábado"
];

document.addEventListener("DOMContentLoaded",async()=>{
    await cargarConfiguracion();
    await cargarCategorias();
    generarHorario("horarioNuevo");
    agregarProducto();
    await cargarLocales();
});

const $id=id=>document.getElementById(id);

function mensaje(id,text,tipo="exito"){
    const e=$id(id);
    if(!e)return;
    e.textContent=text;
    e.className="mensaje "+tipo;
}

function escapar(v){
    return String(v??"").replace(/[&<>"']/g,m=>({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
    }[m]));
}


/* =====================================================
CONFIGURACIÓN
===================================================== */

async function cargarConfiguracion(){

    try{

        const {data,error}=await supabaseClient
        .from("configuracion_negocio")
        .select("*")
        .order("id",{ascending:true})
        .limit(1)
        .maybeSingle();

        if(error)throw error;

        if(data){

            configuracionNegocioId=data.id;

            $id("tarifaDelivery").value=data.tarifa_delivery??"";
            $id("whatsappNegocio").value=data.whatsapp_negocio??"";

        }

    }catch(e){

        console.error(e);

        mensaje(
            "mensajeConfiguracion",
            "No se pudo cargar la configuración: "+e.message,
            "error"
        );

    }

}


async function guardarConfiguracion(){

    try{

        const datos={
            tarifa_delivery:Number($id("tarifaDelivery").value||0),
            whatsapp_negocio:$id("whatsappNegocio").value.trim()
        };

        let error;

        if(configuracionNegocioId){

            ({error}=await supabaseClient
            .from("configuracion_negocio")
            .update(datos)
            .eq("id",configuracionNegocioId));

        }else{

            const r=await supabaseClient
            .from("configuracion_negocio")
            .insert(datos)
            .select()
            .single();

            error=r.error;

            if(!error)
                configuracionNegocioId=r.data.id;

        }

        if(error)throw error;

        mensaje(
            "mensajeConfiguracion",
            "Configuración guardada correctamente."
        );

    }catch(e){

        console.error(e);

        mensaje(
            "mensajeConfiguracion",
            "No se pudo guardar: "+e.message,
            "error"
        );

    }

}


/* =====================================================
CATEGORÍAS
===================================================== */

async function cargarCategorias(){

    try{

        const {data,error}=await supabaseClient
        .from("categorias")
        .select("*")
        .order("nombre");

        if(error)throw error;

        categoriasDisponibles=data||[];

        llenarCategorias();
        renderCategorias();

    }catch(e){

        console.error(e);

        mensaje(
            "mensajeCategoria",
            "No se pudieron cargar las categorías: "+e.message,
            "error"
        );

    }

}


function llenarCategorias(){

    const opciones=
        `<option value="">Seleccionar categoría</option>`+
        categoriasDisponibles
        .filter(c=>c.activo)
        .map(c=>`
            <option value="${escapar(c.nombre)}">
                ${escapar(c.nombre)}
            </option>
        `).join("");

    $id("categoriaLocal").innerHTML=opciones;
    $id("editarCategoria").innerHTML=opciones;

}


function renderCategorias(){

    $id("listaCategorias").innerHTML=
    categoriasDisponibles.map(c=>`

        <div class="item flex">

            <div style="flex:1">
                <strong>${escapar(c.nombre)}</strong>

                <span class="estado ${c.activo?"activo":"inactivo"}">
                    ${c.activo?"Activa":"Inactiva"}
                </span>
            </div>

            <button
                class="btn2"
                onclick="editarCategoria(${c.id},'${escapar(c.nombre)}')">
                Editar
            </button>

            <button
                class="${c.activo?"danger":"ok"}"
                onclick="cambiarCategoria(${c.id},${!c.activo})">
                ${c.activo?"Desactivar":"Activar"}
            </button>

        </div>

    `).join("");

}


async function agregarCategoria(){

    const nombre=$id("nuevaCategoria").value.trim();

    if(!nombre)
        return mensaje(
            "mensajeCategoria",
            "Ingresa una categoría.",
            "error"
        );

    try{

        const {error}=await supabaseClient
        .from("categorias")
        .insert({nombre});

        if(error)throw error;

        $id("nuevaCategoria").value="";

        await cargarCategorias();

        mensaje(
            "mensajeCategoria",
            "Categoría agregada correctamente."
        );

    }catch(e){

        mensaje(
            "mensajeCategoria",
            "No se pudo agregar: "+e.message,
            "error"
        );

    }

}


async function editarCategoria(id,nombreActual){

    const nuevo=prompt(
        "Nombre de la categoría:",
        nombreActual
    );

    if(nuevo===null)return;

    const nombre=nuevo.trim();

    if(!nombre)return;

    try{

        const {error}=await supabaseClient
        .from("categorias")
        .update({nombre})
        .eq("id",id);

        if(error)throw error;

        await cargarCategorias();

    }catch(e){

        alert("No se pudo actualizar la categoría: "+e.message);

    }

}


async function cambiarCategoria(id,activo){

    try{

        const {error}=await supabaseClient
        .from("categorias")
        .update({activo})
        .eq("id",id);

        if(error)throw error;

        await cargarCategorias();

    }catch(e){

        alert("No se pudo cambiar el estado: "+e.message);

    }

}


/* =====================================================
STORAGE
===================================================== */

async function subirImagen(archivo,carpeta){

    if(!archivo)return null;

    if(!archivo.type.startsWith("image/"))
        throw new Error("El archivo seleccionado no es una imagen.");

    const ext=(archivo.name.split(".").pop()||"jpg").toLowerCase();

    const ruta=
        `${carpeta}/${Date.now()}-${crypto.randomUUID
            ?crypto.randomUUID()
            :Math.random().toString(36).slice(2)
        }.${ext}`;

    console.log("Subiendo imagen:",{
        bucket:"restaurantes",
        ruta,
        nombre:archivo.name,
        tipo:archivo.type,
        tamaño:archivo.size
    });

    const {data,error}=await supabaseClient.storage
        .from("restaurantes")
        .upload(
            ruta,
            archivo,
            {
                cacheControl:"3600",
                upsert:false,
                contentType:archivo.type
            }
        );

    if(error){

        console.error("ERROR STORAGE:",error);

        throw new Error(
            "No se pudo subir la imagen: "+error.message
        );

    }

    console.log("Imagen subida:",data);

    const {data:publicData}=
        supabaseClient.storage
        .from("restaurantes")
        .getPublicUrl(ruta);

    const url=publicData?.publicUrl;

    if(!url)
        throw new Error(
            "La imagen se subió pero no se pudo obtener su URL."
        );

    console.log("URL pública:",url);

    return url;

}


/* =====================================================
PREVIEW
===================================================== */

function mostrarBanner(){

    const archivo=$id("bannerLocal").files[0]||null;

    bannerArchivo=archivo;

    if(!archivo){

        $id("previewBanner").classList.add("oculto");
        return;

    }

    $id("imagenBanner").src=
        URL.createObjectURL(archivo);

    $id("previewBanner").classList.remove("oculto");

}


function mostrarBannerEdicion(){

    const archivo=$id("editarBanner").files[0]||null;

    bannerEdicionArchivo=archivo;

    if(!archivo)return;

    $id("editarImagen").src=
        URL.createObjectURL(archivo);

    $id("errorImagenEditar").classList.add("oculto");

    $id("previewEditarBanner").classList.remove("oculto");

    $id("quitarBanner").checked=false;

}


/* =====================================================
HORARIOS
===================================================== */

function generarHorario(contenedor,datos={}){

    $id(contenedor).innerHTML=

    dias.map((dia,i)=>{

        const d=datos[i]||{};

        return`

        <div class="dia">

            <label>${dia}</label>

            <label>
                <input
                    type="checkbox"
                    id="horario${contenedor}C${i}"
                    ${d.cerrado?"checked":""}
                    onchange="cambiarDia('${contenedor}',${i})">
                Cerrado
            </label>

            <input
                type="time"
                id="horario${contenedor}A${i}"
                value="${d.hora_apertura||""}"
                ${d.cerrado?"disabled":""}>

            <input
                type="time"
                id="horario${contenedor}B${i}"
                value="${d.hora_cierre||""}"
                ${d.cerrado?"disabled":""}>

        </div>

        `;

    }).join("");

}


function cambiarDia(contenedor,i){

    const cerrado=
        $id(`horario${contenedor}C${i}`).checked;

    $id(`horario${contenedor}A${i}`).disabled=cerrado;
    $id(`horario${contenedor}B${i}`).disabled=cerrado;

}


function obtenerHorario(contenedor,localId){

    return dias.map((_,i)=>{

        const cerrado=
            $id(`horario${contenedor}C${i}`).checked;

        return{

            restaurante_id:localId,
            dia_semana:i,

            hora_apertura:
                cerrado
                ?null
                :$id(`horario${contenedor}A${i}`).value||null,

            hora_cierre:
                cerrado
                ?null
                :$id(`horario${contenedor}B${i}`).value||null,

            cerrado

        };

    });

}


/* =====================================================
PRODUCTOS NUEVOS
===================================================== */

function agregarProducto(){

    productos.push({
        nombre:"",
        precio:"",
        imagen:null
    });

    renderProductos();

}


function renderProductos(){

    $id("listaProductos").innerHTML=

    productos.map((p,i)=>`

        <div class="producto">

            <div class="grid">

                <div>

                    <label>Nombre</label>

                    <input
                        value="${escapar(p.nombre)}"
                        oninput="productos[${i}].nombre=this.value"
                        placeholder="Nombre del producto">

                </div>

                <div>

                    <label>Precio</label>

                    <input
                        type="number"
                        min="0"
                        step=".01"
                        value="${p.precio}"
                        oninput="productos[${i}].precio=this.value">

                </div>

            </div>

            <label>Imagen <small>(opcional)</small></label>

            <input
                type="file"
                accept="image/*"
                onchange="productos[${i}].imagen=this.files[0]||null">

            <button
                class="danger"
                onclick="productos.splice(${i},1);renderProductos()">
                Eliminar
            </button>

        </div>

    `).join("");

}


/* =====================================================
PUBLICAR LOCAL
===================================================== */

async function publicarLocal(){

    const nombre=$id("nombreLocal").value.trim();
    const categoria=$id("categoriaLocal").value;
    const descripcion=$id("descripcionLocal").value.trim();

    if(!nombre)
        return mensaje(
            "mensajePublicacion",
            "Ingresa el nombre del local.",
            "error"
        );

    if(!categoria)
        return mensaje(
            "mensajePublicacion",
            "Selecciona una categoría.",
            "error"
        );

    try{

        mensaje(
            "mensajePublicacion",
            "Publicando local..."
        );

        let banner=null;

        if(bannerArchivo)
            banner=await subirImagen(
                bannerArchivo,
                "banners"
            );

        const {
            data:local,
            error
        }=await supabaseClient
        .from("restaurantes")
        .insert({
            nombre,
            categoria,
            descripcion,
            banner_url:banner,
            activo:true
        })
        .select()
        .single();

        if(error)throw error;

        const horarios=
            obtenerHorario(
                "horarioNuevo",
                local.id
            );

        const {error:eh}=
            await supabaseClient
            .from("horarios_restaurantes")
            .insert(horarios);

        if(eh)throw eh;

        for(const p of productos){

            if(!p.nombre.trim())continue;

            let imagen=null;

            if(p.imagen)
                imagen=await subirImagen(
                    p.imagen,
                    `productos/${local.id}`
                );

            const {error:ep}=
                await supabaseClient
                .from("productos")
                .insert({
                    restaurante_id:local.id,
                    nombre:p.nombre.trim(),
                    precio:Number(p.precio||0),
                    imagen_url:imagen
                });

            if(ep)throw ep;

        }

        mensaje(
            "mensajePublicacion",
            "Local publicado correctamente."
        );

        limpiarNuevo();

        await cargarLocales();

    }catch(e){

        console.error(
            "ERROR PUBLICANDO LOCAL:",
            e
        );

        mensaje(
            "mensajePublicacion",
            "No se pudo publicar el local: "+e.message,
            "error"
        );

    }

}


/* =====================================================
LIMPIAR
===================================================== */

function limpiarNuevo(){

    $id("nombreLocal").value="";
    $id("categoriaLocal").value="";
    $id("descripcionLocal").value="";
    $id("bannerLocal").value="";

    $id("previewBanner")
        .classList.add("oculto");

    bannerArchivo=null;

    generarHorario("horarioNuevo");

    productos=[];

    agregarProducto();

}


/* =====================================================
LOCALES
===================================================== */

async function cargarLocales(){

    try{

        const {data,error}=
            await supabaseClient
            .from("restaurantes")
            .select("*")
            .order("nombre");

        if(error)throw error;

        localesCache=data||[];

        $id("localesLista").innerHTML=

        localesCache.length

        ?

        localesCache.map(l=>`

            <div class="item">

                <div class="flex">

                    <div style="flex:1">

                        <strong>
                            ${escapar(l.nombre)}
                        </strong>

                        <div>
                            ${escapar(l.categoria||"Sin categoría")}
                        </div>

                        <div class="estado ${
                            l.activo?"activo":"inactivo"
                        }">

                            ${l.activo?"Activo":"Inactivo"}

                        </div>

                    </div>

                    ${
                    l.banner_url

                    ?

                    `<div>

                        <img
                            class="img"
                            src="${escapar(l.banner_url)}?v=${Date.now()}"
                            alt="Banner ${escapar(l.nombre)}"
                            onerror="imagenError(this,'localesLista')">

                        <div class="url-imagen">
                            ${escapar(l.banner_url)}
                        </div>

                    </div>`

                    :

                    ""

                    }

                </div>

                <p>
                    ${escapar(l.descripcion||"")}
                </p>

                <button
                    class="btn"
                    onclick="editarLocal(${l.id})">
                    Editar local
                </button>

                <button
                    class="${l.activo?"danger":"ok"}"
                    onclick="cambiarEstadoLocal(
                        ${l.id},
                        ${!l.activo}
                    )">

                    ${l.activo?"Desactivar":"Activar"}

                </button>

            </div>

        `).join("")

        :

        "<p>No hay locales registrados.</p>";

    }catch(e){

        console.error(e);

        $id("localesLista").innerHTML=`
            <div class="mensaje error">
                No se pudieron cargar los locales:
                ${escapar(e.message)}
            </div>
        `;

    }

}


function imagenError(img){

    console.error(
        "No se pudo cargar imagen:",
        img.src
    );

    img.style.display="none";

    const aviso=document.createElement("div");

    aviso.className="imagen-error";

    aviso.textContent=
        "No se pudo cargar esta imagen.";

    img.parentElement.appendChild(aviso);

}


/* =====================================================
EDITAR LOCAL
===================================================== */

async function editarLocal(id){

    try{

        const local=
            localesCache.find(x=>x.id===id);

        if(!local)return;

        localEditandoId=id;

        $id("editarId").value=id;

        $id("editarNombre").value=
            local.nombre||"";

        $id("editarCategoria").value=
            local.categoria||"";

        $id("editarDescripcion").value=
            local.descripcion||"";

        $id("editarActivo").checked=
            !!local.activo;

        $id("editarBanner").value="";

        $id("quitarBanner").checked=false;

        bannerEdicionArchivo=null;

        /* BANNER */

        if(local.banner_url){

            const url=
                local.banner_url+
                (local.banner_url.includes("?")?"&":"?")+
                "v="+Date.now();

            $id("editarImagen").src=url;

            $id("editarImagen").onload=()=>{

                $id("errorImagenEditar")
                    .classList.add("oculto");

            };

            $id("editarImagen").onerror=()=>{

                console.error(
                    "ERROR CARGANDO BANNER:",
                    url
                );

                $id("errorImagenEditar").textContent=
                    "No se pudo cargar la imagen. Revisa Storage y la URL pública.";

                $id("errorImagenEditar")
                    .classList.remove("oculto");

            };

            $id("previewEditarBanner")
                .classList.remove("oculto");

        }else{

            $id("editarImagen").src="";

            $id("previewEditarBanner")
                .classList.add("oculto");

        }

        /* HORARIOS */

        const {
            data:horarios,
            error:eh
        }=await supabaseClient
        .from("horarios_restaurantes")
        .select("*")
        .eq("restaurante_id",id)
        .order("dia_semana");

        if(eh)throw eh;

        const datos={};

        (horarios||[]).forEach(h=>{
            datos[h.dia_semana]=h;
        });

        generarHorario(
            "horarioEditar",
            datos
        );

        /* PRODUCTOS */

        await cargarProductosEdicion(id);

        $id("editor")
            .classList.remove("oculto");

        window.scrollTo({
            top:$id("editor").offsetTop-20,
            behavior:"smooth"
        });

    }catch(e){

        console.error(e);

        alert(
            "No se pudo cargar el local: "+e.message
        );

    }

}


/* =====================================================
PRODUCTOS EDICIÓN
===================================================== */

async function cargarProductosEdicion(localId){

    const {
        data,
        error
    }=await supabaseClient
    .from("productos")
    .select("*")
    .eq("restaurante_id",localId)
    .order("id");

    if(error)throw error;

    productosEdicion=data||[];

    renderProductosEdicion();

}


function renderProductosEdicion(){

    $id("productosEditar").innerHTML=

    productosEdicion.length

    ?

    productosEdicion.map(p=>`

        <div class="producto">

            <div class="flex">

                ${
                p.imagen_url

                ?

                `<img
                    src="${escapar(p.imagen_url)}?v=${Date.now()}"
                    alt="${escapar(p.nombre)}"
                    onerror="this.style.display='none'">`

                :

                ""

                }

                <div style="flex:1">

                    <input
                        type="text"
                        value="${escapar(p.nombre)}"
                        onchange="
                            guardarProducto(
                                ${p.id},
                                this.value,
                                this.parentElement
                                    .querySelector(
                                        'input[type=number]'
                                    ).value
                            )">

                    <input
                        type="number"
                        min="0"
                        step=".01"
                        value="${p.precio}"
                        onchange="
                            guardarProducto(
                                ${p.id},
                                this.parentElement
                                    .querySelector(
                                        'input[type=text]'
                                    ).value,
                                this.value
                            )">

                </div>

                <button
                    class="danger"
                    onclick="eliminarProducto(${p.id})">
                    Eliminar
                </button>

            </div>

            ${
            p.imagen_url
            ?
            `<div class="url-imagen">
                ${escapar(p.imagen_url)}
            </div>`
            :
            ""
            }

        </div>

    `).join("")

    :

    "<p>No hay productos registrados.</p>";

}


async function guardarProducto(id,nombre,precio){

    try{

        const {error}=
            await supabaseClient
            .from("productos")
            .update({
                nombre:nombre.trim(),
                precio:Number(precio||0)
            })
            .eq("id",id);

        if(error)throw error;

    }catch(e){

        alert(
            "No se pudo actualizar el producto: "+e.message
        );

    }

}


/* =====================================================
AGREGAR PRODUCTO
===================================================== */

async function agregarProductoExistente(){

    if(!localEditandoId)return;

    const nombre=
        $id("nuevoProductoNombre").value.trim();

    const precio=
        Number(
            $id("nuevoProductoPrecio").value||0
        );

    const archivo=
        $id("nuevoProductoImagen")
        .files[0]||null;

    if(!nombre){

        return mensaje(
            "mensajeEdicion",
            "Ingresa el nombre del producto.",
            "error"
        );

    }

    try{

        mensaje(
            "mensajeEdicion",
            "Agregando producto..."
        );

        let imagen=null;

        if(archivo){

            imagen=await subirImagen(
                archivo,
                `productos/${localEditandoId}`
            );

        }

        const {error}=
            await supabaseClient
            .from("productos")
            .insert({
                restaurante_id:localEditandoId,
                nombre,
                precio,
                imagen_url:imagen
            });

        if(error)throw error;

        $id("nuevoProductoNombre").value="";
        $id("nuevoProductoPrecio").value="";
        $id("nuevoProductoImagen").value="";

        await cargarProductosEdicion(
            localEditandoId
        );

        mensaje(
            "mensajeEdicion",
            "Producto agregado correctamente."
        );

    }catch(e){

        console.error(e);

        mensaje(
            "mensajeEdicion",
            "No se pudo agregar el producto: "+e.message,
            "error"
        );

    }

}


/* =====================================================
ELIMINAR PRODUCTO
===================================================== */

async function eliminarProducto(id){

    if(!confirm("¿Eliminar este producto?"))
        return;

    try{

        const {error}=
            await supabaseClient
            .from("productos")
            .delete()
            .eq("id",id);

        if(error)throw error;

        await cargarProductosEdicion(
            localEditandoId
        );

    }catch(e){

        alert(
            "No se pudo eliminar el producto: "+e.message
        );

    }

}


/* =====================================================
GUARDAR LOCAL COMPLETO
===================================================== */

async function guardarLocalCompleto(){

    if(!localEditandoId)return;

    const local=
        localesCache.find(
            x=>x.id===localEditandoId
        );

    if(!local)return;

    const nombre=
        $id("editarNombre").value.trim();

    if(!nombre){

        return mensaje(
            "mensajeEdicion",
            "Ingresa el nombre del local.",
            "error"
        );

    }

    try{

        mensaje(
            "mensajeEdicion",
            "Guardando cambios..."
        );

        /*
        CONSERVAR IMAGEN ACTUAL
        */

        let banner=
            local.banner_url||null;

        /*
        SOLO SUBIR SI HAY NUEVA IMAGEN
        */

        if(bannerEdicionArchivo){

            banner=await subirImagen(
                bannerEdicionArchivo,
                `banners/${localEditandoId}`
            );

        }

        /*
        QUITAR IMAGEN
        */

        if($id("quitarBanner").checked){

            banner=null;

        }

        /*
        ACTUALIZAR LOCAL
        */

        const {error}=
            await supabaseClient
            .from("restaurantes")
            .update({

                nombre,

                categoria:
                    $id("editarCategoria").value,

                descripcion:
                    $id("editarDescripcion")
                    .value.trim(),

                banner_url:banner,

                activo:
                    $id("editarActivo").checked

            })
            .eq("id",localEditandoId);

        if(error)throw error;

        /*
        HORARIOS
        */

        const {error:eh}=
            await supabaseClient
            .from("horarios_restaurantes")
            .delete()
            .eq(
                "restaurante_id",
                localEditandoId
            );

        if(eh)throw eh;

        const horarios=
            obtenerHorario(
                "horarioEditar",
                localEditandoId
            );

        const {error:ih}=
            await supabaseClient
            .from("horarios_restaurantes")
            .insert(horarios);

        if(ih)throw ih;

        /*
        REFRESCAR CACHE
        */

        await cargarLocales();

        const actualizado=
            localesCache.find(
                x=>x.id===localEditandoId
            );

        if(actualizado){

            local.banner_url=
                actualizado.banner_url;

        }

        /*
        LIMPIAR ESTADO DE IMAGEN
        */

        bannerEdicionArchivo=null;

        $id("editarBanner").value="";

        $id("quitarBanner").checked=false;

        /*
        RECARGAR PRODUCTOS
        */

        await cargarProductosEdicion(
            localEditandoId
        );

        mensaje(
            "mensajeEdicion",
            "Local y horario actualizados correctamente."
        );

    }catch(e){

        console.error(
            "ERROR ACTUALIZANDO LOCAL:",
            e
        );

        mensaje(
            "mensajeEdicion",
            "No se pudo actualizar el local: "+e.message,
            "error"
        );

    }

}


/* =====================================================
ESTADO
===================================================== */

async function cambiarEstadoLocal(id,activo){

    try{

        const {error}=
            await supabaseClient
            .from("restaurantes")
            .update({activo})
            .eq("id",id);

        if(error)throw error;

        await cargarLocales();

    }catch(e){

        alert(
            "No se pudo cambiar el estado del local: "+e.message
        );

    }

}


/* =====================================================
CERRAR EDITOR
===================================================== */

function cerrarEditor(){

    localEditandoId=null;
    bannerEdicionArchivo=null;
    productosEdicion=[];

    $id("editor")
        .classList.add("oculto");

    $id("mensajeEdicion").className="mensaje";

}

</script>
