<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administración | Sobre Ruedas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;color:#171717}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.header{background:#171717;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:20}
.header h1{margin:0;font-size:22px}
.header small{color:#ccc}
.wrap{max-width:1200px;margin:auto;padding:20px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.nav button{border:0;border-radius:8px;padding:10px 14px;background:#fff;color:#171717;font-weight:700}
.nav button.active{background:#d62828;color:#fff}
.section{display:none}
.section.active{display:block}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:16px}
h2{margin:0 0 15px;font-size:20px}
h3{margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:700}
input,select,textarea{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px;background:#fff}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700}
.primary{background:#d62828;color:#fff}
.success{background:#198754;color:#fff}
.info{background:#1261a0;color:#fff}
.warning{background:#f4c542;color:#171717}
.danger{background:#b42318;color:#fff}
.secondary{background:#e5e7eb;color:#171717}
.muted{color:#5f6670;font-size:13px}
.msg{padding:10px;border-radius:8px;margin-bottom:14px;display:none}
.msg.ok{display:block;background:#dcfce7;color:#166534}
.msg.err{display:block;background:#fee2e2;color:#991b1b}
.preview{width:100%;max-width:300px;max-height:150px;object-fit:cover;border-radius:8px;border:1px solid #ddd;margin-top:5px}
.local-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.local-card{border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#fff}
.local-banner{width:100%;height:160px;object-fit:cover;background:#e5e7eb}
.local-body{padding:15px}
.local-title{font-size:18px;font-weight:800}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px;font-weight:700}
.badge.on{background:#dcfce7;color:#166534}
.badge.off{background:#fee2e2;color:#991b1b}
.category-list{display:grid;gap:10px}
.category-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #ddd;border-radius:9px;padding:10px;background:#fff}
.product-row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border:1px solid #ddd;border-radius:10px;padding:10px;margin-bottom:8px}
.product-img{width:70px;height:70px;border-radius:8px;object-fit:cover;background:#eee}
.product-info strong{display:block}
.product-info small{color:#5f6670}
.product-actions{display:flex;gap:5px;flex-wrap:wrap}
.horario-box{border:1px solid #ddd;border-radius:10px;overflow:hidden}
.horario-row{display:grid;grid-template-columns:110px 100px 1fr 1fr;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #eee}
.horario-row:last-child{border-bottom:0}
.day{font-weight:700}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.toggle input{display:none}
.eye{width:34px;height:24px;border-radius:20px;background:#d1d5db;display:flex;align-items:center;justify-content:center;font-size:14px}
.toggle input:checked+.eye{background:#198754;color:#fff}
.time-wrap{display:flex;align-items:center;gap:6px}
.time-wrap input:disabled{background:#f3f4f6;color:#9ca3af}
.mode-box{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.mode-option{display:flex;align-items:center;gap:7px;font-weight:700}
.mode-option input{width:auto}
.products-editor{margin-top:10px}
.hidden{display:none!important}
@media(max-width:800px){
.grid,.local-list{grid-template-columns:1fr}
.horario-row{grid-template-columns:1fr 80px 1fr 1fr}
}
@media(max-width:600px){
.wrap{padding:12px}
.product-row{grid-template-columns:55px 1fr}
.product-actions{grid-column:1/-1}
.product-img{width:55px;height:55px}
.horario-row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="header">
<h1>Sobre Ruedas · Administración</h1>
<small>Gestión del negocio</small>
</header>

<div class="wrap">

<nav class="nav">
<button class="active" onclick="mostrarSeccion('config',this)">Configuración</button>
<button onclick="mostrarSeccion('categorias',this)">Categorías</button>
<button onclick="mostrarSeccion('locales',this)">Locales</button>
</nav>

<div id="mensaje" class="msg"></div>

<!-- CONFIGURACIÓN -->
<section id="config" class="section active">

<div class="card">
<h2>Configuración del negocio</h2>

<div class="grid">
<div class="field">
<label>Nombre del negocio</label>
<input id="cfgNombre">
</div>

<div class="field">
<label>Ciudad</label>
<input id="cfgCiudad">
</div>

<div class="field">
<label>Tarifa delivery</label>
<input id="cfgDelivery" type="number" min="0" step="0.01">
</div>

<div class="field">
<label>WhatsApp del negocio</label>
<input id="cfgWhatsapp">
</div>

<div class="field">
<label>Moneda</label>
<input id="cfgMoneda">
</div>
</div>

<div class="actions">
<button class="btn primary" onclick="guardarConfiguracion()">Guardar configuración</button>
</div>
</div>

</section>

<!-- CATEGORÍAS -->
<section id="categorias" class="section">

<div class="card">
<h2>Registrar categoría</h2>

<div class="grid">
<div class="field">
<label>Nombre</label>
<input id="catNombre" placeholder="Ej. Hamburguesas">
</div>
</div>

<div class="actions">
<button class="btn primary" onclick="crearCategoria()">Crear categoría</button>
</div>
</div>

<div class="card">
<h2>Lista de categorías</h2>
<div id="listaCategorias"></div>
</div>

</section>

<!-- LOCALES -->
<section id="locales" class="section">

<div class="card">
<h2>Registro de nuevo local</h2>
<p class="muted">Crea el local y configura su horario y productos.</p>

<div class="grid">

<div class="field">
<label>Nombre del local</label>
<input id="locNombre" placeholder="Ej. AGUA VIVA">
</div>

<div class="field">
<label>Categoría</label>
<select id="locCategoria"></select>
</div>

<div class="field full">
<label>Descripción</label>
<textarea id="locDescripcion" placeholder="Descripción del local"></textarea>
</div>

<div class="field">
<label>Banner opcional</label>
<input id="locBanner" type="file" accept="image/*" onchange="previewArchivo(this,'previewBanner')">
<img id="previewBanner" class="preview hidden">
</div>

</div>

<div class="card" style="margin-top:15px;background:#fafafa">
<h3>Horario de atención</h3>

<div class="mode-box">

<label class="mode-option">
<input type="radio" name="modoHorario" value="siempre" onchange="cambiarModoHorario()">
Siempre abierto
</label>

<label class="mode-option">
<input type="radio" name="modoHorario" value="personalizado" checked onchange="cambiarModoHorario()">
Horario personalizado
</label>

<label class="mode-option">
<input type="radio" name="modoHorario" value="cerrado" onchange="cambiarModoHorario()">
Cerrado
</label>

</div>

<div id="horarioEditor"></div>
</div>

<div class="card" style="margin-top:15px;background:#fafafa">
<h3>Productos</h3>
<div id="productosNuevos"></div>

<div class="actions">
<button class="btn success" onclick="agregarProductoNuevo()">+ Agregar producto</button>
</div>
</div>

<div class="actions">
<button class="btn primary" onclick="guardarNuevoLocal()">Guardar nuevo local</button>
<button class="btn secondary" onclick="limpiarFormularioLocal()">Limpiar</button>
</div>

</div>

<!-- LISTA -->
<div class="card">
<h2>Lista de locales</h2>
<div id="listaLocales" class="local-list"></div>
</div>

<!-- EDICIÓN -->
<div id="editorLocal" class="card hidden">
<h2>Editar local</h2>

<input id="editId" type="hidden">

<div class="grid">

<div class="field">
<label>Nombre del local</label>
<input id="editNombre">
</div>

<div class="field">
<label>Categoría</label>
<select id="editCategoria"></select>
</div>

<div class="field full">
<label>Descripción</label>
<textarea id="editDescripcion"></textarea>
</div>

<div class="field">
<label>Banner actual</label>
<img id="editBannerPreview" class="preview hidden">
</div>

<div class="field">
<label>Nueva imagen de banner opcional</label>
<input id="editBanner" type="file" accept="image/*" onchange="previewArchivo(this,'editBannerPreview')">
</div>

</div>

<div class="card" style="margin-top:15px;background:#fafafa">
<h3>Horario de atención</h3>

<div class="mode-box">

<label class="mode-option">
<input type="radio" name="editModoHorario" value="siempre" onchange="cambiarModoHorarioEdit()">
Siempre abierto
</label>

<label class="mode-option">
<input type="radio" name="editModoHorario" value="personalizado" onchange="cambiarModoHorarioEdit()">
Horario personalizado
</label>

<label class="mode-option">
<input type="radio" name="editModoHorario" value="cerrado" onchange="cambiarModoHorarioEdit()">
Cerrado
</label>

</div>

<div id="editHorarioEditor"></div>
</div>

<div class="card" style="margin-top:15px;background:#fafafa">
<h3>Productos</h3>
<div id="productosEditados"></div>

<div class="actions">
<button class="btn success" onclick="agregarProductoEditado()">+ Agregar producto</button>
</div>
</div>

<div class="actions">
<button class="btn primary" onclick="guardarEdicionLocal()">Guardar cambios</button>
<button class="btn secondary" onclick="cerrarEditor()">Cancelar</button>
</div>

</div>

</section>

</div>

<script>
const BUCKET="restaurantes";
const DIAS=[
 {n:"Domingo",d:0},
 {n:"Lunes",d:1},
 {n:"Martes",d:2},
 {n:"Miércoles",d:3},
 {n:"Jueves",d:4},
 {n:"Viernes",d:5},
 {n:"Sábado",d:6}
];

let categorias=[];
let locales=[];
let productosEdit=[];
let productosNuevos=[];

document.addEventListener("DOMContentLoaded",async()=>{
 await cargarTodo();
 construirHorario("horarioEditor","nuevo");
 construirHorario("editHorarioEditor","edit");
});

function mostrarSeccion(id,btn){
 document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
}

function mensaje(texto,tipo="ok"){
 const el=document.getElementById("mensaje");
 el.textContent=texto;
 el.className="msg "+(tipo==="ok"?"ok":"err");
 clearTimeout(window.msgTimer);
 window.msgTimer=setTimeout(()=>el.className="msg",4000);
}

function err(e){
 console.error(e);
 mensaje(e?.message||"Ocurrió un error.","err");
}

async function cargarTodo(){
 try{
  await Promise.all([
   cargarConfiguracion(),
   cargarCategorias(),
   cargarLocales()
  ]);
 }catch(e){err(e)}
}

async function cargarConfiguracion(){
 const {data,error}=await supabaseClient
  .from("configuracion_negocio")
  .select("*")
  .order("id",{ascending:true})
  .limit(1)
  .maybeSingle();

 if(error)throw error;
 if(!data)return;

 cfgNombre.value=data.nombre_negocio||"";
 cfgCiudad.value=data.ciudad||"";
 cfgDelivery.value=data.tarifa_delivery??1.5;
 cfgWhatsapp.value=data.whatsapp_negocio||"";
 cfgMoneda.value=data.moneda||"USD";
}

async function guardarConfiguracion(){
 try{
  const payload={
   nombre_negocio:cfgNombre.value.trim(),
   ciudad:cfgCiudad.value.trim(),
   tarifa_delivery:Number(cfgDelivery.value)||0,
   whatsapp_negocio:cfgWhatsapp.value.trim(),
   moneda:cfgMoneda.value.trim()||"USD",
   actualizado_en:new Date().toISOString()
  };

  const {data:exist}=await supabaseClient
   .from("configuracion_negocio")
   .select("id")
   .order("id",{ascending:true})
   .limit(1)
   .maybeSingle();

  let error;

  if(exist?.id){
   ({error}=await supabaseClient
    .from("configuracion_negocio")
    .update(payload)
    .eq("id",exist.id));
  }else{
   ({error}=await supabaseClient
    .from("configuracion_negocio")
    .insert(payload));
  }

  if(error)throw error;
  mensaje("Configuración guardada correctamente.");
 }catch(e){err(e)}
}

async function cargarCategorias(){
 const {data,error}=await supabaseClient
  .from("categorias")
  .select("*")
  .order("nombre");

 if(error)throw error;

 categorias=data||[];
 pintarCategorias();
 cargarSelectCategorias();
}

function cargarSelectCategorias(){
 const html='<option value="">Sin categoría</option>'+
  categorias.map(c=>`<option value="${escapeHtml(c.nombre)}">${escapeHtml(c.nombre)}</option>`).join("");

 locCategoria.innerHTML=html;
 editCategoria.innerHTML=html;
}

function pintarCategorias(){
 listaCategorias.innerHTML="";

 if(!categorias.length){
  listaCategorias.innerHTML='<p class="muted">No hay categorías.</p>';
  return;
 }

 categorias.forEach(c=>{
  const row=document.createElement("div");
  row.className="category-row";

  row.innerHTML=`
   <div>
    <strong>${escapeHtml(c.nombre)}</strong>
    <span class="badge ${c.activo?"on":"off"}">${c.activo?"Activa":"Inactiva"}</span>
   </div>

   <div class="actions">
    <button class="btn secondary" onclick="editarCategoria(${c.id})">Editar</button>
    <button class="btn ${c.activo?"warning":"success"}"
      onclick="cambiarEstadoCategoria(${c.id},${!c.activo})">
      ${c.activo?"Inactivar":"Activar"}
    </button>
    <button class="btn danger" onclick="eliminarCategoria(${c.id})">Eliminar</button>
   </div>
  `;

  listaCategorias.appendChild(row);
 });
}

async function crearCategoria(){
 try{
  const nombre=catNombre.value.trim();

  if(!nombre){
   mensaje("Escribe el nombre de la categoría.","err");
   return;
  }

  const existe=categorias.some(c=>c.nombre.trim().toLowerCase()===nombre.toLowerCase());

  if(existe){
   mensaje("Ya existe una categoría con ese nombre.","err");
   return;
  }

  const {error}=await supabaseClient
   .from("categorias")
   .insert({nombre,activo:true});

  if(error)throw error;

  catNombre.value="";
  await cargarCategorias();
  mensaje("Categoría creada.");
 }catch(e){err(e)}
}

async function editarCategoria(id){
 const cat=categorias.find(x=>x.id===id);
 if(!cat)return;

 const nombre=prompt("Nuevo nombre de categoría:",cat.nombre);
 if(nombre===null)return;

 const nuevo=nombre.trim();
 if(!nuevo)return;

 const existe=categorias.some(c=>c.id!==id&&c.nombre.trim().toLowerCase()===nuevo.toLowerCase());

 if(existe){
  mensaje("Ya existe una categoría con ese nombre.","err");
  return;
 }

 try{
  const {error:e1}=await supabaseClient
   .from("categorias")
   .update({nombre:nuevo})
   .eq("id",id);

  if(e1)throw e1;

  const {error:e2}=await supabaseClient
   .from("restaurantes")
   .update({categoria:nuevo})
   .eq("categoria",cat.nombre);

  if(e2)throw e2;

  await cargarCategorias();
  await cargarLocales();
  mensaje("Categoría actualizada.");
 }catch(e){err(e)}
}

async function cambiarEstadoCategoria(id,activo){
 try{
  const {error}=await supabaseClient
   .from("categorias")
   .update({activo})
   .eq("id",id);

  if(error)throw error;

  await cargarCategorias();
  mensaje(activo?"Categoría activada.":"Categoría inactivada.");
 }catch(e){err(e)}
}

async function eliminarCategoria(id){
 const cat=categorias.find(x=>x.id===id);
 if(!cat)return;

 const asociados=locales.filter(x=>x.categoria===cat.nombre);

 let texto=`¿Eliminar la categoría "${cat.nombre}"?`;

 if(asociados.length){
  texto+=`\n\nTiene ${asociados.length} local(es) asociado(s). Su categoría quedará vacía.`;
 }

 if(!confirm(texto))return;

 try{
  if(asociados.length){
   const {error:e1}=await supabaseClient
    .from("restaurantes")
    .update({categoria:null})
    .eq("categoria",cat.nombre);

   if(e1)throw e1;
  }

  const {error}=await supabaseClient
   .from("categorias")
   .delete()
   .eq("id",id);

  if(error)throw error;

  await cargarCategorias();
  await cargarLocales();
  mensaje("Categoría eliminada.");
 }catch(e){err(e)}
}

async function cargarLocales(){
 const {data,error}=await supabaseClient
  .from("restaurantes")
  .select("*")
  .order("nombre");

 if(error)throw error;

 locales=data||[];
 pintarLocales();
}

function pintarLocales(){
 listaLocales.innerHTML="";

 if(!locales.length){
  listaLocales.innerHTML='<p class="muted">No hay locales registrados.</p>';
  return;
 }

 locales.forEach(l=>{
  const div=document.createElement("div");
  div.className="local-card";

  const img=l.banner_url
   ? `${l.banner_url}${l.banner_url.includes("?")?"&":"?"}v=${Date.now()}`
   : "";

  div.innerHTML=`
   ${img
    ? `<img class="local-banner" src="${escapeAttr(img)}" alt="">`
    : `<div class="local-banner"></div>`}

   <div class="local-body">
    <div class="local-title">${escapeHtml(l.nombre)}</div>

    <div class="muted">${escapeHtml(l.categoria||"Sin categoría")}</div>

    <p>${escapeHtml(l.descripcion||"")}</p>

    <span class="badge ${l.activo?"on":"off"}">
      ${l.activo?"Activo":"Inactivo"}
    </span>

    <div class="actions">
     <button class="btn info" onclick="editarLocal(${l.id})">Editar</button>

     <button class="btn ${l.activo?"warning":"success"}"
       onclick="cambiarEstadoLocal(${l.id},${!l.activo})">
       ${l.activo?"Inactivar":"Activar"}
     </button>

     <button class="btn danger" onclick="eliminarLocal(${l.id})">
       Eliminar
     </button>
    </div>
   </div>
  `;

  listaLocales.appendChild(div);
 });
}

function cambiarModoHorario(){
 construirHorario("horarioEditor","nuevo");
}

function cambiarModoHorarioEdit(){
 construirHorario("editHorarioEditor","edit");
}

function modoSeleccionado(tipo){
 const name=tipo==="edit"?"editModoHorario":"modoHorario";
 return document.querySelector(`input[name="${name}"]:checked`)?.value||"personalizado";
}

function construirHorario(id,tipo){
 const box=document.getElementById(id);
 if(!box)return;

 const modo=modoSeleccionado(tipo);

 if(modo==="siempre"){
  box.innerHTML='<p class="muted">El local estará abierto las 24 horas, todos los días.</p>';
  return;
 }

 if(modo==="cerrado"){
  box.innerHTML='<p class="muted">El local estará cerrado todos los días.</p>';
  return;
 }

 box.innerHTML=`
  <div class="horario-box">
   ${DIAS.map(d=>`
    <div class="horario-row">
     <div class="day">${d.n}</div>

     <label class="toggle">
      <input
       type="checkbox"
       id="${tipo}Dia${d.d}"
       checked
       onchange="actualizarFilaHorario('${tipo}',${d.d})">
      <span class="eye">👁</span>
      <span class="estado-text">Abierto</span>
     </label>

     <div class="time-wrap">
      <label>Desde</label>
      <input id="${tipo}Apertura${d.d}" type="time" value="10:00">
     </div>

     <div class="time-wrap">
      <label>Hasta</label>
      <input id="${tipo}Cierre${d.d}" type="time" value="22:00">
     </div>
    </div>
   `).join("")}
  </div>
 `;
}

function actualizarFilaHorario(tipo,dia){
 const chk=document.getElementById(`${tipo}Dia${dia}`);
 const ap=document.getElementById(`${tipo}Apertura${dia}`);
 const ci=document.getElementById(`${tipo}Cierre${dia}`);
 const text=chk?.parentElement?.querySelector(".estado-text");

 const abierto=!!chk?.checked;

 if(ap)ap.disabled=!abierto;
 if(ci)ci.disabled=!abierto;
 if(text)text.textContent=abierto?"Abierto":"Cerrado";
}

function obtenerHorario(tipo){
 const modo=modoSeleccionado(tipo);

 if(modo==="siempre")return DIAS.map(d=>({
  dia_semana:d.d,
  hora_apertura:"00:00",
  hora_cierre:"23:59",
  cerrado:false
 }));

 if(modo==="cerrado")return DIAS.map(d=>({
  dia_semana:d.d,
  hora_apertura:null,
  hora_cierre:null,
  cerrado:true
 }));

 return DIAS.map(d=>{
  const abierto=document.getElementById(`${tipo}Dia${d.d}`)?.checked;

  return {
   dia_semana:d.d,
   hora_apertura:abierto?document.getElementById(`${tipo}Apertura${d.d}`)?.value||"10:00":null,
   hora_cierre:abierto?document.getElementById(`${tipo}Cierre${d.d}`)?.value||"22:00":null,
   cerrado:!abierto
  };
 });
}

async function guardarHorario(restauranteId,tipo){
 const horario=obtenerHorario(tipo);

 const {error:eDelete}=await supabaseClient
  .from("horarios_restaurantes")
  .delete()
  .eq("restaurante_id",restauranteId);

 if(eDelete)throw eDelete;

 const rows=horario.map(h=>({
  restaurante_id:restauranteId,
  ...h
 }));

 const {error:eInsert}=await supabaseClient
  .from("horarios_restaurantes")
  .insert(rows);

 if(eInsert)throw eInsert;
}

async function subirImagen(archivo,carpeta,id,subId=""){
 if(!archivo)return null;

 if(!archivo.type?.startsWith("image/"))
  throw new Error("El archivo seleccionado no es una imagen válida.");

 const extension=(archivo.name.split(".").pop()||"jpg")
  .toLowerCase()
  .replace(/[^a-z0-9]/g,"");

 const ruta=`${carpeta}/${id}${subId?"/"+subId:""}/${Date.now()}-${crypto.randomUUID()}.${extension}`;

 const {error}=await supabaseClient
  .storage
  .from(BUCKET)
  .upload(ruta,archivo,{
   cacheControl:"3600",
   upsert:false,
   contentType:archivo.type
  });

 if(error){
  console.error("Storage:",error);
  throw new Error(error.message||"No se pudo subir la imagen.");
 }

 const {data}=supabaseClient
  .storage
  .from(BUCKET)
  .getPublicUrl(ruta);

 if(!data?.publicUrl)
  throw new Error("No se pudo obtener la URL pública de la imagen.");

 return data.publicUrl;
}

async function guardarNuevoLocal(){

 try{

  const nombre=locNombre.value.trim();

  if(!nombre){
   mensaje("El nombre del local es obligatorio.","err");
   return;
  }

  const existe=locales.some(l=>l.nombre.trim().toLowerCase()===nombre.toLowerCase());

  if(existe){
   mensaje("Ya existe un local con ese nombre.","err");
   return;
  }

  const {data,error}=await supabaseClient
   .from("restaurantes")
   .insert({
    nombre,
    categoria:locCategoria.value||null,
    descripcion:locDescripcion.value.trim()||null,
    activo:true
   })
   .select()
   .single();

  if(error)throw error;

  let bannerUrl=null;

  try{
   if(locBanner.files[0]){
    bannerUrl=await subirImagen(
     locBanner.files[0],
     "banners",
     data.id
    );

    const {error:eBanner}=await supabaseClient
     .from("restaurantes")
     .update({banner_url:bannerUrl})
     .eq("id",data.id);

    if(eBanner)throw eBanner;
   }

   await guardarHorario(data.id,"nuevo");

   await guardarProductosNuevos(data.id);

  }catch(e){

   await supabaseClient
    .from("restaurantes")
    .delete()
    .eq("id",data.id);

   throw e;
  }

  limpiarFormularioLocal();
  await cargarLocales();

  mensaje("Local creado correctamente.");

 }catch(e){err(e)}
}

  if(!p.nombre.trim())continue;

  const {data,error}=await supabaseClient
   .from("productos")
   .insert({
    restaurante_id:localId,
    nombre:p.nombre.trim(),
    descripcion:p.descripcion.trim()||null,
    precio:Number(p.precio)||0,
    activo:true
   })
   .select()
   .single();

  if(error)throw error;

  if(p.imagen){

   const url=await subirImagen(
    p.imagen,
    "productos",
    localId,
    data.id
   );

   const {error:e}=await supabaseClient
    .from("productos")
    .update({imagen_url:url})
    .eq("id",data.id);

   if(e)throw e;
  }
}

}

async function editarLocal(id){

 try{

  const local=locales.find(x=>x.id===id);
  if(!local)return;

  editId.value=id;
  editNombre.value=local.nombre||"";
  editCategoria.value=local.categoria||"";
  editDescripcion.value=local.descripcion||"";
  editBanner.value="";

  if(local.banner_url){
   editBannerPreview.src=local.banner_url+"?v="+Date.now();
   editBannerPreview.classList.remove("hidden");
  }else{
   editBannerPreview.src="";
   editBannerPreview.classList.add("hidden");
  }

  const {data:horarios,error:e1}=await supabaseClient
   .from("horarios_restaurantes")
   .select("*")
   .eq("restaurante_id",id)
   .order("dia_semana");

  if(e1)throw e1;

  prepararHorarioEdicion(horarios||[]);

  const {data:productos,error:e2}=await supabaseClient
   .from("productos")
   .select("*")
   .eq("restaurante_id",id)
   .order("id");

  if(e2)throw e2;

  productosEdit=(productos||[]).map(p=>({
   ...p,
   nuevaImagen:null,
   preview:p.imagen_url||""
  }));

  pintarProductosEditados();

  editorLocal.classList.remove("hidden");

  editorLocal.scrollIntoView({
   behavior:"smooth",
   block:"start"
  });

 }catch(e){err(e)}
}

function prepararHorarioEdicion(horarios){

 const todosSiempre=horarios.length===7&&
  horarios.every(h=>
   !h.cerrado &&
   h.hora_apertura==="00:00:00" &&
   (h.hora_cierre==="23:59:00"||h.hora_cierre==="23:59:59")
  );

 const todosCerrados=horarios.length===7&&
  horarios.every(h=>h.cerrado);

 if(todosSiempre){
  document.querySelector('input[name="editModoHorario"][value="siempre"]').checked=true;
  construirHorario("editHorarioEditor","edit");
  return;
 }

 if(todosCerrados){
  document.querySelector('input[name="editModoHorario"][value="cerrado"]').checked=true;
  construirHorario("editHorarioEditor","edit");
  return;
 }

 document.querySelector('input[name="editModoHorario"][value="personalizado"]').checked=true;
 construirHorario("editHorarioEditor","edit");

 horarios.forEach(h=>{

  const chk=document.getElementById(`editDia${h.dia_semana}`);
  const ap=document.getElementById(`editApertura${h.dia_semana}`);
  const ci=document.getElementById(`editCierre${h.dia_semana}`);

  if(!chk)return;

  chk.checked=!h.cerrado;

  if(h.hora_apertura)ap.value=h.hora_apertura.substring(0,5);
  if(h.hora_cierre)ci.value=h.hora_cierre.substring(0,5);

  actualizarFilaHorario("edit",h.dia_semana);
 });
}

async function guardarEdicionLocal(){

 try{

  const id=Number(editId.value);

  if(!id){
   mensaje("Local inválido.","err");
   return;
  }

  const nombre=editNombre.value.trim();

  if(!nombre){
   mensaje("El nombre del local es obligatorio.","err");
   return;
  }

  const duplicado=locales.some(l=>
   l.id!==id &&
   l.nombre.trim().toLowerCase()===nombre.toLowerCase()
  );

  if(duplicado){
   mensaje("Ya existe otro local con ese nombre.","err");
   return;
  }

  const payload={
   nombre,
   categoria:editCategoria.value||null,
   descripcion:editDescripcion.value.trim()||null
  };

  if(editBanner.files[0]){

   payload.banner_url=await subirImagen(
    editBanner.files[0],
    "banners",
    id
   );
  }

  const {error:e1}=await supabaseClient
   .from("restaurantes")
   .update(payload)
   .eq("id",id);

  if(e1)throw e1;

  await guardarHorario(id,"edit");

  for(const p of productosEdit){

   if(!p.id){

    if(!p.nombre.trim())continue;

    const {data,error}=await supabaseClient
     .from("productos")
     .insert({
      restaurante_id:id,
      nombre:p.nombre.trim(),
      descripcion:p.descripcion?.trim()||null,
      precio:Number(p.precio)||0,
      activo:p.activo!==false
     })
     .select()
     .single();

    if(error)throw error;

    p.id=data.id;

    if(p.nuevaImagen){

     const url=await subirImagen(
      p.nuevaImagen,
      "productos",
      id,
      p.id
     );

     const {error:e}=await supabaseClient
      .from("productos")
      .update({imagen_url:url})
      .eq("id",p.id);

     if(e)throw e;
    }

   }else{

    const values={
     nombre:p.nombre.trim(),
     descripcion:p.descripcion?.trim()||null,
     precio:Number(p.precio)||0,
     activo:p.activo!==false
    };

    if(p.nuevaImagen){

     values.imagen_url=await subirImagen(
      p.nuevaImagen,
      "productos",
      id,
      p.id
     );
    }

    const {error}=await supabaseClient
     .from("productos")
     .update(values)
     .eq("id",p.id);

    if(error)throw error;
   }
  }

  cerrarEditor();
  await cargarLocales();

  mensaje("Local actualizado correctamente.");

 }catch(e){err(e)}
}

async function eliminarLocal(id){

 const local=locales.find(x=>x.id===id);
 if(!local)return;

 if(!confirm(
  `¿Eliminar definitivamente el local "${local.nombre}"?\n\nTambién se eliminarán sus productos y horarios.`
 ))return;

 try{

  const {data:productos,error:e1}=await supabaseClient
   .from("productos")
   .select("id")
   .eq("restaurante_id",id);

  if(e1)throw e1;

  const {error:e2}=await supabaseClient
   .from("horarios_restaurantes")

   .eq("restaurante_id",id);

  if(e2)throw e2;

  const {error:e3}=await supabaseClient
   .from("productos")
   .delete()
   .eq("restaurante_id",id);

  if(e3)throw e3;

  const {error:e4}=await supabaseClient
   .from("restaurantes")
   .delete()
   .eq("id",id);

  if(e4)throw e4;

  await cargarLocales();

  mensaje("Local eliminado.");

 }catch(e){err(e)}
}

function cerrarEditor(){
 editorLocal.classList.add("hidden");
 productosEdit=[];
}

function previewArchivo(input,targetId){

 const file=input.files[0];
 const target=document.getElementById(targetId);

 if(!file){
  target.src="";
  target.classList.add("hidden");
  return;
 }

 if(!file.type.startsWith("image/")){
  mensaje("Selecciona una imagen válida.","err");
  input.value="";
  return;
 }

 const reader=new FileReader();

 reader.onload=e=>{
  target.src=e.target.result;
  target.classList.remove("hidden");
 };

 reader.readAsDataURL(file);
}

function escapeHtml(value){
 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function escapeAttr(value){
 return escapeHtml(value);
}
