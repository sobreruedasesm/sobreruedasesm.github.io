<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi pedido - Sobre Ruedas</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f5;
            color: #17352b;
        }

        header {
            background: #087f5b;
            color: white;
            padding: 18px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        header p {
            margin: 6px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }

        .contenedor {
            width: 92%;
            max-width: 900px;
            margin: 25px auto 50px;
        }

        .boton-volver {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #087f5b;
            font-weight: bold;
        }

        .titulo {
            margin-bottom: 20px;
        }

        .titulo h2 {
            margin: 0;
            font-size: 28px;
        }

        .titulo p {
            margin-top: 6px;
            color: #66756e;
        }

        .carrera {
            background: white;
            border-radius: 14px;
            margin-bottom: 22px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            border-left: 5px solid #087f5b;
        }

        .carrera-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .carrera-header h3 {
            margin: 0;
            color: #087f5b;
            font-size: 20px;
        }

        .carrera-header span {
            font-size: 13px;
            background: #e6f5ef;
            color: #087f5b;
            padding: 6px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .producto {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #e6ebe8;
        }

        .producto:last-child {
            border-bottom: none;
        }

        .producto-info {
            flex: 1;
        }

        .producto-nombre {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .producto-precio {
            color: #66756e;
            font-size: 14px;
        }

        .controles {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-cantidad {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 8px;
            background: #087f5b;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .btn-cantidad:hover {
            background: #066b4c;
        }

        .cantidad {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }

        .btn-eliminar {
            margin-left: 5px;
            border: none;
            background: transparent;
            color: #c0392b;
            cursor: pointer;
            font-size: 18px;
        }

        .resumen-carrera {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #dfe7e3;
        }

        .fila {
            display: flex;
            justify-content: space-between;
            margin: 7px 0;
        }

        .fila.total {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #dfe7e3;
            font-size: 18px;
            font-weight: bold;
            color: #087f5b;
        }

        .formulario {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-top: 25px;
        }

        .formulario h3 {
            margin-top: 0;
            color: #087f5b;
        }

        .campo {
            margin-bottom: 16px;
        }

        .campo label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .campo input,
        .campo textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd7d2;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
        }

        .campo textarea {
            min-height: 85px;
            resize: vertical;
        }

        .campo input:focus,
        .campo textarea:focus {
            outline: none;
            border-color: #087f5b;
        }

        .resumen-final {
            background: #e6f5ef;
            padding: 18px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .resumen-final .fila.total {
            border-top-color: #b9d8cc;
        }

        .btn-confirmar {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #087f5b;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-confirmar:hover {
            background: #066b4c;
        }

        .vacio {
            background: white;
            padding: 40px 25px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .vacio h2 {
            margin-top: 0;
            color: #087f5b;
        }

        .vacio a {
            display: inline-block;
            margin-top: 15px;
            background: #087f5b;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .mensaje {
            display: none;
            margin-top: 20px;
            padding: 18px;
            border-radius: 10px;
            background: #e6f5ef;
            border: 1px solid #9dd2bd;
            color: #145c43;
        }

        .mensaje.error {
            background: #fdecea;
            border-color: #f3b6af;
            color: #8a2d24;
        }

        .pedido-generado {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-top: 25px;
            display: none;
        }

        .pedido-generado h2 {
            color: #087f5b;
            margin-top: 0;
        }

        .carrera-confirmada {
            background: #f4f7f5;
            padding: 15px;
            border-radius: 10px;
            margin: 12px 0;
        }

        @media (max-width: 600px) {
            .contenedor {
                width: 94%;
            }

            .producto {
                align-items: flex-start;
            }

            .controles {
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .carrera-header {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🛵 Sobre Ruedas</h1>
    <p>Tu comida. Tu ciudad. Tu delivery.</p>
</header>

<div class="contenedor">

    <a href="index.html" class="boton-volver">
        ← Seguir comprando
    </a>

    <div class="titulo">
        <h2>🛒 Mi pedido</h2>
        <p>Revisa tus productos antes de confirmar.</p>
    </div>

    <div id="contenedorCarrito"></div>

    <div id="formularioPedido" style="display:none;">

        <div class="formulario">

            <h3>📍 Datos de entrega</h3>

            <div class="campo">
                <label for="clienteNombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="clienteNombre"
                    placeholder="Ej. Juan Pérez"
                >
            </div>

            <div class="campo">
                <label for="clienteTelefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="clienteTelefono"
                    placeholder="Ej. 0981234567"
                >
            </div>

            <div class="campo">
                <label for="clienteDireccion">
                    Dirección de entrega
                </label>

                <textarea
                    id="clienteDireccion"
                    placeholder="Ej. Calle 10 de Agosto y Bolívar"
                ></textarea>
            </div>

            <div class="campo">
                <label for="clienteReferencia">
                    Referencia
                </label>

                <textarea
                    id="clienteReferencia"
                    placeholder="Ej. Casa blanca junto a la farmacia"
                ></textarea>
            </div>

            <div class="resumen-final">

                <div class="fila">
                    <span>Total productos</span>
                    <strong id="totalProductos">$0.00</strong>
                </div>

                <div class="fila">
                    <span>Delivery</span>
                    <strong id="totalDelivery">$0.00</strong>
                </div>

                <div class="fila total">
                    <span>Total a pagar</span>
                    <strong id="totalGeneral">$0.00</strong>
                </div>

            </div>

            <button
                class="btn-confirmar"
                onclick="confirmarPedido()"
            >
                Confirmar pedido
            </button>

            <div id="mensaje" class="mensaje"></div>

        </div>

    </div>

    <div id="pedidoGenerado" class="pedido-generado"></div>

</div>

<script>

    let carrito = [];
    let nombresRestaurantes = {};

    const tarifaDelivery =
        Number(CONFIG.tarifaDelivery) || 1.50;


    /* =========================================================
       UTILIDADES
    ========================================================= */

    function escaparHTML(texto) {

        if (texto === null || texto === undefined) {
            return "";
        }

        return String(texto)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function dinero(valor) {

        return Number(valor || 0).toLocaleString(
            "en-US",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );
    }


    /* =========================================================
       CARGAR CARRITO
    ========================================================= */

    function cargarCarrito() {

        try {

            const carritoGuardado =
                JSON.parse(
                    localStorage.getItem("carrito")
                );

            carrito =
                Array.isArray(carritoGuardado)
                    ? carritoGuardado
                    : [];

        } catch (error) {

            console.error(
                "Error leyendo carrito:",
                error
            );

            carrito = [];
        }

        normalizarCarrito();

    }


    /* =========================================================
       NORMALIZAR Y CONSOLIDAR PRODUCTOS
    ========================================================= */

    function normalizarCarrito() {

        const productosConsolidados = [];

        carrito.forEach(producto => {

            if (!producto) {
                return;
            }

            const restauranteId =
                producto.restaurante_id ??
                producto.id_restaurante ??
                null;

            const productoId =
                producto.producto_id ??
                producto.id_producto ??
                producto.id ??
                null;

            const nombre =
                producto.nombre ??
                producto.producto_nombre ??
                "Producto";

            const precio =
                Number(
                    producto.precio ??
                    producto.precio_unitario ??
                    0
                );

            const cantidad =
                Math.max(
                    1,
                    Number(producto.cantidad) || 1
                );

            const restauranteNombre =
                producto.restaurante_nombre ??
                producto.restaurante ??
                producto.nombre_restaurante ??
                (
                    restauranteId !== null
                        ? nombresRestaurantes[restauranteId]
                        : null
                ) ??
                "Restaurante";

            /*
             * La combinación producto_id + restaurante_id
             * identifica de manera única al producto.
             */

            const clave =
                `${restauranteId}|${productoId}|${nombre}`;

            const existente =
                productosConsolidados.find(
                    item => item.__clave === clave
                );

            if (existente) {

                existente.cantidad += cantidad;

            } else {

                productosConsolidados.push({

                    producto_id: productoId,

                    restaurante_id: restauranteId,

                    restaurante_nombre:
                        restauranteNombre,

                    nombre: nombre,

                    descripcion:
                        producto.descripcion ?? "",

                    precio: precio,

                    imagen_url:
                        producto.imagen_url ??
                        producto.imagen ??
                        "",

                    cantidad: cantidad,

                    __clave: clave

                });

            }

        });

        carrito =
            productosConsolidados.map(producto => {

                delete producto.__clave;

                return producto;

            });

        guardarCarrito();

    }


    function guardarCarrito() {

        localStorage.setItem(
            "carrito",
            JSON.stringify(carrito)
        );

    }


    /* =========================================================
       CARGAR NOMBRES DE RESTAURANTES
    ========================================================= */

    async function cargarNombresRestaurantes() {

        const ids = [
            ...new Set(
                carrito
                    .map(producto =>
                        producto.restaurante_id
                    )
                    .filter(id =>
                        id !== null &&
                        id !== undefined &&
                        id !== ""
                    )
            )
        ];

        if (ids.length === 0) {
            return;
        }

        try {

            const {
                data,
                error
            } = await supabaseClient
                .from("restaurantes")
                .select("id,nombre")
                .in("id", ids);

            if (error) {

                console.error(
                    "Error cargando restaurantes:",
                    error
                );

                return;
            }

            (data || []).forEach(restaurante => {

                nombresRestaurantes[
                    restaurante.id
                ] = restaurante.nombre;

            });

            /*
             * Actualizamos nombres que no los tenían.
             */

            carrito.forEach(producto => {

                if (
                    producto.restaurante_id !== null &&
                    nombresRestaurantes[
                        producto.restaurante_id
                    ]
                ) {

                    producto.restaurante_nombre =
                        nombresRestaurantes[
                            producto.restaurante_id
                        ];

                }

            });

            guardarCarrito();

        } catch (error) {

            console.error(error);

        }

    }


    /* =========================================================
       AGRUPAR POR RESTAURANTE
    ========================================================= */

    function agruparPorRestaurante() {

        const grupos = {};

        carrito.forEach(producto => {

            const restauranteId =
                producto.restaurante_id ??
                "sin-restaurante";

            if (!grupos[restauranteId]) {

                grupos[restauranteId] = {

                    restaurante_id:
                        producto.restaurante_id,

                    nombre:
                        producto.restaurante_nombre ||
                        nombresRestaurantes[
                            producto.restaurante_id
                        ] ||
                        "Restaurante",

                    productos: []

                };

            }

            grupos[restauranteId]
                .productos
                .push(producto);

        });

        return Object.values(grupos);

    }


    /* =========================================================
       MOSTRAR CARRITO
    ========================================================= */

    function mostrarCarrito() {

        const contenedor =
            document.getElementById(
                "contenedorCarrito"
            );

        if (carrito.length === 0) {

            contenedor.innerHTML = `
                <div class="vacio">
                    <h2>🛒 Tu carrito está vacío</h2>

                    <p>
                        Agrega productos de nuestros
                        restaurantes para comenzar.
                    </p>

                    <a href="index.html">
                        Ver restaurantes
                    </a>
                </div>
            `;

            document.getElementById(
                "formularioPedido"
            ).style.display = "none";

            return;

        }

        const grupos =
            agruparPorRestaurante();

        let html = "";

        let totalProductosGeneral = 0;
        let totalDeliveryGeneral = 0;
        let totalGeneral = 0;


        grupos.forEach((grupo, indiceGrupo) => {

            let subtotal = 0;

            let productosHTML = "";


            grupo.productos.forEach(producto => {

                const indice =
                    carrito.indexOf(producto);

                const cantidad =
                    Number(producto.cantidad) || 1;

                const precio =
                    Number(producto.precio) || 0;

                const subtotalProducto =
                    precio * cantidad;

                subtotal += subtotalProducto;


                productosHTML += `

                    <div class="producto">

                        <div class="producto-info">

                            <div class="producto-nombre">
                                ${escaparHTML(
                                    producto.nombre
                                )}
                            </div>

                            <div class="producto-precio">
                                $${dinero(precio)}
                                c/u
                            </div>

                        </div>


                        <div class="controles">

                            <button
                                class="btn-cantidad"
                                onclick="cambiarCantidadPorIndice(
                                    ${indice},
                                    -1
                                )"
                            >
                                −
                            </button>


                            <span class="cantidad">
                                ${cantidad}
                            </span>


                            <button
                                class="btn-cantidad"
                                onclick="cambiarCantidadPorIndice(
                                    ${indice},
                                    1
                                )"
                            >
                                +
                            </button>


                            <button
                                class="btn-eliminar"
                                title="Eliminar producto"
                                onclick="eliminarProductoPorIndice(
                                    ${indice}
                                )"
                            >
                                🗑️
                            </button>

                        </div>

                    </div>

                `;

            });


            const delivery =
                tarifaDelivery;

            const totalCarrera =
                subtotal + delivery;


            totalProductosGeneral += subtotal;
            totalDeliveryGeneral += delivery;
            totalGeneral += totalCarrera;


            html += `

                <div class="carrera">

                    <div class="carrera-header">

                        <h3>
                            🏪 ${escaparHTML(
                                grupo.nombre
                            )}
                        </h3>

                        <span>
                            Carrera ${indiceGrupo + 1}
                        </span>

                    </div>


                    ${productosHTML}


                    <div class="resumen-carrera">

                        <div class="fila">

                            <span>
                                Subtotal
                            </span>

                            <strong>
                                $${dinero(subtotal)}
                            </strong>

                        </div>


                        <div class="fila">

                            <span>
                                Delivery
                            </span>

                            <strong>
                                $${dinero(delivery)}
                            </strong>

                        </div>


                        <div class="fila total">

                            <span>
                                Total carrera
                            </span>

                            <strong>
                                $${dinero(totalCarrera)}
                            </strong>

                        </div>

                    </div>

                </div>

            `;

        });


        contenedor.innerHTML = html;


        document.getElementById(
            "formularioPedido"
        ).style.display = "block";


        document.getElementById(
            "totalProductos"
        ).textContent =
            "$" + dinero(totalProductosGeneral);


        document.getElementById(
            "totalDelivery"
        ).textContent =
            "$" + dinero(totalDeliveryGeneral);


        document.getElementById(
            "totalGeneral"
        ).textContent =
            "$" + dinero(totalGeneral);

    }


    /* =========================================================
       CAMBIAR CANTIDAD
    ========================================================= */

    function cambiarCantidadPorIndice(
        indice,
        cambio
    ) {

        if (
            indice < 0 ||
            indice >= carrito.length
        ) {
            return;
        }

        carrito[indice].cantidad =
            Number(carrito[indice].cantidad) +
            cambio;


        if (
            carrito[indice].cantidad <= 0
        ) {

            carrito.splice(indice, 1);

        }


        guardarCarrito();

        mostrarCarrito();

    }


    /* =========================================================
       ELIMINAR PRODUCTO
    ========================================================= */

    function eliminarProductoPorIndice(
        indice
    ) {

        if (
            indice < 0 ||
            indice >= carrito.length
        ) {
            return;
        }

        carrito.splice(indice, 1);

        guardarCarrito();

        mostrarCarrito();

    }


    /* =========================================================
       GENERAR NÚMERO DE PEDIDO
    ========================================================= */

    function generarNumeroPedido() {

        const ahora =
            Date.now()
                .toString()
                .slice(-6);

        return "SR-" + ahora;

    }


    /* =========================================================
       MOSTRAR MENSAJE
    ========================================================= */

    function mostrarMensaje(
        texto,
        esError = false
    ) {

        const mensaje =
            document.getElementById("mensaje");

        mensaje.textContent = texto;

        mensaje.className =
            esError
                ? "mensaje error"
                : "mensaje";

        mensaje.style.display = "block";

    }


    /* =========================================================
       CONFIRMAR PEDIDO
    ========================================================= */

    function confirmarPedido() {

        if (carrito.length === 0) {

            mostrarMensaje(
                "Tu carrito está vacío.",
                true
            );

            return;

        }


        const nombre =
            document
                .getElementById(
                    "clienteNombre"
                )
                .value
                .trim();


        const telefono =
            document
                .getElementById(
                    "clienteTelefono"
                )
                .value
                .trim();


        const direccion =
            document
                .getElementById(
                    "clienteDireccion"
                )
                .value
                .trim();


        const referencia =
            document
                .getElementById(
                    "clienteReferencia"
                )
                .value
                .trim();


        if (!nombre) {

            mostrarMensaje(
                "Ingresa tu nombre.",
                true
            );

            return;

        }


        if (!telefono) {

            mostrarMensaje(
                "Ingresa tu número de teléfono.",
                true
            );

            return;

        }


        if (!direccion) {

            mostrarMensaje(
                "Ingresa la dirección de entrega.",
                true
            );

            return;

        }


        const grupos =
            agruparPorRestaurante();


        const numeroGeneral =
            generarNumeroPedido();


        let numeroCarrera = 1;

        let totalProductosGeneral = 0;
        let totalDeliveryGeneral = 0;
        let totalGeneral = 0;


        const carreras =
            grupos.map(grupo => {

                let subtotal = 0;


                const detalleProductos =
                    grupo.productos.map(
                        producto => {

                            const precio =
                                Number(
                                    producto.precio
                                ) || 0;

                            const cantidad =
                                Number(
                                    producto.cantidad
                                ) || 1;

                            const subtotalProducto =
                                precio *
                                cantidad;


                            subtotal +=
                                subtotalProducto;


                            return {

                                producto_id:
                                    producto.producto_id,

                                nombre:
                                    producto.nombre,

                                precio_unitario:
                                    precio,

                                cantidad:
                                    cantidad,

                                subtotal:
                                    subtotalProducto

                            };

                        }
                    );


                const delivery =
                    tarifaDelivery;


                const totalCarrera =
                    subtotal + delivery;


                totalProductosGeneral +=
                    subtotal;

                totalDeliveryGeneral +=
                    delivery;

                totalGeneral +=
                    totalCarrera;


                const carrera = {

                    id:
                        numeroGeneral +
                        "-C" +
                        numeroCarrera,

                    restaurante:
                        grupo.nombre,

                    restaurante_id:
                        grupo.restaurante_id,

                    productos:
                        detalleProductos,

                    subtotal:
                        subtotal,

                    delivery:
                        delivery,

                    total:
                        totalCarrera,

                    estado:
                        "Pendiente de asignación",

                    repartidor:
                        null,

                    moto:
                        null

                };


                numeroCarrera++;

                return carrera;

            });


        const pedido = {

            numero:
                numeroGeneral,

            cliente: {

                nombre:
                    nombre,

                telefono:
                    telefono,

                direccion:
                    direccion,

                referencia:
                    referencia

            },

            total_productos:
                totalProductosGeneral,

            total_delivery:
                totalDeliveryGeneral,

            total:
                totalGeneral,

            estado:
                "Pedido recibido",

            carreras:
                carreras,

            creado_en:
                new Date().toISOString()

        };


        /*
         * TEMPORAL
         *
         * Por ahora guardamos el pedido localmente.
         *
         * En el siguiente paso de backend,
         * este objeto será enviado a una
         * Supabase Edge Function.
         */

        localStorage.setItem(
            "ultimoPedido",
            JSON.stringify(pedido)
        );


        mostrarPedidoGenerado(
            pedido
        );


        carrito = [];

        guardarCarrito();


        document.getElementById(
            "formularioPedido"
        ).style.display = "none";


        document.getElementById(
            "contenedorCarrito"
        ).innerHTML = "";

    }


    /* =========================================================
       MOSTRAR PEDIDO GENERADO
    ========================================================= */

    function mostrarPedidoGenerado(
        pedido
    ) {

        const contenedor =
            document.getElementById(
                "pedidoGenerado"
            );


        let carrerasHTML = "";


        pedido.carreras.forEach(
            carrera => {

                carrerasHTML += `

                    <div class="carrera-confirmada">

                        <strong>
                            ${escaparHTML(
                                carrera.id
                            )}
                        </strong>

                        <br>

                        Restaurante:
                        ${escaparHTML(
                            carrera.restaurante
                        )}

                        <br>

                        Total:
                        <strong>
                            $${dinero(
                                carrera.total
                            )}
                        </strong>

                        <br>

                        Estado:
                        ${escaparHTML(
                            carrera.estado
                        )}

                    </div>

                `;

            }
        );


        contenedor.innerHTML = `

            <h2>
                ✅ Pedido recibido
            </h2>

            <p>
                Tu número de pedido es:
                <strong>
                    ${escaparHTML(
                        pedido.numero
                    )}
                </strong>
            </p>


            <p>
                Se generaron
                <strong>
                    ${pedido.carreras.length}
                </strong>
                carrera(s).
            </p>


            ${carrerasHTML}


            <div class="resumen-final">

                <div class="fila">

                    <span>
                        Total productos
                    </span>

                    <strong>
                        $${dinero(
                            pedido.total_productos
                        )}
                    </strong>

                </div>


                <div class="fila">

                    <span>
                        Delivery
                    </span>

                    <strong>
                        $${dinero(
                            pedido.total_delivery
                        )}
                    </strong>

                </div>


                <div class="fila total">

                    <span>
                        Total
                    </span>

                    <strong>
                        $${dinero(
                            pedido.total
                        )}
                    </strong>

                </div>

            </div>


            <p style="
                margin-top:20px;
                color:#66756e;
            ">
                El pedido quedó registrado
                temporalmente en este navegador.
                La conexión real con Supabase
                y WhatsApp la implementaremos
                en el siguiente paso.
            </p>

        `;


        contenedor.style.display = "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =========================================================
       INICIALIZAR
    ========================================================= */

    async function iniciar() {

        cargarCarrito();

        await cargarNombresRestaurantes();

        normalizarCarrito();

        mostrarCarrito();

    }


    iniciar();

</script>

</body>
</html>
