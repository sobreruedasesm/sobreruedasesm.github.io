<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi pedido | Sobre Ruedas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
:root{
 --rojo:#d62828;
 --rojo2:#b51f1f;
 --verde:#198754;
 --verde2:#146c43;
 --azul:#1261a0;
 --azul2:#0d4f82;
 --amarillo:#f4c542;
 --negro:#171717;
 --blanco:#fff;
 --gris:#f4f5f7;
 --gris2:#e5e7eb;
 --muted:#626a73;
 --danger:#b42318;
 --shadow:0 4px 15px rgba(0,0,0,.08);
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:var(--gris);
 color:var(--negro);
 font-family:Arial,Helvetica,sans-serif;
}

header{
 background:var(--negro);
 color:#fff;
 border-top:5px solid var(--rojo);
 position:sticky;
 top:0;
 z-index:50;
 box-shadow:0 2px 12px rgba(0,0,0,.18);
}

.header-inner{
 max-width:1100px;
 margin:auto;
 padding:13px 15px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
}

.logo{
 font-size:22px;
 font-weight:900;
}

.logo span{
 color:var(--rojo);
}

.sub{
 color:#ddd;
 font-size:11px;
 margin-top:2px;
}

.back{
 color:#fff;
 text-decoration:none;
 font-size:13px;
 font-weight:bold;
}

main{
 max-width:1100px;
 margin:auto;
 padding:15px 14px 35px;
}

h1{
 margin:0 0 15px;
 font-size:24px;
}

h2{
 margin:0 0 12px;
 font-size:19px;
}

section{
 background:#fff;
 border-radius:13px;
 padding:15px;
 margin-bottom:15px;
 box-shadow:var(--shadow);
}

.local-card{
 border:1px solid var(--gris2);
 border-radius:10px;
 padding:12px;
 margin-bottom:12px;
}

.local-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin-bottom:10px;
}

.local-name{
 font-size:18px;
 font-weight:900;
}

.delivery{
 color:var(--verde2);
 font-size:12px;
 font-weight:bold;
}

.item{
 display:grid;
 grid-template-columns:65px 1fr auto;
 gap:10px;
 align-items:center;
 padding:10px 0;
 border-top:1px solid var(--gris2);
}

.item:first-child{
 border-top:0;
}

.item-img{
 width:65px;
 height:65px;
 border-radius:8px;
 object-fit:cover;
 background:var(--gris);
}

.item-info{
 min-width:0;
}

.item-name{
 font-weight:bold;
 font-size:14px;
 margin-bottom:3px;
}

.item-price{
 color:var(--muted);
 font-size:12px;
}

.item-total{
 color:var(--rojo);
 font-size:14px;
 font-weight:bold;
 margin-top:4px;
}

.controls{
 display:flex;
 align-items:center;
 gap:5px;
}

.qty{
 min-width:28px;
 text-align:center;
 font-weight:bold;
}

.qty-btn{
 width:30px;
 height:30px;
 padding:0;
 border:0;
 border-radius:7px;
 background:var(--gris2);
 color:var(--negro);
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}

.qty-btn:hover{
 background:#d5d8dc;
}

.remove{
 display:block;
 border:0;
 background:none;
 color:var(--danger);
 font-size:11px;
 cursor:pointer;
 margin-top:4px;
 padding:0;
}

.local-total{
 display:flex;
 justify-content:space-between;
 border-top:1px solid var(--gris2);
 margin-top:8px;
 padding-top:10px;
 font-weight:bold;
}

.total-box{
 background:var(--negro);
 color:#fff;
 border-radius:12px;
 padding:15px;
}

.total-row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 margin:7px 0;
 font-size:14px;
}

.total-row.final{
 border-top:1px solid #444;
 margin-top:12px;
 padding-top:12px;
 font-size:21px;
 font-weight:900;
}

.form-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}

.field{
 margin-bottom:2px;
}

label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin-bottom:5px;
}

input,
textarea{
 width:100%;
 border:1px solid var(--gris2);
 border-radius:9px;
 padding:11px;
 font:inherit;
 outline:none;
}

textarea{
 resize:vertical;
 min-height:80px;
}

input:focus,
textarea:focus{
 border-color:var(--azul);
 box-shadow:0 0 0 3px rgba(18,97,160,.1);
}

.location-box{
 border:1px solid #cfe2f3;
 background:#f3f9fd;
 border-radius:10px;
 padding:13px;
 margin-top:12px;
}

.location-title{
 font-weight:900;
 color:var(--azul2);
 margin-bottom:5px;
}

.location-status{
 font-size:13px;
 color:var(--muted);
 margin:6px 0 10px;
}

.location-actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
}

button{
 border:0;
 border-radius:9px;
 padding:10px 13px;
 font-weight:bold;
 cursor:pointer;
}

.btn-red{
 background:var(--rojo);
 color:#fff;
}

.btn-red:hover{
 background:var(--rojo2);
}

.btn-green{
 background:var(--verde);
 color:#fff;
}

.btn-green:hover{
 background:var(--verde2);
}

.btn-blue{
 background:var(--azul);
 color:#fff;
}

.btn-blue:hover{
 background:var(--azul2);
}

.btn-yellow{
 background:var(--amarillo);
 color:var(--negro);
}

.btn-gray{
 background:var(--gris2);
 color:var(--negro);
}

.btn-danger{
 background:var(--danger);
 color:#fff;
}

.location-link{
 display:none;
 margin-top:10px;
 padding:8px;
 background:#fff;
 border-radius:8px;
 border:1px solid var(--gris2);
 font-size:12px;
 word-break:break-all;
}

.location-link a{
 color:var(--azul);
 font-weight:bold;
 text-decoration:none;
}

.empty{
 background:#fff;
 border-radius:13px;
 padding:35px 15px;
 text-align:center;
 box-shadow:var(--shadow);
 color:var(--muted);
}

.empty-icon{
 font-size:42px;
 margin-bottom:8px;
}

.clear{
 width:100%;
 margin-top:10px;
}

.send{
 width:100%;
 margin-top:12px;
 font-size:16px;
 padding:13px;
}

.notice{
 background:#fff8d9;
 border-left:4px solid var(--amarillo);
 padding:10px;
 border-radius:7px;
 font-size:12px;
 margin-bottom:12px;
}

.error{
 background:#fff0ef;
 color:var(--rojo2);
 border:1px solid #f2c5c1;
 padding:12px;
 border-radius:9px;
 margin-bottom:12px;
}

.hidden{
 display:none!important;
}

@media(max-width:650px){
 .form-grid{
  grid-template-columns:1fr;
 }

 .item{
  grid-template-columns:55px 1fr;
 }

 .item>div:last-child{
  grid-column:2;
 }

 .item-img{
  width:55px;
  height:55px;
 }
}
</style>
</head>

<body>

<header>
 <div class="header-inner">

  <div>
   <div class="logo">Sobre <span>Ruedas</span></div>
   <div class="sub">Delivery en Esmeraldas</div>
  </div>

  <a href="index.html" class="back">← Seguir comprando</a>

 </div>
</header>

<main>

 <h1>🛒 Mi pedido</h1>

 <div id="mensaje"></div>

 <div id="contenido"></div>

</main>

<script>

const CONFIG_DEFAULT={
 nombreNegocio:"Sobre Ruedas",
 ciudad:"Esmeraldas",
 tarifaDelivery:1.50,
 whatsappNegocio:"593985459479",
 moneda:"USD"
};

let carrito=[];
let configuracion={...CONFIG_DEFAULT};

let ubicacionActual=null;
let ubicacionMapsUrl="";

const $=id=>document.getElementById(id);

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#039;"
}[m]));

function mostrarError(mensaje){
 $("mensaje").innerHTML=`
  <div class="error">${esc(mensaje)}</div>
 `;
}

function limpiarMensaje(){
 $("mensaje").innerHTML="";
}

function cargarCarrito(){

 try{

  const data=JSON.parse(
   localStorage.getItem("carrito")||"[]"
  );

  carrito=Array.isArray(data)?data:[];

 }catch{

  carrito=[];

 }

}

async function cargarConfiguracion(){

 try{

  const {data,error}=await supabaseClient
   .from("configuracion_negocio")
   .select("*")
   .order("id",{ascending:true})
   .limit(1)
   .maybeSingle();

  if(error){
   console.warn(error);
   return;
  }

  if(data){

   configuracion={
    nombreNegocio:data.nombre_negocio||CONFIG_DEFAULT.nombreNegocio,
    ciudad:data.ciudad||CONFIG_DEFAULT.ciudad,
    tarifaDelivery:Number(data.tarifa_delivery)||
     CONFIG_DEFAULT.tarifaDelivery,
    whatsappNegocio:data.whatsapp_negocio||
     CONFIG_DEFAULT.whatsappNegocio,
    moneda:data.moneda||"USD"
   };

  }

 }catch(error){

  console.warn("Configuración:",error);

 }
}

function guardarCarrito(){

 if(carrito.length){
  localStorage.setItem(
   "carrito",
   JSON.stringify(carrito)
  );
 }else{
  localStorage.removeItem("carrito");
 }

}

function agruparCarrito(){

 const grupos={};

 carrito.forEach(item=>{

  const id=String(item.restaurante_id);

  if(!grupos[id]){
   grupos[id]={
    restaurante_id:item.restaurante_id,
    restaurante_nombre:
     item.restaurante_nombre||"Local",
    productos:[]
   };
  }

  grupos[id].productos.push(item);

 });

 return Object.values(grupos);
}

function subtotalGrupo(grupo){

 return grupo.productos.reduce(
  (total,item)=>
   total+
   (Number(item.precio)||0)*
   (Number(item.cantidad)||0),
  0
 );

}

function render(){

 const contenido=$("contenido");

 if(!carrito.length){

  contenido.innerHTML=`
   <div class="empty">
    <div class="empty-icon">🛒</div>
    <strong>Tu carrito está vacío</strong>
    <p>Agrega productos desde nuestros locales.</p>
    <button
     class="btn-red"
     onclick="location.href='index.html'">
     Ver locales
    </button>
   </div>
  `;

  return;
 }

 const grupos=agruparCarrito();

 let totalProductos=0;
 let totalDelivery=0;

 let html="";

 grupos.forEach(grupo=>{

  const subtotal=subtotalGrupo(grupo);
  const delivery=Number(configuracion.tarifaDelivery)||0;

  totalProductos+=subtotal;
  totalDelivery+=delivery;

  html+=`
   <section class="local-card">

    <div class="local-title">
     <div class="local-name">
      ${esc(grupo.restaurante_nombre)}
     </div>

     <div class="delivery">
      Delivery $${delivery.toFixed(2)}
     </div>
    </div>
  `;

  grupo.productos.forEach(item=>{

   const cantidad=Number(item.cantidad)||0;
   const precio=Number(item.precio)||0;
   const total=precio*cantidad;

   const imagen=item.imagen_url
    ?`
     <img
      class="item-img"
      src="${esc(item.imagen_url)}?v=${Date.now()}"
      alt=""
      onerror="this.style.visibility='hidden'">
    `
    :`
     <div class="item-img"
      style="display:flex;align-items:center;justify-content:center;font-size:25px">
      🍽️
     </div>
    `;

   html+=`
    <div class="item">

     ${imagen}

     <div class="item-info">

      <div class="item-name">
       ${esc(item.producto_nombre)}
      </div>

      <div class="item-price">
       $${precio.toFixed(2)} c/u
      </div>

      <div class="item-total">
       $${total.toFixed(2)}
      </div>

     </div>

     <div>

      <div class="controls">

       <button
        class="qty-btn"
        onclick="cambiarCantidad(${item.producto_id},${item.restaurante_id},-1)">
        −
       </button>

       <span class="qty">${cantidad}</span>

       <button
        class="qty-btn"
        onclick="cambiarCantidad(${item.producto_id},${item.restaurante_id},1)">
        +
       </button>

      </div>

      <button
       class="remove"
       onclick="eliminarProducto(${item.producto_id},${item.restaurante_id})">
       Eliminar
      </button>

     </div>

    </div>
   `;
  });

  html+=`
    <div class="local-total">
     <span>Subtotal</span>
     <span>$${subtotal.toFixed(2)}</span>
    </div>

   </section>
  `;

 });

 const total=totalProductos+totalDelivery;

 html+=`

  <section>

   <h2>Datos de entrega</h2>

   <div class="notice">
    Completa tus datos para registrar el pedido.
   </div>

   <div class="form-grid">

    <div class="field">
     <label for="clienteNombre">Nombre</label>
     <input
      id="clienteNombre"
      placeholder="Tu nombre"
      autocomplete="name">
    </div>

    <div class="field">
     <label for="clienteTelefono">Teléfono</label>
     <input
      id="clienteTelefono"
      type="tel"
      placeholder="0999999999"
      autocomplete="tel">
    </div>

   </div>

   <div class="field" style="margin-top:12px">
    <label for="direccion">
     Dirección de entrega
    </label>

    <textarea
     id="direccion"
     placeholder="Calle, número, barrio, sector..."></textarea>
   </div>

   <div class="field" style="margin-top:12px">
    <label for="referencia">
     Referencia adicional
    </label>

    <textarea
     id="referencia"
     placeholder="Ej. Casa de dos pisos, junto a..."></textarea>
   </div>

   <div class="location-box">

    <div class="location-title">
     📍 Ubicación
    </div>

    <div class="location-status" id="locationStatus">
     Puedes usar tu ubicación actual o elegir otra ubicación.
    </div>

    <div class="location-actions">

     <button
      type="button"
      class="btn-green"
      onclick="usarMiUbicacion()">
      📍 Usar mi ubicación
     </button>

     <button
      type="button"
      class="btn-blue"
      onclick="verMiUbicacion()"
      id="btnVerUbicacion"
      style="display:none">
      Ver mi ubicación
     </button>

     <button
      type="button"
      class="btn-yellow"
      onclick="elegirOtraUbicacion()">
      🗺️ Elegir otra ubicación
     </button>

    </div>

    <div
     id="locationLink"
     class="location-link">
    </div>

    <div style="margin-top:10px">

     <label for="enlaceUbicacion">
      Si elegiste otra ubicación
     </label>

     <input
      id="enlaceUbicacion"
      type="url"
      placeholder="Pega aquí el enlace de Google Maps">

    </div>

   </div>

  </section>

  <section>

   <div class="total-box">

    <div class="total-row">
     <span>Productos</span>
     <strong>$${totalProductos.toFixed(2)}</strong>
    </div>

    <div class="total-row">
     <span>Delivery</span>
     <strong>$${totalDelivery.toFixed(2)}</strong>
    </div>

    <div class="total-row final">
     <span>Total</span>
     <strong>$${total.toFixed(2)}</strong>
    </div>

   </div>

   <button
    class="btn-gray clear"
    onclick="vaciarCarrito()">
    Vaciar carrito
   </button>

   <button
    class="btn-green send"
    onclick="confirmarPedido()">
    🚴 Confirmar pedido
   </button>

  </section>
 `;

 contenido.innerHTML=html;

 $("enlaceUbicacion").addEventListener(
  "input",
  procesarEnlacePegado
 );

}

function cambiarCantidad(productoId,restauranteId,cambio){

 const item=carrito.find(
  x=>
   Number(x.producto_id)===Number(productoId)&&
   Number(x.restaurante_id)===Number(restauranteId)
 );

 if(!item)return;

 item.cantidad=
  (Number(item.cantidad)||0)+cambio;

 if(item.cantidad<=0){

  carrito=carrito.filter(
   x=>!(
    Number(x.producto_id)===Number(productoId)&&
    Number(x.restaurante_id)===Number(restauranteId)
   )
  );

 }

 guardarCarrito();
 render();
}

function eliminarProducto(productoId,restauranteId){

 carrito=carrito.filter(
  item=>!(
   Number(item.producto_id)===Number(productoId)&&
   Number(item.restaurante_id)===Number(restauranteId)
  )
 );

 guardarCarrito();
 render();
}

function vaciarCarrito(){

 if(!carrito.length)return;

 if(!confirm("¿Vaciar todo el carrito?"))
  return;

 carrito=[];
 guardarCarrito();
 render();
}

function generarNumeroPedido(){

 const ahora=new Date();

 const fecha=
  ahora.getFullYear()+
  String(ahora.getMonth()+1).padStart(2,"0")+
  String(ahora.getDate()).padStart(2,"0");

 const aleatorio=
  Math.floor(1000+Math.random()*9000);

 return`SR-${fecha}-${aleatorio}`;
}

function obtenerUrlUbicacion(){

 const pegado=$("enlaceUbicacion")?.value.trim();

 if(pegado){
  return pegado;
 }

 return ubicacionMapsUrl||"";
}

function procesarEnlacePegado(){

 const input=$("enlaceUbicacion");

 if(!input)return;

 const valor=input.value.trim();

 if(!valor){
  if(!ubicacionMapsUrl){
   ubicacionMapsUrl="";
  }
  return;
 }

 if(
  valor.startsWith("https://")||
  valor.startsWith("http://")
 ){

  ubicacionMapsUrl=valor;

  mostrarEstadoUbicacion(
   "📍 Ubicación alternativa agregada."
  );

 }
}

function mostrarEstadoUbicacion(texto){

 const el=$("locationStatus");

 if(el)
  el.textContent=texto;

}

function construirMapsUrl(lat,lng){

 return(
  "https://www.google.com/maps/search/?api=1&query="+
  encodeURIComponent(`${lat},${lng}`)
 );

}

function usarMiUbicacion(){

 if(!navigator.geolocation){

  mostrarEstadoUbicacion(
   "Tu navegador no permite obtener la ubicación."
  );

  return;
 }

 mostrarEstadoUbicacion(
  "📍 Obteniendo tu ubicación..."
 );

 navigator.geolocation.getCurrentPosition(

  posicion=>{

   const lat=posicion.coords.latitude;
   const lng=posicion.coords.longitude;

   ubicacionActual={
    lat,
    lng
   };

   ubicacionMapsUrl=
    construirMapsUrl(lat,lng);

   const input=$("enlaceUbicacion");

   if(input)
    input.value="";

   mostrarEstadoUbicacion(
    "📍 Ubicación actual detectada correctamente."
   );

   const btn=$("btnVerUbicacion");

   if(btn)
    btn.style.display="inline-block";

   mostrarLinkUbicacion();

  },

  error=>{

   console.error(error);

   let mensaje=
    "No se pudo obtener tu ubicación.";

   if(error.code===1){
    mensaje=
     "Permiso de ubicación denegado. Puedes elegir otra ubicación.";
   }else if(error.code===2){
    mensaje=
     "No se pudo determinar tu ubicación.";
   }else if(error.code===3){
    mensaje=
     "La ubicación tardó demasiado. Intenta nuevamente.";
   }

   mostrarEstadoUbicacion(mensaje);

  },

  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:60000
  }

 );

}

function mostrarLinkUbicacion(){

 const box=$("locationLink");

 if(!box||!ubicacionMapsUrl)return;

 box.style.display="block";

 box.innerHTML=`
  📍 Ubicación lista:
  <a
   href="${esc(ubicacionMapsUrl)}"
   target="_blank"
   rel="noopener noreferrer">
   Ver en Google Maps
  </a>
 `;
}

function verMiUbicacion(){

 const url=obtenerUrlUbicacion();

 if(!url){

  mostrarEstadoUbicacion(
   "Primero debes obtener o ingresar una ubicación."
  );

  return;
 }

 window.open(
  url,
  "_blank",
  "noopener,noreferrer"
 );

}

function elegirOtraUbicacion(){

 const url=
  "https://www.google.com/maps/@?api=1&map_action=map";

 window.open(
  url,
  "_blank",
  "noopener,noreferrer"
 );

 mostrarEstadoUbicacion(
  "Google Maps se abrió. Cuando tengas el enlace de la ubicación elegida, pégalo aquí."
 );

 const input=$("enlaceUbicacion");

 if(input)
  input.focus();

}

function validarUrlUbicacion(url){

 if(!url)return false;

 try{

  const parsed=new URL(url);

  return(
   parsed.protocol==="https:"||
   parsed.protocol==="http:"
  );

 }catch{

  return false;

 }

}

function validarDatos(){

 const nombre=
  $("clienteNombre").value.trim();

 const telefono=
  $("clienteTelefono").value.trim();

 const direccion=
  $("direccion").value.trim();

 const referencia=
  $("referencia").value.trim();

 const ubicacion=
  obtenerUrlUbicacion();

 if(!nombre)
  return"Ingresa tu nombre.";

 if(!telefono)
  return"Ingresa tu número de teléfono.";

 if(!direccion&&!ubicacion)
  return"Ingresa una dirección o indica una ubicación en el mapa.";

 if(ubicacion&&!validarUrlUbicacion(ubicacion))
  return"El enlace de ubicación no es válido.";

 return null;
}

function construirReferencia(referencia,url){

 let texto=referencia.trim();

 if(url){

  if(texto)
   texto+="\n";

  texto+="Ubicación GPS/Mapa: "+url;

 }

 return texto||null;
}

function construirCarreras(){

 const grupos=agruparCarrito();

 return grupos.map(grupo=>{

  const subtotal=subtotalGrupo(grupo);

  const delivery=
   Number(configuracion.tarifaDelivery)||0;

  return{

   restaurante_id:Number(grupo.restaurante_id),

   subtotal,

   delivery,

   total:subtotal+delivery,

   productos:grupo.productos.map(item=>({

    producto_id:item.producto_id,

    producto_nombre:item.producto_nombre,

    precio_unitario:Number(item.precio)||0,

    cantidad:Number(item.cantidad)||1,

    subtotal:
     (Number(item.precio)||0)*
     (Number(item.cantidad)||0)

   }))

  };

 });

}

async function registrarPedido(){

 const nombre=
  $("clienteNombre").value.trim();

 const telefono=
  $("clienteTelefono").value.trim();

 const direccionOriginal=
  $("direccion").value.trim();

 const referenciaOriginal=
  $("referencia").value.trim();

 const ubicacion=
  obtenerUrlUbicacion();

 const carreras=
  construirCarreras();

 const totalProductos=
  carreras.reduce(
   (sum,c)=>sum+c.subtotal,
   0
  );

 const totalDelivery=
  carreras.reduce(
   (sum,c)=>sum+c.delivery,
   0
  );

 const total=
  totalProductos+totalDelivery;

 const numero=
  generarNumeroPedido();

 let direccion=direccionOriginal;

 if(!direccion&&ubicacion)
  direccion="Ubicación indicada en el mapa";

 const referencia=
  construirReferencia(
   referenciaOriginal,
   ubicacion
  );

 const {data,error}=await supabaseClient
  .rpc(
   "registrar_pedido_completo",
   {
    p_numero:numero,
    p_cliente_nombre:nombre,
    p_cliente_telefono:telefono,
    p_direccion:direccion,
    p_referencia:referencia,
    p_total_productos:totalProductos,
    p_total_delivery:totalDelivery,
    p_total:total,
    p_carreras:carreras
   }
  );

 if(error)
  throw error;

 return{
  id:data,
  numero,
  nombre,
  telefono,
  direccion,
  referencia,
  ubicacion,
  carreras,
  totalProductos,
  totalDelivery,
  total
 };

}

function construirMensajeWhatsApp(pedido){

 let texto=
  `*${configuracion.nombreNegocio} - NUEVO PEDIDO*%0A%0A`;

 texto+=
  `*Pedido:* ${encodeURIComponent(pedido.numero)}%0A`;

 texto+=
  `*Cliente:* ${encodeURIComponent(pedido.nombre)}%0A`;

 texto+=
  `*Teléfono:* ${encodeURIComponent(pedido.telefono)}%0A`;

 texto+=
  `*Dirección:* ${encodeURIComponent(pedido.direccion)}%0A`;

 if(pedido.referencia){

  texto+=
   `*Referencia:* ${encodeURIComponent(pedido.referencia)}%0A`;

 }

 if(pedido.ubicacion){

  texto+=
   `*📍 Ubicación:* ${encodeURIComponent(pedido.ubicacion)}%0A`;

 }

 texto+="%0A";

 pedido.carreras.forEach(carrera=>{

  texto+=
   `*${encodeURIComponent(
    buscarNombreLocal(carrera.restaurante_id)
   )}*%0A`;

  carrera.productos.forEach(item=>{

   texto+=
    `${item.cantidad} x `+
    `${encodeURIComponent(item.producto_nombre)} `+
    `= $${item.subtotal.toFixed(2)}%0A`;

  });

  texto+=
   `Subtotal: $${carrera.subtotal.toFixed(2)}%0A`;

  texto+=
   `Delivery: $${carrera.delivery.toFixed(2)}%0A%0A`;

 });

 texto+=
  `*TOTAL: $${pedido.total.toFixed(2)}*`;

 return texto;
}

function buscarNombreLocal(id){

 const grupo=
  carrito.find(
   item=>Number(item.restaurante_id)===Number(id)
  );

 return grupo?.restaurante_nombre||"Local";

}

async function confirmarPedido(){

 limpiarMensaje();

 const error=validarDatos();

 if(error){

  mostrarError(error);

  window.scrollTo({
   top:0,
   behavior:"smooth"
  });

  return;
 }

 if(!carrito.length){

  mostrarError(
   "El carrito está vacío."
  );

  return;
 }

 const boton=document.querySelector(".send");

 if(boton){

  boton.disabled=true;
  boton.textContent="Registrando pedido...";
 }

 try{

  const pedido=
   await registrarPedido();

  /*
   IMPORTANTE:
   El carrito se elimina solamente después
   de registrar correctamente el pedido.
  */

  carrito=[];
  localStorage.removeItem("carrito");

  const mensaje=
   construirMensajeWhatsApp(pedido);

  const numero=
   String(configuracion.whatsappNegocio||"")
    .replace(/\D/g,"");

  const whatsappUrl=
   `https://wa.me/${numero}?text=${mensaje}`;

  $("contenido").innerHTML=`
   <section class="empty">

    <div class="empty-icon">✅</div>

    <h2>¡Pedido registrado!</h2>

    <p>
     Tu pedido
     <strong>${esc(pedido.numero)}</strong>
     fue registrado correctamente.
    </p>

    <p>
     Total:
     <strong>$${pedido.total.toFixed(2)}</strong>
    </p>

    ${
     pedido.ubicacion
      ?`
       <p>
        📍 La ubicación fue incluida en tu pedido.
       </p>
      `
      :""
    }

    <button
     class="btn-green"
     style="width:100%;margin-top:10px"
     onclick="window.location.href='${esc(whatsappUrl)}'">
     📲 Enviar pedido por WhatsApp
    </button>

    <button
     class="btn-blue"
     style="width:100%;margin-top:10px"
     onclick="window.location.href='index.html'">
     Seguir comprando
    </button>

   </section>
  `;

  window.scrollTo({
   top:0,
   behavior:"smooth"
  });

 }catch(error){

  console.error("REGISTRO PEDIDO:",error);

  mostrarError(
   error?.message||
   "No se pudo registrar el pedido. El carrito se mantiene para que puedas intentarlo nuevamente."
  );

  if(boton){

   boton.disabled=false;
   boton.textContent="🚴 Confirmar pedido";

  }

 }

}

async function iniciar(){

 cargarCarrito();

 await cargarConfiguracion();

 render();

}

iniciar();

</script>
