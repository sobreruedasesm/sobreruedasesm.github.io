<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi pedido | Sobre Ruedas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:18px;text-align:center;font-size:24px;font-weight:bold}
.container{max-width:800px;margin:auto;padding:15px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
h2{font-size:19px;margin:0 0 14px}
.producto{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;padding:10px 0;gap:10px}
.producto:last-child{border-bottom:0}
.producto-info{flex:1}
.producto-nombre{font-weight:bold}
.producto-precio{color:#555;margin-top:3px}
.controls{display:flex;align-items:center;gap:7px}
.controls button{width:32px;height:32px;border:0;border-radius:7px;font-size:18px;cursor:pointer}
.btnMenos{background:#eee}
.btnMas{background:#111;color:#fff}
.btnEliminar{background:#e53935;color:#fff}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin-top:6px}
textarea{resize:vertical}
label{display:block;font-weight:bold;margin-top:12px}
input:disabled,textarea:disabled,select:disabled{background:#f3f3f3;color:#888;cursor:not-allowed}
.controls button:disabled{opacity:.45;cursor:not-allowed}
.btn{border:0;border-radius:8px;padding:12px 15px;cursor:pointer;font-weight:bold;font-size:15px;margin:3px 0}
.btnRed{background:#e53935;color:#fff}
.btnDark{background:#111;color:#fff}
.btnGray{background:#ddd;color:#222}
.btn:disabled{opacity:.45;cursor:not-allowed}
.whatsapp{width:100%;margin-top:10px;background:#25d366}
.total{font-size:20px;font-weight:bold;text-align:right;margin-top:15px}
.clienteEstado{font-size:13px;margin-top:6px;min-height:18px}
.clienteEstado.ok{color:#16843a}
.clienteEstado.error{color:#d32f2f}
.clienteEstado.loading{color:#777}
.referido{display:none;margin-top:12px;padding:12px;background:#fff8e1;border-radius:8px;border:1px solid #ffe082}
.referido.show{display:block}
.referido small{display:block;margin-top:8px;color:#666;line-height:1.4}
#mapWrap{display:none;margin-top:12px}
#map{height:350px;border-radius:10px}
.ubicacion{margin-top:10px;padding:10px;background:#f7f7f7;border-radius:8px}
.error{color:#d32f2f;font-weight:bold;margin-top:10px}
.success{color:#16843a;font-weight:bold;margin-top:10px}
.factura{margin-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){
 .row{grid-template-columns:1fr}
 .producto{gap:8px}
}
</style>
</head>

<body>

<header>🛵 Sobre Ruedas</header>

<div class="container">

<div class="card">
<h2>🛒 Mi carrito</h2>
<div id="carrito"></div>
</div>

<div class="card">
<h2>👤 Datos del cliente</h2>

<label for="clienteNombre">Nombre</label>
<input id="clienteNombre" type="text" placeholder="Tu nombre">

<label for="clienteTelefono">Teléfono</label>
<input id="clienteTelefono" type="tel" placeholder="Tu número de teléfono">

<div id="clienteEstado" class="clienteEstado"></div>

<div id="campoReferido" class="referido">

<label for="telefonoReferente">Teléfono de quien te refirió</label>
<input id="telefonoReferente" type="tel" placeholder="Teléfono de tu referente">

<div id="referenteEstado" class="clienteEstado"></div>

<small>
Por temas de seguridad, para realizar tu primer pedido debes haber sido referido por un cliente registrado.
</small>

</div>

<div class="factura">

<label>
<input type="checkbox" id="requiereFactura" data-requiere-cliente>
 ¿Necesitas factura?
</label>

<div id="datosFactura">

<div class="row">

<div>
<label for="tipoDocumento">Tipo de documento</label>
<select id="tipoDocumento" data-requiere-cliente>
<option value="CEDULA">Cédula</option>
<option value="RUC">RUC</option>
</select>
</div>

<div>
<label for="numeroDocumento">Número de documento</label>
<input id="numeroDocumento" type="text" placeholder="Cédula o RUC" data-requiere-cliente>
</div>

</div>

<label for="correoFactura">Correo para factura</label>
<input id="correoFactura" type="email" placeholder="correo@ejemplo.com" data-requiere-cliente>

</div>
</div>
</div>

<div class="card">
<h2>📍 Dirección de entrega</h2>

<button class="btn btnRed requiere-cliente" onclick="usarMiUbicacion(this)">
📍 Usar mi ubicación
</button>

<button class="btn btnDark requiere-cliente" onclick="abrirMapa()">
🗺️ Otra dirección
</button>

<div id="direccionGuardada" class="ubicacion">
No has seleccionado una dirección.
</div>

<div id="mapWrap">

<div id="map"></div>

<div style="margin-top:10px">
<button class="btn btnRed requiere-cliente" onclick="aceptarMapa()">
Aceptar y guardar
</button>

<button class="btn btnGray requiere-cliente" onclick="cerrarMapa()">
Cancelar
</button>
</div>

</div>

<label for="referencia">Referencia</label>
<textarea id="referencia" rows="2"
placeholder="Ej.: casa de dos pisos, junto a..."
data-requiere-cliente></textarea>

</div>

<div class="card">

<h2>💰 Resumen</h2>

<div id="resumen"></div>

<button class="btn btnGray requiere-cliente" onclick="vaciarCarrito()">
🗑️ Vaciar carrito
</button>

<button class="btn whatsapp requiere-cliente" onclick="realizarPedido()">
📲 Realizar pedido por WhatsApp
</button>

<div id="mensaje"></div>

</div>

</div>

<script>

/* =========================================================
   CONFIGURACIÓN
========================================================= */

const CONFIG_DEFAULT={
 nombreNegocio:"Sobre Ruedas",
 ciudad:"Esmeraldas",
 tarifaDelivery:1.50,
 whatsappNegocio:"593985459479",

 /*
  IMPORTANTE:
  Si ADM no proporciona este valor todavía,
  la validación queda ACTIVADA por seguridad.
 */
 validacion_clientes:true,

 moneda:"USD"
};


/* =========================================================
   ESTADO
========================================================= */

let carrito=[];

let configuracion={...CONFIG_DEFAULT};

let validacionClientes=true;

let map=null;
let marker=null;

let ubicacion={
 lat:null,
 lng:null,
 direccion:""
};

let ubicacionTemporal={
 lat:null,
 lng:null,
 direccion:""
};

let clienteActual=null;

let timerCliente=null;
let timerReferente=null;

let validacionClienteId=0;
let validacionReferenteId=0;

let ubicacionCargando=false;

let accesoPedido=false;

let referenteValido=false;


/* =========================================================
   UTILIDADES
========================================================= */

const $=id=>document.getElementById(id);

function normalizarTelefono(v){
 return String(v||"").replace(/\D/g,"");
}

function guardarFormulario(){

 localStorage.setItem(
  "sr_nombre",
  $("clienteNombre").value
 );

 localStorage.setItem(
  "sr_telefono",
  $("clienteTelefono").value
 );

 localStorage.setItem(
  "sr_referente",
  $("telefonoReferente").value
 );

 localStorage.setItem(
  "sr_referencia",
  $("referencia").value
 );

}

function cargarFormulario(){

 $("clienteNombre").value=
  localStorage.getItem("sr_nombre")||"";

 $("clienteTelefono").value=
  localStorage.getItem("sr_telefono")||"";

 $("telefonoReferente").value=
  localStorage.getItem("sr_referente")||"";

 $("referencia").value=
  localStorage.getItem("sr_referencia")||"";

}

function mostrarEstadoCliente(texto,tipo=""){

 const e=$("clienteEstado");

 e.textContent=texto;
 e.className="clienteEstado "+tipo;

}

function mostrarEstadoReferente(texto,tipo=""){

 const e=$("referenteEstado");

 e.textContent=texto;
 e.className="clienteEstado "+tipo;

}

function mostrarError(texto){

 $("mensaje").innerHTML=
  `<div class="error">${texto}</div>`;

}

function mostrarExito(texto){

 $("mensaje").innerHTML=
  `<div class="success">${texto}</div>`;

}


/* =========================================================
   CONFIGURACIÓN DE VALIDACIÓN
========================================================= */

function aplicarConfiguracion(){

 /*
  Cualquier valor explícitamente false
  desactiva la validación.

  Si no existe el parámetro, se mantiene true.
 */

 validacionClientes=
  configuracion.validacion_clientes!==false;

 if(!validacionClientes){

  /*
   Si ADM desactiva la validación,
   el pedido queda inmediatamente habilitado.
  */

  accesoPedido=true;

  clienteActual=null;
  referenteValido=false;

  $("campoReferido").classList.remove("show");

  mostrarEstadoCliente(
   "ℹ️ La validación de clientes está desactivada.",
   "ok"
  );

 }else{

  /*
   Si está activada, todavía no damos acceso.
   Se habilita solamente después de validar
   cliente o referente.
  */

  accesoPedido=false;

 }

 actualizarAcceso();

}


/*
 Esta función permite que posteriormente
 admin.html pueda cargar la configuración
 desde Supabase y simplemente hacer:

 configuracion = datos;
 aplicarConfiguracion();
*/

function establecerConfiguracion(datos){

 if(datos && typeof datos==="object"){

  configuracion={
   ...CONFIG_DEFAULT,
   ...datos
  };

 }

 aplicarConfiguracion();

}


/* =========================================================
   CONTROL DE ACCESO
========================================================= */

function actualizarAcceso(){

 /*
  Cuando la validación está desactivada,
  todo lo relacionado al pedido está habilitado.
 */

 const habilitado=
  !validacionClientes||
  accesoPedido===true;

 document
  .querySelectorAll(
   "[data-requiere-cliente],.requiere-cliente"
  )
  .forEach(e=>{
   e.disabled=!habilitado;
  });


 /*
  Nombre y teléfono siempre editables.
 */

 $("clienteTelefono").disabled=false;
 $("clienteNombre").disabled=false;


 /*
  El referente solamente se bloquea cuando
  ya existe un cliente registrado.
 */

 $("telefonoReferente").disabled=!!clienteActual;


 /*
  Si la validación está desactivada,
  el referente no es necesario.
 */

 if(!validacionClientes){

  $("telefonoReferente").disabled=true;

 }


 /*
  Nunca escondemos campoReferido aquí.
  Esto evita el parpadeo/desaparición
  cuando el usuario hace clic.
 */

 if(!habilitado){

  $("mapWrap").style.display="none";

 }

}

function bloquearPedido(){

 if(!validacionClientes){

  accesoPedido=true;
  actualizarAcceso();

  return;
 }

 accesoPedido=false;

 actualizarAcceso();

}

function habilitarPedido(){

 accesoPedido=true;

 actualizarAcceso();

}


/* =========================================================
   CARRITO
========================================================= */

function guardarCarrito(){

 localStorage.setItem(
  "sr_carrito",
  JSON.stringify(carrito)
 );

}

function cargarCarrito(){

 try{

  carrito=
   JSON.parse(
    localStorage.getItem("sr_carrito")||"[]"
   );

  if(!Array.isArray(carrito))
   carrito=[];

 }catch{

  carrito=[];

 }

}

function render(){

 const c=$("carrito");

 if(!carrito.length){

  c.innerHTML="<p>Tu carrito está vacío.</p>";

  $("resumen").innerHTML="";

  actualizarAcceso();

  return;
 }

 let subtotal=0;

 c.innerHTML=
  carrito.map((p,i)=>{

   const total=
    Number(p.precio)*
    Number(p.cantidad);

   subtotal+=total;

   return `
   <div class="producto">

    <div class="producto-info">

     <div class="producto-nombre">
      ${p.nombre}
     </div>

     <div class="producto-precio">
      $${Number(p.precio).toFixed(2)}
      × ${p.cantidad}
     </div>

    </div>

    <div class="controls">

     <button
      class="btnMenos"
      onclick="cambiarCantidad(${i},-1)">
      −
     </button>

     <strong>${p.cantidad}</strong>

     <button
      class="btnMas"
      onclick="cambiarCantidad(${i},1)">
      +
     </button>

     <button
      class="btnEliminar"
      onclick="eliminarProducto(${i})">
      ×
     </button>

    </div>

   </div>
   `;

  }).join("");


 const delivery=
  Number(configuracion.tarifaDelivery||0);

 const total=
  subtotal+delivery;


 $("resumen").innerHTML=`

  <div>
   Subtotal:
   <strong>$${subtotal.toFixed(2)}</strong>
  </div>

  <div>
   Delivery:
   <strong>$${delivery.toFixed(2)}</strong>
  </div>

  <div class="total">
   Total: $${total.toFixed(2)}
  </div>

 `;

 actualizarAcceso();

}

function cambiarCantidad(i,cambio){

 if(!carrito[i])return;

 carrito[i].cantidad+=cambio;

 if(carrito[i].cantidad<=0)
  carrito.splice(i,1);

 guardarCarrito();

 render();

}

function eliminarProducto(i){

 carrito.splice(i,1);

 guardarCarrito();

 render();

}

function vaciarCarrito(){

 if(validacionClientes&&!accesoPedido){

  mostrarError(
   "Primero debes ingresar un teléfono registrado o un referente válido."
  );

  return;
 }

 carrito=[];

 guardarCarrito();

 render();

}


/* =========================================================
   CLIENTES
========================================================= */

async function consultarCliente(telefono){

 const telefonoNormalizado=
  normalizarTelefono(telefono);

 if(!telefonoNormalizado)
  return null;

 const r=
  await supabaseClient.rpc(
   "buscar_cliente_por_telefono",
   {
    p_telefono:telefonoNormalizado
   }
  );

 if(r.error)
  throw r.error;

 if(Array.isArray(r.data))
  return r.data[0]||null;

 return r.data||null;

}


/* =========================================================
   VALIDACIÓN DEL CLIENTE PRINCIPAL
========================================================= */

function programarValidacionCliente(){

 clearTimeout(timerCliente);

 /*
  Si ADM desactivó la validación,
  no hacemos ninguna consulta.
 */

 if(!validacionClientes){

  accesoPedido=true;

  $("campoReferido")
   .classList.remove("show");

  mostrarEstadoCliente(
   "ℹ️ Validación de clientes desactivada.",
   "ok"
  );

  actualizarAcceso();

  return;
 }


 const telefono=
  normalizarTelefono(
   $("clienteTelefono").value
  );


 clienteActual=null;
 referenteValido=false;

 bloquearPedido();


 /*
  Solamente el teléfono principal
  puede ocultar el campo referente.
 */

 $("campoReferido")
  .classList.remove("show");

 mostrarEstadoReferente("");


 if(!telefono){

  mostrarEstadoCliente("");

  return;
 }


 if(telefono.length<7){

  mostrarEstadoCliente(
   "Ingresa un número de teléfono válido.",
   "error"
  );

  return;
 }


 mostrarEstadoCliente(
  "🔄 Verificando cliente...",
  "loading"
 );


 const id=++validacionClienteId;

 timerCliente=
  setTimeout(
   ()=>validarClienteEnTiempoReal(id),
   500
  );

}


async function validarClienteEnTiempoReal(id){

 if(!validacionClientes)
  return;


 const telefono=
  normalizarTelefono(
   $("clienteTelefono").value
  );


 if(
  telefono.length<7||
  id!==validacionClienteId
 )
  return;


 try{

  const cliente=
   await consultarCliente(telefono);


  if(id!==validacionClienteId)
   return;


  const telefonoActual=
   normalizarTelefono(
    $("clienteTelefono").value
   );


  if(telefono!==telefonoActual)
   return;


  if(cliente){

   if(cliente.activo===false){

    clienteActual=null;
    referenteValido=false;

    bloquearPedido();

    mostrarEstadoCliente(
     "❌ Este cliente está inactivo.",
     "error"
    );

    $("campoReferido")
     .classList.remove("show");

    return;
   }


   clienteActual=cliente;

   referenteValido=false;


   $("campoReferido")
    .classList.remove("show");


   mostrarEstadoCliente(
    "✅ Cliente registrado. Puedes continuar.",
    "ok"
   );


   habilitarPedido();

   return;

  }


  /*
   No está registrado:
   mostramos referente.
  */

  clienteActual=null;
  referenteValido=false;

  bloquearPedido();


  $("campoReferido")
   .classList.add("show");


  mostrarEstadoCliente(
   "⚠️ Este número no está registrado. Necesitas un referente.",
   "error"
  );


 }catch(e){

  console.error(
   "Error verificando cliente:",
   e
  );


  clienteActual=null;
  referenteValido=false;

  bloquearPedido();


  if(id===validacionClienteId){

   $("campoReferido")
    .classList.add("show");

   mostrarEstadoCliente(
    "No se pudo verificar el cliente.",
    "error"
   );

  }

 }

}


/* =========================================================
   VALIDACIÓN DEL REFERENTE
========================================================= */

function programarValidacionReferente(){

 clearTimeout(timerReferente);

 if(!validacionClientes)
  return;


 referenteValido=false;


 const telefono=
  normalizarTelefono(
   $("telefonoReferente").value
  );


 /*
  MUY IMPORTANTE:
  aquí jamás ocultamos campoReferido.
 */

 if(!telefono){

  mostrarEstadoReferente("");

  accesoPedido=false;

  actualizarAcceso();

  return;
 }


 if(telefono.length<7){

  mostrarEstadoReferente(
   "Ingresa un número válido.",
   "error"
  );

  accesoPedido=false;

  actualizarAcceso();

  return;
 }


 accesoPedido=false;

 actualizarAcceso();


 mostrarEstadoReferente(
  "🔄 Verificando referente...",
  "loading"
 );


 const id=++validacionReferenteId;


 timerReferente=
  setTimeout(
   ()=>validarReferenteEnTiempoReal(id),
   600
  );

}


async function validarReferenteEnTiempoReal(id){

 if(!validacionClientes)
  return;


 const telefono=
  normalizarTelefono(
   $("telefonoReferente").value
  );


 const telefonoCliente=
  normalizarTelefono(
   $("clienteTelefono").value
  );


 if(
  telefono.length<7||
  id!==validacionReferenteId
 )
  return;


 if(telefono===telefonoCliente){

  referenteValido=false;

  bloquearPedido();

  mostrarEstadoReferente(
   "❌ No puedes referirte a ti mismo.",
   "error"
  );

  return;

 }


 try{

  const referente=
   await consultarCliente(telefono);


  if(id!==validacionReferenteId)
   return;


  const telefonoActual=
   normalizarTelefono(
    $("telefonoReferente").value
   );


  if(telefono!==telefonoActual)
   return;


  if(!referente){

   referenteValido=false;

   bloquearPedido();

   mostrarEstadoReferente(
    "❌ Este teléfono no corresponde a un cliente registrado.",
    "error"
   );

   return;

  }


  if(referente.activo===false){

   referenteValido=false;

   bloquearPedido();

   mostrarEstadoReferente(
    "❌ Este cliente está inactivo.",
    "error"
   );

   return;

  }


  if(!referente.codigo_referido){

   referenteValido=false;

   bloquearPedido();

   mostrarEstadoReferente(
    "❌ Este cliente no tiene un código de referido válido.",
    "error"
   );

   return;

  }


  referenteValido=true;


  mostrarEstadoReferente(
   "✅ Referente encontrado. Puedes continuar.",
   "ok"
  );


  habilitarPedido();


 }catch(e){

  console.error(
   "Error verificando referente:",
   e
  );


  referenteValido=false;

  bloquearPedido();


  if(id===validacionReferenteId){

   mostrarEstadoReferente(
    "No se pudo verificar el referente.",
    "error"
   );

  }

 }

}


/* =========================================================
   UBICACIÓN
========================================================= */

async function usarMiUbicacion(btn){

 if(
  validacionClientes&&
  !accesoPedido
 ){

  mostrarError(
   "Primero debes ingresar un teléfono registrado o un referente válido."
  );

  return;
 }


 ubicacionCargando=true;


 if(btn)
  btn.disabled=true;


 $("direccionGuardada").textContent=
  "📍 Obteniendo ubicación...";


 navigator.geolocation.getCurrentPosition(

  async pos=>{

   const lat=
    pos.coords.latitude;

   const lng=
    pos.coords.longitude;


   try{

    const r=
     await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`,
      {
       headers:{
        "Accept-Language":"es"
       }
      }
     );


    const data=
     await r.json();


    ubicacion={
     lat,
     lng,
     direccion:
      data.display_name||
      `${lat}, ${lng}`
    };


    $("direccionGuardada").textContent=
     "📍 "+ubicacion.direccion;


   }catch(e){

    ubicacion={
     lat,
     lng,
     direccion:`${lat}, ${lng}`
    };


    $("direccionGuardada").textContent=
     "📍 Ubicación obtenida.";

   }


   ubicacionCargando=false;


   if(btn)
    btn.disabled=false;


  },


  err=>{

   console.error(err);


   ubicacionCargando=false;


   if(btn)
    btn.disabled=false;


   $("direccionGuardada").textContent=
    "No se pudo obtener tu ubicación.";

  },


  {
   enableHighAccuracy:true,
   timeout:15000,
   maximumAge:0
  }

 );

}


function abrirMapa(){

 if(
  validacionClientes&&
  !accesoPedido
 ){

  mostrarError(
   "Primero debes ingresar un teléfono registrado o un referente válido."
  );

  return;
 }


 $("mapWrap").style.display="block";


 setTimeout(()=>{

  if(!map){

   map=
    L.map("map")
     .setView(
      [0.9682,-79.6517],
      13
     );


   L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
     attribution:"© OpenStreetMap"
    }
   ).addTo(map);


   map.on(
    "click",
    async e=>{

     const lat=
      e.latlng.lat;

     const lng=
      e.latlng.lng;


     if(marker)
      marker.setLatLng([lat,lng]);
     else
      marker=
       L.marker([lat,lng])
        .addTo(map);


     ubicacionTemporal={
      lat,
      lng,
      direccion:`${lat}, ${lng}`
     };


     try{

      const r=
       await fetch(
        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`,
        {
         headers:{
          "Accept-Language":"es"
         }
        }
       );


      const data=
       await r.json();


      ubicacionTemporal.direccion=
       data.display_name||
       ubicacionTemporal.direccion;


     }catch(e){}

    }
   );

  }


  map.invalidateSize();


 },100);

}


function aceptarMapa(){

 if(
  validacionClientes&&
  !accesoPedido
 )
  return;


 if(
  ubicacionTemporal.lat===null||
  ubicacionTemporal.lng===null
 ){

  mostrarError(
   "Selecciona una ubicación en el mapa."
  );

  return;
 }


 ubicacion={
  ...ubicacionTemporal
 };


 $("direccionGuardada").textContent=
  "📍 "+ubicacion.direccion;


 cerrarMapa();

}


function cerrarMapa(){

 $("mapWrap").style.display="none";

}


/* =========================================================
   VALIDACIÓN FINAL
========================================================= */

function validar(){

 if(!carrito.length){

  mostrarError(
   "El carrito está vacío."
  );

  return false;
 }


 if(!$("clienteNombre").value.trim()){

  mostrarError(
   "Ingresa tu nombre."
  );

  $("clienteNombre").focus();

  return false;
 }


 if(!$("clienteTelefono").value.trim()){

  mostrarError(
   "Ingresa tu teléfono."
  );

  $("clienteTelefono").focus();

  return false;
 }


 /*
  Solo exigimos acceso si la validación
  está activa.
 */

 if(
  validacionClientes&&
  !accesoPedido
 ){

  mostrarError(
   "Primero debes ingresar un teléfono registrado o un referente válido."
  );

  return false;
 }


 if(
  ubicacion.lat===null||
  ubicacion.lng===null
 ){

  mostrarError(
   "Selecciona tu ubicación de entrega."
  );

  return false;
 }


 if(ubicacionCargando){

  mostrarError(
   "Espera mientras se obtiene la dirección de entrega."
  );

  return false;
 }


 if($("requiereFactura").checked){

  if(!$("numeroDocumento").value.trim()){

   mostrarError(
    "Ingresa tu cédula o RUC."
   );

   return false;
  }


  if(!$("correoFactura").value.trim()){

   mostrarError(
    "Ingresa el correo para la factura."
   );

   return false;
  }

 }


 return true;

}


/* =========================================================
   CREACIÓN DE CLIENTE
========================================================= */

async function validarCliente(){

 const telefono=
  normalizarTelefono(
   $("clienteTelefono").value
  );


 /*
  Si la validación está desactivada,
  no necesitamos buscar ni crear cliente
  para permitir el pedido.
 */

 if(!validacionClientes){

  return null;

 }


 let cliente=
  await consultarCliente(telefono);


 if(cliente){

  if(cliente.activo===false)
   throw new Error(
    "El cliente está inactivo."
   );


  clienteActual=cliente;

  return cliente;

 }


 const telefonoReferente=
  normalizarTelefono(
   $("telefonoReferente").value
  );


 if(!telefonoReferente)
  throw new Error(
   "Debes ingresar un referente."
  );


 const referente=
  await consultarCliente(
   telefonoReferente
  );


 if(
  !referente||
  referente.activo===false||
  !referente.codigo_referido
 ){

  throw new Error(
   "El referente no es válido."
  );

 }


 const codigoNuevo=
  "SR"+
  Date.now()
   .toString(36)
   .toUpperCase()+
  Math.floor(
   100+
   Math.random()*900
  );


 const cr=
  await supabaseClient.rpc(
   "crear_cliente",
   {
    p_nombre:
     $("clienteNombre")
      .value
      .trim(),

    p_telefono:
     telefono,

    p_codigo_referido:
     codigoNuevo,

    p_codigo_referente:
     referente.codigo_referido
   }
  );


 if(cr.error)
  throw cr.error;


 cliente=
  await consultarCliente(
   telefono
  );


 if(!cliente)
  throw new Error(
   "No se pudo crear el cliente."
  );


 clienteActual=cliente;

 referenteValido=false;


 $("campoReferido")
  .classList.remove("show");


 habilitarPedido();


 return cliente;

}


/* =========================================================
   REALIZAR PEDIDO
========================================================= */

async function realizarPedido(){

 if(!validar())
  return;


 const btn=
  document.querySelector(".whatsapp");


 if(btn)
  btn.disabled=true;


 try{

  /*
   Si validación está activa:
   verifica/crea cliente.

   Si está desactivada:
   no realiza esta validación.
  */

  const cliente=
   await validarCliente();


  const ahora=
   new Date();


  const pad=
   n=>String(n).padStart(2,"0");


  const numeroPedido=
   "SR-"+
   ahora.getFullYear()+
   pad(ahora.getMonth()+1)+
   pad(ahora.getDate())+
   "-"+
   pad(ahora.getHours())+
   pad(ahora.getMinutes())+
   pad(ahora.getSeconds());


  let subtotal=0;


  carrito.forEach(p=>{

   subtotal+=
    Number(p.precio)*
    Number(p.cantidad);

  });


  const delivery=
   Number(
    configuracion.tarifaDelivery||0
   );


  const total=
   subtotal+delivery;


  /*
   Si existe cliente, usamos su ID.
   Si la validación está desactivada,
   cliente_id queda null.
  */

  const pedido={

   numero:
    numeroPedido,

   cliente_id:
    cliente?.id||null,

   nombre_cliente:
    $("clienteNombre")
     .value
     .trim(),

   telefono_cliente:
    normalizarTelefono(
     $("clienteTelefono").value
    ),

   subtotal,

   costo_delivery:
    delivery,

   total,

   latitud:
    ubicacion.lat,

   longitud:
    ubicacion.lng,

   direccion:
    ubicacion.direccion,

   referencia:
    $("referencia")
     .value
     .trim(),

   requiere_factura:
    $("requiereFactura").checked,

   tipo_documento:
    $("tipoDocumento").value,

   numero_documento:
    $("numeroDocumento")
     .value
     .trim(),

   correo_factura:
    $("correoFactura")
     .value
     .trim(),

   estado:
    "pendiente"

  };


  const pr=
   await supabaseClient
    .from("pedidos")
    .insert(pedido)
    .select()
    .single();


  if(pr.error)
   throw pr.error;


  const pedidoCreado=
   pr.data;


  /*
   Mantengo la estructura actual
   de carreras.
  */

  const carrera={

   pedido_id:
    pedidoCreado.id,

   restaurante_id:
    carrito[0]?.restaurante_id||
    null,

   numero:
    numeroPedido,

   estado:
    "pendiente"

  };


  const cr=
   await supabaseClient
    .from("carreras")
    .insert(carrera)
    .select()
    .single();


  if(cr.error)
   throw cr.error;


  const carreraCreada=
   cr.data;


  const detalles=
   carrito.map(p=>({

    carrera_id:
     carreraCreada.id,

    producto_id:
     p.producto_id||p.id,

    cantidad:
     p.cantidad,

    precio_unitario:
     Number(p.precio),

    subtotal:
     Number(p.precio)*
     Number(p.cantidad)

   }));


  if(detalles.length){

   const dr=
    await supabaseClient
     .from("detalle_carreras")
     .insert(detalles);


   if(dr.error)
    throw dr.error;

  }


  /*
   WhatsApp
  */

  let mensaje=
`🛵 *NUEVO PEDIDO - ${numeroPedido}*

👤 *Cliente:* ${$("clienteNombre").value.trim()}
📱 *Teléfono:* ${normalizarTelefono($("clienteTelefono").value)}

📍 *Dirección:*
${ubicacion.direccion}

📝 *Referencia:*
${$("referencia").value.trim()||"Sin referencia"}

🛒 *Pedido:*
`;


  carrito.forEach(p=>{

   mensaje+=
`\n• ${p.nombre} × ${p.cantidad} = $${(
    Number(p.precio)*
    Number(p.cantidad)
   ).toFixed(2)}`;

  });


  mensaje+=
`\n\nSubtotal: $${subtotal.toFixed(2)}
Delivery: $${delivery.toFixed(2)}
*TOTAL: $${total.toFixed(2)}*`;


  if($("requiereFactura").checked){

   mensaje+=
`\n\n🧾 *FACTURA*
${$("tipoDocumento").value}: ${$("numeroDocumento").value.trim()}
Correo: ${$("correoFactura").value.trim()}`;

  }


  const wa=
   configuracion.whatsappNegocio;


  const msg=
   encodeURIComponent(
    mensaje
   );


  localStorage.removeItem(
   "sr_carrito"
  );


  carrito=[];


  window.location.href=
   `https://wa.me/${wa}?text=${msg}`;


 }catch(e){

  console.error(e);


  mostrarError(
   e.message||
   "No se pudo realizar el pedido."
  );


  if(btn)
   btn.disabled=false;

 }

}
