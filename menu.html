<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi pedido | Sobre Ruedas</title>

<style>
*{box-sizing:border-box}

:root{
 --bg:#f7f4ee;
 --panel:#fffdf9;
 --panel2:#fff;
 --primary:#2f5d45;
 --primary2:#244936;
 --accent:#d97941;
 --accent2:#c86832;
 --text:#26352d;
 --muted:#68736b;
 --border:#e7dfd2;
 --soft:#f1eadf;
 --danger:#a9553b;
 --success:#35633f;
 --shadow:0 4px 16px #5b46331a;
}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
}

header{
 background:var(--primary);
 color:#fff;
 padding:18px 20px;
 position:sticky;
 top:0;
 z-index:20;
 box-shadow:0 3px 12px #0002;
}

.header-inner{
 max-width:1100px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
}

header h1{
 margin:0;
 font-size:24px;
}

header p{
 margin:4px 0 0;
 color:#e5eee7;
 font-size:14px;
}

.btn-header{
 background:#ffffff1c;
 color:#fff;
 border:1px solid #ffffff33;
 padding:9px 13px;
 border-radius:9px;
 cursor:pointer;
 font-weight:bold;
}

main{
 max-width:1100px;
 margin:auto;
 padding:20px;
}

.seccion{
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:14px;
 padding:18px;
 margin-bottom:18px;
 box-shadow:var(--shadow);
}

.seccion h2{
 margin:0 0 15px;
 color:var(--primary);
 font-size:20px;
}

.seccion h3{
 margin:0 0 12px;
 color:var(--primary);
 font-size:17px;
}

.mensaje{
 padding:11px 13px;
 border-radius:9px;
 background:#f5eadf;
 border:1px solid #ead6c3;
 color:#76543d;
 margin-bottom:14px;
 font-size:14px;
}

.mensaje.exito{
 background:#e2efe3;
 border-color:#cfe2d0;
 color:var(--success);
}

.oculto{
 display:none!important;
}

/* CARRITO */

.local-card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:12px;
 padding:15px;
 margin-bottom:14px;
}

.local-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:12px;
 padding-bottom:10px;
 border-bottom:1px solid var(--border);
}

.local-header h3{
 margin:0;
 color:var(--primary);
}

.producto{
 display:grid;
 grid-template-columns:1fr auto auto;
 gap:12px;
 align-items:center;
 padding:10px 0;
 border-bottom:1px solid #eee8de;
}

.producto:last-child{
 border-bottom:0;
}

.producto-info strong{
 display:block;
 color:var(--text);
 margin-bottom:3px;
}

.producto-info small{
 color:var(--muted);
}

.cantidad{
 display:flex;
 align-items:center;
 gap:7px;
}

.cantidad button{
 width:30px;
 height:30px;
 padding:0;
 border-radius:7px;
 background:var(--soft);
 color:var(--primary);
 font-size:17px;
}

.cantidad span{
 min-width:22px;
 text-align:center;
 font-weight:bold;
}

.producto-total{
 text-align:right;
 min-width:80px;
 font-weight:bold;
 color:var(--primary);
}

.eliminar{
 background:none;
 color:var(--danger);
 border:0;
 padding:4px;
 cursor:pointer;
 font-size:12px;
}

.local-resumen{
 margin-top:12px;
 padding-top:11px;
 border-top:1px solid var(--border);
}

.linea{
 display:flex;
 justify-content:space-between;
 gap:10px;
 margin:6px 0;
 color:var(--muted);
 font-size:14px;
}

.linea.total-local{
 color:var(--primary);
 font-size:16px;
 font-weight:bold;
}

/* RESUMEN */

.resumen-final{
 background:var(--primary);
 color:#fff;
 border-radius:13px;
 padding:17px;
 margin-top:18px;
}

.resumen-final .linea{
 color:#e4eee7;
}

.resumen-final .linea.total{
 color:#fff;
 font-size:20px;
 font-weight:bold;
 padding-top:10px;
 margin-top:10px;
 border-top:1px solid #ffffff33;
}

/* FORMULARIO */

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
 gap:12px;
}

.campo{
 margin-bottom:4px;
}

.campo label{
 display:block;
 margin-bottom:6px;
 font-size:13px;
 font-weight:bold;
 color:#53665a;
}

input,
textarea{
 width:100%;
 padding:11px 12px;
 border:1px solid #d8d0c3;
 border-radius:9px;
 background:#fff;
 color:var(--text);
 font-size:14px;
 outline:none;
}

input:focus,
textarea:focus{
 border-color:var(--primary);
 box-shadow:0 0 0 3px #2f5d4515;
}

textarea{
 min-height:80px;
 resize:vertical;
}

.ubicacion{
 display:flex;
 gap:8px;
 margin-top:7px;
 flex-wrap:wrap;
}

.ubicacion button{
 flex:1;
 min-width:170px;
}

/* BOTONES */

.acciones{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-top:15px;
}

button{
 border:0;
 border-radius:8px;
 background:var(--accent);
 color:#fff;
 padding:10px 14px;
 cursor:pointer;
 font-weight:bold;
 transition:.15s;
}

button:hover{
 background:var(--accent2);
 transform:translateY(-1px);
}

button.sec{
 background:var(--primary);
}

button.sec:hover{
 background:var(--primary2);
}

button.gray{
 background:var(--soft);
 color:var(--primary);
}

button.danger{
 background:#f0ddd7;
 color:var(--danger);
}

button.danger:hover{
 background:#e7ccc4;
}

button:disabled{
 opacity:.55;
 cursor:not-allowed;
 transform:none;
}

/* VACÍO */

.vacio{
 text-align:center;
 padding:40px 20px;
 color:var(--muted);
}

.vacio-icon{
 font-size:42px;
 margin-bottom:10px;
}

.vacio h2{
 margin:0 0 7px;
 color:var(--primary);
}

/* FOOTER */

.acciones-finales{
 display:flex;
 gap:10px;
 justify-content:flex-end;
 flex-wrap:wrap;
 margin-top:18px;
}

.btn-pedido{
 font-size:16px;
 padding:13px 20px;
}

/* RESPONSIVE */

@media(max-width:600px){

 main{
  padding:14px;
 }

 header{
  padding:16px;
 }

 header h1{
  font-size:21px;
 }

 .seccion{
  padding:15px;
 }

 .producto{
  grid-template-columns:1fr auto;
 }

 .producto-total{
  grid-column:2;
  grid-row:1;
 }

 .cantidad{
  grid-column:1;
 }

 .eliminar{
  grid-column:2;
  grid-row:2;
  justify-self:end;
 }

 .local-header{
  align-items:flex-start;
 }

 .acciones-finales button{
  width:100%;
 }
}
</style>
</head>

<body>

<header>
 <div class="header-inner">
  <div>
   <h1>Sobre Ruedas</h1>
   <p>Mi pedido</p>
  </div>

  <button class="btn-header" onclick="volverInicio()">
   ← Seguir comprando
  </button>
 </div>
</header>

<main>

<div id="mensaje"></div>

<section id="seccionCarrito" class="seccion">
 <h2>🛒 Productos seleccionados</h2>

 <div id="carrito"></div>

 <div id="resumenFinal"></div>

 <div class="acciones-finales">
  <button class="gray" onclick="vaciarCarrito()">
   Vaciar carrito
  </button>

  <button class="sec" onclick="volverInicio()">
   Seguir comprando
  </button>
 </div>
</section>

<section id="seccionDatos" class="seccion oculto">

 <h2>📍 Datos de entrega</h2>

 <div class="grid">

  <div class="campo">
   <label>Nombre</label>
   <input
    id="clienteNombre"
    type="text"
    placeholder="Tu nombre">
  </div>

  <div class="campo">
   <label>Teléfono</label>
   <input
    id="clienteTelefono"
    type="tel"
    placeholder="Ej.: 0981234567">
  </div>

 </div>

 <div class="campo" style="margin-top:12px">
  <label>Dirección de entrega</label>

  <textarea
   id="direccion"
   placeholder="Ingresa la dirección donde deseas recibir tu pedido"></textarea>

  <div class="ubicacion">

   <button
    type="button"
    class="sec"
    onclick="usarMiUbicacion()">
    📍 Usar mi ubicación
   </button>

   <button
    type="button"
    class="gray"
    id="btnMapa"
    onclick="abrirGoogleMaps()"
    disabled>
    🗺️ Abrir en Google Maps
   </button>

  </div>
 </div>

 <div class="campo" style="margin-top:12px">
  <label>Referencia</label>

  <input
   id="referencia"
   type="text"
   placeholder="Ej.: casa de color azul, frente al parque">
 </div>

 <div class="acciones">
  <button
   class="btn-pedido"
   onclick="confirmarPedido()">
   Confirmar pedido
  </button>
 </div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>

<script>

const $=id=>document.getElementById(id);

const carritoEl=$("carrito");
const resumenFinalEl=$("resumenFinal");
const seccionDatos=$("seccionDatos");
const mensajeEl=$("mensaje");
const clienteNombre=$("clienteNombre");
const clienteTelefono=$("clienteTelefono");
const direccion=$("direccion");
const referencia=$("referencia");
const btnMapa=$("btnMapa");

let carrito=[];
let ubicacionActual=null;
let tarifaDelivery=1.50;
let whatsappNegocio=
 window.CONFIG?.whatsappNegocio||
 "593985459479";

/* =========================
   UTILIDADES
========================= */

function escapeHtml(v=""){
 return String(v).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function mostrarMensaje(texto,exito=false){

 mensajeEl.innerHTML=
  `<div class="mensaje ${exito?"exito":""}">
   ${escapeHtml(texto)}
  </div>`;

 window.scrollTo({
  top:0,
  behavior:"smooth"
 });

 setTimeout(()=>{
  mensajeEl.innerHTML="";
 },5000);
}

function dinero(valor){
 return "$"+Number(valor||0).toFixed(2);
}

function numeroPedido(){
 return "SR-"+Math.floor(
  100000+
  Math.random()*900000
 );
}

/* =========================
   CARRITO
========================= */

function cargarCarrito(){

 try{

  carrito=JSON.parse(
   localStorage.getItem("carrito")||"[]"
  );

  if(!Array.isArray(carrito))
   carrito=[];

 }catch{

  carrito=[];
 }

 renderCarrito();
}

function guardarCarrito(){

 localStorage.setItem(
  "carrito",
  JSON.stringify(carrito)
 );

 renderCarrito();
}

function agruparPorLocal(){

 const grupos={};

 carrito.forEach((p,i)=>{

  const id=String(
   p.restaurante_id||
   p.local_id||
   "sin-local"
  );

  if(!grupos[id]){

   grupos[id]={
    restaurante_id:p.restaurante_id,
    restaurante_nombre:
     p.restaurante_nombre||
     "Local",
    productos:[]
   };

  }

  grupos[id].productos.push({
   ...p,
   _index:i
  });

 });

 return Object.values(grupos);
}

function calcularSubtotalLocal(local){

 return local.productos.reduce(
  (total,p)=>
   total+
   (Number(p.precio)||0)*
   (Number(p.cantidad)||0),
  0
 );
}

function calcularDelivery(){

 return agruparPorLocal().length*
  Number(tarifaDelivery||1.50);
}

function calcularTotalProductos(){

 return carrito.reduce(
  (total,p)=>
   total+
   (Number(p.precio)||0)*
   (Number(p.cantidad)||0),
  0
 );
}

function renderCarrito(){

 const locales=agruparPorLocal();

 if(!locales.length){

  carritoEl.innerHTML=`
   <div class="vacio">

    <div class="vacio-icon">🛒</div>

    <h2>Tu carrito está vacío</h2>

    <p>Agrega productos desde nuestros locales.</p>

    <button class="sec" onclick="volverInicio()">
     Ver locales
    </button>

   </div>
  `;

  resumenFinalEl.innerHTML="";
  seccionDatos.classList.add("oculto");

  return;
 }

 seccionDatos.classList.remove("oculto");

 carritoEl.innerHTML=locales.map(local=>{

  const subtotal=calcularSubtotalLocal(local);
  const delivery=Number(tarifaDelivery)||1.50;
  const total=subtotal+delivery;

  return `
   <div class="local-card">

    <div class="local-header">
     <h3>${escapeHtml(local.restaurante_nombre)}</h3>
     <strong>${dinero(total)}</strong>
    </div>

    ${local.productos.map(p=>`

     <div class="producto">

      <div class="producto-info">
       <strong>${escapeHtml(p.producto_nombre||"Producto")}</strong>
       <small>
        ${dinero(p.precio)} × ${Number(p.cantidad)||0}
       </small>
      </div>

      <div class="cantidad">

       <button
        onclick="cambiarCantidad(${p._index},-1)">
        −
       </button>

       <span>${Number(p.cantidad)||0}</span>

       <button
        onclick="cambiarCantidad(${p._index},1)">
        +
       </button>

      </div>

      <div class="producto-total">
       ${dinero(
        (Number(p.precio)||0)*
        (Number(p.cantidad)||0)
       )}

       <br>

       <button
        class="eliminar"
        onclick="eliminarProducto(${p._index})">
        Eliminar
       </button>

      </div>

     </div>

    `).join("")}

    <div class="local-resumen">

     <div class="linea">
      <span>Productos</span>
      <span>${dinero(subtotal)}</span>
     </div>

     <div class="linea">
      <span>Delivery</span>
      <span>${dinero(delivery)}</span>
     </div>

     <div class="linea total-local">
      <span>Total local</span>
      <span>${dinero(total)}</span>
     </div>

    </div>

   </div>
  `;

 }).join("");

 const totalProductos=calcularTotalProductos();
 const totalDelivery=calcularDelivery();
 const total=totalProductos+totalDelivery;

 resumenFinalEl.innerHTML=`
  <div class="resumen-final">

   <div class="linea">
    <span>Total productos</span>
    <span>${dinero(totalProductos)}</span>
   </div>

   <div class="linea">
    <span>Total delivery</span>
    <span>${dinero(totalDelivery)}</span>
   </div>

   <div class="linea total">
    <span>TOTAL DEL PEDIDO</span>
    <span>${dinero(total)}</span>
   </div>

  </div>
 `;
}

function cambiarCantidad(index,cambio){

 if(!carrito[index])return;

 carrito[index].cantidad=
  Math.max(
   1,
   (Number(carrito[index].cantidad)||1)+cambio
  );

 guardarCarrito();
}

function eliminarProducto(index){

 if(!carrito[index])return;

 carrito.splice(index,1);

 guardarCarrito();

 mostrarMensaje(
  "Producto eliminado del carrito.",
  true
 );
}

function vaciarCarrito(){

 if(!carrito.length)return;

 if(!confirm(
  "¿Deseas eliminar todos los productos del carrito?"
 ))return;

 carrito=[];

 localStorage.removeItem("carrito");

 renderCarrito();

 mostrarMensaje(
  "Carrito vacío.",
  true
 );
}

/* =========================
   CONFIGURACIÓN
========================= */

async function cargarConfiguracion(){

 try{

  const {data,error}=await supabaseClient
   .from("configuracion_negocio")
   .select("*")
   .order("id",{ascending:true})
   .limit(1);

  if(!error&&data?.length){

   tarifaDelivery=
    Number(data[0].tarifa_delivery)||1.50;

   whatsappNegocio=
    data[0].whatsapp_negocio||
    whatsappNegocio;

   renderCarrito();

   return;
  }

 }catch(e){

  console.error(e);

 }

 tarifaDelivery=
  Number(window.CONFIG?.tarifaDelivery)||1.50;

 whatsappNegocio=
  window.CONFIG?.whatsappNegocio||
  whatsappNegocio;

 renderCarrito();
}

/* =========================
   UBICACIÓN
========================= */

function usarMiUbicacion(){

 if(!navigator.geolocation){

  mostrarMensaje(
   "Tu navegador no permite obtener la ubicación."
  );

  return;
 }

 mostrarMensaje(
  "Obteniendo tu ubicación..."
 );

 navigator.geolocation.getCurrentPosition(

  posicion=>{

   const lat=posicion.coords.latitude;
   const lng=posicion.coords.longitude;

   ubicacionActual={
    lat,
    lng
   };

   btnMapa.disabled=false;

   /*
    IMPORTANTE:
    NO colocamos coordenadas en el campo
    de dirección.
   */

   abrirGoogleMaps();

   mensajeEl.innerHTML="";

  },

  error=>{

   console.error(error);

   let texto=
    "No se pudo obtener tu ubicación.";

   if(error.code===1)
    texto=
     "Debes permitir el acceso a tu ubicación.";

   if(error.code===2)
    texto=
     "No fue posible determinar tu ubicación.";

   if(error.code===3)
    texto=
     "La ubicación tardó demasiado en responder.";

   mostrarMensaje(texto);

  },

  {
   enableHighAccuracy:true,
   timeout:10000,
   maximumAge:0
  }
 );
}

function abrirGoogleMaps(){

 if(!ubicacionActual){

  mostrarMensaje(
   "Primero presiona «Usar mi ubicación»."
  );

  return;
 }

 const url=
  "https://www.google.com/maps/search/?api=1&query="+
  encodeURIComponent(
   `${ubicacionActual.lat},${ubicacionActual.lng}`
  );

 window.open(
  url,
  "_blank",
  "noopener,noreferrer"
 );
}

/* =========================
   PEDIDO
========================= */

function validarDatos(){

 if(!clienteNombre.value.trim()){

  mostrarMensaje(
   "Ingresa tu nombre."
  );

  clienteNombre.focus();

  return false;
 }

 if(!clienteTelefono.value.trim()){

  mostrarMensaje(
   "Ingresa tu número de teléfono."
  );

  clienteTelefono.focus();

  return false;
 }

 if(!direccion.value.trim()){

  mostrarMensaje(
   "Ingresa la dirección de entrega."
  );

  direccion.focus();

  return false;
 }

 if(!carrito.length){

  mostrarMensaje(
   "El carrito está vacío."
  );

  return false;
 }

 return true;
}

function construirCarreras(){

 return agruparPorLocal().map(local=>{

  const subtotal=
   calcularSubtotalLocal(local);

  const delivery=
   Number(tarifaDelivery)||1.50;

  return {

   restaurante_id:Number(
    local.restaurante_id
   ),

   subtotal,

   delivery,

   total:subtotal+delivery,

   productos:local.productos.map(p=>({

    producto_id:
     p.producto_id?
     Number(p.producto_id):
     null,

    producto_nombre:
     p.producto_nombre||
     "Producto",

    precio_unitario:
     Number(p.precio)||0,

    cantidad:
     Number(p.cantidad)||1,

    subtotal:
     (Number(p.precio)||0)*
     (Number(p.cantidad)||0)

   }))

  };

 });
}

async function registrarPedido(){

 const numero=numeroPedido();

 const totalProductos=
  calcularTotalProductos();

 const totalDelivery=
  calcularDelivery();

 const total=
  totalProductos+
  totalDelivery;

 const carreras=
  construirCarreras();

 const {data,error}=await supabaseClient.rpc(
  "registrar_pedido_completo",
  {
   p_numero:numero,

   p_cliente_nombre:
    clienteNombre.value.trim(),

   p_cliente_telefono:
    clienteTelefono.value.trim(),

   p_direccion:
    direccion.value.trim(),

   p_referencia:
    referencia.value.trim(),

   p_total_productos:
    totalProductos,

   p_total_delivery:
    totalDelivery,

   p_total:
    total,

   p_carreras:
    carreras
  }
 );

 if(error)
  throw error;

 return {
  id:data,
  numero,
  totalProductos,
  totalDelivery,
  total
 };
}

/* =========================
   WHATSAPP
========================= */

function generarMensajeWhatsApp(pedido){

 const locales=agruparPorLocal();

 let texto=
  `*NUEVO PEDIDO - SOBRE RUEDAS*%0A%0A`+
  `*Pedido:* ${pedido.numero}%0A`+
  `*Cliente:* ${encodeURIComponent(clienteNombre.value.trim())}%0A`+
  `*Teléfono:* ${encodeURIComponent(clienteTelefono.value.trim())}%0A`+
  `*Dirección:* ${encodeURIComponent(direccion.value.trim())}%0A`;

 if(referencia.value.trim()){

  texto+=
   `*Referencia:* ${encodeURIComponent(
    referencia.value.trim()
   )}%0A`;
 }

 texto+="%0A";

 locales.forEach(local=>{

  texto+=
   `*${encodeURIComponent(
    local.restaurante_nombre
   )}*%0A`;

  local.productos.forEach(p=>{

   texto+=
    `• ${encodeURIComponent(
     p.producto_nombre
    )} x${Number(p.cantidad)||0} `+
    `- ${dinero(
     (Number(p.precio)||0)*
     (Number(p.cantidad)||0)
    )}%0A`;

  });

  const subtotal=
   calcularSubtotalLocal(local);

  texto+=
   `Subtotal: ${dinero(subtotal)}%0A`+
   `Delivery: ${dinero(tarifaDelivery)}%0A`+
   `Total local: ${dinero(
    subtotal+Number(tarifaDelivery)
   )}%0A%0A`;
 });

 texto+=
  `*TOTAL PRODUCTOS:* ${dinero(
   pedido.totalProductos
  )}%0A`+
  `*TOTAL DELIVERY:* ${dinero(
   pedido.totalDelivery
  )}%0A`+
  `*TOTAL PEDIDO:* ${dinero(
   pedido.total
  )}`;

 return texto;
}

/* =========================
   CONFIRMAR
========================= */

async function confirmarPedido(){

 if(!validarDatos())
  return;

 const botones=
  document.querySelectorAll(
   "#seccionDatos button"
  );

 botones.forEach(b=>b.disabled=true);

 mostrarMensaje(
  "Registrando tu pedido..."
 );

 try{

  const pedido=
   await registrarPedido();

  /*
   El pedido ya está guardado en Supabase.
   Ahora sí limpiamos el carrito.
  */

  localStorage.removeItem("carrito");
  carrito=[];

  const mensajeWhatsApp=
   generarMensajeWhatsApp(pedido);

  const telefono=
   String(whatsappNegocio)
    .replace(/\D/g,"");

  const url=
   `https://wa.me/${telefono}?text=${mensajeWhatsApp}`;

  mostrarMensaje(
   `Pedido ${pedido.numero} registrado correctamente.`,
   true
  );

  renderCarrito();

  setTimeout(()=>{

   window.open(
    url,
    "_blank",
    "noopener,noreferrer"
   );

  },500);

 }catch(e){

  console.error(e);

  mostrarMensaje(
   "No se pudo registrar el pedido: "+
   (e.message||"Error desconocido.")
  );

 }finally{

  botones.forEach(b=>b.disabled=false);

 }
}

/* =========================
   NAVEGACIÓN
========================= */

function volverInicio(){

 location.href="index.html";
}

/* =========================
   INICIO
========================= */

async function iniciar(){

 cargarCarrito();

 await cargarConfiguracion();

}

iniciar();

</script>
