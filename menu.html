<body>

<header>

    <div class="header-content">

        <div class="logo">
            🛵 Sobre Ruedas
        </div>

        <a
            href="index.html"
            class="volver"
        >
            ← Seguir comprando
        </a>

    </div>

</header>


<div class="container">

    <div id="contenidoPedido"></div>

</div>


<script src="config.js"></script>


<script>

let carrito = JSON.parse(
    localStorage.getItem("carrito") || "[]"
);

let ubicacion = null;


const TARIFA_DELIVERY =
    Number(
        localStorage.getItem("configSobreRuedas")
            ? JSON.parse(
                localStorage.getItem(
                    "configSobreRuedas"
                )
            ).tarifaDelivery
            : CONFIG.tarifaDelivery
    ) || 1.50;


const WHATSAPP =
    CONFIG.whatsappNegocio ||
    "593980390363";


const contenido =
    document.getElementById(
        "contenidoPedido"
    );


// ========================================
// UTILIDADES
// ========================================

function dinero(valor) {

    return Number(
        valor || 0
    ).toFixed(2);

}


function escapar(texto) {

    return String(
        texto ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


// ========================================
// NORMALIZAR CARRITO
// ========================================

function normalizarCarrito() {

    const mapa = new Map();


    carrito.forEach(item => {

        const restauranteId =
            item.restaurante_id ?? "";

        const productoId =
            item.producto_id ?? "";

        const nombre =
            item.nombre ?? "Producto";


        const clave =
            restauranteId +
            "|" +
            productoId;


        if (!mapa.has(clave)) {

            mapa.set(
                clave,
                {
                    producto_id:
                        productoId,

                    restaurante_id:
                        restauranteId,

                    restaurante_nombre:
                        item.restaurante_nombre ||
                        "Restaurante",

                    nombre:
                        nombre,

                    descripcion:
                        item.descripcion || "",

                    precio:
                        Number(
                            item.precio || 0
                        ),

                    cantidad:
                        Number(
                            item.cantidad || 1
                        )
                }
            );

        } else {

            mapa.get(
                clave
            ).cantidad += Number(
                item.cantidad || 1
            );

        }

    });


    carrito =
        Array.from(
            mapa.values()
        );


    localStorage.setItem(
        "carrito",
        JSON.stringify(carrito)
    );

}


// ========================================
// MOSTRAR CARRITO
// ========================================

function mostrarCarrito() {

    normalizarCarrito();


    if (!carrito.length) {

        contenido.innerHTML = `

            <div class="card vacio">

                <h2>
                    🛒 Tu carrito está vacío
                </h2>

                <p>
                    Agrega productos antes de continuar.
                </p>

                <a href="index.html">
                    Volver a restaurantes
                </a>

            </div>

        `;

        return;

    }


    const grupos = {};


    carrito.forEach(item => {

        const id =
            item.restaurante_id ||
            item.restaurante_nombre;


        if (!grupos[id]) {

            grupos[id] = {

                restaurante_id:
                    item.restaurante_id,

                restaurante_nombre:
                    item.restaurante_nombre,

                productos: []

            };

        }


        grupos[id].productos.push(
            item
        );

    });


    let totalProductos = 0;

    let totalDelivery = 0;


    let html = `

        <h1>
            🛒 Mi pedido
        </h1>

        <p class="subtitulo">
            Revisa tus productos antes de confirmar.
        </p>

    `;


    Object.values(
        grupos
    ).forEach(grupo => {

        let subtotal = 0;

        let productosHTML = "";


        grupo.productos.forEach(
            producto => {

                const cantidad =
                    Number(
                        producto.cantidad || 1
                    );


                const precio =
                    Number(
                        producto.precio || 0
                    );


                const subtotalProducto =
                    cantidad * precio;


                subtotal +=
                    subtotalProducto;


                productosHTML += `

                    <div class="producto">

                        <div class="producto-info">

                            <div class="producto-nombre">

                                ${escapar(
                                    producto.nombre
                                )}

                            </div>

                            <div>
                                Cantidad: ${cantidad}
                            </div>

                            <div>
                                Precio unitario:
                                $${dinero(precio)}
                            </div>

                        </div>


                        <div class="producto-precio">

                            $${dinero(
                                subtotalProducto
                            )}

                        </div>

                    </div>

                `;

            }
        );


        const delivery =
            TARIFA_DELIVERY;


        const totalCarrera =
            subtotal +
            delivery;


        totalProductos +=
            subtotal;


        totalDelivery +=
            delivery;


        html += `

            <div class="card restaurante">

                <h2>

                    🏪
                    ${escapar(
                        grupo.restaurante_nombre
                    )}

                </h2>


                ${productosHTML}


                <div class="carrera-total">

                    Subtotal:
                    $${dinero(subtotal)}

                    <br>

                    Delivery:
                    $${dinero(delivery)}

                    <br>

                    Total carrera:
                    $${dinero(totalCarrera)}

                </div>

            </div>

        `;

    });


    const totalGeneral =
        totalProductos +
        totalDelivery;


    html += `

        <div class="card">

            <h2>
                📋 Datos de entrega
            </h2>


            <label>
                Nombre
            </label>

            <input
                id="clienteNombre"
                type="text"
                placeholder="Tu nombre"
            >


            <label>
                Teléfono
            </label>

            <input
                id="clienteTelefono"
                type="tel"
                placeholder="Ej: 0999999999"
            >


            <label>
                Dirección
            </label>

            <textarea
                id="clienteDireccion"
                placeholder="Ej: Calle, número de casa, sector..."
            ></textarea>


            <div class="ubicacion-box">

                <strong>
                    📍 Comparte tu ubicación
                </strong>

                <p>
                    Si estás en el lugar donde recibirás
                    el pedido, puedes compartir tu ubicación
                    para facilitar la entrega.
                </p>


                <button
                    type="button"
                    class="btn-ubicacion"
                    onclick="obtenerUbicacion()"
                >
                    📍 Usar mi ubicación
                </button>


                <div id="estadoUbicacion">

                    No se ha compartido ubicación.

                </div>

            </div>


            <label>
                Referencia
            </label>

            <textarea
                id="clienteReferencia"
                placeholder="Ej: Casa de dos pisos, junto a una tienda..."
            ></textarea>

        </div>


        <div class="card">

            <h2>
                💰 Resumen
            </h2>


            <div class="fila-total">

                <span>
                    Total productos
                </span>

                <strong>
                    $${dinero(totalProductos)}
                </strong>

            </div>


            <div class="fila-total">

                <span>
                    Delivery
                </span>

                <strong>
                    $${dinero(totalDelivery)}
                </strong>

            </div>


            <div class="fila-total total-final">

                <span>
                    Total
                </span>

                <strong>
                    $${dinero(totalGeneral)}
                </strong>

            </div>


            <button
                class="btn-whatsapp"
                onclick="enviarPedidoWhatsApp()"
            >

                📲 Enviar pedido por WhatsApp

            </button>

        </div>

    `;


    contenido.innerHTML =
        html;

}


// ========================================
// UBICACIÓN
// ========================================

function obtenerUbicacion() {

    const estado =
        document.getElementById(
            "estadoUbicacion"
        );


    if (!navigator.geolocation) {

        estado.innerHTML =
            "❌ Tu navegador no permite obtener ubicación.";

        return;

    }


    estado.innerHTML =
        "📍 Obteniendo ubicación...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                position.coords.latitude;


            const lon =
                position.coords.longitude;


            ubicacion = {

                lat: lat,

                lon: lon

            };


            estado.innerHTML = `

                ✅ Ubicación obtenida.

                <br>

                <a
                    href="https://www.google.com/maps?q=${lat},${lon}"
                    target="_blank"
                >
                    Ver ubicación en Google Maps
                </a>

            `;

        },


        function(error) {

            console.error(error);


            estado.innerHTML =

                "❌ No se pudo obtener la ubicación. " +

                "Puedes escribir la dirección manualmente.";

        },


        {

            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 0

        }

    );

}


// ========================================
// NÚMERO DE PEDIDO
// ========================================

function generarNumeroPedido() {

    const numero =
        Math.floor(
            100000 +
            Math.random() * 900000
        );


    return "SR-" + numero;

}


// ========================================
// ENVIAR WHATSAPP
// ========================================

function enviarPedidoWhatsApp() {

    if (!carrito.length) {

        alert(
            "Tu carrito está vacío."
        );

        return;

    }


    const nombre =
        document
            .getElementById(
                "clienteNombre"
            )
            .value
            .trim();


    const telefono =
        document
            .getElementById(
                "clienteTelefono"
            )
            .value
            .trim();


    const direccion =
        document
            .getElementById(
                "clienteDireccion"
            )
            .value
            .trim();


    const referencia =
        document
            .getElementById(
                "clienteReferencia"
            )
            .value
            .trim();


    if (!nombre) {

        alert(
            "Ingresa tu nombre."
        );

        return;

    }


    if (!telefono) {

        alert(
            "Ingresa tu teléfono."
        );

        return;

    }


    if (!direccion && !ubicacion) {

        alert(
            "Ingresa tu dirección o comparte tu ubicación."
        );

        return;

    }


    const numeroPedido =
        generarNumeroPedido();


    const grupos = {};


    carrito.forEach(item => {

        const id =
            item.restaurante_id ||
            item.restaurante_nombre;


        if (!grupos[id]) {

            grupos[id] = {

                restaurante_nombre:
                    item.restaurante_nombre,

                productos: []

            };

        }


        grupos[id].productos.push(
            item
        );

    });


    let totalProductos = 0;

    let totalDelivery = 0;


    let mensaje = "";


    mensaje +=
        "🛵 *SOBRE RUEDAS*";


    mensaje += "\n";


    mensaje +=
        "📦 *PEDIDO: " +
        numeroPedido +
        "*";


    mensaje += "\n\n";


    mensaje +=
        "👤 *Cliente:* " +
        nombre;


    mensaje += "\n";


    mensaje +=
        "📱 *Teléfono:* " +
        telefono;


    mensaje += "\n";


    if (direccion) {

        mensaje +=
            "📍 *Dirección:* " +
            direccion;

        mensaje += "\n";

    }


    if (referencia) {

        mensaje +=
            "📌 *Referencia:* " +
            referencia;

        mensaje += "\n";

    }


    if (ubicacion) {

        const mapa =
            "https://www.google.com/maps?q=" +
            ubicacion.lat +
            "," +
            ubicacion.lon;


        mensaje +=
            "🗺️ *Ubicación:* " +
            mapa;


        mensaje += "\n";

    }


    mensaje += "\n";


    let contadorCarrera = 0;


    Object.values(
        grupos
    ).forEach(grupo => {

        contadorCarrera++;


        let subtotal = 0;


        mensaje +=
            "🏪 *CARRERA " +
            contadorCarrera +
            "*";


        mensaje += "\n";


        mensaje +=
            "*" +
            grupo.restaurante_nombre +
            "*";


        mensaje += "\n";


        grupo.productos.forEach(
            producto => {

                const cantidad =
                    Number(
                        producto.cantidad || 1
                    );


                const precio =
                    Number(
                        producto.precio || 0
                    );


                const subtotalProducto =
                    cantidad *
                    precio;


                subtotal +=
                    subtotalProducto;


                mensaje +=
                    "• " +
                    producto.nombre +
                    " x" +
                    cantidad +
                    " — $" +
                    dinero(
                        subtotalProducto
                    );


                mensaje += "\n";

            }
        );


        const delivery =
            TARIFA_DELIVERY;


        const totalCarrera =
            subtotal +
            delivery;


        totalProductos +=
            subtotal;


        totalDelivery +=
            delivery;


        mensaje +=
            "🛵 Delivery: $" +
            dinero(delivery);


        mensaje += "\n";


        mensaje +=
            "💰 Total carrera: $" +
            dinero(totalCarrera);


        mensaje += "\n\n";

    });


    const total =
        totalProductos +
        totalDelivery;


    mensaje +=
        "🧾 *TOTAL PRODUCTOS:* $" +
        dinero(totalProductos);


    mensaje += "\n";


    mensaje +=
        "🛵 *TOTAL DELIVERY:* $" +
        dinero(totalDelivery);


    mensaje += "\n";


    mensaje +=
        "💰 *TOTAL PEDIDO: $" +
        dinero(total) +
        "*";


    mensaje += "\n\n";


    mensaje +=
        "Pedido generado desde Sobre Ruedas.";


    // Guardar pedido localmente
    const pedido = {

        numero:
            numeroPedido,

        cliente: {

            nombre:
                nombre,

            telefono:
                telefono,

            direccion:
                direccion,

            referencia:
                referencia

        },

        ubicacion:
            ubicacion,

        total_productos:
            totalProductos,

        total_delivery:
            totalDelivery,

        total:
            total,

        carreras:
            Object.values(
                grupos
            ),

        creado_en:
            new Date().toISOString()

    };


    localStorage.setItem(
        "ultimoPedido",
        JSON.stringify(
            pedido
        )
    );


    // Abrir WhatsApp
    const url =
        "https://wa.me/" +
        WHATSAPP +
        "?text=" +
        encodeURIComponent(
            mensaje
        );


    window.location.href =
        url;

}


// ========================================
// INICIO
// ========================================

mostrarCarrito();

</script>

</body>
</html>
```
