<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi pedido | Sobre Ruedas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f5ee;color:#26352d}
header{background:#2f5d45;color:#fff;padding:18px 20px}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;color:#e7f0e8}
main{max-width:900px;margin:auto;padding:20px}
.volver{display:inline-block;margin-bottom:15px;color:#2f5d45;text-decoration:none;font-weight:bold}
.seccion{background:#fffdf9;border:1px solid #eee5d8;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 3px 10px #5b46331c}
.seccion h2{margin:0 0 15px;color:#2f5d45;font-size:20px}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee5d8}
.item:last-child{border-bottom:0}
.item-img{width:70px;height:70px;border-radius:9px;object-fit:cover;background:#e9e1d3;flex:none}
.item-info{flex:1;min-width:0}
.item-info h3{margin:0 0 4px;color:#2f5d45;font-size:16px}
.item-info p{margin:3px 0;color:#68736b;font-size:14px}
.cantidad{display:flex;align-items:center;gap:7px;margin-top:7px}
.cantidad button{width:30px;height:30px;padding:0;border:0;border-radius:7px;background:#2f5d45;color:#fff;font-weight:bold;cursor:pointer}
.cantidad span{min-width:22px;text-align:center;font-weight:bold}
.item-total{font-weight:bold;color:#d06f39;white-space:nowrap}
.eliminar{border:0;background:#eee2d7;color:#9b4f31;border-radius:7px;padding:7px 9px;cursor:pointer}
.vacio{text-align:center;padding:30px 15px;color:#68736b}
.total-linea{display:flex;justify-content:space-between;margin:8px 0;color:#59675e}
.total-final{display:flex;justify-content:space-between;margin-top:15px;padding-top:15px;border-top:1px solid #ddd3c5;font-size:21px;font-weight:bold;color:#2f5d45}
.campo{margin-bottom:12px}
.campo label{display:block;margin-bottom:5px;font-weight:bold;color:#53665a}
.campo input,.campo textarea{width:100%;padding:11px;border:1px solid #d8d0c3;border-radius:8px;background:#fff;color:#26352d;font-size:15px}
.campo textarea{min-height:80px;resize:vertical}
.ubicacion{display:flex;gap:8px;margin-top:7px}
.ubicacion button{width:auto;padding:9px 12px;background:#e7dfd2;color:#2f5d45}
button{border:0;border-radius:9px;background:#d97941;color:#fff;padding:12px;cursor:pointer;font-weight:bold}
button:hover{background:#c86832}
.btn-pedido{width:100%;font-size:17px;margin-top:8px}
.btn-pedido:disabled{background:#b9b2a8;cursor:not-allowed}
.aviso{background:#f5eadf;color:#76543d;border-radius:8px;padding:10px;font-size:13px;margin-top:10px}
.cargando{text-align:center;padding:20px;color:#68736b}
</style>
</head>

<body>

<header>
<h1>Sobre Ruedas</h1>
<p>Mi pedido</p>
</header>

<main>

<a class="volver" href="index.html">← Seguir comprando</a>

<div id="contenido"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
let carrito=[];
let config={};

const contenido=document.getElementById("contenido");

function escapeHtml(v=""){
 return String(v).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function cargarCarrito(){
 try{
  const datos=JSON.parse(localStorage.getItem("carrito")||"[]");
  carrito=Array.isArray(datos)?datos:[];
 }catch{
  carrito=[];
 }
}

function guardarCarrito(){
 if(carrito.length){
  localStorage.setItem("carrito",JSON.stringify(carrito));
 }else{
  localStorage.removeItem("carrito");
 }
}

async function cargarConfig(){
 try{
  const {data,error}=await supabaseClient
   .from("configuracion_negocio")
   .select("*")
   .order("id")
   .limit(1)
   .maybeSingle();

  if(error)throw error;

  config=data||{
   nombre_negocio:"Sobre Ruedas",
   ciudad:"Esmeraldas",
   tarifa_delivery:1.50,
   whatsapp_negocio:"593985459479",
   moneda:"USD"
  };
 }catch(e){
  console.error(e);

  config={
   nombre_negocio:"Sobre Ruedas",
   ciudad:"Esmeraldas",
   tarifa_delivery:1.50,
   whatsapp_negocio:"593985459479",
   moneda:"USD"
  };
 }
}

function agruparCarrito(){
 const grupos={};

 carrito.forEach(item=>{
  const id=String(item.restaurante_id);

  if(!grupos[id]){
   grupos[id]={
    restaurante_id:item.restaurante_id,
    restaurante_nombre:item.restaurante_nombre||"Local",
    productos:[]
   };
  }

  grupos[id].productos.push(item);
 });

 return Object.values(grupos);
}

function calcularSubtotalGrupo(grupo){
 return grupo.productos.reduce(
  (s,p)=>s+(Number(p.precio)||0)*(Number(p.cantidad)||0),
  0
 );
}

function calcularSubtotal(){
 return carrito.reduce(
  (s,p)=>s+(Number(p.precio)||0)*(Number(p.cantidad)||0),
  0
 );
}

function calcularDelivery(){
 const tarifa=Number(config.tarifa_delivery);

 return agruparCarrito().length*
  (Number.isFinite(tarifa)?tarifa:1.50);
}

function calcularTotal(){
 return calcularSubtotal()+calcularDelivery();
}

function imagenUrl(url){
 if(!url)return "";
 const separador=url.includes("?")?"&":"?";
 return url+separador+"v="+Date.now();
}

function render(){
 if(!carrito.length){
  contenido.innerHTML=`
   <div class="seccion vacio">
    <h2>Tu carrito está vacío</h2>
    <p>Agrega productos desde nuestros locales.</p>
    <button onclick="location.href='index.html'">
     Ver locales
    </button>
   </div>
  `;
  return;
 }

 const grupos=agruparCarrito();

 contenido.innerHTML=`
  <div class="seccion">
   <h2>Tu pedido</h2>

   ${grupos.map(grupo=>`
    <div style="margin-bottom:20px">
     <h3 style="color:#2f5d45;margin:0 0 8px">
      ${escapeHtml(grupo.restaurante_nombre)}
     </h3>

     ${grupo.productos.map(item=>`
      <div class="item">
       ${
        item.imagen_url
        ? `<img
             class="item-img"
             src="${escapeHtml(imagenUrl(item.imagen_url))}"
             alt="${escapeHtml(item.producto_nombre)}"
             onerror="this.style.display='none'">`
        : `<div class="item-img"></div>`
       }

       <div class="item-info">
        <h3>${escapeHtml(item.producto_nombre)}</h3>
        <p>$${Number(item.precio||0).toFixed(2)} c/u</p>

        <div class="cantidad">
         <button onclick="cambiarCantidad(${item.producto_id},-1)">−</button>
         <span>${Number(item.cantidad)||0}</span>
         <button onclick="cambiarCantidad(${item.producto_id},1)">+</button>
         <button class="eliminar" onclick="eliminarProducto(${item.producto_id})">
          Eliminar
         </button>
        </div>
       </div>

       <div class="item-total">
        $${(
         (Number(item.precio)||0)*
         (Number(item.cantidad)||0)
        ).toFixed(2)}
       </div>
      </div>
     `).join("")}
    </div>
   `).join("")}

   <button
    style="background:#e7dfd2;color:#2f5d45;width:100%"
    onclick="vaciarCarrito()">
    Vaciar carrito
   </button>
  </div>

  <div class="seccion">
   <h2>Resumen</h2>

   <div class="total-linea">
    <span>Productos</span>
    <span>$${calcularSubtotal().toFixed(2)}</span>
   </div>

   <div class="total-linea">
    <span>Delivery</span>
    <span>$${calcularDelivery().toFixed(2)}</span>
   </div>

   <div class="total-final">
    <span>Total</span>
    <span>$${calcularTotal().toFixed(2)}</span>
   </div>
  </div>

  <div class="seccion">
   <h2>Datos de entrega</h2>

   <div class="campo">
    <label for="cliente">Nombre</label>
    <input id="cliente" placeholder="Tu nombre">
   </div>

   <div class="campo">
    <label for="telefono">Teléfono</label>
    <input id="telefono" type="tel" placeholder="Tu número de teléfono">
   </div>

   <div class="campo">
    <label for="direccion">Dirección</label>
    <input id="direccion" placeholder="Calle, sector, número de casa">
    <div class="ubicacion">
     <button onclick="obtenerUbicacion()">
      📍 Usar mi ubicación
     </button>
    </div>
   </div>

   <div class="campo">
    <label for="referencia">Referencia</label>
    <textarea id="referencia" placeholder="Ej.: casa de color azul, junto a..."></textarea>
   </div>

   <div id="aviso"></div>

   <button class="btn-pedido" id="btnPedido" onclick="realizarPedido()">
    Confirmar pedido por WhatsApp
   </button>
  </div>
 `;
}

function cambiarCantidad(productoId,cambio){
 const item=carrito.find(
  p=>Number(p.producto_id)===Number(productoId)
 );

 if(!item)return;

 item.cantidad=(Number(item.cantidad)||0)+cambio;

 if(item.cantidad<=0){
  carrito=carrito.filter(
   p=>Number(p.producto_id)!==Number(productoId)
  );
 }

 guardarCarrito();
 render();
}

function eliminarProducto(productoId){
 carrito=carrito.filter(
  p=>Number(p.producto_id)!==Number(productoId)
 );

 guardarCarrito();
 render();
}

function vaciarCarrito(){
 carrito=[];
 guardarCarrito();
 render();
}

function obtenerUbicacion(){
 if(!navigator.geolocation){
  mostrarAviso("Tu navegador no permite obtener la ubicación.");
  return;
 }

 mostrarAviso("Obteniendo ubicación...");

 navigator.geolocation.getCurrentPosition(
  posicion=>{
   const lat=posicion.coords.latitude;
   const lon=posicion.coords.longitude;

   direccion.value=
    `Ubicación GPS: ${lat.toFixed(6)}, ${lon.toFixed(6)}`;

   mostrarAviso("Ubicación agregada correctamente.");
  },
  ()=>{
   mostrarAviso(
    "No se pudo obtener la ubicación. Ingresa la dirección manualmente."
   );
  },
  {
   enableHighAccuracy:true,
   timeout:10000,
   maximumAge:60000
  }
 );
}

function mostrarAviso(texto){
 const aviso=document.getElementById("aviso");
 if(aviso)aviso.innerHTML=`<div class="aviso">${escapeHtml(texto)}</div>`;
}

function generarNumeroPedido(){
 const ahora=Date.now().toString().slice(-6);
 return "SR-"+ahora;
}

function construirCarreras(){
 return agruparCarrito().map(grupo=>({
  restaurante_id:Number(grupo.restaurante_id),
  subtotal:Number(calcularSubtotalGrupo(grupo).toFixed(2)),
  delivery:Number(Number(config.tarifa_delivery||1.50).toFixed(2)),
  total:Number(
   (
    calcularSubtotalGrupo(grupo)+
    Number(config.tarifa_delivery||1.50)
   ).toFixed(2)
  ),
  productos:grupo.productos.map(p=>({
   producto_id:Number(p.producto_id),
   producto_nombre:p.producto_nombre,
   precio_unitario:Number(p.precio)||0,
   cantidad:Number(p.cantidad)||0,
   subtotal:Number(
    (
     (Number(p.precio)||0)*
     (Number(p.cantidad)||0)
    ).toFixed(2)
   )
  }))
 }));
}

async function registrarPedido(numero,cliente,telefono,direccionTexto,referencia){
 const carreras=construirCarreras();

 const payload={
  p_numero:numero,
  p_cliente_nombre:cliente,
  p_cliente_telefono:telefono,
  p_direccion:direccionTexto,
  p_referencia:referencia||null,
  p_total_productos:Number(calcularSubtotal().toFixed(2)),
  p_total_delivery:Number(calcularDelivery().toFixed(2)),
  p_total:Number(calcularTotal().toFixed(2)),
  p_carreras:carreras
 };

 const {data,error}=await supabaseClient.rpc(
  "registrar_pedido_completo",
  payload
 );

 if(error)throw error;

 return data;
}

async function realizarPedido(){
 if(!carrito.length){
  render();
  return;
 }

 const cliente=document.getElementById("cliente").value.trim();
 const telefono=document.getElementById("telefono").value.trim();
 const direccionTexto=document.getElementById("direccion").value.trim();
 const referencia=document.getElementById("referencia").value.trim();
 const boton=document.getElementById("btnPedido");

 if(!cliente||!telefono||!direccionTexto){
  mostrarAviso("Completa nombre, teléfono y dirección.");
  return;
 }

 if(!config.whatsapp_negocio){
  mostrarAviso("No está configurado el WhatsApp del negocio.");
  return;
 }

 boton.disabled=true;
 boton.textContent="Registrando pedido...";

 try{
  const numero=generarNumeroPedido();

  await registrarPedido(
   numero,
   cliente,
   telefono,
   direccionTexto,
   referencia
  );

  boton.textContent="Abriendo WhatsApp...";

  let mensaje=
`*NUEVO PEDIDO - SOBRE RUEDAS*%0A`+
`Pedido: ${numero}%0A`+
`Cliente: ${encodeURIComponent(cliente)}%0A`+
`Teléfono: ${encodeURIComponent(telefono)}%0A`+
`Dirección: ${encodeURIComponent(direccionTexto)}%0A`;

  if(referencia){
   mensaje+=
    `Referencia: ${encodeURIComponent(referencia)}%0A`;
  }

  mensaje+=`%0A*DETALLE DEL PEDIDO*%0A`;

  agruparCarrito().forEach(grupo=>{
   mensaje+=
    `%0A*${encodeURIComponent(grupo.restaurante_nombre)}*%0A`;

   grupo.productos.forEach(p=>{
    const cantidad=Number(p.cantidad)||0;
    const precio=Number(p.precio)||0;
    const subtotal=cantidad*precio;

    mensaje+=
     `${cantidad} x ${encodeURIComponent(p.producto_nombre)} `+
     `- $${subtotal.toFixed(2)}%0A`;
   });

   mensaje+=
    `Subtotal: $${calcularSubtotalGrupo(grupo).toFixed(2)}%0A`;
   mensaje+=
    `Delivery: $${Number(config.tarifa_delivery||1.50).toFixed(2)}%0A`;
  });

  mensaje+=
   `%0A*TOTAL: $${calcularTotal().toFixed(2)}*`;

  const telefonoWhatsApp=
   String(config.whatsapp_negocio).replace(/\D/g,"");

  const url=
   "https://wa.me/"+
   telefonoWhatsApp+
   "?text="+
   mensaje;

  guardarCarrito();
  localStorage.removeItem("carrito");

  location.href=url;

 }catch(e){
  console.error(e);

  boton.disabled=false;
  boton.textContent="Confirmar pedido por WhatsApp";

  mostrarAviso(
   "No se pudo registrar el pedido. Verifica tu conexión e inténtalo nuevamente."
  );
 }
}

async function iniciar(){
 cargarCarrito();

 if(!carrito.length){
  render();
  return;
 }

 await cargarConfig();
 render();
}

iniciar();
</script>

</body>
</html>
