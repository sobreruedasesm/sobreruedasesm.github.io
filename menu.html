```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mi pedido - Sobre Ruedas</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    background: #111827;
    color: white;
    padding: 18px 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #22c55e;
}

.back-button {
    background: white;
    color: #111827;
    border: none;

    padding: 10px 15px;

    border-radius: 20px;

    font-weight: bold;

    cursor: pointer;
}

.container {
    max-width: 800px;
    margin: 30px auto;
    padding: 0 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 20px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.08);
}

h1 {
    margin-bottom: 20px;
}

h2 {
    margin-bottom: 20px;
}

.restaurante-pedido {
    background: #f0fdf4;
    color: #166534;

    padding: 12px;

    border-radius: 8px;

    margin-bottom: 15px;

    font-weight: bold;
}

.producto {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 15px 0;

    border-bottom: 1px solid #eee;

    gap: 15px;
}

.producto-info {
    flex: 1;
}

.producto-info strong {
    display: block;
    margin-bottom: 5px;
}

.producto-info span {
    color: #16a34a;
    font-weight: bold;
}

.controles {
    display: flex;
    align-items: center;
    gap: 8px;
}

.controles button {

    width: 32px;
    height: 32px;

    border: none;

    border-radius: 50%;

    background: #e5e7eb;

    cursor: pointer;

    font-weight: bold;
}

.controles .eliminar {

    color: #dc2626;

    background: white;

    font-size: 18px;
}

.total {

    display: flex;

    justify-content: space-between;

    font-size: 22px;

    font-weight: bold;

    margin-top: 20px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    display: block;

    font-weight: bold;

    margin-bottom: 7px;
}

input,
textarea {

    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.btn {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background: #22c55e;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

.btn:hover {
    background: #16a34a;
}

.vacio {
    text-align: center;
    padding: 30px;
    color: #666;
}

.exito {
    display: none;
    text-align: center;
    padding: 30px;
}

.exito-icon {
    font-size: 60px;
    margin-bottom: 15px;
}

.numero-pedido {
    font-size: 24px;
    font-weight: bold;

    color: #16a34a;

    margin: 15px 0;
}

.whatsapp {
    background: #25D366;
    margin-top: 15px;
}

.volver {
    background: #111827;
    margin-top: 10px;
}

@media(max-width:600px) {

    header {
        padding: 15px;
    }

    .logo {
        font-size: 20px;
    }

    .producto {
        flex-wrap: wrap;
    }

}

</style>

</head>

<body>


<header>

    <div class="logo">

        🛵 <span>Sobre</span> Ruedas

    </div>


    <button
        class="back-button"
        onclick="seguirComprando()"
    >

        ← Seguir comprando

    </button>

</header>



<div class="container">


    <h1>
        🛒 Mi pedido
    </h1>


    <!-- CARRITO -->

    <div
        class="card"
        id="carritoCard"
    >

        <h2>
            Productos
        </h2>


        <div
            id="productosCarrito"
        >
        </div>


        <div class="total">

            <span>
                Total
            </span>

            <span>
                $<span id="total">0.00</span>
            </span>

        </div>

    </div>



    <!-- FORMULARIO -->

    <div
        class="card"
        id="formularioCard"
    >

        <h2>
            📍 Datos de entrega
        </h2>


        <div class="form-group">

            <label>
                Nombre
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Ej: Juan Pérez"
            >

        </div>


        <div class="form-group">

            <label>
                Teléfono
            </label>

            <input
                type="tel"
                id="telefono"
                placeholder="Ej: 0987654321"
            >

        </div>


        <div class="form-group">

            <label>
                Dirección de entrega
            </label>

            <textarea
                id="direccion"
                placeholder="Calle, número de casa, sector..."
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                Referencia
            </label>

            <input
                type="text"
                id="referencia"
                placeholder="Ej: Casa azul junto a..."
            >

        </div>


        <button
            class="btn"
            onclick="confirmarPedido()"
        >

            🛵 Confirmar pedido

        </button>

    </div>



    <!-- ÉXITO -->

    <div
        class="card exito"
        id="exito"
    >

        <div class="exito-icon">
            ✅
        </div>


        <h2>
            ¡Pedido recibido!
        </h2>


        <p>
            Tu pedido fue registrado correctamente.
        </p>


        <div class="numero-pedido">

            Pedido #
            <span id="numeroPedido"></span>

        </div>


        <p>
            Ahora puedes enviarlo por WhatsApp
            a Sobre Ruedas.
        </p>


        <button
            class="btn whatsapp"
            onclick="enviarWhatsApp()"
        >

            📱 Enviar pedido por WhatsApp

        </button>


        <button
            class="btn volver"
            onclick="window.location.href='index.html'"
        >

            🏠 Volver al inicio

        </button>

    </div>

</div>



<script>


let carrito =
    JSON.parse(
        localStorage.getItem("carrito")
    ) || [];



function mostrarCarrito() {

    const contenedor =
        document.getElementById(
            "productosCarrito"
        );


    contenedor.innerHTML = "";


    if (carrito.length === 0) {

        contenedor.innerHTML = `

            <div class="vacio">

                🛒 Tu carrito está vacío.

                <br><br>

                <button
                    class="btn"
                    onclick="seguirComprando()"
                >

                    Buscar restaurantes

                </button>

            </div>

        `;

        document.getElementById(
            "total"
        ).textContent = "0.00";

        return;
    }


    const restaurante =
        carrito[0].restaurante ||
        "Restaurante";


    const nombreRestaurante =
        document.createElement("div");


    nombreRestaurante.className =
        "restaurante-pedido";


    nombreRestaurante.textContent =
        "🏪 " + restaurante;


    contenedor.appendChild(
        nombreRestaurante
    );


    carrito.forEach(
        function(producto, index) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "producto";


            const subtotal =
                producto.precio *
                producto.cantidad;


            div.innerHTML = `

                <div class="producto-info">

                    <strong>
                        ${producto.nombre}
                    </strong>

                    <span>
                        $${producto.precio.toFixed(2)}
                    </span>

                </div>


                <div class="controles">

                    <button
                        onclick="cambiarCantidad(
                            ${index},
                            -1
                        )"
                    >
                        −
                    </button>

                    <strong>
                        ${producto.cantidad}
                    </strong>

                    <button
                        onclick="cambiarCantidad(
                            ${index},
                            1
                        )"
                    >
                        +
                    </button>

                    <button
                        class="eliminar"
                        onclick="eliminarProducto(
                            ${index}
                        )"
                    >
                        ✕
                    </button>

                </div>


                <div>

                    $${subtotal.toFixed(2)}

                </div>

            `;


            contenedor.appendChild(
                div
            );

        }
    );


    calcularTotal();

}



function cambiarCantidad(
    index,
    cambio
) {

    carrito[index].cantidad +=
        cambio;


    if (
        carrito[index].cantidad <= 0
    ) {

        carrito.splice(index, 1);

    }


    guardar();

    mostrarCarrito();

}



function eliminarProducto(index) {

    carrito.splice(index, 1);

    guardar();

    mostrarCarrito();

}



function guardar() {

    localStorage.setItem(
        "carrito",
        JSON.stringify(carrito)
    );

}



function calcularTotal() {

    let total = 0;


    carrito.forEach(
        function(producto) {

            total +=
                producto.precio *
                producto.cantidad;

        }
    );


    document.getElementById(
        "total"
    ).textContent =
        total.toFixed(2);


    return total;

}



function confirmarPedido() {

    if (carrito.length === 0) {

        alert(
            "Tu carrito está vacío."
        );

        return;
    }


    const nombre =
        document
        .getElementById("nombre")
        .value.trim();


    const telefono =
        document
        .getElementById("telefono")
        .value.trim();


    const direccion =
        document
        .getElementById("direccion")
        .value.trim();


    const referencia =
        document
        .getElementById("referencia")
        .value.trim();


    if (
        !nombre ||
        !telefono ||
        !direccion
    ) {

        alert(
            "Completa nombre, teléfono y dirección."
        );

        return;
    }


    const total =
        calcularTotal();


    const restaurante =
        carrito[0].restaurante ||
        "Restaurante";


    const numero =
        "SR-" +
        Date.now()
        .toString()
        .slice(-6);


    const pedido = {

        numero: numero,

        restaurante: restaurante,

        cliente: {

            nombre: nombre,

            telefono: telefono,

            direccion: direccion,

            referencia: referencia

        },

        productos: carrito,

        total: total,

        fecha:
            new Date()
            .toLocaleString("es-EC")

    };


    localStorage.setItem(
        "ultimoPedido",
        JSON.stringify(pedido)
    );


    document.getElementById(
        "numeroPedido"
    ).textContent =
        numero;


    document.getElementById(
        "formularioCard"
    ).style.display =
        "none";


    document.getElementById(
        "carritoCard"
    ).style.display =
        "none";


    document.getElementById(
        "exito"
    ).style.display =
        "block";

}



function enviarWhatsApp() {

    const pedido =
        JSON.parse(
            localStorage.getItem(
                "ultimoPedido"
            )
        );


    if (!pedido) {
        return;
    }


    let mensaje =
        "Hola, Sobre Ruedas.%0A%0A";


    mensaje +=
        "🛵 PEDIDO " +
        pedido.numero +
        "%0A%0A";


    mensaje +=
        "🏪 Restaurante: " +
        pedido.restaurante +
        "%0A";


    mensaje +=
        "👤 Cliente: " +
        pedido.cliente.nombre +
        "%0A";


    mensaje +=
        "📱 Teléfono: " +
        pedido.cliente.telefono +
        "%0A";


    mensaje +=
        "📍 Dirección: " +
        pedido.cliente.direccion +
        "%0A";


    if (
        pedido.cliente.referencia
    ) {

        mensaje +=
            "📝 Referencia: " +
            pedido.cliente.referencia +
            "%0A";

    }


    mensaje +=
        "%0A🍔 PRODUCTOS%0A";


    pedido.productos.forEach(
        function(producto) {

            mensaje +=

                producto.cantidad +
                " x " +
                producto.nombre +
                " - $" +
                (
                    producto.precio *
                    producto.cantidad
                ).toFixed(2) +
                "%0A";

        }
    );


    mensaje +=
        "%0A💰 TOTAL: $" +
        pedido.total.toFixed(2);


    const numeroSobreRuedas =
        "593985459479";


    window.open(

        "https://wa.me/" +
        numeroSobreRuedas +
        "?text=" +
        mensaje,

        "_blank"

    );

}



function seguirComprando() {

    window.location.href =
        "index.html";

}


mostrarCarrito();

</script>

</body>

</html>
```
