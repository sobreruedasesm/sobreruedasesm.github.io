 button{

<script src="supabase.js"></script>

<script>

const BUCKET="restaurantes";
const $=id=>document.getElementById(id);

const mensaje=$("mensaje");
const nombreNegocio=$("nombreNegocio");
const ciudad=$("ciudad");
const tarifaDelivery=$("tarifaDelivery");
const whatsappNegocio=$("whatsappNegocio");
const nuevaCategoria=$("nuevaCategoria");
const listaCategorias=$("listaCategorias");
const nuevoNombre=$("nuevoNombre");
const nuevoCategoria=$("nuevoCategoria");
const nuevoDescripcion=$("nuevoDescripcion");
const nuevoBanner=$("nuevoBanner");
const previewNuevo=$("previewNuevo");
const productosNuevosEl=$("productosNuevos");
const listaLocales=$("listaLocales");
const edicion=$("edicion");
const editId=$("editId");
const editNombre=$("editNombre");
const editCategoria=$("editCategoria");
const editDescripcion=$("editDescripcion");
const editActivo=$("editActivo");
const editBanner=$("editBanner");
const previewEdit=$("previewEdit");
const bannerActual=$("bannerActual");
const productosEditEl=$("productosEdit");

let categorias=[];
let locales=[];
let productosEdit=[];
let productosNuevos=[];
let bannerEdicionActual="";

const dias=[
 "Domingo",
 "Lunes",
 "Martes",
 "Miércoles",
 "Jueves",
 "Viernes",
 "Sábado"
];

function escapeHtml(v=""){
 return String(v).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function mostrarMensaje(texto,exito=false){
 mensaje.innerHTML=
  `<div class="mensaje ${exito?"exito":""}">
   ${escapeHtml(texto)}
  </div>`;

 setTimeout(()=>mensaje.innerHTML="",4000);
}

function cacheUrl(url){
 if(!url)return "";
 return url+(url.includes("?")?"&":"?")+"v="+Date.now();
}

function extensionArchivo(nombre=""){
 const p=nombre.toLowerCase().split(".");
 return p.length>1?p.pop():"jpg";
}

async function subirImagen(archivo,idLocal){
 if(!archivo)return null;

 const ruta=
  `banners/${idLocal}/${Date.now()}-${crypto.randomUUID()}.${extensionArchivo(archivo.name)}`;

 const {error}=await supabaseClient.storage
  .from(BUCKET)
  .upload(ruta,archivo,{
   cacheControl:"3600",
   upsert:false,
   contentType:archivo.type||"image/jpeg"
  });

 if(error)throw error;

 const {data}=supabaseClient.storage
  .from(BUCKET)
  .getPublicUrl(ruta);

 if(!data?.publicUrl)
  throw new Error("No se pudo obtener la URL pública.");

 return data.publicUrl;
}

function previsualizarArchivo(input,id){
 const archivo=input.files?.[0];
 const img=$(id);

 if(!archivo){
  img.style.display="none";
  img.removeAttribute("src");
  return;
 }

 img.src=URL.createObjectURL(archivo);
 img.style.display="block";
}

/* CONFIGURACIÓN */

async function cargarConfiguracion(){
 try{

  let data=null;

  const r=await supabaseClient
   .from("configuracion_negocio")
   .select("*")
   .order("id",{ascending:true})
   .limit(1);

  if(r.error)throw r.error;

  if(r.data?.length)
   data=r.data[0];

  nombreNegocio.value=
   data?.nombre_negocio||
   window.CONFIG?.nombreNegocio||
   "Sobre Ruedas";

  ciudad.value=
   data?.ciudad||
   window.CONFIG?.ciudad||
   "Esmeraldas";

  tarifaDelivery.value=
   data?.tarifa_delivery??
   window.CONFIG?.tarifaDelivery??
   1.50;

  whatsappNegocio.value=
   data?.whatsapp_negocio||
   window.CONFIG?.whatsappNegocio||
   "";

 }catch(e){

  console.error(e);

  nombreNegocio.value=window.CONFIG?.nombreNegocio||"Sobre Ruedas";
  ciudad.value=window.CONFIG?.ciudad||"Esmeraldas";
  tarifaDelivery.value=window.CONFIG?.tarifaDelivery??1.50;
  whatsappNegocio.value=window.CONFIG?.whatsappNegocio||"";

 }
}

async function guardarConfiguracion(){

 try{

  const registro={
   nombre_negocio:nombreNegocio.value.trim()||"Sobre Ruedas",
   ciudad:ciudad.value.trim()||"Esmeraldas",
   tarifa_delivery:Number(tarifaDelivery.value)||0,
   whatsapp_negocio:whatsappNegocio.value.trim(),
   moneda:"USD",
   actualizado_en:new Date().toISOString()
  };

  const {data,error}=await supabaseClient
   .from("configuracion_negocio")
   .select("id")
   .order("id",{ascending:true})
   .limit(1);

  if(error)throw error;

  let errorGuardar;

  if(data?.length){

   ({error:errorGuardar}=await supabaseClient
    .from("configuracion_negocio")
    .update(registro)
    .eq("id",data[0].id));

  }else{

   ({error:errorGuardar}=await supabaseClient
    .from("configuracion_negocio")
    .insert(registro));

  }

  if(errorGuardar)throw errorGuardar;

  mostrarMensaje("Configuración guardada.",true);

 }catch(e){

  console.error(e);
  mostrarMensaje("No se pudo guardar la configuración: "+e.message);

 }
}

/* CATEGORÍAS */

async function cargarCategorias(){

 try{

  const {data,error}=await supabaseClient
   .from("categorias")
   .select("*")
   .order("nombre");

  if(error)throw error;

  categorias=data||[];

  renderCategorias();
  cargarSelectCategorias();

 }catch(e){

  console.error(e);

  categorias=[];
  renderCategorias();
  cargarSelectCategorias();

  mostrarMensaje("No se pudieron cargar las categorías: "+e.message);

 }
}

function renderCategorias(){

 if(!categorias.length){

  listaCategorias.innerHTML=
   `<div class="vacio">No hay categorías registradas.</div>`;

  return;
 }

 listaCategorias.innerHTML=categorias.map(c=>`

  <div class="card">

   <strong>${escapeHtml(c.nombre)}</strong>

   <span class="estado ${c.activo?"activo":"inactivo"}">
    ${c.activo?"● Activa":"● Inactiva"}
   </span>

   <div class="acciones">

    <button class="gray"
     onclick="editarCategoria(${c.id})">
     Editar
    </button>

    <button class="${c.activo?"warning":"sec"}"
     onclick="cambiarEstadoCategoria(${c.id},${!c.activo})">
     ${c.activo?"Desactivar":"Activar"}
    </button>

    <button class="danger"
     onclick="eliminarCategoria(${c.id})">
     Eliminar
    </button>

   </div>

  </div>

 `).join("");
}

function cargarSelectCategorias(){

 const opciones=
  '<option value="">Seleccionar categoría</option>'+
  categorias
   .filter(c=>c.activo)
   .map(c=>`
    <option value="${escapeHtml(c.nombre)}">
     ${escapeHtml(c.nombre)}
    </option>
   `).join("");

 nuevoCategoria.innerHTML=opciones;
 editCategoria.innerHTML=opciones;
}

async function crearCategoria(){

 const nombre=nuevaCategoria.value.trim();

 if(!nombre){
  mostrarMensaje("Ingresa el nombre de la categoría.");
  return;
 }

 try{

  const existe=categorias.some(c=>
   c.nombre.trim().toLowerCase()===nombre.toLowerCase()
  );

  if(existe){
   mostrarMensaje("La categoría ya existe.");
   return;
  }

  const {error}=await supabaseClient
   .from("categorias")
   .insert({
    nombre,
    activo:true
   });

  if(error)throw error;

  nuevaCategoria.value="";

  await cargarCategorias();

  mostrarMensaje("Categoría creada.",true);

 }catch(e){

  console.error(e);
  mostrarMensaje("No se pudo crear la categoría: "+e.message);

 }
}

async function editarCategoria(id){

 const categoria=categorias.find(c=>Number(c.id)===Number(id));

 if(!categoria)return;

 const nuevo=prompt(
  "Nombre de la categoría:",
  categoria.nombre
 );

 if(nuevo===null)return;

 const nombre=nuevo.trim();

 if(!nombre){
  mostrarMensaje("El nombre no puede quedar vacío.");
  return;
 }

 try{

  const existe=categorias.some(c=>
   Number(c.id)!==Number(id)&&
   c.nombre.trim().toLowerCase()===nombre.toLowerCase()
  );

  if(existe){
   mostrarMensaje("Ya existe otra categoría con ese nombre.");
   return;
  }

  const {error}=await supabaseClient
   .from("categorias")
   .update({nombre})
   .eq("id",id);

  if(error)throw error;

  /*
   Actualizamos también los locales que tenían
   la categoría anterior.
  */

  if(categoria.nombre!==nombre){

   const {error:errorLocales}=await supabaseClient
    .from("restaurantes")
    .update({categoria:nombre})
    .eq("categoria",categoria.nombre);

   if(errorLocales)throw errorLocales;
  }

  await cargarCategorias();
  await cargarLocales();

  mostrarMensaje("Categoría actualizada.",true);

 }catch(e){

  console.error(e);
  mostrarMensaje("No se pudo actualizar la categoría: "+e.message);

 }
}

async function cambiarEstadoCategoria(id,activo){

 try{

  const {error}=await supabaseClient
   .from("categorias")
   .update({activo})
   .eq("id",id);

  if(error)throw error;

  await cargarCategorias();

  mostrarMensaje(
   activo?"Categoría activada.":"Categoría desactivada.",
   true
  );

 }catch(e){

  console.error(e);
  mostrarMensaje("No se pudo cambiar el estado: "+e.message);

 }
}

async function eliminarCategoria(id){

 const categoria=categorias.find(c=>Number(c.id)===Number(id));

 if(!categoria)return;

 const usada=locales.some(l=>
  String(l.categoria||"").trim().toLowerCase()===
  String(categoria.nombre).trim().toLowerCase()
 );

 if(usada){

  if(!confirm(
   `La categoría "${categoria.nombre}" está siendo utilizada por uno o más locales.\n\n`+
   "Si la eliminas, esos locales quedarán sin categoría.\n\n"+
   "¿Deseas continuar?"
  ))return;

  try{

   const {error:errorLocales}=await supabaseClient
    .from("restaurantes")
    .update({categoria:null})
    .eq("categoria",categoria.nombre);

   if(errorLocales)throw errorLocales;

  }catch(e){

   console.error(e);
   mostrarMensaje("No se pudo quitar la categoría de los locales: "+e.message);
   return;
  }
 }

 if(!confirm(
  `¿Eliminar definitivamente la categoría "${categoria.nombre}"?`
 ))return;

 try{

  const {error}=await supabaseClient
   .from("categorias")
   .delete()
   .eq("id",id);

  if(error)throw error;

  await cargarCategorias();
  await cargarLocales();

  mostrarMensaje("Categoría eliminada.",true);

 }catch(e){

  console.error(e);
  mostrarMensaje("No se pudo eliminar la categoría: "+e.message);

 }
}

/* HORARIOS */

function renderHorarios(contenedorId,datos=[]){

 const cont=$(contenedorId);
 const mapa={};

 datos.forEach(h=>mapa[h.dia_semana]=h);

 cont.innerHTML=dias.map((dia,i)=>{

  const h=mapa[i]||{
   cerrado:false,
   hora_apertura:"10:00",
   hora_cierre:"22:00"
  };

  return `
   <div class="dia">

    <strong>${dia}</strong>

    <label class="check">
     <input
      type="checkbox"
      id="${contenedorId}_cerrado_${i}"
      ${h.cerrado?"checked":""}>
     Cerrado
    </label>

    <input
     type="time"
     id="${contenedorId}_apertura_${i}"
     value="${h.hora_apertura||"10:00"}"
     style="margin-top:7px">

    <input
     type="time"
     id="${contenedorId}_cierre_${i}"
     value="${h.hora_cierre||"22:00"}"
     style="margin-top:7px">

   </div>
  `;

 }).join("");
}

function leerHorarios(contenedorId){

 return dias.map((_,i)=>({

  dia_semana:i,

  hora_apertura:
   $(`${contenedorId}_apertura_${i}`).value||null,

  hora_cierre:
   $(`${contenedorId}_cierre_${i}`).value||null,

  cerrado:
   $(`${contenedorId}_cerrado_${i}`).checked

 }));

}

/* PRODUCTOS */

function renderProductosNuevos(){

 productosNuevosEl.innerHTML=
  productosNuevos.map((p,i)=>`

   <div class="producto-row">

    <input
     placeholder="Nombre del producto"
     value="${escapeHtml(p.nombre||"")}"
     oninput="productosNuevos[${i}].nombre=this.value">

    <input
     type="number"
     step="0.01"
     min="0"
     placeholder="Precio"
     value="${p.precio??""}"
     oninput="productosNuevos[${i}].precio=this.value">

    <button
     class="danger"
     onclick="eliminarProductoNuevo(${i})">
     Eliminar
    </button>

   </div>

  `).join("");
}

function agregarProductoNuevo(){

 productosNuevos.push({
  nombre:"",
  precio:""
 });

 renderProductosNuevos();
}

function eliminarProductoNuevo(i){

 productosNuevos.splice(i,1);

 renderProductosNuevos();
}

function renderProductosEdit(){

 productosEditEl.innerHTML=
  productosEdit.map((p,i)=>`

   <div class="card" style="margin-bottom:8px">

    <div class="producto-row">

     <input
      placeholder="Nombre"
      value="${escapeHtml(p.nombre||"")}"
      oninput="productosEdit[${i}].nombre=this.value">

     <input
      type="number"
      step="0.01"
      min="0"
      placeholder="Precio"
      value="${p.precio??""}"
      oninput="productosEdit[${i}].precio=this.value">

     <button

     <input
      type="checkbox"

   </div>

  `).join("");
}

function agregarProductoEdit(){

 productosEdit.push({
  nombre:"",

  _nuevo:true
 });

 renderProductosEdit();
}

function eliminarProductoEdit(i){

 if(productosEdit[i]._nuevo)
  productosEdit.splice(i,1);
 else
  productosEdit[i].activo=false;

 renderProductosEdit();

/* CREAR LOCAL */

async function crearLocal(){

 try{

  const nombre=nuevoNombre.value.trim();

  if(!nombre){
   mostrarMensaje("Ingresa el nombre del local.");
   return;
  }

  if(!nuevoCategoria.value){
   mostrarMensaje("Selecciona una categoría.");
   return;
  }

  const {data,error}=await supabaseClient
   .from("restaurantes")
   .insert({
    nombre,
    categoria:nuevoCategoria.value,
    descripcion:nuevoDescripcion.value.trim(),
    activo:true
   })
   .select()
   .single();

  if(error)throw error;

  const archivo=nuevoBanner.files?.[0];

  if(archivo){

   try{

    const bannerUrl=await subirImagen(archivo,data.id);

    const {error:errorBanner}=await supabaseClient
     .from("restaurantes")
     .update({banner_url:bannerUrl})
     .eq("id",data.id);

    if(errorBanner)throw errorBanner;

   }catch(e){

    await supabaseClient
     .from("restaurantes")
     .delete()
     .eq("id",data.id);

    throw new Error("No se pudo subir el banner: "+e.message);
   }
  }

  const horariosData=leerHorarios("horariosNuevo");

  const {error:errorHorarios}=await supabaseClient
   .from("horarios_restaurantes")
   .upsert(
    horariosData.map(h=>({
     restaurante_id:data.id,
     ...h
    })),
    {onConflict:"restaurante_id,dia_semana"}
   );

  if(errorHorarios)throw errorHorarios;

  const productosValidos=
   productosNuevos
    .filter(p=>p.nombre.trim()&&Number(p.precio)>=0)
    .map(p=>({
     restaurante_id:data.id,
     nombre:p.nombre.trim(),
     precio:Number(p.precio)||0,
     activo:true
    }));

  if(productosValidos.length){

   const {error:errorProductos}=await supabaseClient
    .from("productos")
    .insert(productosValidos);

   if(errorProductos)throw errorProductos;
  }

  nuevoNombre.value="";
  nuevoCategoria.value="";
  nuevoDescripcion.value="";
  nuevoBanner.value="";

  previewNuevo.style.display="none";
  previewNuevo.removeAttribute("src");

  productosNuevos=[];

  renderProductosNuevos();
  renderHorarios("horariosNuevo");

  await cargarLocales();

  mostrarMensaje("Local creado correctamente.",true);

 }catch(e){

  console.error(e);

  mostrarMensaje(
   "No se pudo crear el local: "+e.message
  );

 }
}

/* LOCALES */

async function cargarLocales(){

 try{

  const {data,error}=await supabaseClient
   .from("restaurantes")
   .select("*")
   .order("nombre");

  if(error)throw error;

  locales=data||[];

  listaLocales.innerHTML=locales.length
   ? locales.map(l=>`

    <div class="card">

     ${l.banner_url?`
      <img
       class="banner"
       src="${escapeHtml(cacheUrl(l.banner_url))}"
       alt="${escapeHtml(l.nombre)}"
       onerror="this.style.display='none'">
     `:""}

     <h3>${escapeHtml(l.nombre)}</h3>

     <p>
      <strong>Categoría:</strong>
      ${escapeHtml(l.categoria||"Sin categoría")}
     </p>

     <p>${escapeHtml(l.descripcion||"")}</p>

     <span class="estado ${l.activo?"activo":"inactivo"}">
      ${l.activo?"● Activo":"● Inactivo"}
     </span>

     <div class="acciones">

      <button onclick="abrirEdicion(${l.id})">
       Editar
      </button>

      <button
       class="${l.activo?"warning":"sec"}"
       onclick="cambiarEstadoLocal(${l.id},${!l.activo})">
       ${l.activo?"Desactivar":"Activar"}
      </button>

      <button
       class="danger"
       onclick="eliminarLocal(${l.id})">
       Eliminar
      </button>

     </div>

    </div>

   `).join("")
   :
   `<div class="vacio">No hay locales registrados.</div>`;

 }catch(e){

  console.error(e);

  listaLocales.innerHTML=
   `<div class="mensaje">
    No se pudieron cargar los locales:
    ${escapeHtml(e.message)}
   </div>`;

 }
}

async function abrirEdicion(id){

 try{

  const local=locales.find(
   l=>Number(l.id)===Number(id)
  );

  if(!local)return;

  editId.value=local.id;
  editNombre.value=local.nombre||"";
  editCategoria.value=local.categoria||"";
  editDescripcion.value=local.descripcion||"";
  editActivo.value=String(local.activo!==false);

  bannerEdicionActual=local.banner_url||"";

  editBanner.value="";
  previewEdit.style.display="none";
  previewEdit.removeAttribute("src");

  bannerActual.innerHTML=local.banner_url
   ? `
    <p style="color:#aab7b1;font-size:13px;font-weight:600">
     Banner actual
    </p>

    <img
     class="banner"
     src="${escapeHtml(cacheUrl(local.banner_url))}"
     onerror="this.style.display='none'">
   `
   :
   `<p style="color:#91a09a;font-size:13px">
    Este local no tiene banner.
   </p>`;

  const {data:horariosData,error:errorHorarios}=
   await supabaseClient
    .from("horarios_restaurantes")
    .select("*")
    .eq("restaurante_id",id)
    .order("dia_semana");

  if(errorHorarios)throw errorHorarios;

  renderHorarios(
   "horariosEdit",
   horariosData||[]
  );

  const {data:productos,error:errorProductos}=
   await supabaseClient
    .from("productos")
    .select("*")
    .eq("restaurante_id",id)
    .order("nombre");

  if(errorProductos)throw errorProductos;

  productosEdit=(productos||[]).map(p=>({
   ...p,
   _nuevo:false
  }));

  renderProductosEdit();

  edicion.classList.remove("oculto");

  edicion.scrollIntoView({
   behavior:"smooth",
   block:"start"
  });

 }catch(e){

  console.error(e);

  mostrarMensaje(
   "No se pudo cargar el local: "+e.message
  );

 }
}

async function guardarEdicion(){

 try{

  const id=Number(editId.value);

  if(!id)return;

  if(!editNombre.value.trim()){
   mostrarMensaje("Ingresa el nombre del local.");
   return;
  }

  let bannerUrl=bannerEdicionActual;

  const archivo=editBanner.files?.[0];

  /*
   IMPORTANTE:
   Solo se intenta subir una imagen
   cuando realmente se seleccionó una nueva.
  */

  if(archivo)
   bannerUrl=await subirImagen(archivo,id);

  const {error}=await supabaseClient
   .from("restaurantes")
   .update({
    nombre:editNombre.value.trim(),
    categoria:editCategoria.value||null,
    descripcion:editDescripcion.value.trim(),
    activo:editActivo.value==="true",
    banner_url:bannerUrl||null
   })
   .eq("id",id);

  if(error)throw error;

  const horariosData=leerHorarios("horariosEdit");

  const {error:errorHorarios}=await supabaseClient
   .from("horarios_restaurantes")
   .upsert(
    horariosData.map(h=>({
     restaurante_id:id,
     ...h
    })),
    {onConflict:"restaurante_id,dia_semana"}
   );

  if(errorHorarios)throw errorHorarios;

  for(const p of productosEdit.filter(p=>!p._nuevo)){

   if(!p.nombre?.trim())continue;

   const {error:errorProducto}=await supabaseClient
    .from("productos")
    .update({
     nombre:p.nombre.trim(),
     precio:Number(p.precio)||0,
     activo:p.activo!==false
    })
    .eq("id",p.id);

   if(errorProducto)throw errorProducto;
  }

  const nuevos=
   productosEdit
    .filter(p=>p._nuevo&&p.nombre.trim())
    .map(p=>({
     restaurante_id:id,
     nombre:p.nombre.trim(),
     precio:Number(p.precio)||0,
     activo:true
    }));

  if(nuevos.length){

   const {error:errorNuevos}=await supabaseClient
    .from("productos")
    .insert(nuevos);

   if(errorNuevos)throw errorNuevos;
  }

  await cargarLocales();

  cerrarEdicion();

  mostrarMensaje(
   "Local actualizado correctamente.",
   true
  );

 }catch(e){

  console.error(e);

  mostrarMensaje(
   "No se pudo actualizar el local: "+e.message
  );

 }
}

function cerrarEdicion(){

 edicion.classList.add("oculto");

 bannerEdicionActual="";
 productosEdit=[];

 editBanner.value="";

 previewEdit.style.display="none";
 previewEdit.removeAttribute("src");

 bannerActual.innerHTML="";
}

async function cambiarEstadoLocal(id,activo){

 try{

  const {error}=await supabaseClient
   .from("restaurantes")
   .update({activo})
   .eq("id",id);

  if(error)throw error;

  await cargarLocales();

  mostrarMensaje(
   activo?"Local activado.":"Local desactivado.",
   true
  );

 }catch(e){

  console.error(e);

  mostrarMensaje(
   "No se pudo cambiar el estado: "+e.message
  );

 }
}

async function eliminarLocal(id){

 const local=locales.find(
  l=>Number(l.id)===Number(id)
 );

 if(!local)return;

 if(!confirm(
  `¿Eliminar definitivamente el local "${local.nombre}"?\n\n`+
  "También se eliminarán sus productos y horarios."
 ))return;

 try{

  const {error:errorProductos}=await supabaseClient
   .from("productos")
   .delete()
   .eq("restaurante_id",id);

  if(errorProductos)throw errorProductos;

  const {error:errorHorarios}=await supabaseClient
   .from("horarios_restaurantes")
   .delete()
   .eq("restaurante_id",id);

  if(errorHorarios)throw errorHorarios;

  const {error}=await supabaseClient
   .from("restaurantes")
   .delete()
   .eq("id",id);

  if(error)throw error;

  await cargarLocales();

  mostrarMensaje("Local eliminado.",true);

 }catch(e){

  console.error(e);

  mostrarMensaje(
   "No se pudo eliminar el local: "+e.message
  );

 }
}

 ]);

}
