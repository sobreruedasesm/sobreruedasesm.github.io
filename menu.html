            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"

    );

    $("mensaje").innerHTML = `

    `;
}

   ========================================================= */

function guardarDatosFormulario() {

    const nombre = $("clienteNombre");
    const telefono = $("clienteTelefono");
    const direccion = $("direccion");
    const referencia = $("referencia");
    const factura = $("requiereFactura");
    const tipo = $("tipoDocumento");
    const numero = $("numeroDocumento");
    const correo = $("correoFactura");

    if (nombre) {
        datosFormulario.nombre = nombre.value;
    }

    if (telefono) {
        datosFormulario.telefono = telefono.value;
    }

    if (direccion) {
        datosFormulario.direccion = direccion.value;
    }

    if (referencia) {
        datosFormulario.referencia = referencia.value;
    }

    if (factura) {
        datosFormulario.requiereFactura = factura.checked;
    }

    if (tipo) {
        datosFormulario.tipoDocumento = tipo.value;
    }

    if (numero) {
        datosFormulario.numeroDocumento = numero.value;
    }

    if (correo) {
        datosFormulario.correoFactura = correo.value;
    }
}


/* =========================================================
   RESTAURAR DATOS DEL FORMULARIO
   ========================================================= */

function restaurarDatosFormulario() {

    const nombre = $("clienteNombre");
    const telefono = $("clienteTelefono");
    const direccion = $("direccion");
    const referencia = $("referencia");
    const factura = $("requiereFactura");
    const tipo = $("tipoDocumento");
    const numero = $("numeroDocumento");
    const correo = $("correoFactura");

    if (nombre) {
        nombre.value = datosFormulario.nombre || "";
    }

    if (telefono) {
        telefono.value = datosFormulario.telefono || "";
    }

    if (direccion) {

        /*
            Si existe una ubicación seleccionada,
            conservar la dirección de esa ubicación.
        */

        if (ubicacionDireccion) {
            direccion.value = ubicacionDireccion;
        } else {
            direccion.value = datosFormulario.direccion || "";
        }
    }

    if (referencia) {
        referencia.value = datosFormulario.referencia || "";
    }

    if (factura) {
        factura.checked = !!datosFormulario.requiereFactura;
    }

    if (tipo) {
        tipo.value = datosFormulario.tipoDocumento || "Cédula";
    }

    if (numero) {
        numero.value = datosFormulario.numeroDocumento || "";
    }

    if (correo) {
        correo.value = datosFormulario.correoFactura || "";
    }

    mostrarDatosFactura();
}


/* =========================================================
   CARRITO
   ========================================================= */

function cargarCarrito() {

    try {

        const data = JSON.parse(
            localStorage.getItem("carrito") || "[]"
        );

        carrito = Array.isArray(data) ? data : [];

    } catch {

        carrito = [];
    }
}


function guardarCarrito() {

    if (carrito.length) {

        localStorage.setItem(
            "carrito",
            JSON.stringify(carrito)
        );

    } else {

        localStorage.removeItem("carrito");
    }
}


function agruparCarrito() {

    const grupos = {};

    carrito.forEach(item => {

        const id = String(item.restaurante_id);

        if (!grupos[id]) {

            grupos[id] = {

                restaurante_id:item.restaurante_id,

                restaurante_nombre:
                    item.restaurante_nombre ||
                    "Local",

                productos:[]
            };
        }

        grupos[id].productos.push(item);
    });

    return Object.values(grupos);
}


function subtotalGrupo(grupo) {

    return grupo.productos.reduce(
        (total,item) =>
            total +
            (Number(item.precio) || 0) *
            (Number(item.cantidad) || 0),
        0
    );
}

async function cargarConfiguracion() {

                .from("configuracion_negocio")
                .select("*")
                .order("id",{ascending:true})
                .limit(1)
                .maybeSingle();

        if (error) {

            console.warn(
                "Configuración:",
                error
            );

            return;
        }

        if (data) {

            configuracion = {

                nombreNegocio:
                    data.nombre_negocio ||

                ciudad:
                    data.ciudad ||
                    CONFIG_DEFAULT.ciudad,

                tarifaDelivery:

                whatsappNegocio:
                    data.whatsapp_negocio ||

                moneda:
                    data.moneda ||
                    "USD"
            };
        }

    } catch (error) {

        console.warn(
            "Configuración:",
            error
        );
    }
}
