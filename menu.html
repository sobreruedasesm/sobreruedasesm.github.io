<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi pedido | Sobre Ruedas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:bold}
header a{color:#fff;text-decoration:none}
main{max-width:900px;margin:auto;padding:20px}
.bloque{background:#fff;border-radius:10px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
.carrera{border:1px solid #ddd;border-radius:8px;padding:12px;margin-bottom:12px}
.carrera h3{margin:0 0 10px}
.producto{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}
.producto:last-child{border-bottom:0}
.producto-info{flex:1}
.producto-nombre{font-weight:bold}
.producto-precio{font-size:13px;color:#666}
.cantidad{font-weight:bold}
.subtotal{font-weight:bold}
button{border:0;border-radius:6px;padding:9px 12px;cursor:pointer}
.btn{background:#111;color:#fff}
.btn-ok{background:#198754;color:#fff}
.btn-danger{background:#c0392b;color:#fff}
.btn-light{background:#ddd;color:#222}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
input,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-top:5px}
textarea{min-height:80px;resize:vertical}
label{display:block;margin-bottom:10px;font-size:14px}
.resumen div{display:flex;justify-content:space-between;padding:5px 0}
.total{font-size:20px;font-weight:bold;border-top:1px solid #ddd;margin-top:8px;padding-top:10px!important}
.vacio,.error{background:#fff;border-radius:10px;padding:20px;text-align:center}
.error{color:#a00}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ubicacion{font-size:13px;margin-top:5px}
footer{text-align:center;color:#777;padding:25px;font-size:13px}
</style>
</head>
<body>

<header>
<div class="logo">🛵 Sobre Ruedas</div>
<a href="index.html">← Seguir comprando</a>
</header>

<main id="contenidoPedido"></main>

<footer>Sobre Ruedas · Delivery Esmeraldas</footer>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
let carrito=[];
let ubicacion=null;
let configuracion=null;

const $=id=>document.getElementById(id);
const dinero=v=>`$${Number(v||0).toFixed(2)}`;

function escapar(v){
    return String(v??"").replace(/[&<>"']/g,m=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",
        '"':"&quot;","'":"&#039;"
    }[m]));
}

document.addEventListener("DOMContentLoaded",async()=>{
    cargarCarrito();
    await cargarConfiguracion();
    mostrarCarrito();
});

function cargarCarrito(){
    try{
        carrito=JSON.parse(localStorage.getItem("carrito")||"[]");
        if(!Array.isArray(carrito))carrito=[];
    }catch{
        carrito=[];
    }
    normalizarCarrito();
}

function normalizarCarrito(){
    const mapa=new Map();

    carrito.forEach(p=>{
        const productoId=Number(p.producto_id);
        const restauranteId=Number(p.restaurante_id);
        if(!productoId||!restauranteId)return;

        const clave=`${restauranteId}_${productoId}`;

        if(!mapa.has(clave)){
            mapa.set(clave,{
                producto_id:productoId,
                restaurante_id:restauranteId,
                restaurante_nombre:p.restaurante_nombre||"Local",
                nombre:p.nombre||"Producto",
                descripcion:p.descripcion||"",
                precio:Number(p.precio||0),
                imagen_url:p.imagen_url||null,
                cantidad:Math.max(1,Number(p.cantidad||1))
            });
        }else{
            mapa.get(clave).cantidad+=Math.max(1,Number(p.cantidad||1));
        }
    });

    carrito=[...mapa.values()];
    guardarCarrito();
}

function guardarCarrito(){
    if(carrito.length)
        localStorage.setItem("carrito",JSON.stringify(carrito));
    else
        localStorage.removeItem("carrito");
}

async function cargarConfiguracion(){
    try{
        const {data,error}=await supabaseClient
            .from("configuracion_negocio")
            .select("id,nombre_negocio,ciudad,tarifa_delivery,whatsapp_negocio,moneda")
            .order("id",{ascending:true})
            .limit(1)
            .maybeSingle();

        if(error)throw error;

        configuracion=data||{
            nombre_negocio:"Sobre Ruedas",
            ciudad:"Esmeraldas",
            tarifa_delivery:1.50,
            whatsapp_negocio:"",
            moneda:"USD"
        };
    }catch(e){
        console.error("Configuración:",e);
        configuracion={
            nombre_negocio:"Sobre Ruedas",
            ciudad:"Esmeraldas",
            tarifa_delivery:1.50,
            whatsapp_negocio:"593985459479",
            moneda:"USD"
        };
    }
}

function agruparCarrito(){
    const grupos=new Map();

    carrito.forEach(p=>{
        const id=Number(p.restaurante_id);

        if(!grupos.has(id)){
            grupos.set(id,{
                id,
                nombre:p.restaurante_nombre||"Local",
                productos:[]
            });
        }

        grupos.get(id).productos.push(p);
    });

    return [...grupos.values()];
}

function obtenerSubtotal(grupo){
    return grupo.productos.reduce(
        (t,p)=>t+Number(p.precio||0)*Number(p.cantidad||0),
        0
    );
}

function mostrarCarrito(){
    const contenedor=$("contenidoPedido");

    if(!carrito.length){
        contenedor.innerHTML=`
        <div class="vacio">
            <h2>Tu carrito está vacío</h2>
            <p>Agrega productos desde nuestros locales.</p>
            <button class="btn" onclick="location.href='index.html'">
                Ver locales
            </button>
        </div>`;
        return;
    }

    const grupos=agruparCarrito();
    const delivery=Number(configuracion?.tarifa_delivery??1.50);
    const subtotal=grupos.reduce((t,g)=>t+obtenerSubtotal(g),0);
    const totalDelivery=delivery*grupos.length;
    const total=subtotal+totalDelivery;

    contenedor.innerHTML=`
    <div class="bloque">
        <h2>Mi pedido</h2>

        ${grupos.map(g=>`
        <div class="carrera">
            <h3>${escapar(g.nombre)}</h3>

            ${g.productos.map(p=>`
            <div class="producto">
                <div class="producto-info">
                    <div class="producto-nombre">
                        ${escapar(p.nombre)}
                    </div>
                    <div class="producto-precio">
                        ${dinero(p.precio)} × ${p.cantidad}
                    </div>
                </div>

                <div class="cantidad">
                    ${dinero(Number(p.precio)*Number(p.cantidad))}
                </div>

                <button
                    class="btn-danger"
                    onclick="eliminarProducto(${p.restaurante_id},${p.producto_id})">
                    ×
                </button>
            </div>
            `).join("")}

            <div class="resumen">
                <div>
                    <span>Subtotal</span>
                    <strong>${dinero(obtenerSubtotal(g))}</strong>
                </div>
                <div>
                    <span>Delivery</span>
                    <strong>${dinero(delivery)}</strong>
                </div>
            </div>
        </div>
        `).join("")}

        <div class="resumen">
            <div>
                <span>Productos</span>
                <strong>${dinero(subtotal)}</strong>
            </div>
            <div>
                <span>Delivery</span>
                <strong>${dinero(totalDelivery)}</strong>
            </div>
            <div class="total">
                <span>Total</span>
                <strong>${dinero(total)}</strong>
            </div>
        </div>

        <div class="acciones">
            <button class="btn-light" onclick="vaciarCarrito()">
                Vaciar carrito
            </button>
            <button class="btn" onclick="location.href='index.html'">
                Seguir comprando
            </button>
        </div>
    </div>

    <div class="bloque">
        <h2>Datos de entrega</h2>

        <div class="form-grid">
            <label>
                Nombre *
                <input id="clienteNombre" maxlength="100">
            </label>

            <label>
                Teléfono *
                <input id="clienteTelefono" type="tel" maxlength="30">
            </label>
        </div>

        <label>
            Dirección *
            <textarea id="clienteDireccion" maxlength="300"></textarea>
        </label>

        <label>
            Referencia
            <textarea id="clienteReferencia" maxlength="300"></textarea>
        </label>

        <button class="btn-light" onclick="obtenerUbicacion()">
            📍 Compartir ubicación
        </button>

        <div id="ubicacionEstado" class="ubicacion"></div>

        <div class="acciones">
            <button class="btn-ok" onclick="enviarPedidoWhatsApp()">
                Enviar pedido por WhatsApp
            </button>
        </div>

        <div id="mensajePedido"></div>
    </div>`;
}

function eliminarProducto(restauranteId,productoId){
    carrito=carrito.filter(p=>!(
        Number(p.restaurante_id)===Number(restauranteId)&&
        Number(p.producto_id)===Number(productoId)
    ));

    guardarCarrito();
    mostrarCarrito();
}

function vaciarCarrito(){
    if(!carrito.length)return;

    if(!confirm("¿Vaciar todo el carrito?"))return;

    carrito=[];
    localStorage.removeItem("carrito");
    mostrarCarrito();
}

function obtenerUbicacion(){
    if(!navigator.geolocation){
        mostrarMensaje("Este navegador no permite obtener ubicación.","error");
        return;
    }

    $("ubicacionEstado").textContent="Obteniendo ubicación...";

    navigator.geolocation.getCurrentPosition(
        posicion=>{
            ubicacion={
                lat:Number(posicion.coords.latitude),
                lon:Number(posicion.coords.longitude)
            };

            $("ubicacionEstado").innerHTML=`
                Ubicación obtenida correctamente.
                <a target="_blank"
                   rel="noopener"
                   href="https://www.google.com/maps?q=${ubicacion.lat},${ubicacion.lon}">
                   Ver en mapa
                </a>`;
        },
        error=>{
            console.error(error);
            ubicacion=null;
            $("ubicacionEstado").textContent=
                "No se pudo obtener la ubicación.";
        },
        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:0
        }
    );
}

function generarNumeroPedido(){
    return "SR-"+Date.now().toString().slice(-6);
}

async function enviarPedidoWhatsApp(){

    if(!carrito.length){
        mostrarMensaje("El carrito está vacío.","error");
        return;
    }

    const nombre=$("clienteNombre").value.trim();
    const telefono=$("clienteTelefono").value.trim();
    const direccion=$("clienteDireccion").value.trim();
    const referencia=$("clienteReferencia").value.trim();

    if(!nombre){
        mostrarMensaje("Ingresa tu nombre.","error");
        return;
    }

    if(!telefono){
        mostrarMensaje("Ingresa tu teléfono.","error");
        return;
    }

    if(!direccion){
        mostrarMensaje("Ingresa la dirección de entrega.","error");
        return;
    }

    const grupos=agruparCarrito();
    const delivery=Number(configuracion?.tarifa_delivery??1.50);
    const subtotal=grupos.reduce((t,g)=>t+obtenerSubtotal(g),0);
    const totalDelivery=delivery*grupos.length;
    const total=subtotal+totalDelivery;
    const numero=generarNumeroPedido();

    try{
        mostrarMensaje("Registrando pedido...");

        const {data:pedido,error:ep}=await supabaseClient
            .from("pedidos")
            .insert({
                numero,
                cliente_nombre:nombre,
                cliente_telefono:telefono,
                direccion,
                referencia:referencia||null,
                total_productos:subtotal,
                total_delivery:totalDelivery,
                total
            })
            .select("id,numero")
            .single();

        if(ep)throw ep;

        for(const grupo of grupos){

            const subtotalCarrera=obtenerSubtotal(grupo);
            const totalCarrera=subtotalCarrera+delivery;

            const {data:carrera,error:ec}=await supabaseClient
                .from("carreras")
                .insert({
                    pedido_id:pedido.id,
                    restaurante_id:grupo.id,
                    numero:`${numero}-${grupo.id}`,
                    subtotal:subtotalCarrera,
                    delivery,
                    total:totalCarrera,
                    estado:"Pendiente de asignación"
                })
                .select("id")
                .single();

            if(ec)throw ec;

            const detalles=grupo.productos.map(p=>({
                carrera_id:carrera.id,
                producto_id:Number(p.producto_id),
                producto_nombre:p.nombre,
                precio_unitario:Number(p.precio||0),
                cantidad:Number(p.cantidad||0),
                subtotal:Number(p.precio||0)*Number(p.cantidad||0)
            }));

            const {error:ed}=await supabaseClient
                .from("detalle_carreras")
                .insert(detalles);

            if(ed)throw ed;
        }

        const mensaje=generarMensajeWhatsApp({
            numero,
            nombre,
            telefono,
            direccion,
            referencia,
            grupos,
            delivery,
            subtotal,
            totalDelivery,
            total
        });

        const whatsapp=
            String(configuracion?.whatsapp_negocio||"")
            .replace(/\D/g,"");

        if(!whatsapp){
            mostrarMensaje(
                "Pedido registrado, pero no existe un WhatsApp configurado.",
                "error"
            );
            return;
        }

        const url=
            `https://wa.me/${whatsapp}?text=${encodeURIComponent(mensaje)}`;

        localStorage.removeItem("carrito");
        carrito=[];

        window.location.href=url;

    }catch(e){
        console.error("ERROR REGISTRANDO PEDIDO:",e);
        mostrarMensaje(
            "No se pudo registrar el pedido: "+e.message,
            "error"
        );
    }
}

function generarMensajeWhatsApp(datos){

    let texto=
`*SOBRE RUEDAS - NUEVO PEDIDO*
Pedido: ${datos.numero}

*CLIENTE*
Nombre: ${datos.nombre}
Teléfono: ${datos.telefono}
Dirección: ${datos.direccion}`;

    if(datos.referencia)
        texto+=`\nReferencia: ${datos.referencia}`;

    if(ubicacion)
        texto+=
            `\nUbicación: https://www.google.com/maps?q=${ubicacion.lat},${ubicacion.lon}`;

    texto+="\n\n*PEDIDO*";

    datos.grupos.forEach(g=>{
        texto+=`\n\n*${g.nombre}*`;

        g.productos.forEach(p=>{
            texto+=
                `\n${p.cantidad} x ${p.nombre} - `+
                `${dinero(Number(p.precio)*Number(p.cantidad))}`;
        });

        texto+=`\nSubtotal: ${dinero(obtenerSubtotal(g))}`;
        texto+=`\nDelivery: ${dinero(datos.delivery)}`;
        texto+=`\nTotal local: ${dinero(obtenerSubtotal(g)+datos.delivery)}`;
    });

    texto+=
`\n\nSubtotal productos: ${dinero(datos.subtotal)}
Delivery: ${dinero(datos.totalDelivery)}
*TOTAL: ${dinero(datos.total)}*`;

    return texto;
}

function mostrarMensaje(texto,tipo="ok"){
    const e=$("mensajePedido");
    if(!e)return;

    e.textContent=texto;
    e.style.padding="10px";
    e.style.marginTop="10px";
    e.style.borderRadius="6px";
    e.style.background=
        tipo==="error"?"#fde2e2":"#dff5e5";
    e.style.color=
        tipo==="error"?"#8b1e1e":"#176b35";
}
</script>
</body>
</html>
