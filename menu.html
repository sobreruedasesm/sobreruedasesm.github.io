<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Carrito - Sobre Ruedas</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .volver {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 9px 13px;
            border-radius: 8px;
            cursor: pointer;
        }

        .contenedor {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 15px 50px;
        }

        .info {
            background: #fff3cd;
            border: 1px solid #ffe69c;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .carrera {
            background: white;
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,.07);
        }

        .carrera h3 {
            margin-top: 0;
            color: #ff5722;
        }

        .producto {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }

        .controles {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .controles button {
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
        }

        .menos {
            background: #ddd;
        }

        .mas {
            background: #ff9800;
            color: white;
        }

        .eliminar {
            background: #f44336;
            color: white;
        }

        .subtotal {
            text-align: right;
            margin-top: 15px;
            font-weight: bold;
        }

        .delivery {
            text-align: right;
            margin-top: 7px;
            color: #555;
        }

        .total-carrera {
            text-align: right;
            margin-top: 7px;
            font-size: 19px;
            font-weight: bold;
        }

        .resumen {
            background: #111;
            color: white;
            padding: 22px;
            border-radius: 12px;
            margin-top: 25px;
        }

        .fila-total {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }

        .total-general {
            font-size: 24px;
            font-weight: bold;
            border-top: 1px solid #555;
            padding-top: 15px;
            margin-top: 15px;
        }

        .formulario {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .formulario input,
        .formulario textarea {
            width: 100%;
            padding: 13px;
            margin: 7px 0 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .formulario textarea {
            min-height: 90px;
            resize: vertical;
        }

        .confirmar {
            width: 100%;
            background: #25d366;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 9px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .vacio {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
        }

        #resultado {
            margin-top: 20px;
        }

        .pedido-generado {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            padding: 20px;
            border-radius: 10px;
        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        🛵 Sobre Ruedas
    </div>

    <button
        class="volver"
        onclick="seguirComprando()"
    >
        ← Seguir comprando
    </button>

</header>


<main class="contenedor">

    <h1>
        🛒 Tu pedido
    </h1>


    <div class="info">

        <strong>
            ℹ️ Importante
        </strong>

        <p>
            Puedes comprar productos de diferentes restaurantes
            en un mismo pedido.
        </p>

        <p>
            Cada restaurante genera una
            <strong>carrera independiente</strong>
            y cada carrera tiene un delivery de
            <strong id="textoTarifa">$1.50</strong>.
        </p>

    </div>


    <div id="carrito"></div>


    <div id="formulario" style="display:none;">

        <div class="formulario">

            <h2>
                Datos de entrega
            </h2>

            <label>
                Nombre
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Ej. Juan Pérez"
            >


            <label>
                Teléfono
            </label>

            <input
                type="tel"
                id="telefono"
                placeholder="Ej. 0987654321"
            >


            <label>
                Dirección de entrega
            </label>

            <textarea
                id="direccion"
                placeholder="Ej. Calle Bolívar y 10 de Agosto"
            ></textarea>


            <label>
                Referencia
            </label>

            <input
                type="text"
                id="referencia"
                placeholder="Ej. Frente al parque"
            >


            <button
                class="confirmar"
                onclick="confirmarPedido()"
            >
                🛵 CONFIRMAR PEDIDO
            </button>

        </div>

    </div>


    <div id="resultado"></div>

</main>


<script src="config.js"></script>


<script>


let carrito =
    JSON.parse(localStorage.getItem("carrito")) || [];


document.getElementById("textoTarifa")
    .textContent =
        "$" + CONFIG.tarifaDelivery.toFixed(2);


function agruparPorRestaurante() {

    const grupos = {};

    carrito.forEach(producto => {

        if (!grupos[producto.restaurante]) {

            grupos[producto.restaurante] = [];

        }

        grupos[producto.restaurante].push(producto);

    });

    return grupos;

}


function mostrarCarrito() {

    const contenedor =
        document.getElementById("carrito");

    contenedor.innerHTML = "";


    if (carrito.length === 0) {

        contenedor.innerHTML = `

            <div class="vacio">

                <h2>
                    Tu carrito está vacío
                </h2>

                <p>
                    Agrega productos para comenzar.
                </p>

                <button
                    class="confirmar"
                    onclick="seguirComprando()"
                >
                    Ver restaurantes
                </button>

            </div>

        `;

        document.getElementById("formulario")
            .style.display = "none";

        return;

    }


    const grupos =
        agruparPorRestaurante();


    let totalGeneral = 0;


    Object.keys(grupos).forEach(restaurante => {

        const productos =
            grupos[restaurante];


        let subtotal = 0;


        let html = `

            <div class="carrera">

                <h3>
                    🏪 ${restaurante}
                </h3>
        `;


        productos.forEach(producto => {

            const totalProducto =
                producto.precio *
                producto.cantidad;

            subtotal += totalProducto;


            html += `

                <div class="producto">

                    <div>

                        <strong>
                            ${producto.nombre}
                        </strong>

                        <br>

                        $${producto.precio.toFixed(2)}
                        ×
                        ${producto.cantidad}

                    </div>


                    <div class="controles">

                        <button
                            class="menos"
                            onclick="cambiarCantidad(
                                '${escapeTexto(producto.nombre)}',
                                '${escapeTexto(restaurante)}',
                                -1
                            )"
                        >
                            −
                        </button>


                        <strong>
                            ${producto.cantidad}
                        </strong>


                        <button
                            class="mas"
                            onclick="cambiarCantidad(
                                '${escapeTexto(producto.nombre)}',
                                '${escapeTexto(restaurante)}',
                                1
                            )"
                        >
                            +
                        </button>


                        <button
                            class="eliminar"
                            onclick="eliminarProducto(
                                '${escapeTexto(producto.nombre)}',
                                '${escapeTexto(restaurante)}'
                            )"
                        >
                            🗑
                        </button>

                    </div>

                </div>

            `;

        });


        const delivery =
            Number(CONFIG.tarifaDelivery);


        const totalCarrera =
            subtotal + delivery;


        totalGeneral += totalCarrera;


        html += `

                <div class="subtotal">
                    Productos:
                    $${subtotal.toFixed(2)}
                </div>

                <div class="delivery">
                    Delivery:
                    $${delivery.toFixed(2)}
                </div>

                <div class="total-carrera">
                    Total carrera:
                    $${totalCarrera.toFixed(2)}
                </div>

            </div>

        `;


        contenedor.innerHTML += html;

    });


    const cantidadCarreras =
        Object.keys(grupos).length;


    let totalProductos = 0;


    carrito.forEach(producto => {

        totalProductos +=
            producto.precio *
            producto.cantidad;

    });


    const totalDelivery =
        cantidadCarreras *
        CONFIG.tarifaDelivery;


    contenedor.innerHTML += `

        <div class="resumen">

            <div class="fila-total">

                <span>
                    Productos
                </span>

                <strong>
                    $${totalProductos.toFixed(2)}
                </strong>

            </div>


            <div class="fila-total">

                <span>
                    Delivery
                </span>

                <strong>
                    $${totalDelivery.toFixed(2)}
                </strong>

            </div>


            <div class="fila-total">

                <span>
                    Carreras
                </span>

                <strong>
                    ${cantidadCarreras}
                </strong>

            </div>


            <div class="fila-total total-general">

                <span>
                    TOTAL
                </span>

                <strong>
                    $${totalGeneral.toFixed(2)}
                </strong>

            </div>

        </div>

    `;


    document.getElementById("formulario")
        .style.display = "block";

}


function cambiarCantidad(
    nombre,
    restaurante,
    cambio
) {

    const producto =
        carrito.find(item =>
            item.nombre === nombre &&
            item.restaurante === restaurante
        );


    if (!producto) return;


    producto.cantidad += cambio;


    if (producto.cantidad <= 0) {

        carrito =
            carrito.filter(item =>
                !(
                    item.nombre === nombre &&
                    item.restaurante === restaurante
                )
            );

    }


    guardarCarrito();

}


function eliminarProducto(
    nombre,
    restaurante
) {

    carrito =
        carrito.filter(item =>
            !(
                item.nombre === nombre &&
                item.restaurante === restaurante
            )
        );


    guardarCarrito();

}


function guardarCarrito() {

    localStorage.setItem(
        "carrito",
        JSON.stringify(carrito)
    );

    mostrarCarrito();

}


function escapeTexto(texto) {

    return texto
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}


function confirmarPedido() {

    if (carrito.length === 0) {

        alert("El carrito está vacío.");
        return;

    }


    const nombre =
        document.getElementById("nombre")
            .value.trim();

    const telefono =
        document.getElementById("telefono")
            .value.trim();

    const direccion =
        document.getElementById("direccion")
            .value.trim();

    const referencia =
        document.getElementById("referencia")
            .value.trim();


    if (
        !nombre ||
        !telefono ||
        !direccion
    ) {

        alert(
            "Completa nombre, teléfono y dirección."
        );

        return;

    }


    const grupos =
        agruparPorRestaurante();


    const numeroGeneral =
        "SR-" +
        String(Date.now()).slice(-6);


    const carreras = [];


    let numeroCarrera = 1;


    Object.keys(grupos).forEach(restaurante => {

        const productos =
            grupos[restaurante];


        let subtotal = 0;


        productos.forEach(producto => {

            subtotal +=
                producto.precio *
                producto.cantidad;

        });


        const sobrecargoDelivery =
            Number(CONFIG.tarifaDelivery);


        const totalCarrera =
            subtotal +
            sobrecargoDelivery;


        carreras.push({

            id:
                numeroGeneral +
                "-C" +
                numeroCarrera,

            restaurante:
                restaurante,

            productos:
                productos,

            subtotal:
                subtotal,

            sobrecargoDelivery:
                sobrecargoDelivery,

            totalCarrera:
                totalCarrera,

            estado:
                "Pendiente de asignación",

            repartidor:
                null

        });


        numeroCarrera++;

    });


    const total =
        carreras.reduce(
            (suma, carrera) =>
                suma + carrera.totalCarrera,
            0
        );


    const pedido = {

        numero:
            numeroGeneral,

        cliente: {

            nombre:
                nombre,

            telefono:
                telefono,

            direccion:
                direccion,

            referencia:
                referencia

        },

        total:
            total,

        cantidadCarreras:
            carreras.length,

        carreras:
            carreras,

        estado:
            "Pedido recibido",

        fecha:
            new Date().toISOString()

    };


    localStorage.setItem(
        "ultimoPedido",
        JSON.stringify(pedido)
    );


    mostrarResultado(pedido);

}


function mostrarResultado(pedido) {

    const resultado =
        document.getElementById("resultado");


    let carrerasHTML = "";


    pedido.carreras.forEach(carrera => {

        carrerasHTML += `

            <div style="
                background:white;
                margin-top:10px;
                padding:12px;
                border-radius:8px;
            ">

                <strong>
                    ${carrera.id}
                </strong>

                <br>

                ${carrera.restaurante}

                <br>

                Total:
                $${carrera.totalCarrera.toFixed(2)}

                <br>

                Estado:
                🟡 ${carrera.estado}

            </div>

        `;

    });


    resultado.innerHTML = `

        <div class="pedido-generado">

            <h2>
                ✅ Pedido registrado
            </h2>

            <h3>
                ${pedido.numero}
            </h3>

            <p>
                Hemos recibido tu pedido.
            </p>

            <p>
                Se generaron
                <strong>
                    ${pedido.cantidadCarreras}
                    carreras
                </strong>.
            </p>

            ${carrerasHTML}

            <h2>
                Total:
                $${pedido.total.toFixed(2)}
            </h2>

            <p>
                En la siguiente etapa conectaremos
                este pedido automáticamente con
                WhatsApp Business.
            </p>

        </div>

    `;


    localStorage.removeItem("carrito");

    carrito = [];


    document.getElementById("formulario")
        .style.display = "none";


    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

}


function seguirComprando() {

    window.location.href = "index.html";

}


mostrarCarrito();

</script>

</body>
</html>
