<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi pedido | Sobre Ruedas</title>

<style>
*{box-sizing:border-box}

:root{
    --verde:#123d35;
    --verde2:#1d594b;
    --verde3:#e9f1ed;
    --crema:#f7f3ed;
    --blanco:#fff;
    --naranja:#d96f3d;
    --naranja2:#b9572d;
    --texto:#24332f;
    --gris:#71807a;
    --borde:#e5ddd2;
    --sombra:0 12px 35px rgba(22,45,38,.10);
    --radio:20px;
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:radial-gradient(circle at top left,#fff8ef 0,#f7f3ed 35%,#eee7dc 100%);
    color:var(--texto);
}

button,input,textarea{font:inherit}

.header{
    background:linear-gradient(135deg,var(--verde),#0c302a);
    color:#fff;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.header-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:14px;
}

.back{
    width:42px;
    height:42px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.08);
    color:#fff;
    cursor:pointer;
    font-size:20px;
}

.logo{flex:1}

.logo strong{
    display:block;
    font-size:22px;
    letter-spacing:-.4px;
}

.logo span{
    display:block;
    margin-top:2px;
    font-size:12px;
    color:#cfe1da;
}

main{
    width:min(100%,1000px);
    margin:auto;
    padding:25px 16px 50px;
}

.hero{margin-bottom:22px}

.hero h1{
    margin:0;
    color:var(--verde);
    font-size:clamp(28px,5vw,38px);
    letter-spacing:-1px;
}

.hero p{
    margin:7px 0 0;
    color:var(--gris);
    font-size:15px;
}

#pedido{
    display:grid;
    gap:18px;
}

.local-card{
    background:rgba(255,255,255,.96);
    border:1px solid rgba(229,221,210,.9);
    border-radius:var(--radio);
    overflow:hidden;
    box-shadow:var(--sombra);
}

.local-head{
    padding:18px 20px;
    background:linear-gradient(135deg,#fff,#f8f3eb);
    border-bottom:1px solid var(--borde);
}

.local-name{
    margin:0;
    font-size:21px;
    color:var(--verde);
}

.local-products{padding:0 20px}

.producto{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:17px 0;
    border-bottom:1px solid #eee8df;
}

.producto:last-child{border-bottom:0}

.producto-info{
    min-width:0;
    flex:1;
}

.producto-nombre{
    margin:0;
    font-weight:700;
    color:var(--texto);
    line-height:1.3;
}

.producto-detalle{
    margin-top:5px;
    color:var(--gris);
    font-size:13px;
}

.producto-total{
    white-space:nowrap;
    font-weight:800;
    color:var(--verde);
}

.local-totales{
    padding:16px 20px 19px;
    background:#faf7f2;
    border-top:1px solid var(--borde);
}

.total-linea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:5px 0;
    font-size:14px;
}

.total-linea.delivery{
    color:var(--verde2);
    font-weight:700;
}

.total-linea.total-local{
    margin-top:9px;
    padding-top:12px;
    border-top:1px dashed #d9cec0;
    font-size:17px;
    font-weight:800;
    color:var(--verde);
}

.form-card{
    background:rgba(255,255,255,.96);
    border:1px solid var(--borde);
    border-radius:var(--radio);
    padding:22px;
    box-shadow:var(--sombra);
}

.form-title{
    margin:0 0 4px;
    color:var(--verde);
    font-size:21px;
}

.form-subtitle{
    margin:0 0 20px;
    color:var(--gris);
    font-size:13px;
}

.field{margin-bottom:15px}

.field label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:750;
    color:var(--verde);
}

.field input,
.field textarea{
    width:100%;
    border:1px solid #ddd4c8;
    border-radius:13px;
    padding:13px 14px;
    outline:none;
    background:#fff;
    color:var(--texto);
    transition:.2s;
}

.field input:focus,
.field textarea:focus{
    border-color:var(--verde2);
    box-shadow:0 0 0 3px rgba(29,89,75,.09);
}

.field textarea{
    min-height:82px;
    resize:vertical;
}

.ubicacion{
    margin-top:4px;
    display:flex;
    flex-wrap:wrap;
    gap:9px;
}

.btn{
    border:0;
    border-radius:13px;
    padding:12px 15px;
    cursor:pointer;
    font-weight:750;
    transition:.2s;
}

.btn:hover{transform:translateY(-1px)}

.btn-gps{
    background:var(--verde3);
    color:var(--verde);
}

.btn-maps{
    background:#f0eee9;
    color:#3c4d47;
    text-decoration:none;
    display:none;
}

.resumen{
    background:linear-gradient(145deg,var(--verde),#0c302a);
    color:#fff;
    border-radius:24px;
    padding:22px;
    box-shadow:0 15px 35px rgba(18,61,53,.22);
}

.resumen h2{
    margin:0 0 15px;
    font-size:20px;
}

.resumen-linea{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:7px 0;
    color:#d9e7e1;
}

.resumen-total{
    margin-top:13px;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,.16);
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:15px;
}

.resumen-total span:first-child{
    font-size:14px;
    color:#c9ddd6;
}

.resumen-total strong{
    font-size:31px;
    letter-spacing:-1px;
}

.btn-pedir{
    width:100%;
    margin-top:18px;
    padding:16px;
    border:0;
    border-radius:16px;
    background:linear-gradient(135deg,var(--naranja),var(--naranja2));
    color:#fff;
    font-size:17px;
    font-weight:850;
    cursor:pointer;
    box-shadow:0 8px 22px rgba(217,111,61,.25);
}

.btn-pedir:hover{transform:translateY(-1px)}

.btn-pedir:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.vacio{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:20px;
    padding:45px 20px;
    text-align:center;
    box-shadow:var(--sombra);
}

.vacio-icon{
    font-size:42px;
    margin-bottom:10px;
}

.vacio h2{
    margin:0;
    color:var(--verde);
}

.vacio p{color:var(--gris)}

.btn-volver{
    display:inline-block;
    margin-top:10px;
    background:var(--verde);
    color:#fff;
    text-decoration:none;
    padding:12px 18px;
    border-radius:13px;
    font-weight:750;
}

.mensaje{
    margin-bottom:15px;
    padding:13px 15px;
    border-radius:13px;
    display:none;
    font-size:14px;
}

.mensaje.error{
    display:block;
    background:#fbe8e2;
    color:#9e3f25;
}

.mensaje.ok{
    display:block;
    background:#e5f1ea;
    color:#286044;
}

@media(max-width:600px){
    main{padding:20px 12px 40px}
    .header{padding:14px}
    .header-inner{gap:10px}
    .local-products{padding:0 16px}
    .local-totales{padding:15px 16px 17px}
    .producto{gap:10px}
    .form-card{padding:18px}
    .resumen{padding:19px}
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <button class="back" onclick="history.back()" aria-label="Volver">←</button>

        <div class="logo">
            <strong>Sobre Ruedas</strong>
            <span>Tu pedido en Esmeraldas</span>
        </div>
    </div>
</header>

<main>

    <section class="hero">
        <h1>Mi pedido</h1>
        <p>Revisa tus productos y completa los datos de entrega.</p>
    </section>

    <div id="mensaje" class="mensaje"></div>

    <div id="pedido"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const pedidoEl=document.getElementById("pedido");
const mensajeEl=document.getElementById("mensaje");

const CARRITO_KEY="carrito";

let carrito=[];
let config={};
let ubicacionActual=null;

function leerCarrito(){
    try{
        const data=JSON.parse(localStorage.getItem(CARRITO_KEY)||"[]");
        return Array.isArray(data)?data:[];
    }catch{
        return [];
    }
}

function guardarCarrito(){
    localStorage.setItem(CARRITO_KEY,JSON.stringify(carrito));
}

function dinero(valor){
    return `$${Number(valor||0).toFixed(2)}`;
}

function escapeHtml(text){
    return String(text??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function mostrarMensaje(texto,tipo="error"){
    mensajeEl.textContent=texto;
    mensajeEl.className=`mensaje ${tipo}`;
}

function ocultarMensaje(){
    mensajeEl.textContent="";
    mensajeEl.className="mensaje";
}

function agruparCarrito(){
    const grupos={};

    carrito.forEach(p=>{
        const id=p.restaurante_id;

        if(!grupos[id]){
            grupos[id]={
                id,
                nombre:p.restaurante_nombre||"Local",
                productos:[],
                subtotal:0,
                delivery:Number(
                    config.tarifa_delivery ??
                    config.tarifaDelivery ??
                    1.5
                )
            };
        }

        const cantidad=Number(p.cantidad)||0;
        const precio=Number(p.precio)||0;
        const subtotal=precio*cantidad;

        grupos[id].productos.push({
            ...p,
            cantidad,
            precio,
            subtotal
        });

        grupos[id].subtotal+=subtotal;
    });

    return Object.values(grupos);
}

function renderPedido(){

    carrito=leerCarrito();

    if(!carrito.length){
        pedidoEl.innerHTML=`
            <div class="vacio">
                <div class="vacio-icon">🛒</div>
                <h2>Tu carrito está vacío</h2>
                <p>Agrega productos de nuestros locales para comenzar tu pedido.</p>
                <a class="btn-volver" href="index.html">Ver locales</a>
            </div>
        `;
        return;
    }

    const grupos=agruparCarrito();

    const subtotalGeneral=grupos.reduce(
        (s,g)=>s+g.subtotal,0
    );

    const deliveryGeneral=grupos.reduce(
        (s,g)=>s+g.delivery,0
    );

    const totalGeneral=subtotalGeneral+deliveryGeneral;

    pedidoEl.innerHTML=`

        ${grupos.map(g=>`
            <section class="local-card">

                <div class="local-head">
                    <h2 class="local-name">
                        ${escapeHtml(g.nombre)}
                    </h2>
                </div>

                <div class="local-products">

                    ${g.productos.map(p=>`
                        <div class="producto">

                            <div class="producto-info">

                                <p class="producto-nombre">
                                    ${escapeHtml(p.producto_nombre)}
                                </p>

                                <div class="producto-detalle">
                                    ${p.cantidad} × ${dinero(p.precio)}
                                </div>

                            </div>

                            <div class="producto-total">
                                ${dinero(p.subtotal)}
                            </div>

                        </div>
                    `).join("")}

                </div>

                <div class="local-totales">

                    <div class="total-linea">
                        <span>Subtotal</span>
                        <strong>${dinero(g.subtotal)}</strong>
                    </div>

                    <div class="total-linea delivery">
                        <span>🛵 Delivery</span>
                        <strong>${dinero(g.delivery)}</strong>
                    </div>

                    <div class="total-linea total-local">
                        <span>Total de ${escapeHtml(g.nombre)}</span>
                        <strong>${dinero(g.subtotal+g.delivery)}</strong>
                    </div>

                </div>

            </section>
        `).join("")}

        <section class="form-card">

            <h2 class="form-title">Datos de entrega</h2>

            <p class="form-subtitle">
                Necesitamos estos datos para preparar y entregar tu pedido.
            </p>

            <div class="field">
                <label for="clienteNombre">Nombre</label>
                <input
                    id="clienteNombre"
                    type="text"
                    placeholder="Tu nombre"
                    autocomplete="name"
                >
            </div>

            <div class="field">
                <label for="clienteTelefono">Teléfono</label>
                <input
                    id="clienteTelefono"
                    type="tel"
                    placeholder="0999999999"
                    autocomplete="tel"
                >
            </div>

            <div class="field">
                <label for="direccion">Dirección de entrega</label>
                <input
                    id="direccion"
                    type="text"
                    placeholder="Calle, sector, barrio..."
                    autocomplete="street-address"
                >
            </div>

            <div class="ubicacion">

                <button
                    class="btn btn-gps"
                    type="button"
                    onclick="obtenerUbicacion()"
                >
                    📍 Usar mi ubicación
                </button>

                <a
                    id="btnMaps"
                    class="btn btn-maps"
                    href="#"
                    target="_blank"
                    rel="noopener"
                >
                    🗺️ Abrir en Google Maps
                </a>

            </div>

            <div class="field" style="margin-top:15px">

                <label for="referencia">
                    Referencia
                </label>

                <textarea
                    id="referencia"
                    placeholder="Ej.: casa de dos pisos, frente al parque..."
                ></textarea>

            </div>

        </section>

        <section class="resumen">

            <h2>Resumen del pedido</h2>

            <div class="resumen-linea">
                <span>Productos</span>
                <strong>${dinero(subtotalGeneral)}</strong>
            </div>

            <div class="resumen-linea">
                <span>
                    Delivery (${grupos.length}
                    ${grupos.length===1?"local":"locales"})
                </span>
                <strong>${dinero(deliveryGeneral)}</strong>
            </div>

            <div class="resumen-total">
                <span>TOTAL DEL PEDIDO</span>
                <strong>${dinero(totalGeneral)}</strong>
            </div>

            <button
                id="btnPedir"
                class="btn-pedir"
                onclick="confirmarPedido()"
            >
                Confirmar pedido por WhatsApp
            </button>

        </section>
    `;
}

async function cargarConfiguracion(){

    const {data,error}=await supabaseClient
        .from("configuracion_negocio")
        .select("*")
        .order("id",{ascending:true})
        .limit(1);

    if(error){
        console.error("Error cargando configuración:",error);

        config={
            tarifa_delivery:1.50,
            whatsapp_negocio:"593985459479",
            nombre_negocio:"Sobre Ruedas",
            ciudad:"Esmeraldas",
            moneda:"USD"
        };

        renderPedido();
        return;
    }

    config=data?.[0]||{
        tarifa_delivery:1.50,
        whatsapp_negocio:"593985459479",
        nombre_negocio:"Sobre Ruedas",
        ciudad:"Esmeraldas",
        moneda:"USD"
    };

    renderPedido();
}

function obtenerUbicacion(){

    if(!navigator.geolocation){
        mostrarMensaje(
            "Tu navegador no permite obtener la ubicación.",
            "error"
        );
        return;
    }

    mostrarMensaje(
        "Obteniendo tu ubicación...",
        "ok"
    );

    navigator.geolocation.getCurrentPosition(
        posicion=>{
            const lat=posicion.coords.latitude;
            const lng=posicion.coords.longitude;

            ubicacionActual={lat,lng};

            const urlMaps=
                `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;

            const btn=document.getElementById("btnMaps");

            if(btn){
                btn.href=urlMaps;
                btn.style.display="inline-flex";
            }

            const direccion=document.getElementById("direccion");

            if(direccion){
                direccion.value=
                    `Ubicación GPS: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            }

            mostrarMensaje(
                "Ubicación obtenida correctamente. Puedes abrirla en Google Maps.",
                "ok"
            );
        },
        error=>{
            console.error(error);

            let texto="No se pudo obtener tu ubicación.";

            if(error.code===1){
                texto="Debes permitir el acceso a tu ubicación en el navegador.";
            }else if(error.code===2){
                texto="No fue posible determinar tu ubicación.";
            }else if(error.code===3){
                texto="La ubicación tardó demasiado en responder.";
            }

            mostrarMensaje(texto,"error");
        },
        {
            enableHighAccuracy:true,
            timeout:10000,
            maximumAge:60000
        }
    );
}

function generarNumeroPedido(){
    return "SR-"+Math.floor(
        100000+Math.random()*900000
    );
}

function limpiarTexto(texto){
    return String(texto||"").trim();
}

async function confirmarPedido(){

    ocultarMensaje();

    const btn=document.getElementById("btnPedir");

    const nombre=limpiarTexto(
        document.getElementById("clienteNombre")?.value
    );

    const telefono=limpiarTexto(
        document.getElementById("clienteTelefono")?.value
    );

    const direccion=limpiarTexto(
        document.getElementById("direccion")?.value
    );

    const referencia=limpiarTexto(
        document.getElementById("referencia")?.value
    );

    if(!nombre){
        mostrarMensaje("Ingresa tu nombre.");
        document.getElementById("clienteNombre")?.focus();
        return;
    }

    if(!telefono){
        mostrarMensaje("Ingresa tu número de teléfono.");
        document.getElementById("clienteTelefono")?.focus();
        return;
    }

    if(!direccion){
        mostrarMensaje("Ingresa la dirección de entrega.");
        document.getElementById("direccion")?.focus();
        return;
    }

    carrito=leerCarrito();

    if(!carrito.length){
        mostrarMensaje("Tu carrito está vacío.");
        renderPedido();
        return;
    }

    const grupos=agruparCarrito();

    const subtotalGeneral=grupos.reduce(
        (s,g)=>s+g.subtotal,0
    );

    const deliveryGeneral=grupos.reduce(
        (s,g)=>s+g.delivery,0
    );

    const totalGeneral=subtotalGeneral+deliveryGeneral;

    const numero=generarNumeroPedido();

    const carreras=grupos.map(g=>({

        restaurante_id:Number(g.id),

        subtotal:Number(g.subtotal.toFixed(2)),

        delivery:Number(g.delivery.toFixed(2)),

        total:Number(
            (g.subtotal+g.delivery).toFixed(2)
        ),

        productos:g.productos.map(p=>({

            producto_id:p.producto_id
                ? Number(p.producto_id)
                : null,

            producto_nombre:p.producto_nombre,

            precio_unitario:Number(
                p.precio.toFixed(2)
            ),

            cantidad:Number(p.cantidad),

            subtotal:Number(
                p.subtotal.toFixed(2)
            )

        }))

    }));

    btn.disabled=true;
    btn.textContent="Registrando pedido...";

    try{

        const {data,error}=await supabaseClient.rpc(
            "registrar_pedido_completo",
            {
                p_numero:numero,
                p_cliente_nombre:nombre,
                p_cliente_telefono:telefono,
                p_direccion:direccion,
                p_referencia:referencia||null,
                p_total_productos:Number(
                    subtotalGeneral.toFixed(2)
                ),
                p_total_delivery:Number(
                    deliveryGeneral.toFixed(2)
                ),
                p_total:Number(
                    totalGeneral.toFixed(2)
                ),
                p_carreras:carreras
            }
        );

        if(error){
            console.error(
                "Error registrando pedido:",
                error
            );

            throw new Error(
                error.message||
                "No se pudo registrar el pedido."
            );
        }

        const pedidoId=data;

        const telefonoNegocio=
            String(
                config.whatsapp_negocio||
                config.whatsappNegocio||
                "593985459479"
            ).replace(/\D/g,"");

        let mensaje=
`🛵 *SOBRE RUEDAS*
📦 *PEDIDO ${numero}*

👤 Cliente: ${nombre}
📱 Teléfono: ${telefono}
📍 Dirección: ${direccion}`;

        if(ubicacionActual){
            mensaje+=
`\n🗺️ Ubicación:
https://www.google.com/maps/search/?api=1&query=${ubicacionActual.lat},${ubicacionActual.lng}`;
        }

        if(referencia){
            mensaje+=
`\n📝 Referencia: ${referencia}`;
        }

        mensaje+=`\n\n`;

        grupos.forEach(g=>{

            mensaje+=
`🏪 *${g.nombre}*
`;

            g.productos.forEach(p=>{
                mensaje+=
`• ${p.cantidad} × ${p.producto_nombre} — ${dinero(p.subtotal)}
`;
            });

            mensaje+=
`Subtotal: ${dinero(g.subtotal)}
🛵 Delivery: ${dinero(g.delivery)}
*Total local: ${dinero(g.subtotal+g.delivery)}*

`;
        });

        mensaje+=
`💰 *TOTAL DEL PEDIDO: ${dinero(totalGeneral)}*

`;
        mensaje+=
`🔢 ID pedido: ${pedidoId}`;

        /*
         * El carrito se limpia únicamente después
         * de que Supabase confirme el registro.
         */
        localStorage.removeItem(CARRITO_KEY);

        const whatsappUrl=
            `https://wa.me/${telefonoNegocio}?text=${encodeURIComponent(mensaje)}`;

        btn.textContent="Pedido registrado ✓";

        mostrarMensaje(
            `Pedido ${numero} registrado correctamente. Abriendo WhatsApp...`,
            "ok"
        );

        setTimeout(()=>{
            window.location.href=whatsappUrl;
        },500);

    }catch(error){

        console.error(error);

        mostrarMensaje(
            error.message||
            "No se pudo registrar el pedido. Intenta nuevamente."
        );

        btn.disabled=false;
        btn.textContent="Confirmar pedido por WhatsApp";
    }
}

carrito=leerCarrito();

if(carrito.length){
    cargarConfiguracion();
}else{
    renderPedido();
}
</script>

</body>
</html>
