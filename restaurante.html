<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local | Sobre Ruedas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{box-sizing:border-box}

:root{
 --rojo:#d62828;
 --rojo-dark:#b51f1f;
 --verde:#198754;
 --azul:#1261a0;
 --amarillo:#f4c542;
 --negro:#171717;
 --blanco:#fff;
 --gris:#f4f5f7;
 --gris2:#e5e7eb;
 --muted:#5f6670;
}

body{
 margin:0;
 background:var(--gris);
 color:var(--negro);
 font-family:Arial,Helvetica,sans-serif;
}

.header{
 background:var(--negro);
 color:#fff;
 padding:13px 16px;
 position:sticky;
 top:0;
 z-index:20;
}

.header-inner{
 max-width:1100px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:12px;
}

.brand{
 font-size:20px;
 font-weight:800;
}

.cart{
 color:#fff;
 text-decoration:none;
 background:var(--rojo);
 padding:9px 12px;
 border-radius:8px;
 font-weight:700;
}

.wrap{
 max-width:1100px;
 margin:auto;
 padding:15px;
}

.banner{
 width:100%;
 height:280px;
 object-fit:cover;
 border-radius:14px;
 background:#ddd;
}

.no-banner{
 height:180px;
 border-radius:14px;
 background:linear-gradient(135deg,var(--rojo),var(--azul));
 display:flex;
 align-items:center;
 justify-content:center;
 color:#fff;
 font-size:30px;
 font-weight:800;
 text-align:center;
 padding:20px;
}

.info{
 background:#fff;
 border-radius:14px;
 padding:18px;
 margin-top:12px;
 border:1px solid var(--gris2);
}

.title{
 font-size:28px;
 font-weight:800;
 margin-bottom:5px;
}

.category{
 color:var(--azul);
 font-weight:700;
}

.description{
 color:var(--muted);
 margin-top:10px;
 line-height:1.5;
}

.status{
 margin-top:12px;
 font-weight:800;
}

.status.open{
 color:var(--verde);
}

.status.closed{
 color:var(--rojo);
}

.hours{
 margin-top:8px;
 color:var(--muted);
 font-size:14px;
}

.products{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:14px;
 margin-top:18px;
}

.product{
 background:#fff;
 border:1px solid var(--gris2);
 border-radius:12px;
 overflow:hidden;
 display:flex;
 flex-direction:column;
}

.product-image{
 width:100%;
 height:180px;
 object-fit:cover;
 background:#eee;
}

.product-no-image{
 width:100%;
 height:180px;
 background:#e5e7eb;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#888;
 font-size:14px;
}

.product-body{
 padding:14px;
 display:flex;
 flex-direction:column;
 flex:1;
}

.product-name{
 font-weight:800;
 font-size:18px;
}

.product-description{
 color:var(--muted);
 font-size:14px;
 line-height:1.4;
 margin-top:6px;
 flex:1;
}

.product-bottom{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-top:14px;
}

.price{
 font-weight:800;
 font-size:18px;
 color:var(--rojo);
}

.add{
 border:0;
 background:var(--rojo);
 color:#fff;
 padding:9px 12px;
 border-radius:8px;
 font-weight:700;
 cursor:pointer;
}

.add:hover{
 background:var(--rojo-dark);
}

.empty{
 background:#fff;
 border-radius:12px;
 padding:25px;
 text-align:center;
 color:var(--muted);
 margin-top:18px;
}

.back{
 display:inline-block;
 margin-bottom:12px;
 color:var(--azul);
 text-decoration:none;
 font-weight:700;
}

@media(max-width:700px){
 .banner{height:210px}
 .products{grid-template-columns:1fr}
 .title{font-size:24px}
}

@media(max-width:430px){
 .product-image,
 .product-no-image{height:160px}
}
</style>
</head>

<body>

<header class="header">
<div class="header-inner">

<div class="brand">Sobre Ruedas</div>

<a href="menu.html" class="cart">
🛒 Carrito <span id="cartCount">0</span>
</a>

</div>
</header>

<main class="wrap">

<a href="index.html" class="back">← Volver a locales</a>

<div id="contenido"></div>

</main>

<script>
const params=new URLSearchParams(location.search);
const restauranteId=Number(params.get("id"));

let restaurante=null;
let productos=[];
let horarios=[];

document.addEventListener("DOMContentLoaded",async()=>{
 actualizarCarrito();
 await cargarLocal();
});

async function cargarLocal(){

 if(!restauranteId){
  mostrarError("No se especificó el local.");
  return;
 }

 try{

  const {data,error}=await supabaseClient
   .from("restaurantes")
   .select("*")
   .eq("id",restauranteId)
   .eq("activo",true)
   .maybeSingle();

  if(error)throw error;

  if(!data){
   mostrarError("Este local no está disponible.");
   return;
  }

  restaurante=data;

  const [{data:prods,error:e2},{data:hrs,error:e3}]=await Promise.all([

   supabaseClient
    .from("productos")
    .select("*")
    .eq("restaurante_id",restauranteId)
    .eq("activo",true)
    .order("id"),

   supabaseClient
    .from("horarios_restaurantes")
    .select("*")
    .eq("restaurante_id",restauranteId)
    .order("dia_semana")

  ]);

  if(e2)throw e2;
  if(e3)throw e3;

  productos=prods||[];
  horarios=hrs||[];

  pintar();

  actualizarEstado();

  setInterval(actualizarEstado,60000);

 }catch(e){

  console.error(e);

  mostrarError(
   e?.message||"No se pudo cargar el local."
  );
 }
}

function pintar(){

 const banner=restaurante.banner_url
  ? `<img class="banner"
      src="${escapeAttr(restaurante.banner_url+"?v="+Date.now())}"
      alt="${escapeAttr(restaurante.nombre)}">`
  : `<div class="no-banner">${escapeHtml(restaurante.nombre)}</div>`;

 const categoria=restaurante.categoria
  ? `<div class="category">${escapeHtml(restaurante.categoria)}</div>`
  : "";

 contenido.innerHTML=`

  ${banner}

  <section class="info">

   <div class="title">
    ${escapeHtml(restaurante.nombre)}
   </div>

   ${categoria}

   <div class="description">
    ${escapeHtml(restaurante.descripcion||"")}
   </div>

   <div id="estadoLocal" class="status"></div>

   <div id="horarioLocal" class="hours"></div>

  </section>

  <section>
   <div class="products" id="productos"></div>
  </section>
 `;

 pintarProductos();
}

function pintarProductos(){

 const box=document.getElementById("productos");

 if(!productos.length){

  box.innerHTML=`
   <div class="empty">
    Este local no tiene productos disponibles.
   </div>
  `;

  return;
 }

 box.innerHTML=productos.map(p=>{

  const imagen=p.imagen_url
   ? `<img
      class="product-image"
      src="${escapeAttr(p.imagen_url+"?v="+Date.now())}"
      alt="${escapeAttr(p.nombre)}">`
   : `<div class="product-no-image">Sin imagen</div>`;

  return `

   <article class="product">

    ${imagen}

    <div class="product-body">

     <div class="product-name">
      ${escapeHtml(p.nombre)}
     </div>

     <div class="product-description">
      ${escapeHtml(p.descripcion||"")}
     </div>

     <div class="product-bottom">

      <div class="price">
       $${Number(p.precio||0).toFixed(2)}
      </div>

      <button
       class="add"
       onclick="agregarAlCarrito(${p.id})">
       + Agregar
      </button>

     </div>

    </div>

   </article>

  `;
 }).join("");
}

function agregarAlCarrito(id){

 const producto=productos.find(p=>p.id===id);

 if(!producto)return;

 let carrito=[];

 try{
  carrito=JSON.parse(localStorage.getItem("carrito_sobre_ruedas")||"[]");
  if(!Array.isArray(carrito))carrito=[];
 }catch{
  carrito=[];
 }

 const existente=carrito.find(x=>
  Number(x.producto_id)===Number(producto.id)&&
  Number(x.restaurante_id)===Number(restaurante.id)
 );

 if(existente){

  existente.cantidad=(Number(existente.cantidad)||1)+1;

 }else{

  carrito.push({
   producto_id:producto.id,
   restaurante_id:restaurante.id,
   restaurante_nombre:restaurante.nombre,
   producto_nombre:producto.nombre,
   precio:Number(producto.precio)||0,
   cantidad:1,
   imagen_url:producto.imagen_url||""
  });
 }

 localStorage.setItem(
  "carrito_sobre_ruedas",
  JSON.stringify(carrito)
 );

 actualizarCarrito();

}

function actualizarCarrito(){

 let carrito=[];

 try{
  carrito=JSON.parse(
   localStorage.getItem("carrito_sobre_ruedas")||"[]"
  );

  if(!Array.isArray(carrito))carrito=[];
 }catch{
  carrito=[];
 }

 const total=carrito.reduce(
  (s,p)=>s+(Number(p.cantidad)||0),
  0
 );

 const el=document.getElementById("cartCount");

 if(el)el.textContent=total;
}

function obtenerEstadoLocal(){

 const ahora=new Date();

 const dia=ahora.getDay();

 const hora=String(ahora.getHours()).padStart(2,"0");
 const minuto=String(ahora.getMinutes()).padStart(2,"0");

 const actual=hora+":"+minuto;

 const todosDias=horarios.length===7;

 if(todosDias&&horarios.every(h=>
  !h.cerrado &&
  h.hora_apertura?.substring(0,5)==="00:00" &&
  (
   h.hora_cierre?.substring(0,5)==="23:59" ||
   h.hora_cierre?.substring(0,5)==="00:00"
  )
 )){

  return {
   abierto:true,
   texto:"Abierto · Siempre abierto"
  };
 }

 const h=horarios.find(x=>Number(x.dia_semana)===dia);

 if(!h||h.cerrado){

  const siguiente=buscarSiguienteHorario(dia);

  return {
   abierto:false,
   texto:siguiente
    ? `Cerrado · Abre ${siguiente}`
    : "Cerrado"
  };
 }

 const apertura=(h.hora_apertura||"00:00").substring(0,5);
 const cierre=(h.hora_cierre||"23:59").substring(0,5);

 let abierto;

 if(apertura<=cierre){
  abierto=actual>=apertura&&actual<=cierre;
 }else{
  abierto=actual>=apertura||actual<=cierre;
 }

 if(abierto){

  return {
   abierto:true,
   texto:`Abierto · Hasta las ${cierre}`
  };

 }

 return {
  abierto:false,
  texto:`Cerrado · Abre a las ${apertura}`
 };
}

function buscarSiguienteHorario(diaActual){

 for(let i=1;i<=7;i++){

  const dia=(diaActual+i)%7;

  const h=horarios.find(x=>
   Number(x.dia_semana)===dia
  );

  if(h&&!h.cerrado&&h.hora_apertura){

   const nombre=DIAS_NOMBRES[dia];

   return `${nombre} a las ${h.hora_apertura.substring(0,5)}`;
  }
 }

 return null;
}

const DIAS_NOMBRES=[
 "domingo",
 "lunes",
 "martes",
 "miércoles",
 "jueves",
 "viernes",
 "sábado"
];

function actualizarEstado(){

 const estado=obtenerEstadoLocal();

 const el=document.getElementById("estadoLocal");

 if(!el)return;

 el.textContent=estado.texto;

 el.className=
  "status "+(estado.abierto?"open":"closed");
}

function mostrarError(texto){

 contenido.innerHTML=`
  <div class="empty">
   ${escapeHtml(texto)}
  </div>
 `;
}

function escapeHtml(value){

 return String(value??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function escapeAttr(value){
 return escapeHtml(value);
}
</script>

</body>
</html>
