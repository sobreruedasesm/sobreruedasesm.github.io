```html
<!DOCTYPE html>

<head>

<meta charset="UTF-8">

<title>Sobre Ruedas</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    color: #222;
    padding-bottom: 90px;
}

header {
    background: #111827;
    color: white;
    padding: 16px 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.logo span {
    color: #22c55e;
}

.header-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

.back-button {
    background: white;
    color: #111827;
    border: none;
    padding: 10px 14px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

.back-button:hover {
    background: #e5e7eb;
}

.cart-button {
    background: #22c55e;
    border: none;
    color: white;
    padding: 10px 15px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

.restaurant-header {
    background: white;
    padding: 30px 20px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

.restaurant-icon {
    font-size: 70px;
    margin-bottom: 10px;
}

.restaurant-header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.restaurant-header p {
    color: #666;
    margin-bottom: 10px;
}

.rating {
    color: #f59e0b;
    font-weight: bold;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 20px;
}

.section-title {
    font-size: 25px;
    margin-bottom: 20px;
}

.products {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

.product {
    background: white;
    border-radius: 15px;
    padding: 20px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

.product-image {
    height: 130px;
    background: #e5e7eb;
    border-radius: 10px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 55px;
    margin-bottom: 15px;
}

.product h3 {
    margin-bottom: 8px;
}

.product-description {
    color: #666;
    font-size: 14px;
    min-height: 38px;
    margin-bottom: 12px;
}

.price {
    color: #16a34a;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 15px;
}

.add-button {
    width: 100%;
    border: none;
    background: #22c55e;
    color: white;
    padding: 12px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

.add-button:hover {
    background: #16a34a;
}

.cart-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;

    background: white;
    border-top: 1px solid #ddd;
    padding: 15px 20px;

    display: flex;
    justify-content: center;
}

.cart-bar button {
    background: #111827;
    color: white;
    border: none;

    padding: 15px 30px;
    border-radius: 10px;

    font-weight: bold;
    font-size: 16px;
    cursor: pointer;

    min-width: 280px;
}

.mensaje {
    position: fixed;
    top: 80px;

    display: none;

    z-index: 1000;
}

@media(max-width:600px) {

    .restaurant-header h1 {
        font-size: 25px;
    }

    .products {
        grid-template-columns: 1fr;
    }

    .header-buttons {
        gap: 5px;
    }

    .back-button {
        padding: 8px 10px;
        font-size: 12px;

        padding: 8px 10px;
    }

}

</style>

</head>

<body>


<header>

    <div class="logo">

        🛵 <span>Sobre</span> Ruedas

    </div>


    <div class="header-buttons">

        <button
            class="back-button"
            onclick="volverRestaurantes()"
        >

            ← Restaurantes

        </button>


        <button
            class="cart-button"
            onclick="irAlCarrito()"
        >

            🛒
            <span id="cantidadCarrito">0</span>

        </button>

    </div>

</header>



<section class="restaurant-header">

    <div
        class="restaurant-icon"
        id="iconoRestaurante"
    >
        🍔
    </div>


    <h1 id="nombreRestaurante">
        Hamburguesas Don Pepe
    </h1>


    <p id="descripcionRestaurante">
        Hamburguesas, papas y bebidas.
    </p>


    <div class="rating">
        ⭐⭐⭐⭐⭐ 4.8
    </div>

</section>



<div class="container">

    <h2 class="section-title">
        Menú
    </h2>

    <div
        class="products"
        id="productos"
    >
    </div>

</div>



<div class="cart-bar">

    <button onclick="irAlCarrito()">

        🛒 Ver pedido

        (<span id="cantidadCarrito2">0</span>)

    </button>

</div>



<div
    class="mensaje"
    id="mensaje"
>
    Producto agregado ✅
</div>



<script>


const restaurantes = {


    "Hamburguesas Don Pepe": {

        icono: "🍔",

        descripcion:
            "Hamburguesas, papas y bebidas.",

        productos: [

            {
                nombre: "Hamburguesa Clásica",
                descripcion:
                    "Carne, queso, lechuga, tomate y salsa especial.",
                precio: 4
            },

            {
                nombre: "Hamburguesa Especial",
                descripcion:
                    "Carne doble, queso, tocino y salsa especial.",
                precio: 5.50
            },

            {
                nombre: "Papas Fritas",
                descripcion:
                    "Papas fritas crujientes con salsa de la casa.",
                precio: 2
            },

            {
                nombre: "Coca-Cola",
                descripcion:
                    "Coca-Cola fría de 500 ml.",
                precio: 1.25
            }

        ]

    },


    "Pizza Esmeraldas": {

        icono: "🍕",

        descripcion:
            "Pizzas familiares y personales.",

        productos: [

            {
                nombre: "Pizza Personal",
                descripcion:
                    "Pizza personal con queso y tus ingredientes favoritos.",
                precio: 5
            },

            {
                nombre: "Pizza Familiar",
                descripcion:
                    "Pizza familiar para compartir.",
                precio: 12
            },

            {
                nombre: "Pizza Especial",
                descripcion:
                    "Jamón, pepperoni, champiñones y queso.",
                precio: 14
            },

            {
                nombre: "Coca-Cola",
                descripcion:
                    "Coca-Cola fría de 500 ml.",
                precio: 1.25
            }

        ]

    },


    "Pollo El Sabor": {

        icono: "🍗",

        descripcion:
            "Pollo asado, combos y bebidas.",

        productos: [

            {
                nombre: "Pollo Entero",
                descripcion:
                    "Pollo asado acompañado de papas y ensalada.",
                precio: 12
            },

            {
                nombre: "Medio Pollo",
                descripcion:
                    "Medio pollo asado con papas.",
                precio: 7
            },

            {
                nombre: "Combo Familiar",
                descripcion:
                    "Pollo, papas, arroz y bebidas.",
                precio: 18
            },

            {
                nombre: "Coca-Cola",
                descripcion:
                    "Coca-Cola fría de 500 ml.",
                precio: 1.25
            }

        ]

    }

};



const parametros =
    new URLSearchParams(
        window.location.search
    );


const nombre =
    parametros.get("restaurante")
    || "Hamburguesas Don Pepe";


const restaurante =
    restaurantes[nombre];


if (restaurante) {

    document.getElementById(
        "nombreRestaurante"
    ).textContent = nombre;


    document.getElementById(
        "descripcionRestaurante"
    ).textContent =
        restaurante.descripcion;


    document.getElementById(
        "iconoRestaurante"
    ).textContent =
        restaurante.icono;


    mostrarProductos(
        restaurante.productos
    );

}



function mostrarProductos(productos) {

    const contenedor =
        document.getElementById("productos");


    contenedor.innerHTML = "";


    productos.forEach(function(producto) {

        const tarjeta =
            document.createElement("div");


        tarjeta.className = "product";


        tarjeta.innerHTML = `

            <div class="product-image">
                ${obtenerIcono(producto.nombre)}
            </div>

            <h3>
                ${producto.nombre}
            </h3>

            <p class="product-description">
                ${producto.descripcion}
            </p>

            <div class="price">
                $${producto.precio.toFixed(2)}
            </div>

            <button
                class="add-button"
                onclick="agregarProducto(
                    '${producto.nombre}',
                    ${producto.precio},
                    '${nombre}'
                )"
            >

                ➕ Agregar al pedido

            </button>

        `;


        contenedor.appendChild(tarjeta);

    });

}



function obtenerIcono(nombre) {

    if (nombre.includes("Pizza"))
        return "🍕";

    if (nombre.includes("Pollo"))
        return "🍗";

    if (nombre.includes("Papas"))
        return "🍟";

    if (nombre.includes("Coca"))
        return "🥤";

    if (nombre.includes("Combo"))
        return "🍱";

    return "🍔";

}



function agregarProducto(
    nombreProducto,
    precio,
    restaurante
) {

    let carrito =
        JSON.parse(
            localStorage.getItem("carrito")
        ) || [];


    /*
    IMPORTANTE:

    Ya NO bloqueamos la compra
    cuando existe otro restaurante.

    Cada producto conserva
    el nombre de su restaurante.
    */


    let existente =
        carrito.find(
            producto =>
                producto.nombre === nombreProducto &&
                producto.restaurante === restaurante
        );


    if (existente) {

        existente.cantidad++;

    } else {

        carrito.push({

            nombre: nombreProducto,

            precio: precio,

            cantidad: 1,

            restaurante: restaurante

        });

    }


    localStorage.setItem(
        "carrito",
        JSON.stringify(carrito)
    );


    actualizarCarrito();

    mostrarMensaje();

}



function actualizarCarrito() {

    let carrito =
        JSON.parse(
            localStorage.getItem("carrito")
        ) || [];


    let cantidad =
        carrito.reduce(
            (total, producto) =>
                total + producto.cantidad,
            0
        );


    document.getElementById(
        "cantidadCarrito"
    ).textContent = cantidad;


    document.getElementById(
        "cantidadCarrito2"
    ).textContent = cantidad;

}



function mostrarMensaje() {

    const mensaje =
        document.getElementById("mensaje");


    mensaje.textContent =
        "Producto agregado al pedido ✅";


    mensaje.style.display = "block";


    setTimeout(function() {

        mensaje.style.display = "none";

    }, 1500);

}



function irAlCarrito() {

    window.location.href =
        "menu.html";

}



function volverRestaurantes() {

    window.location.href =
        "index.html";

}


actualizarCarrito();

</script>

</body>

</html>
