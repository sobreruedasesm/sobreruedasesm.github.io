<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

let restauranteActual = null;


/* =========================================
   OBTENER RESTAURANTE DESDE LA URL
========================================= */

function obtenerNombreRestaurante() {

    const parametros =
        new URLSearchParams(
            window.location.search
        );

    return parametros.get("restaurante");

}


/* =========================================
   CARGAR RESTAURANTE
========================================= */

async function cargarRestaurante() {

    const nombre =
        obtenerNombreRestaurante();


    if (!nombre) {

        mostrarError(
            "No se especificó ningún restaurante."
        );

        return;

    }


    const { data, error } =
        await supabaseClient

            .from("restaurantes")

            .select("*")

            .eq("nombre", nombre)

            .eq("activo", true)

            .single();


    if (error || !data) {

        console.error(error);

        mostrarError(
            "No encontramos este restaurante."
        );

        return;

    }


    restauranteActual = data;


    document.title =
        data.nombre + " - Sobre Ruedas";


    document.getElementById(
        "nombreRestaurante"
    ).textContent = data.nombre;


    document.getElementById(
        "descripcionRestaurante"
    ).textContent =
        data.descripcion ||
        "Deliciosos productos.";


    const categoria =
        document.querySelector(
            ".categoria"
        );


    categoria.textContent =
        "🍽️ " +
        (data.categoria || "Restaurante");


    cargarProductos(data.id);

}


/* =========================================
   CARGAR PRODUCTOS
========================================= */

async function cargarProductos(
    restauranteId
) {

    const contenedor =
        document.getElementById(
            "productos"
        );


    const { data, error } =
        await supabaseClient

            .from("productos")

            .select("*")

            .eq(
                "restaurante_id",
                restauranteId
            )

            .eq("activo", true)

            .order("nombre");


    if (error) {

        console.error(error);

        contenedor.innerHTML = `
            <div class="estado">
                ❌ No pudimos cargar el menú.
            </div>
        `;

        return;

    }


    if (!data || data.length === 0) {

        contenedor.innerHTML = `
            <div class="estado">
                🍽️
                <h3>
                    Este restaurante todavía no tiene productos.
                </h3>
                <p>
                    Pronto agregaremos su menú.
                </p>
            </div>
        `;

        return;

    }


    contenedor.innerHTML = "";


    data.forEach(producto => {

        const tarjeta =
            document.createElement("div");

        tarjeta.className = "producto";


        let imagen = "🍽️";


        if (producto.imagen_url) {

            imagen = `
                <img
                    src="${producto.imagen_url}"
                    alt="${escapeHTML(producto.nombre)}"
                    loading="lazy"
                >
            `;

        }


        tarjeta.innerHTML = `

            <div class="producto-imagen">
                ${imagen}
            </div>

            <div class="producto-contenido">

                <h3>
                    ${escapeHTML(producto.nombre)}
                </h3>

                <p class="producto-descripcion">
                    ${escapeHTML(
                        producto.descripcion ||
                        "Delicioso producto."
                    )}
                </p>

                <div class="producto-pie">

                    <span class="precio">
                        $${Number(
                            producto.precio
                        ).toFixed(2)}
                    </span>

                    <button
                        class="btn-agregar"
                        onclick='agregarAlCarrito(${JSON.stringify({
                            id: producto.id,
                            restaurante_id: producto.restaurante_id,
                            restaurante_nombre: restauranteActual.nombre,
                            nombre: producto.nombre,
                            precio: Number(producto.precio)
                        })})'
                    >
                        + Agregar
                    </button>

                </div>

            </div>

        `;


        contenedor.appendChild(tarjeta);

    });

}


/* =========================================
   AGREGAR AL CARRITO
========================================= */

function agregarAlCarrito(producto) {

    let carrito =
        JSON.parse(
            localStorage.getItem("carrito")
        ) || [];


    const existente =
        carrito.find(
            item =>
                item.id === producto.id
        );


    if (existente) {

        existente.cantidad++;

    } else {

        carrito.push({

            ...producto,

            cantidad: 1

        });

    }


    localStorage.setItem(
        "carrito",
        JSON.stringify(carrito)
    );


    actualizarCarrito();

    mostrarNotificacion(
        producto.nombre +
        " agregado al carrito ✅"
    );

}


/* =========================================
   ACTUALIZAR CARRITO
========================================= */

function actualizarCarrito() {

    const carrito =
        JSON.parse(
            localStorage.getItem("carrito")
        ) || [];


    const cantidad =
        carrito.reduce(
            (total, producto) =>
                total +
                Number(producto.cantidad || 0),
            0
        );


    document.getElementById(
        "cantidadCarrito"
    ).textContent = cantidad;

}


/* =========================================
   IR AL CARRITO
========================================= */

function irAlCarrito() {

    window.location.href =
        "menu.html";

}


/* =========================================
   NOTIFICACION
========================================= */

function mostrarNotificacion(texto) {

    const elemento =
        document.getElementById(
            "notificacion"
        );


    elemento.textContent = texto;

    elemento.style.display = "block";


    setTimeout(() => {

        elemento.style.display =
            "none";

    }, 2200);

}


/* =========================================
   ERROR
========================================= */

function mostrarError(mensaje) {

    document.getElementById(
        "nombreRestaurante"
    ).textContent = "Ups";


    document.getElementById(
        "descripcionRestaurante"
    ).textContent = mensaje;


    document.getElementById(
        "productos"
    ).innerHTML = `
        <div class="estado">
            ❌ ${mensaje}
        </div>
    `;

}


/* =========================================
   SEGURIDAD
========================================= */

function escapeHTML(texto) {

    const div =
        document.createElement("div");

    div.textContent =
        texto ?? "";

    return div.innerHTML;

}


/* =========================================
   INICIO
========================================= */

cargarRestaurante();

actualizarCarrito();

</script>


</body>

</html>
