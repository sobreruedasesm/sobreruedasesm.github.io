<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Menú - Sobre Ruedas</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        header {
            background: #111;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
        }

        button {
            cursor: pointer;
        }

        .btn-carrito {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .volver {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 8px 12px;
            border-radius: 8px;
            margin-right: 10px;
        }

        .cabecera-restaurante {
            background: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .banner-restaurante {
            max-width: 900px;
            margin: auto;
            max-height: 280px;
            overflow: hidden;
            border-radius: 15px;
        }

        .banner-restaurante img {
            width: 100%;
            max-height: 280px;
            object-fit: cover;
        }

        .productos {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .producto {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0,0,0,.08);
        }

        .producto-imagen {
            height: 150px;
            background: #eee;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .producto-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .producto h3 {
            margin: 5px 0;
        }

        .precio {
            font-size: 21px;
            font-weight: bold;
            color: #ff5722;
            margin: 10px 0;
        }

        .btn-agregar {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #ff9800;
            color: white;
            font-weight: bold;
        }

        .mensaje {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: white;
            padding: 14px 20px;
            border-radius: 10px;
            display: none;
            z-index: 200;
        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        🛵 Sobre Ruedas
    </div>

    <div>

        <button
            class="volver"
            onclick="volverRestaurantes()"
        >
            ← Restaurantes
        </button>

        <button
            class="btn-carrito"
            onclick="irAlCarrito()"
        >
            🛒 Carrito
            (<span id="cantidadCarrito">0</span>)
        </button>

    </div>

</header>


<section class="cabecera-restaurante">

    <div
        id="bannerRestaurante"
        class="banner-restaurante"
    ></div>

    <h1 id="nombreRestaurante">
        Restaurante
    </h1>

    <p id="descripcionRestaurante"></p>

</section>


<main>

    <div
        id="productos"
        class="productos"
    ></div>

</main>


<div id="mensaje" class="mensaje">
    Producto agregado
</div>


<script src="config.js"></script>

<script>


const productosBase = {

    "Hamburguesas Don Pepe": [

        {
            nombre: "Hamburguesa Clásica",
            precio: 4,
            icono: "🍔"
        },

        {
            nombre: "Hamburguesa Especial",
            precio: 5.50,
            icono: "🍔"
        },

        {
            nombre: "Papas Fritas",
            precio: 2,
            icono: "🍟"
        },

        {
            nombre: "Coca-Cola",
            precio: 1.25,
            icono: "🥤"
        }

    ],


    "Pizza Esmeraldas": [

        {
            nombre: "Pizza Personal",
            precio: 5,
            icono: "🍕"
        },

        {
            nombre: "Pizza Familiar",
            precio: 12,
            icono: "🍕"
        },

        {
            nombre: "Pizza Especial",
            precio: 14,
            icono: "🍕"
        },

        {
            nombre: "Coca-Cola",
            precio: 1.25,
            icono: "🥤"
        }

    ],


    "Pollo El Sabor": [

        {
            nombre: "Pollo Entero",
            precio: 12,
            icono: "🍗"
        },

        {
            nombre: "Medio Pollo",
            precio: 7,
            icono: "🍗"
        },

        {
            nombre: "Combo Familiar",
            precio: 18,
            icono: "🍗"
        },

        {
            nombre: "Coca-Cola",
            precio: 1.25,
            icono: "🥤"
        }

    ]

};


function obtenerProductos(restaurante) {

    const productosGuardados =
        JSON.parse(localStorage.getItem("productos")) || {};

    if (productosGuardados[restaurante]) {

        return productosGuardados[restaurante];

    }

    return productosBase[restaurante] || [];

}


function obtenerRestaurante() {

    const params =
        new URLSearchParams(window.location.search);

    return params.get("restaurante");

}


function cargarRestaurante() {

    const nombre =
        obtenerRestaurante();

    if (!nombre) {

        window.location.href = "index.html";
        return;

    }

    const restaurantes =
        JSON.parse(localStorage.getItem("restaurantes")) || {};

    const datos =
        restaurantes[nombre] || {};

    document.getElementById("nombreRestaurante")
        .textContent = nombre;

    document.getElementById("descripcionRestaurante")
        .textContent =
            datos.descripcion ||
            "Deliciosos productos para ti.";


    if (datos.banner) {

        document.getElementById("bannerRestaurante")
            .innerHTML = `
                <img
                    src="${datos.banner}"
                    alt="${nombre}"
                >
            `;

    } else {

        document.getElementById("bannerRestaurante")
            .innerHTML = "🍽️";

    }


    mostrarProductos(nombre);

}


function mostrarProductos(restaurante) {

    const productos =
        obtenerProductos(restaurante);

    const contenedor =
        document.getElementById("productos");

    contenedor.innerHTML = "";


    if (productos.length === 0) {

        contenedor.innerHTML = `
            <div>
                No hay productos disponibles.
            </div>
        `;

        return;

    }


    productos.forEach(producto => {

        const tarjeta =
            document.createElement("div");

        tarjeta.className = "producto";


        const imagen =
            producto.imagen
                ? `<img src="${producto.imagen}" alt="${producto.nombre}">`
                : producto.icono || "🍽️";


        tarjeta.innerHTML = `

            <div class="producto-imagen">
                ${imagen}
            </div>

            <h3>
                ${producto.nombre}
            </h3>

            <div class="precio">
                $${Number(producto.precio).toFixed(2)}
            </div>

            <button
                class="btn-agregar"
                onclick="agregarProducto(
                    '${escapeTexto(producto.nombre)}',
                    ${producto.precio},
                    '${escapeTexto(restaurante)}'
                )"
            >
                + Agregar
            </button>

        `;


        contenedor.appendChild(tarjeta);

    });

}


function escapeTexto(texto) {

    return texto
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}


function agregarProducto(
    nombreProducto,
    precio,
    restaurante
) {

    let carrito =
        JSON.parse(localStorage.getItem("carrito")) || [];


    const existente =
        carrito.find(item =>
            item.nombre === nombreProducto &&
            item.restaurante === restaurante
        );


    if (existente) {

        existente.cantidad++;

    } else {

        carrito.push({

            nombre: nombreProducto,
            precio: Number(precio),
            cantidad: 1,
            restaurante: restaurante

        });

    }


    localStorage.setItem(
        "carrito",
        JSON.stringify(carrito)
    );


    actualizarCarrito();

    mostrarMensaje(
        `${nombreProducto} agregado al carrito`
    );

}


function actualizarCarrito() {

    const carrito =
        JSON.parse(localStorage.getItem("carrito")) || [];

    const cantidad =
        carrito.reduce(
            (total, producto) =>
                total + producto.cantidad,
            0
        );

    document.getElementById("cantidadCarrito")
        .textContent = cantidad;

}


function mostrarMensaje(texto) {

    const mensaje =
        document.getElementById("mensaje");

    mensaje.textContent = texto;

    mensaje.style.display = "block";

    setTimeout(() => {

        mensaje.style.display = "none";

    }, 1800);

}


function irAlCarrito() {

    window.location.href = "menu.html";

}


function volverRestaurantes() {

    window.location.href = "index.html";

}


cargarRestaurante();
actualizarCarrito();

</script>

</body>
</html>
