<header>
 <h1 id="nombreHeader">Sobre Ruedas</h1>
 <p>Delivery en Esmeraldas</p>
</header>

<main>

<a class="volver" href="index.html">
 ← Volver a locales
</a>

<div id="local"></div>

<div id="mensajeCerrado"></div>

<h2 class="titulo-productos">
 Productos
</h2>

<div id="productos" class="productos"></div>

</main>

<div
 class="carrito"
 onclick="location.href='menu.html'"
>
 🛒 Carrito <span id="contador">0</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

const params=
 new URLSearchParams(location.search);

const restauranteId=
 params.get("id");

const ZONA_ECUADOR=
 "America/Guayaquil";

let restaurante=null;
let productos=[];
let horarios=[];
let localAbierto=false;

const localEl=
 document.getElementById("local");

const productosEl=
 document.getElementById("productos");

const contador=
 document.getElementById("contador");

const nombreHeader=
 document.getElementById("nombreHeader");

const mensajeCerradoEl=
 document.getElementById("mensajeCerrado");


/* =========================================
   UTILIDADES
========================================= */

function escapeHtml(valor=""){

 return String(valor).replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m])
 );

}


function imagenUrl(url){

 if(!url)
  return "";

 const separador=
  url.includes("?")?"&":"?";

 return url+
  separador+
  "v="+Date.now();

}


function obtenerCarrito(){

 try{

  const carrito=
   JSON.parse(
    localStorage.getItem("carrito")||"[]"
   );

  return Array.isArray(carrito)
   ? carrito
   : [];

 }catch{

  return [];

 }

}


function guardarCarrito(carrito){

 localStorage.setItem(
  "carrito",
  JSON.stringify(carrito)
 );

}


function actualizarCarrito(){

 const carrito=
  obtenerCarrito();

 const cantidad=
  carrito.reduce(
   (total,item)=>
    total+(Number(item.cantidad)||0),
   0
  );

 contador.textContent=
  cantidad;

}


/* =========================================
   HORA ACTUAL DE ECUADOR
========================================= */

function obtenerFechaEcuador(){

 /*
  Obtiene la fecha/hora actual expresada
  específicamente en America/Guayaquil.

  Esto evita depender de la zona horaria
  configurada en el dispositivo.
 */

 const partes=
  new Intl.DateTimeFormat(
   "en-US",
   {
    timeZone:ZONA_ECUADOR,
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    weekday:"short",
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hourCycle:"h23"
   }
  ).formatToParts(new Date());

 const valores={};

 partes.forEach(parte=>{
  if(parte.type!=="literal"){
   valores[parte.type]=parte.value;
  }
 });


 const mapaDias={
  Sun:0,
  Mon:1,
  Tue:2,
  Wed:3,
  Thu:4,
  Fri:5,
  Sat:6
 };


 return {
  anio:Number(valores.year),
  mes:Number(valores.month),
  diaMes:Number(valores.day),
  diaSemana:mapaDias[valores.weekday],
  hora:Number(valores.hour),
  minuto:Number(valores.minute),
  segundo:Number(valores.second)
 };

}


function minutosActualesEcuador(){

 const ahora=
  obtenerFechaEcuador();

 return (
  ahora.hora*60+
  ahora.minuto
 );

}


/* =========================================
   CONVERSIÓN DE HORA
========================================= */

function minutosDesdeMedianoche(hora){

 if(!hora)
  return null;

 const partes=
  String(hora)
   .substring(0,5)
   .split(":");

 const horas=
  Number(partes[0]);

 const minutos=
  Number(partes[1]);

 if(
  !Number.isFinite(horas)||
  !Number.isFinite(minutos)
 )
  return null;

 return horas*60+minutos;

}


/* =========================================
   ESTADO DEL LOCAL
========================================= */

function obtenerEstadoLocal(){

 if(!horarios.length){

  return {
   abierto:false,
   horario:null,
   motivo:"Sin horario disponible"
  };

 }


 const ahora=
  obtenerFechaEcuador();

 const dia=
  ahora.diaSemana;

 const minutosActuales=
  ahora.hora*60+
  ahora.minuto;


 /*
  Horario correspondiente al día actual.
 */
 const horarioHoy=
  horarios.find(
   h=>Number(h.dia_semana)===dia
  );


 /*
  Revisamos también el día anterior
  por si existe un horario que cruza
  medianoche.

  Ejemplo:

  viernes 18:00 - 02:00

  El sábado a la 01:00 sigue abierto.
 */
 const diaAnterior=
  dia===0
   ? 6
   : dia-1;

 const horarioAnterior=
  horarios.find(
   h=>Number(h.dia_semana)===diaAnterior
  );


 /* =====================================
    HORARIO DEL DÍA ANTERIOR
    QUE CONTINÚA DESPUÉS DE MEDIANOCHE
 ===================================== */

 if(
  horarioAnterior &&
  !horarioAnterior.cerrado &&
  horarioAnterior.hora_apertura &&
  horarioAnterior.hora_cierre
 ){

  const aperturaAnterior=
   minutosDesdeMedianoche(
    horarioAnterior.hora_apertura
   );

  const cierreAnterior=
   minutosDesdeMedianoche(
    horarioAnterior.hora_cierre
   );


  if(
   aperturaAnterior!==null &&
   cierreAnterior!==null &&
   cierreAnterior<aperturaAnterior &&
   minutosActuales<cierreAnterior
  ){

   return {
    abierto:true,
    horario:horarioAnterior
   };

  }

 }


 /* =====================================
    HORARIO DEL DÍA ACTUAL
 ===================================== */

 if(
  !horarioHoy||
  horarioHoy.cerrado||
  !horarioHoy.hora_apertura||
  !horarioHoy.hora_cierre
 ){

  return {
   abierto:false,
   horario:horarioHoy||null
  };

 }


 const apertura=
  minutosDesdeMedianoche(
   horarioHoy.hora_apertura
  );

 const cierre=
  minutosDesdeMedianoche(
   horarioHoy.hora_cierre
  );


 if(
  apertura===null||
  cierre===null
 ){

  return {
   abierto:false,
   horario:horarioHoy
  };

 }


 /* =====================================
    HORARIO NORMAL
    Ejemplo 10:00 - 22:00
 ===================================== */

 if(cierre>apertura){

  if(
   minutosActuales>=apertura &&
   minutosActuales<cierre
  ){

   return {
    abierto:true,
    horario:horarioHoy
   };

  }

 }


 /* =====================================
    HORARIO QUE CRUZA MEDIANOCHE
    Ejemplo 18:00 - 02:00
 ===================================== */

 else if(cierre<apertura){

  if(
   minutosActuales>=apertura||
   minutosActuales<cierre
  ){

   return {
    abierto:true,
    horario:horarioHoy
   };

  }

 }


 return {
  abierto:false,
  horario:horarioHoy
 };

}


/* =========================================
   FORMATO DE HORARIO
========================================= */

function formatearHora(hora){

 if(!hora)
  return "";

 return String(hora).substring(0,5);

}


function formatearHorario(horario){

 if(!horario)
  return "";

 if(horario.cerrado)
  return "Cerrado";

 if(
  !horario.hora_apertura||
  !horario.hora_cierre
 )
  return "Horario no definido";

 return (
  formatearHora(
   horario.hora_apertura
  )+
  " - "+
  formatearHora(
   horario.hora_cierre
  )
 );

}


/* =========================================
   PRÓXIMA APERTURA
========================================= */

function obtenerProximoHorario(){

 if(!horarios.length)
  return null;

 const ahora=
  obtenerFechaEcuador();

 const diaActual=
  ahora.diaSemana;

 const minutosActuales=
  ahora.hora*60+
  ahora.minuto;


 for(let i=0;i<7;i++){

  const dia=
   (diaActual+i)%7;

  const horario=
   horarios.find(
    h=>Number(h.dia_semana)===dia
   );

  if(
   !horario||
   horario.cerrado||
   !horario.hora_apertura
  )
   continue;


  const apertura=
   minutosDesdeMedianoche(
    horario.hora_apertura
   );


  if(
   i>0||
   (
    apertura!==null&&
    apertura>minutosActuales
   )
  ){

   return {
    dia,
    horario
   };

  }

 }


 return null;

}


function nombreDia(dia){

 const dias=[
  "domingo",
  "lunes",
  "martes",
  "miércoles",
  "jueves",
  "viernes",
  "sábado"
 ];

 return dias[dia]||"";

}


/* =========================================
   ACTUALIZAR ESTADO VISUAL
========================================= */

function actualizarEstado(){

 if(!restaurante)
  return;

 const estado=
  obtenerEstadoLocal();

 localAbierto=
  estado.abierto;


 const estadoEl=
  document.getElementById(
   "estadoLocal"
  );

 if(!estadoEl)
  return;


 if(localAbierto){

  const horarioTexto=
   formatearHorario(
    estado.horario
   );


  estadoEl.innerHTML=`

   <div class="estado estado-abierto">

    <span>
     🟢 Local abierto
    </span>

    ${
     horarioTexto
     ?
     `<span class="horario">
       Horario: ${escapeHtml(horarioTexto)}
      </span>`
     :
     ""
    }

   </div>

  `;


  mensajeCerradoEl.innerHTML="";


 }else{

  const proximo=
   obtenerProximoHorario();

  let textoProximo="";


  if(proximo){

   textoProximo=
    `Próxima apertura: ${
     nombreDia(proximo.dia)
    } a las ${
     formatearHora(
      proximo.horario.hora_apertura
     )
    }`;

  }


  estadoEl.innerHTML=`

   <div class="estado estado-cerrado">

    <span>
     🔴 Local cerrado
    </span>

    <span class="horario">
     ${
      textoProximo||
      "No disponible en este momento"
     }
    </span>

   </div>

  `;


  mensajeCerradoEl.innerHTML=`

   <div class="mensaje-cerrado">

    <strong>
     🔴 El local está cerrado
    </strong>

    ${
     textoProximo
     ?
     escapeHtml(textoProximo)
     :
     "No puedes realizar compras en este momento."
    }

   </div>

  `;

 }


 /*
  Vuelve a pintar los productos para
  activar/desactivar los botones.
 */
 renderProductos();

}


/* =========================================
   CARGAR INFORMACIÓN
========================================= */

async function cargar(){

 if(!restauranteId){

  localEl.innerHTML=
   '<div class="mensaje">No se especificó el local.</div>';

  productosEl.innerHTML="";

  return;

 }


 try{

  /* =====================================
     LOCAL
  ===================================== */

  const {
   data,
   error
  }=
   await supabaseClient
    .from("restaurantes")
    .select("*")
    .eq("id",restauranteId)
    .eq("activo",true)
    .single();


  if(error)
   throw error;


  if(!data){

   localEl.innerHTML=
    '<div class="mensaje">El local no está disponible.</div>';

   return;

  }


  restaurante=data;

  nombreHeader.textContent=
   restaurante.nombre||
   "Sobre Ruedas";


  /* =====================================
     PRODUCTOS
  ===================================== */

  const respuestaProductos=
   await supabaseClient
    .from("productos")
    .select("*")
    .eq("restaurante_id",restaurante.id)
    .eq("activo",true)
    .order("nombre",{ascending:true});


  if(respuestaProductos.error)
   throw respuestaProductos.error;


  productos=
   respuestaProductos.data||[];


  /* =====================================
     HORARIOS
  ===================================== */

  const respuestaHorarios=
   await supabaseClient
    .from("horarios_restaurantes")
    .select("*")
    .eq("restaurante_id",restaurante.id)
    .order("dia_semana",{ascending:true});


  if(respuestaHorarios.error)
   throw respuestaHorarios.error;


  horarios=
   respuestaHorarios.data||[];


  renderLocal();

  actualizarEstado();

 }catch(error){

  console.error(
   "Error cargando local:",
   error
  );

  localEl.innerHTML=
   '<div class="mensaje">No se pudo cargar el local.</div>';

  productosEl.innerHTML="";

 }

}


/* =========================================
   RENDER LOCAL
========================================= */

function renderLocal(){

 const imagen=
  imagenUrl(
   restaurante.banner_url
  );

 const nombre=
  escapeHtml(
   restaurante.nombre||""
  );

 const categoria=
  escapeHtml(
   restaurante.categoria||""
  );

 const descripcion=
  escapeHtml(
   restaurante.descripcion||""
  );


 localEl.innerHTML=`

  <div class="local">

   ${
    imagen

    ?

    `<img
      class="banner"
      src="${escapeHtml(imagen)}"
      alt="${nombre}"
      onerror="this.outerHTML='<div class=\\'sin-imagen\\'>Sin imagen</div>'"
    >`

    :

    `<div class="sin-imagen">
      Sin imagen
    </div>`
   }

   <div class="info">

    <h2>${nombre}</h2>

    ${
     categoria
     ?
     `<div class="badge">
       ${categoria}
      </div>`
     :
     ""
    }

    ${
     descripcion
     ?
     `<p>${descripcion}</p>`
     :
     ""
    }

    <div id="estadoLocal"></div>

   </div>

  </div>

 `;

}


/* =========================================
   RENDER PRODUCTOS
========================================= */

function renderProductos(){

 if(!productos.length){

  productosEl.innerHTML=
   '<div class="mensaje">Este local no tiene productos disponibles.</div>';

  return;

 }


 productosEl.innerHTML=
  productos.map(producto=>{

   const imagen=
    imagenUrl(
     producto.imagen_url
    );

   const nombre=
    escapeHtml(
     producto.nombre||""
    );

   const descripcion=
    escapeHtml(
     producto.descripcion||""
    );

   const precio=
    Number(
     producto.precio||0
    ).toFixed(2);


   return `

    <article
     class="producto ${
      !localAbierto
      ?"cerrado"
      :""
     }"
    >

     ${
      imagen

      ?

      `<img
        class="producto-imagen"
        src="${escapeHtml(imagen)}"
        alt="${nombre}"
        onerror="this.outerHTML='<div class=\\'sin-imagen-producto\\'>Sin imagen</div>'"
      >`

      :

      `<div class="sin-imagen-producto">
        Sin imagen
      </div>`
     }


     <div class="producto-info">

      <h3>${nombre}</h3>

      ${
       descripcion
       ?
       `<p>${descripcion}</p>`
       :
       ""
      }

      <div class="precio">
       $${precio}
      </div>


      <button
       type="button"
       onclick="agregarProducto(${Number(producto.id)})"
       ${!localAbierto?"disabled":""}
      >

       ${
        localAbierto
        ?
        "Agregar al carrito"
        :
        "Local cerrado"
       }

      </button>

     </div>

    </article>

   `;

  }).join("");

}


/* =========================================
   AGREGAR AL CARRITO
========================================= */

function agregarProducto(id){

 /*
  Segunda validación del horario.

  Esto evita que alguien pueda ejecutar
  manualmente la función aunque el botón
  esté deshabilitado.
 */

 const estado=
  obtenerEstadoLocal();

 if(!estado.abierto){

  localAbierto=false;

  renderProductos();

  alert(
   "Este local está cerrado. No puedes agregar productos en este momento."
  );

  return;

 }


 localAbierto=true;


 const producto=
  productos.find(
   p=>Number(p.id)===Number(id)
  );


 if(
  !producto||
  !restaurante
 )
  return;


 const carrito=
  obtenerCarrito();


 const existente=
  carrito.find(
   item=>
    Number(item.producto_id)===
    Number(producto.id)
  );


 if(existente){

  existente.cantidad=
   (Number(existente.cantidad)||0)+1;

 }else{

  carrito.push({

   producto_id:
    producto.id,

   restaurante_id:
    restaurante.id,

   restaurante_nombre:
    restaurante.nombre,

   producto_nombre:
    producto.nombre,

   precio:
    Number(producto.precio)||0,

   cantidad:1,

   imagen_url:
    producto.imagen_url||""

  });

 }


 guardarCarrito(carrito);

 actualizarCarrito();

}


/* =========================================
   INICIO
========================================= */

actualizarCarrito();

cargar();


/*
  Actualiza el estado cada minuto.

  Ejemplo:
  si el local abre a las 10:00 y el usuario
  tiene la página abierta desde las 09:59,
  a las 10:00 los botones se habilitarán.
 */
setInterval(
 actualizarEstado,
 60000
);


window.addEventListener(
 "storage",
 actualizarCarrito
);
