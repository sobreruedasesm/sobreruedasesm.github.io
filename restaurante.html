<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local | Sobre Ruedas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f5ee;color:#26352d}
header{background:#2f5d45;color:#fff;padding:18px 20px}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;color:#e7f0e8}
main{max-width:1100px;margin:auto;padding:20px}
.volver{display:inline-block;margin-bottom:15px;color:#2f5d45;text-decoration:none;font-weight:bold}
.local{background:#fffdf9;border-radius:14px;overflow:hidden;border:1px solid #eee5d8;box-shadow:0 3px 12px #5b463322;margin-bottom:20px}
.banner{width:100%;height:240px;object-fit:cover;display:block;background:#e9e1d3}
.sin-imagen{height:180px;display:flex;align-items:center;justify-content:center;background:#ebe3d5;color:#7a8178}
.info{padding:18px}
.info h2{margin:0 0 6px;color:#2f5d45}
.info p{margin:6px 0;color:#68736b}
.badge{color:#d06f39;font-size:13px;font-weight:bold}
.productos{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}
.producto{background:#fffdf9;border:1px solid #eee5d8;border-radius:14px;overflow:hidden;box-shadow:0 3px 10px #5b46331c}
.producto img{width:100%;height:170px;object-fit:cover;display:block;background:#e9e1d3}
.producto-info{padding:14px}
.producto h3{margin:0 0 6px;color:#2f5d45}
.producto p{margin:5px 0;color:#68736b;font-size:14px}
.precio{font-size:18px;font-weight:bold;color:#d06f39;margin:10px 0}
button{width:100%;border:0;border-radius:9px;background:#d97941;color:#fff;padding:11px;cursor:pointer;font-weight:bold}
button:hover{background:#c86832}
.carrito{position:fixed;right:20px;bottom:20px;background:#d97941;color:#fff;border-radius:50px;padding:14px 18px;cursor:pointer;box-shadow:0 4px 12px #5b463344;font-weight:bold}
.carrito:hover{background:#c86832}
.mensaje{padding:25px;background:#fffdf9;border-radius:12px;border:1px solid #eee5d8;color:#68736b}
</style>
</head>

<body>

<header>
<h1 id="nombreHeader">Sobre Ruedas</h1>
<p>Delivery en Esmeraldas</p>
</header>

<main>
<a class="volver" href="index.html">← Volver a locales</a>

<div id="local"></div>
<div id="productos" class="productos"></div>
</main>

<div class="carrito" onclick="location.href='menu.html'">
🛒 Carrito <span id="contador">0</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const params=new URLSearchParams(location.search);
const restauranteId=params.get("id");

let restaurante=null;
let productos=[];

function escapeHtml(v=""){
 return String(v).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function imagenUrl(url){
 if(!url)return "";
 const separador=url.includes("?")?"&":"?";
 return url+separador+"v="+Date.now();
}

async function cargar(){
 if(!restauranteId){
  localEl.innerHTML='<div class="mensaje">No se especificó el local.</div>';
  return;
 }

 try{
  const {data,error}=await supabaseClient
   .from("restaurantes")
   .select("*")
   .eq("id",restauranteId)
   .eq("activo",true)
   .single();

  if(error)throw error;

  restaurante=data;
  nombreHeader.textContent=restaurante.nombre;

  const respuesta=await supabaseClient
   .from("productos")
   .select("*")
   .eq("restaurante_id",restaurante.id)
   .eq("activo",true)
   .order("nombre");

  if(respuesta.error)throw respuesta.error;

  productos=respuesta.data||[];

  renderLocal();
  renderProductos();
 }catch(e){
  console.error(e);
  localEl.innerHTML='<div class="mensaje">No se pudo cargar el local.</div>';
 }
}

function renderLocal(){
 const imagen=imagenUrl(restaurante.banner_url);

 localEl.innerHTML=`
  <div class="local">
   ${
    imagen
    ? `<img class="banner"
        src="${escapeHtml(imagen)}"
        alt="${escapeHtml(restaurante.nombre)}"
        onerror="this.outerHTML='<div class=\\'sin-imagen\\'>Sin imagen</div>'">`
    : `<div class="sin-imagen">Sin imagen</div>`
   }
   <div class="info">
    <h2>${escapeHtml(restaurante.nombre)}</h2>
    <div class="badge">${escapeHtml(restaurante.categoria||"")}</div>
    <p>${escapeHtml(restaurante.descripcion||"")}</p>
   </div>
  </div>
 `;
}

function renderProductos(){
 if(!productos.length){
  productosEl.innerHTML='<div class="mensaje">Este local no tiene productos disponibles.</div>';
  return;
 }

 productosEl.innerHTML=productos.map(p=>{
  const imagen=imagenUrl(p.imagen_url);

  return `
   <article class="producto">
    ${
     imagen
     ? `<img
          src="${escapeHtml(imagen)}"
          alt="${escapeHtml(p.nombre)}"
          onerror="this.style.display='none'">`
     : ""
    }
    <div class="producto-info">
     <h3>${escapeHtml(p.nombre)}</h3>
     <p>${escapeHtml(p.descripcion||"")}</p>
     <div class="precio">$${Number(p.precio||0).toFixed(2)}</div>
     <button onclick="agregarProducto(${p.id})">
      Agregar al carrito
     </button>
    </div>
   </article>
  `;
 }).join("");
}

function agregarProducto(id){
 const producto=productos.find(p=>Number(p.id)===Number(id));
 if(!producto)return;

 let carrito=[];

 try{
  carrito=JSON.parse(localStorage.getItem("carrito")||"[]");
  if(!Array.isArray(carrito))carrito=[];
 }catch{
  carrito=[];
 }

 const existente=carrito.find(p=>
  Number(p.producto_id)===Number(producto.id)
 );

 if(existente){
  existente.cantidad=(Number(existente.cantidad)||0)+1;
 }else{
  carrito.push({
   producto_id:producto.id,
   restaurante_id:restaurante.id,
   restaurante_nombre:restaurante.nombre,
   producto_nombre:producto.nombre,
   precio:Number(producto.precio)||0,
   cantidad:1,
   imagen_url:producto.imagen_url||""
  });
 }

 localStorage.setItem("carrito",JSON.stringify(carrito));
 actualizarCarrito();
}

function actualizarCarrito(){
 try{
  const carrito=JSON.parse(localStorage.getItem("carrito")||"[]");
  contador.textContent=carrito.reduce(
   (total,p)=>total+(Number(p.cantidad)||0),0
  );
 }catch{
  contador.textContent="0";
 }
}

const localEl=document.getElementById("local");
const productosEl=document.getElementById("productos");
const contador=document.getElementById("contador");
const nombreHeader=document.getElementById("nombreHeader");

actualizarCarrito();
cargar();

window.addEventListener("storage",actualizarCarrito);
</script>

</body>
</html>
