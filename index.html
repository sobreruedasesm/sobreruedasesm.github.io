<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sobre Ruedas - Delivery Esmeraldas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .carrito-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .hero {
            background: linear-gradient(135deg, #ff9800, #ff5722);
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        .hero h1 {
            margin: 0 0 10px;
        }

        .hero p {
            margin: 0;
        }

        .busqueda {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .busqueda input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .categorias {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 15px 20px;
            max-width: 1000px;
            margin: auto;
        }

        .categoria {
            background: white;
            border: 1px solid #ddd;
            padding: 10px 15px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
            padding: 10px 15px 40px;
        }

        .titulo-seccion {
            margin-top: 20px;
        }

        .restaurantes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .restaurante {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,.08);
        }

        .restaurante-imagen {
            height: 180px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            overflow: hidden;
        }

        .restaurante-imagen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .restaurante-contenido {
            padding: 18px;
        }

        .restaurante h3 {
            margin-top: 0;
        }

        .btn-menu {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #ff9800;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .vacio {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        🛵 Sobre Ruedas
    </div>

    <button class="carrito-btn" onclick="irAlCarrito()">
        🛒 Carrito (<span id="cantidadCarrito">0</span>)
    </button>

</header>


<section class="hero">

    <h1>¿Qué quieres pedir hoy?</h1>

    <p>
        Tu comida. Tu ciudad. Tu delivery.
    </p>

</section>


<div class="busqueda">

    <input
        type="text"
        id="buscar"
        placeholder="🔎 Buscar restaurante..."
        oninput="filtrarRestaurantes()"
    >

</div>


<div class="categorias">

    <button class="categoria" onclick="filtrarCategoria('Hamburguesas')">
        🍔 Hamburguesas
    </button>

    <button class="categoria" onclick="filtrarCategoria('Pizza')">
        🍕 Pizza
    </button>

    <button class="categoria" onclick="filtrarCategoria('Pollo')">
        🍗 Pollo
    </button>

    <button class="categoria" onclick="filtrarCategoria('Bebidas')">
        🥤 Bebidas
    </button>

    <button class="categoria" onclick="filtrarCategoria('Tiendas')">
        🛒 Tiendas
    </button>

    <button class="categoria" onclick="mostrarTodos()">
        Ver todos
    </button>

</div>


<main class="contenedor">

    <h2 class="titulo-seccion">
        Restaurantes
    </h2>

    <div id="restaurantes" class="restaurantes"></div>

</main>


<footer>

    <strong>🛵 Sobre Ruedas</strong>

    <p>
        Tu comida. Tu ciudad. Tu delivery.
    </p>

    <p>
        Esmeraldas, Ecuador
    </p>

</footer>


<script src="config.js"></script>

<script>

const restaurantesBase = {

    "Hamburguesas Don Pepe": {
        categoria: "Hamburguesas",
        descripcion: "Hamburguesas, papas y bebidas."
    },

    "Pizza Esmeraldas": {
        categoria: "Pizza",
        descripcion: "Pizzas y bebidas."
    },

    "Pollo El Sabor": {
        categoria: "Pollo",
        descripcion: "Pollo y combos familiares."
    }

};


function obtenerRestaurantes() {

    const restaurantesGuardados =
        JSON.parse(localStorage.getItem("restaurantes")) || {};

    return {
        ...restaurantesBase,
        ...restaurantesGuardados
    };

}


function mostrarRestaurantes(lista = null) {

    const restaurantes = lista || obtenerRestaurantes();

    const contenedor =
        document.getElementById("restaurantes");

    contenedor.innerHTML = "";

    const nombres = Object.keys(restaurantes);

    if (nombres.length === 0) {

        contenedor.innerHTML = `
            <div class="vacio">
                No hay restaurantes disponibles.
            </div>
        `;

        return;
    }


    nombres.forEach(nombre => {

        const restaurante = restaurantes[nombre];

        let imagen = "";

        if (restaurante.banner) {

            imagen = `
                <img
                    src="${restaurante.banner}"
                    alt="${nombre}"
                >
            `;

        } else {

            imagen = "🍽️";

        }


        const tarjeta = document.createElement("div");

        tarjeta.className = "restaurante";

        tarjeta.innerHTML = `

            <div class="restaurante-imagen">
                ${imagen}
            </div>

            <div class="restaurante-contenido">

                <h3>${nombre}</h3>

                <p>
                    ${restaurante.descripcion || "Deliciosos productos."}
                </p>

                <button
                    class="btn-menu"
                    onclick="verMenu('${encodeURIComponent(nombre)}')"
                >
                    Ver menú
                </button>

            </div>
        `;

        contenedor.appendChild(tarjeta);

    });

}


function verMenu(nombre) {

    window.location.href =
        "restaurante.html?restaurante=" + nombre;

}


function filtrarRestaurantes() {

    const texto =
        document.getElementById("buscar").value.toLowerCase();

    const restaurantes = obtenerRestaurantes();

    const filtrados = {};

    Object.keys(restaurantes).forEach(nombre => {

        const r = restaurantes[nombre];

        if (
            nombre.toLowerCase().includes(texto) ||
            (r.descripcion || "").toLowerCase().includes(texto)
        ) {

            filtrados[nombre] = r;

        }

    });

    mostrarRestaurantes(filtrados);

}


function filtrarCategoria(categoria) {

    const restaurantes = obtenerRestaurantes();

    const filtrados = {};

    Object.keys(restaurantes).forEach(nombre => {

        if (
            restaurantes[nombre].categoria === categoria
        ) {

            filtrados[nombre] =
                restaurantes[nombre];

        }

    });

    mostrarRestaurantes(filtrados);

}


function mostrarTodos() {

    mostrarRestaurantes();

}


function actualizarCarrito() {

    const carrito =
        JSON.parse(localStorage.getItem("carrito")) || [];

    const cantidad =
        carrito.reduce(
            (total, producto) =>
                total + producto.cantidad,
            0
        );

    document.getElementById("cantidadCarrito")
        .textContent = cantidad;

}


function irAlCarrito() {

    window.location.href = "menu.html";

}


mostrarRestaurantes();
actualizarCarrito();

</script>

</body>
</html>
