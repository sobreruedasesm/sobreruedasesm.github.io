<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sobre Ruedas | Esmeraldas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
:root{
 --rojo:#d62828;
 --rojo2:#b51f1f;
 --verde:#198754;
 --verde2:#146c43;
 --azul:#1261a0;
 --amarillo:#f4c542;
 --negro:#171717;
 --blanco:#fff;
 --gris:#f4f5f7;
 --gris2:#e5e7eb;
 --muted:#626a73;
 --shadow:0 4px 15px rgba(0,0,0,.08);
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:var(--gris);
 color:var(--negro);
 font-family:Arial,Helvetica,sans-serif;
}

header{
 background:var(--negro);
 color:#fff;
 border-top:5px solid var(--rojo);
 padding:14px 16px;
 position:sticky;
 top:0;
 z-index:20;
 box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
 max-width:1100px;
 margin:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
}

.logo{
 font-size:24px;
 font-weight:900;
 letter-spacing:-.5px;
}

.logo span{
 color:var(--rojo);
}

.subtitle{
 color:#ddd;
 font-size:12px;
 margin-top:2px;
}

.cart{
 background:var(--rojo);
 color:#fff;
 border:0;
 border-radius:22px;
 padding:9px 13px;
 font-weight:bold;
 cursor:pointer;
 text-decoration:none;
 white-space:nowrap;
}

.cart:hover{
 background:var(--rojo2);
}

main{
 max-width:1100px;
 margin:auto;
 padding:18px 14px 30px;
}

.hero{
 background:#fff;
 border-radius:14px;
 padding:20px;
 margin-bottom:15px;
 box-shadow:var(--shadow);
 border-left:5px solid var(--rojo);
}

.hero h1{
 margin:0 0 5px;
 font-size:25px;
}

.hero p{
 margin:0;
 color:var(--muted);
}

.search{
 margin-top:15px;
}

.search input{
 width:100%;
 border:1px solid var(--gris2);
 border-radius:10px;
 padding:12px 14px;
 font-size:15px;
 outline:none;
}

.search input:focus{
 border-color:var(--azul);
 box-shadow:0 0 0 3px rgba(18,97,160,.1);
}

.categories{
 display:flex;
 gap:8px;
 overflow-x:auto;
 padding:2px 0 13px;
 scrollbar-width:none;
}

.categories::-webkit-scrollbar{
 display:none;
}

.category{
 flex:0 0 auto;
 border:1px solid var(--gris2);
 background:#fff;
 color:var(--negro);
 padding:8px 13px;
 border-radius:20px;
 cursor:pointer;
 font-weight:bold;
 font-size:13px;
}

.category:hover{
 border-color:var(--azul);
}

.category.active{
 background:var(--azul);
 border-color:var(--azul);
 color:#fff;
}

.section-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 margin:8px 0 12px;
}

.section-title h2{
 margin:0;
 font-size:19px;
}

.count{
 color:var(--muted);
 font-size:12px;
}

.locales{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
 gap:14px;
}

.local{
 background:#fff;
 border-radius:13px;
 overflow:hidden;
 box-shadow:var(--shadow);
 cursor:pointer;
 transition:.18s;
 border:1px solid #eee;
}

.local:hover{
 transform:translateY(-2px);
 box-shadow:0 7px 20px rgba(0,0,0,.11);
}

.banner{
 height:165px;
 background:var(--gris);
 position:relative;
 overflow:hidden;
}

.banner img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
}

.no-image{
 width:100%;
 height:100%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(135deg,var(--negro),var(--azul));
 color:#fff;
 font-size:36px;
 font-weight:900;
}

.status{
 position:absolute;
 top:10px;
 right:10px;
 background:var(--verde);
 color:#fff;
 border-radius:20px;
 padding:5px 9px;
 font-size:11px;
 font-weight:bold;
}

.local-body{
 padding:13px;
}

.local-name{
 font-size:18px;
 font-weight:900;
 margin-bottom:5px;
}

.local-category{
 color:var(--azul);
 font-size:12px;
 font-weight:bold;
 margin-bottom:7px;
}

.local-description{
 color:var(--muted);
 font-size:13px;
 line-height:1.4;
 min-height:36px;
}

.local-footer{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin-top:12px;
 padding-top:10px;
 border-top:1px solid var(--gris2);
}

.view{
 color:var(--rojo);
 font-weight:bold;
 font-size:13px;
}

.delivery{
 color:var(--verde2);
 font-size:12px;
 font-weight:bold;
}

.empty{
 background:#fff;
 border-radius:12px;
 padding:30px 15px;
 text-align:center;
 color:var(--muted);
 box-shadow:var(--shadow);
}

.empty-icon{
 font-size:35px;
 margin-bottom:8px;
}

.loading{
 text-align:center;
 padding:35px;
 color:var(--muted);
}

.error{
 background:#fff0ef;
 color:var(--rojo2);
 border:1px solid #f2c5c1;
 border-radius:10px;
 padding:15px;
}

@media(max-width:600px){
 .logo{
  font-size:21px;
 }

 .hero{
  padding:16px;
 }

 .hero h1{
  font-size:22px;
 }

 .locales{
  grid-template-columns:1fr;
 }

 .banner{
  height:180px;
 }
}
</style>
</head>

<body>

<header>
 <div class="header-inner">

  <div>
   <div class="logo">Sobre <span>Ruedas</span></div>
   <div class="subtitle">Delivery en Esmeraldas</div>
  </div>

  <a class="cart" href="menu.html">
   🛒 Carrito
   <span id="cartCount">0</span>
  </a>

 </div>
</header>

<main>

 <section class="hero">
  <h1>¿Qué quieres pedir hoy?</h1>
  <p>Encuentra tus locales favoritos y pide desde Sobre Ruedas.</p>

  <div class="search">
   <input
    id="busqueda"
    type="search"
    placeholder="🔎 Buscar local..."
    autocomplete="off">
  </div>
 </section>

 <div id="categorias" class="categories"></div>

 <div class="section-title">
  <h2>Locales disponibles</h2>
  <span id="contador" class="count"></span>
 </div>

 <div id="locales" class="locales">
  <div class="loading">Cargando locales...</div>
 </div>

</main>

<script>
let locales=[];
let categorias=[];
let categoriaActual="";

const $=id=>document.getElementById(id);

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#039;"
}[m]));

function actualizarCarrito(){
 try{
  const carrito=JSON.parse(localStorage.getItem("carrito")||"[]");

  const cantidad=carrito.reduce(
   (total,item)=>total+(Number(item.cantidad)||0),
   0
  );

  $("cartCount").textContent=cantidad;
 }catch{
  $("cartCount").textContent="0";
 }
}

async function cargar(){

 const localesEl=$("locales");

 try{

  const [
   {data:localesData,error:localesError},
   {data:categoriasData,error:categoriasError}
  ]=await Promise.all([

   supabaseClient
    .from("restaurantes")
    .select("*")
    .eq("activo",true)
    .order("nombre"),

   supabaseClient
    .from("categorias")
    .select("*")
    .eq("activo",true)
    .order("nombre")

  ]);

  if(localesError)throw localesError;
  if(categoriasError)throw categoriasError;

  locales=localesData||[];
  categorias=categoriasData||[];

  renderCategorias();
  renderLocales();

 }catch(error){

  console.error(error);

  localesEl.innerHTML=`
   <div class="error">
    No se pudieron cargar los locales.
    <br><small>${esc(error.message||"Error de conexión")}</small>
   </div>
  `;
 }
}

function renderCategorias(){

 const el=$("categorias");

 if(!categorias.length){
  el.innerHTML="";
  return;
 }

 el.innerHTML=`
  <button
   class="category ${categoriaActual===""?"active":""}"
   onclick="seleccionarCategoria('')">
   Todos
  </button>
 `+
 categorias.map(c=>`
  <button
   class="category ${categoriaActual===c.nombre?"active":""}"
   onclick='seleccionarCategoria(${JSON.stringify(c.nombre)})'>
   ${esc(c.nombre)}
  </button>
 `).join("");
}

function seleccionarCategoria(nombre){

 categoriaActual=nombre;

 renderCategorias();
 renderLocales();

 window.scrollTo({
  top:document.querySelector(".section-title").offsetTop-80,
  behavior:"smooth"
 });
}

function renderLocales(){

 const contenedor=$("locales");
 const texto=$("busqueda").value.trim().toLowerCase();

 let filtrados=locales.filter(local=>{

  const coincideTexto=
   !texto ||
   norm(local.nombre).includes(texto) ||
   norm(local.descripcion).includes(texto) ||
   norm(local.categoria).includes(texto);

  const coincideCategoria=
   !categoriaActual ||
   norm(local.categoria)===norm(categoriaActual);

  return coincideTexto&&coincideCategoria;
 });

 $("contador").textContent=
  filtrados.length===1
   ?"1 local"
   :`${filtrados.length} locales`;

 if(!filtrados.length){

  contenedor.innerHTML=`
   <div class="empty">
    <div class="empty-icon">🔎</div>
    <strong>No encontramos locales</strong>
    <div>Prueba con otra búsqueda o categoría.</div>
   </div>
  `;

  return;
 }

 contenedor.innerHTML=filtrados.map(local=>{

  const imagen=local.banner_url
   ?`
    <img
     src="${esc(local.banner_url)}?v=${Date.now()}"
     alt="${esc(local.nombre)}"
     loading="lazy"
     onerror="this.parentElement.innerHTML='<div class=&quot;no-image&quot;>🍴</div>'">
   `
   :`
    <div class="no-image">🍴</div>
   `;

  return`
   <article
    class="local"
    onclick="abrirLocal(${Number(local.id)})">

    <div class="banner">
     ${imagen}
     <span class="status">● Disponible</span>
    </div>

    <div class="local-body">

     <div class="local-name">
      ${esc(local.nombre)}
     </div>

     ${local.categoria?`
      <div class="local-category">
       ${esc(local.categoria)}
      </div>
     `:""}

     <div class="local-description">
      ${esc(local.descripcion||"")}
     </div>

     <div class="local-footer">
      <span class="delivery">🚴 Delivery</span>
      <span class="view">Ver menú →</span>
     </div>

    </div>

   </article>
  `;

 }).join("");
}

function abrirLocal(id){
 window.location.href=`restaurante.html?id=${encodeURIComponent(id)}`;
}

function norm(valor){
 return String(valor??"").trim().toLowerCase();
}

$("busqueda").addEventListener("input",renderLocales);

actualizarCarrito();
cargar();

window.addEventListener("storage",actualizarCarrito);

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden)actualizarCarrito();
});
</script>

</body>
</html>
