<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sobre Ruedas | Esmeraldas</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f8f5ee;color:#26352d}
header{background:#2f5d45;color:#fff;padding:18px 20px}
header h1{margin:0;font-size:24px}
header div{margin-top:4px;color:#e7f0e8}
main{max-width:1100px;margin:auto;padding:20px}
.buscador{margin-bottom:15px}
input{width:100%;padding:12px;border:1px solid #d8d0c3;border-radius:9px;font-size:16px;background:#fffdf9;color:#26352d}
.categorias{display:flex;gap:8px;overflow-x:auto;padding-bottom:15px}
.categorias button{border:1px solid #d8cbb8;background:#fffaf2;color:#53665a;border-radius:20px;padding:9px 15px;white-space:nowrap;cursor:pointer}
.categorias button.activo{background:#d97941;color:#fff;border-color:#d97941}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.card{background:#fffdf9;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #5b463322;cursor:pointer;border:1px solid #eee5d8}
.card:hover{transform:translateY(-2px);transition:.15s}
.banner{width:100%;height:180px;object-fit:cover;background:#e9e1d3;display:block}
.sin-imagen{height:180px;display:flex;align-items:center;justify-content:center;background:#ebe3d5;color:#7a8178}
.info{padding:14px}
.info h3{margin:0 0 6px;color:#2f5d45}
.info p{margin:5px 0;color:#68736b;font-size:14px}
.badge{font-size:12px;color:#d06f39;font-weight:600}
.carrito{position:fixed;right:20px;bottom:20px;background:#d97941;color:#fff;border-radius:50px;padding:14px 18px;cursor:pointer;box-shadow:0 4px 12px #5b463344;font-weight:bold}
.carrito:hover{background:#c86832}
</style>
</head>
<body>

<header>
<h1>Sobre Ruedas</h1>
<div>Delivery en Esmeraldas</div>
</header>

<main>
<div class="buscador">
<input id="buscar" placeholder="Buscar locales..." oninput="render()">
</div>

<div id="categorias" class="categorias"></div>
<div id="locales" class="grid">Cargando...</div>
</main>

<div class="carrito" onclick="location.href='menu.html'">
🛒 Carrito <span id="contador">0</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
let locales=[];
let categorias=[];
let categoriaActual="Todos";

function escapeHtml(v=""){
 return String(v).replace(/[&<>"']/g,m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m]));
}

function imagenUrl(url){
 if(!url)return "";
 const separador=url.includes("?")?"&":"?";
 return url+separador+"v="+Date.now();
}

async function cargar(){
 try{
  const [r,c]=await Promise.all([
   supabaseClient
    .from("restaurantes")
    .select("*")
    .eq("activo",true)
    .order("nombre"),
   supabaseClient
    .from("categorias")
    .select("*")
    .eq("activo",true)
    .order("nombre")
  ]);

  if(r.error)throw r.error;
  if(c.error)throw c.error;

  locales=r.data||[];
  categorias=c.data||[];

  renderCategorias();
  render();
 }catch(e){
  localesEl.innerHTML="<p>No se pudieron cargar los locales.</p>";
  console.error(e);
 }
}

function renderCategorias(){
 categoriasEl.innerHTML=
  `<button class="activo" onclick="seleccionarCategoria('Todos',this)">Todos</button>`+
  categorias.map(c=>
   `<button onclick="seleccionarCategoria('${escapeHtml(c.nombre)}',this)">
    ${escapeHtml(c.nombre)}
   </button>`
  ).join("");
}

function seleccionarCategoria(nombre,btn){
 categoriaActual=nombre;
 document.querySelectorAll(".categorias button")
  .forEach(x=>x.classList.remove("activo"));
 btn.classList.add("activo");
 render();
}

function render(){
 const texto=buscar.value.trim().toLowerCase();

 const filtrados=locales.filter(l=>{
  const coincideCategoria=
   categoriaActual==="Todos"||
   (l.categoria||"").toLowerCase()===categoriaActual.toLowerCase();

  const coincideTexto=
   !texto||
   (l.nombre||"").toLowerCase().includes(texto)||
   (l.descripcion||"").toLowerCase().includes(texto)||
   (l.categoria||"").toLowerCase().includes(texto);

  return coincideCategoria&&coincideTexto;
 });

 if(!filtrados.length){
  localesEl.innerHTML="<p>No se encontraron locales.</p>";
  return;
 }

 localesEl.innerHTML=filtrados.map(l=>{
  const imagen=imagenUrl(l.banner_url);

  return `
   <div class="card" onclick="verMenu(${l.id})">
    ${
     imagen
     ? `<img class="banner"
          src="${escapeHtml(imagen)}"
          alt="${escapeHtml(l.nombre)}"
          onerror="this.outerHTML='<div class=\\'sin-imagen\\'>Sin imagen</div>'">`
     : `<div class="sin-imagen">Sin imagen</div>`
    }
    <div class="info">
     <h3>${escapeHtml(l.nombre)}</h3>
     <div class="badge">${escapeHtml(l.categoria||"")}</div>
     <p>${escapeHtml(l.descripcion||"")}</p>
    </div>
   </div>
  `;
 }).join("");
}

function verMenu(id){
 location.href="restaurante.html?id="+encodeURIComponent(id);
}

function actualizarCarrito(){
 try{
  const carrito=JSON.parse(localStorage.getItem("carrito")||"[]");
  contador.textContent=carrito.reduce((s,p)=>s+(Number(p.cantidad)||0),0);
 }catch{
  contador.textContent="0";
 }
}

const buscar=document.getElementById("buscar");
const categoriasEl=document.getElementById("categorias");
const localesEl=document.getElementById("locales");
const contador=document.getElementById("contador");

actualizarCarrito();
cargar();

window.addEventListener("storage",actualizarCarrito);
</script>
</body>
</html>
